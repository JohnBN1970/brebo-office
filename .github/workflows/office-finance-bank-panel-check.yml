name: Office Finance bank panel checks
on:
  pull_request:
    paths:
      - 'office-independent/public/office-finance.php'
      - 'office-independent/src/Finance/OfficeFinanceView.php'
      - 'office-independent/src/Finance/OfficeFinanceBankPanel.php'
      - 'office-independent/src/Finance/OfficeMoneybirdBankApiClient.php'
      - 'office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php'
      - 'office-independent/src/Finance/OfficeFinanceAccess.php'
      - 'office-independent/tests/OfficeFinanceBankPanelTest.php'
      - 'office-independent/tests/OfficeMoneybirdBankApiClientTest.php'
      - 'office-independent/tests/OfficeMoneybirdBankSnapshotTest.php'
      - 'office-independent/tests/OfficeFinanceBankAccessTest.php'
      - 'office-independent/tests/OfficeFinanceBankViewTest.php'
      - '.github/workflows/office-finance-bank-panel-check.yml'
      - '.github/workflows/office-moneybird-bank-stage.yml'
      - 'office-independent/deployment/hostinger/office-moneybird-bank-preflight.php'
      - 'office-independent/deployment/hostinger/office-moneybird-bank-preview-hooks.php'
      - 'office-independent/tests/OfficeFinanceBankPreviewHooksTest.php'
      - 'office-independent/deployment/hostinger/office-moneybird-bank-activate.php'
      - 'office-independent/tests/OfficeFinanceBankActivationBoundaryTest.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test bank panel
        run: |
          set -euo pipefail
          for file in office-independent/public/office-finance.php office-independent/src/Finance/OfficeFinanceView.php office-independent/src/Finance/OfficeFinanceBankPanel.php office-independent/src/Finance/OfficeMoneybirdBankApiClient.php office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php office-independent/tests/OfficeFinanceBankPanelTest.php office-independent/tests/OfficeMoneybirdBankApiClientTest.php; do php -l "$file"; done
          php office-independent/tests/OfficeFinanceBankPanelTest.php
          php office-independent/tests/OfficeMoneybirdBankApiClientTest.php
          php -l office-independent/src/Finance/OfficeFinanceAccess.php
          php office-independent/tests/OfficeMoneybirdBankSnapshotTest.php
          php office-independent/tests/OfficeFinanceBankAccessTest.php
          php office-independent/tests/OfficeFinanceBankViewTest.php
          php -l office-independent/deployment/hostinger/office-moneybird-bank-preflight.php
          php -l office-independent/deployment/hostinger/office-moneybird-bank-preview-hooks.php
          php office-independent/tests/OfficeFinanceBankPreviewHooksTest.php
          php -l office-independent/deployment/hostinger/office-moneybird-bank-activate.php
          php office-independent/tests/OfficeFinanceBankActivationBoundaryTest.php
          BANK_PREFLIGHT_LIVE_READ=0 php office-independent/deployment/hostinger/office-moneybird-bank-preflight.php > /tmp/bank-preflight-unconfigured.txt
          grep -q 'BANK_READ_PREFLIGHT_GO=0' /tmp/bank-preflight-unconfigured.txt

