name: Office Finance bank panel checks
on:
  pull_request:
    paths:
      - 'office-independent/src/Finance/OfficeFinanceCostReadiness.php'
      - 'office-independent/tests/OfficeFinanceCostReadinessTest.php'
      - 'office-independent/deployment/hostinger/office-finance-cost-connections*'
      - 'office-independent/src/Finance/OfficeFinanceSalesOverview.php'
      - 'office-independent/tests/OfficeFinanceSalesOverviewTest.php'
      - 'office-independent/deployment/hostinger/office-finance-sales-overview*'
      - 'office-independent/public/office-finance.php'
      - 'office-independent/src/Finance/OfficeFinanceView.php'
      - 'office-independent/src/Finance/OfficeFinanceDashboard.php'
      - 'office-independent/tests/OfficeFinanceDashboardTest.php'
      - 'office-independent/deployment/hostinger/office-finance-dashboard*'
      - 'office-independent/src/Finance/OfficeFinanceBankPanel.php'
      - 'office-independent/src/Finance/OfficeMoneybirdBankApiClient.php'
      - 'office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php'
      - 'office-independent/tests/OfficeFinanceBankPanelTest.php'
      - 'office-independent/tests/OfficeMoneybirdBankApiClientTest.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test bank panel
        run: |
          set -euo pipefail
          for file in office-independent/public/office-finance.php office-independent/src/Finance/OfficeFinanceView.php office-independent/src/Finance/OfficeFinanceBankPanel.php office-independent/src/Finance/OfficeMoneybirdBankApiClient.php office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php office-independent/tests/OfficeFinanceBankPanelTest.php office-independent/tests/OfficeMoneybirdBankApiClientTest.php; do php -l "$file"; done
          php -l office-independent/deployment/hostinger/office-finance-sales-overview-install.php
          php office-independent/tests/OfficeFinanceCostReadinessTest.php
          php -l office-independent/deployment/hostinger/office-finance-cost-connections-install.php
          php office-independent/tests/OfficeFinanceSalesOverviewTest.php
          php office-independent/tests/OfficeFinanceOverviewTest.php
          php office-independent/tests/OfficeFinanceBankViewTest.php
          php office-independent/tests/OfficeFinanceDashboardTest.php
          php -l office-independent/deployment/hostinger/office-finance-dashboard-install.php
          php office-independent/tests/OfficeFinanceBankPanelTest.php
          php office-independent/tests/OfficeMoneybirdBankApiClientTest.php

