name: BREBO Mail runtime probe

on:
  push:
    branches:
      - ops/mail-runtime-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to obtain SSH host key."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Probe non-secret mail runtime readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd public_html/sboffice
          php -r '
            require "web/sites/default/settings.php";
            $vars = [
              "BREBO_MAIL_SOURCE",
              "BREBO_MAIL_ADDRESS",
              "BREBO_IMAP_HOST",
              "BREBO_IMAP_PORT",
              "BREBO_IMAP_FLAGS",
              "BREBO_IMAP_USER",
              "BREBO_IMAP_PASSWORD",
            ];
            foreach ($vars as $name) {
              $value = getenv($name);
              echo $name . "=" . (($value !== false && trim((string) $value) !== "") ? "SET" : "MISSING") . PHP_EOL;
            }
            echo "PHP_IMAP=" . (function_exists("imap_open") ? "AVAILABLE" : "MISSING") . PHP_EOL;
          '
          REMOTE
