name: OnSite Android
on:
  pull_request:
    paths: ['android/**', '.github/workflows/onsite-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build, contract tests and Android lint
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: OnSite-Android-test
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html




