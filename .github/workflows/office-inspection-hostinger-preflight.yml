name: Office inspection Hostinger preflight
on:
  workflow_dispatch:
    inputs:
      confirm_test_only:
        description: 'Type OFFICE-TEST to run read-only preflight'
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_test_only == 'OFFICE-TEST' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do test -n "${!name}"; done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/office_test_key
          chmod 600 ~/.ssh/office_test_key
      - name: Inspect Hostinger Office-test (read only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_test_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' < office-independent/deployment/hostinger/office-inspection-release-preflight.sh
