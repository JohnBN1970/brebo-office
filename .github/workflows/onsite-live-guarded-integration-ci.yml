name: OnSite guarded integration source checks
on:
  pull_request:
    paths:
      - 'office-independent/deployment/hostinger/integrate-onsite-approval-live-guarded.py'
      - '.github/workflows/onsite-approved-hours-guarded-deploy.yml'
      - 'office-independent/src/Inzet/OfficeOnSite*.php'
      - 'office-independent/tests/OfficeOnSite*.php'
      - 'office-independent/tests/OfficePersonnelAccountLinkTest.php'
      - 'office-independent/src/Inzet/OfficePersonnelAccountLink.php'
      - 'office-independent/public/office-personnel.php'
      - 'office-independent/src/Approval/OfficeTestSiteAdministratorAccess.php'
      - 'scripts/deployment/OfficeOnSiteRolloutReadiness.php'
      - 'office-independent/deployment/vps/audit-onsite-readiness.php'
      - '.github/workflows/onsite-live-guarded-integration-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: OnSite regression tests
        run: |
          set -euo pipefail
          php office-independent/tests/OfficePersonnelAccountLinkTest.php
          php -l office-independent/src/Inzet/OfficePersonnelAccountLink.php
          php -l office-independent/public/office-personnel.php
          php office-independent/tests/OfficeOnSiteFourEyesGuardTest.php
          php office-independent/tests/OfficeOnSiteRolloutReadinessTest.php
          php -l office-independent/deployment/vps/audit-onsite-readiness.php
      - name: Verify integration script syntax and CLI
        run: |
          set -euo pipefail
          python3 -m py_compile office-independent/deployment/hostinger/integrate-onsite-approval-live-guarded.py
          python3 office-independent/deployment/hostinger/integrate-onsite-approval-live-guarded.py --help
      - name: Validate approval chain and PHP sources
        run: |
          set -euo pipefail
          php office-independent/tests/OfficeOnSiteApprovalChainContractTest.php
          for f in office-independent/public/office-onsite-presence-review.php office-independent/public/office-projects.php office-independent/src/Inzet/OfficeOnSiteApprovalService.php office-independent/src/Inzet/OfficeApprovedHoursWeekRepository.php office-independent/src/Project/OfficeProjectPortfolioView.php; do php -l "$f"; done
