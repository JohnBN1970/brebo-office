name: Smoke check sboffice after deploy

on:
  workflow_run:
    workflows:
      - 'Deploy BREBO Office develop to sboffice'
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Missing $name"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            [[ "$attempt" -lt 5 ]] || exit 1
            sleep $((attempt * 2))
          done

      - name: Verify production layout and HTTP health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/public_html"
          app="$base/sboffice_app"
          public="$base/sboffice"

          [[ -L "$public" ]]
          [[ "$(readlink -f "$public")" == "$(readlink -f "$app")" ]]
          [[ ! -d "$app/web/web" ]]
          [[ -f "$app/web/robots.txt" ]]

          expected_sha=$(sha256sum "$app/web/robots.txt" | awk '{print $1}')
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://sboffice.brebobv.nl/robots.txt' -o /tmp/brebo-smoke-robots.txt
          live_sha=$(sha256sum /tmp/brebo-smoke-robots.txt | awk '{print $1}')
          [[ "$expected_sha" == "$live_sha" ]]

          home_status=$(curl -sS -o /tmp/brebo-smoke-home.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' 'https://sboffice.brebobv.nl/')
          mail_status=$(curl -sS -o /tmp/brebo-smoke-mail.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' 'https://sboffice.brebobv.nl/admin/brebo/mail-intake')

          [[ "$home_status" -ge 200 && "$home_status" -lt 500 ]]
          [[ "$mail_status" -ge 200 && "$mail_status" -lt 500 ]]

          echo "SMOKE_OK=1"
          echo "PUBLIC_ROOT=CANONICAL"
          echo "NESTED_WEB=ABSENT"
          echo "ROBOTS_MATCH=1"
          echo "HOME_STATUS=$home_status"
          echo "MAIL_INTAKE_STATUS=$mail_status"
          REMOTE
