name: Mail module routing smoke

on:
  pull_request:
    paths:
      - 'web/modules/custom/brebo_mail_intake/src/Service/MailModuleRoutingAdvisor.php'
      - 'web/modules/custom/brebo_mail_intake/src/Service/MailIntakePipeline.php'
      - 'web/modules/custom/brebo_mail_intake/tests/mail-module-routing-smoke.php'
      - '.github/workflows/mail-module-routing-smoke.yml'\n      - 'web/themes/custom/brebo_office/js/mail-list-controls.js'\n      - 'web/modules/custom/brebo_mail_intake/src/Service/MailCommunicationBlockProjector.php'\n      - 'web/modules/custom/brebo_mail_intake/tests/mail-communication-block-smoke.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l web/modules/custom/brebo_mail_intake/src/Service/MailModuleRoutingAdvisor.php
          php -l web/modules/custom/brebo_mail_intake/src/Service/MailIntakePipeline.php
          php -l web/modules/custom/brebo_mail_intake/tests/mail-module-routing-smoke.php
      - name: Communication block projection tests\n        run: |\n          php -l web/modules/custom/brebo_mail_intake/src/Service/MailCommunicationBlockProjector.php\n          php web/modules/custom/brebo_mail_intake/tests/mail-communication-block-smoke.php\n      - name: Mail inbox JavaScript syntax\n        run: node --check web/themes/custom/brebo_office/js/mail-list-controls.js\n      - name: Routing smoke tests
        run: php web/modules/custom/brebo_mail_intake/tests/mail-module-routing-smoke.php
