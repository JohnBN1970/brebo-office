name: Calc installed grant array shape (read only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT-CALC-SHAPE
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation and SSH
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = AUDIT-CALC-SHAPE
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_calc_shape
          chmod 600 ~/.ssh/id_calc_shape
      - name: Inspect grant SQL projection and return structure
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_calc_shape -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          root=$(OFFICE_CONFIG_PATH="$base/config/config.php" php <<'PHP'
          <?php
          $config=require getenv('OFFICE_CONFIG_PATH');
          $root=is_array($config)?($config['OFFICE_PRIVATE_ROOT']??''):'';
          if(!is_string($root)||$root==='')exit(1);
          echo $root;
          PHP
          )
          root=$(realpath "$root")
          case "$root" in "$base"/release-*/private) ;; *) echo 'CALC_SHAPE=BLOCKED_ROOT'; exit 1;; esac
          export CALC_ACTIVE_ROOT="$root"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $file=getenv('CALC_ACTIVE_ROOT').'/src/Calculation/OfficeCalcSessionGrantRepository.php';
          if(!is_file($file))exit(1);
          $tokens=token_get_all(file_get_contents($file));
          $start=null;
          for($i=0;$i<count($tokens);$i++){
            if(is_array($tokens[$i])&&$tokens[$i][0]===T_FUNCTION){
              for($j=$i+1;$j<min($i+8,count($tokens));$j++){
                if(is_array($tokens[$j])&&$tokens[$j][0]===T_STRING&&$tokens[$j][1]==='findActive'){$start=$j;break 2;}
              }
            }
          }
          if($start===null){echo "CALC_SHAPE=METHOD_MISSING\n";exit(1);}
          $parts=[];$depth=0;$inBody=false;
          for($i=$start;$i<count($tokens);$i++){
            $t=$tokens[$i];$v=is_array($t)?$t[1]:$t;
            if($v==='{'){$depth++;$inBody=true;}
            if($inBody)$parts[]=$v;
            if($v==='}'&&--$depth===0&&$inBody)break;
          }
          $body=implode('',$parts);
          $columns=['reference','session_hash','actor_id','project_id','calculation_id','expires_at','revoked_at'];
          foreach($columns as $col){
            echo 'CALC_SHAPE_FIELD_'.$col.'='.(preg_match('/\\b'.preg_quote($col,'/').'\\b/i',$body)?'MENTIONED':'NOT_MENTIONED')."\n";
          }
          echo 'CALC_SHAPE_FETCH_ASSOC='.(str_contains($body,'PDO::FETCH_ASSOC')?'YES':'NOT_EXPLICIT')."\n";
          echo 'CALC_SHAPE_FETCH_COLUMN='.(str_contains($body,'fetchColumn(')?'YES':'NO')."\n";
          echo 'CALC_SHAPE_FETCH='.(str_contains($body,'->fetch(')?'YES':'NO')."\n";
          echo "CALC_SHAPE_AUDIT=READ_ONLY_COMPLETE\n";
          PHP
          REMOTE
