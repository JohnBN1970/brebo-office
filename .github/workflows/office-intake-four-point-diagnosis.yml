name: Office intake four-point read-only diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source routes and storage behavior
        shell: bash
        run: |
          set -euo pipefail
          echo 'CHECK_1_WEBSITE_DESTINATION_SOURCE'
          grep -Fq '"/brebo-internal/intake/europakozijn"' integration-api/src/public-intake.ts
          grep -Fq 'publicEuropakozijnIntake' integration-api/src/public-intake.ts
          echo 'WEBSITE_FORWARDER_DEFINED=yes'
          if grep -Fq 'publicEuropakozijnIntake(' integration-api/src/index.ts; then echo 'WEBSITE_FORWARDER_MAIN_ROUTER=yes'; else echo 'WEBSITE_FORWARDER_MAIN_ROUTER=not_found'; fi
          echo 'CHECK_2_REQUEST_STORAGE_SOURCE'
          grep -Fq 'persistForReview(' web/modules/custom/brebo_data_intake/src/Service/SourceNeutralIntakeManager.php
          echo 'LEGACY_DRUPAL_REVIEW_PERSISTENCE=implemented'
          echo 'CHECK_3_DOCUMENT_STORAGE_SOURCE'
          grep -Fq "private://brebo-intake/" web/modules/custom/brebo_data_intake/src/Controller/WebsiteEuropakozijnProjectDocumentController.php
          grep -Fq 'setPermanent()' web/modules/custom/brebo_data_intake/src/Controller/WebsiteEuropakozijnProjectDocumentController.php
          echo 'LEGACY_DRUPAL_PERMANENT_UPLOAD=implemented'
          echo 'CHECK_4_OFFICE_DRUPAL_DEPENDENCY_SOURCE'
          if grep -R -l -E 'Drupal\\\\|Drupal::|drupal_bootstrap' office-independent/src/Intake office-independent/public/office-intake-receive.php; then
            echo 'OFFICE_NATIVE_DRUPAL_REFERENCE=found'
          else
            echo 'OFFICE_NATIVE_DRUPAL_REFERENCE=not_found'
          fi
      - name: Inspect active Office-test release and configuration safely
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            ROOT="$HOME/domains/brebobv.nl/office_calc_test"
            CONFIG="$ROOT/config/config.php"
            ROUTER="$HOME/domains/brebobv.nl/public_html/office-test/index.php"
            PHP=/opt/alt/php83/usr/bin/php
            test -f "$CONFIG" && test -f "$ROUTER"
            echo 'ACTIVE_OFFICE_ROUTER=present'
            "$PHP" -l "$ROUTER" | grep -q 'No syntax errors'
            echo 'ACTIVE_OFFICE_ROUTER_SYNTAX=valid'
            if grep -Fq '/office-test/api/intake/v1/receive' "$ROUTER"; then echo 'ACTIVE_OFFICE_INTAKE_ROUTE=present'; else echo 'ACTIVE_OFFICE_INTAKE_ROUTE=not_found'; fi
            echo 'OFFICE_TEST_CONFIG_FILE=present'
            echo 'OFFICE_TEST_CONFIG_RUNTIME=not_executed_for_safety'
            echo 'OFFICE_TEST_CONFIG_KEY_REFERENCES=not_checked'
            echo 'ACTIVE_WEBSITE_ROUTING=unverified_without_live_website_router_audit'
            echo 'ACTIVE_DRUPAL_STORAGE=unverified_without_live_drupal_database_audit'
            echo 'ACTIVE_DOCUMENT_STORAGE=unverified_without_live_drupal_file_audit'
            echo 'DIAGNOSIS_READ_ONLY_COMPLETE'
      - name: Audit live website and Drupal footprint without reading customer data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            WEB="$HOME/domains/brebobv.nl/public_html"
            echo 'LIVE_AUDIT_START'
            if test -f "$WEB/index.php"; then echo 'WEBSITE_INDEX=present'; else echo 'WEBSITE_INDEX=missing'; fi
            if test -f "$WEB/sites/default/settings.php"; then echo 'DRUPAL_SETTINGS=present'; else echo 'DRUPAL_SETTINGS=not_at_web_root'; fi
            if test -f "$WEB/web/sites/default/settings.php"; then echo 'DRUPAL_COMPOSER_SETTINGS=present'; else echo 'DRUPAL_COMPOSER_SETTINGS=not_found'; fi
            if test -f "$WEB/modules/custom/brebo_data_intake/brebo_data_intake.routing.yml"; then echo 'LIVE_DRUPAL_INTAKE_MODULE=present_at_root'; else echo 'LIVE_DRUPAL_INTAKE_MODULE=not_at_root'; fi
            if test -f "$WEB/web/modules/custom/brebo_data_intake/brebo_data_intake.routing.yml"; then echo 'LIVE_DRUPAL_INTAKE_MODULE_COMPOSER=present'; else echo 'LIVE_DRUPAL_INTAKE_MODULE_COMPOSER=not_found'; fi
            if test -d "$HOME/domains/brebobv.nl/private"; then echo 'PRIVATE_DIRECTORY=present'; else echo 'PRIVATE_DIRECTORY=not_at_expected_path'; fi
            echo 'LIVE_DRUPAL_DATABASE_ROWS=not_queried'
            echo 'LIVE_UPLOAD_CONTENTS=not_read'
            echo 'LIVE_WEBSITE_POST_DESTINATION=not_verified'
            echo 'LIVE_AUDIT_COMPLETE'
