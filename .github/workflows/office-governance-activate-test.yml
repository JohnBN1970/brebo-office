name: Office governance activate isolated test modules
on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/office-governance-activate-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-governance-test-activation
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate guarded activation and module contracts
        run: |
          set -euo pipefail
          php -l office-independent/deployment/hostinger/activate-office-governance-test.php
          php -l office-independent/deployment/hostinger/audit-office-governance-runtime.php
          php office-independent/tests/OfficeGovernanceIntegrationTest.php
      - name: Stage test-only activator and independent verifier
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: office-independent/deployment/hostinger/activate-office-governance-test.php,office-independent/deployment/hostinger/audit-office-governance-runtime.php
          target: /home/u213420663/domains/brebobv.nl/office_calc_test/.governance-activation-stage
          overwrite: true
      - name: Activate only uniquely mandated project manager on isolated Office-test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            ROOT=/home/u213420663/domains/brebobv.nl/office_calc_test
            PHP=/opt/alt/php83/usr/bin/php
            STAGE="$ROOT/.governance-activation-stage/office-independent/deployment/hostinger"
            test -f "$STAGE/activate-office-governance-test.php"
            test -f "$STAGE/audit-office-governance-runtime.php"
            "$PHP" -l "$STAGE/activate-office-governance-test.php"
            "$PHP" -l "$STAGE/audit-office-governance-runtime.php"
            export OFFICE_BASE_PATH=/office-test
            export OFFICE_GOVERNANCE_ACTIVATE=explicit-test-only
            "$PHP" "$STAGE/activate-office-governance-test.php"
            export OFFICE_GOVERNANCE_RUNTIME_AUDIT=read-only
            OUTPUT=$("$PHP" "$STAGE/audit-office-governance-runtime.php")
            printf '%s\n' "$OUTPUT"
            printf '%s\n' "$OUTPUT" | grep -Fxq GOVERNANCE_RUNTIME_READY
            echo GOVERNANCE_TEST_ACTIVATION_VERIFIED
