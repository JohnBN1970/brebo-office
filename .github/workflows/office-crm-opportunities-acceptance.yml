name: CRM opportunities acceptance
on:
  push:
    branches: [feature/crm-opportunities-foundation-20261108]
  pull_request:
    branches: [develop]
    paths:
      - 'office-independent/src/Crm/OfficeCrmOpportunity*.php'
      - 'office-independent/tests/OfficeCrmOpportunityContractTest.php'
      - 'office-independent/tests/OfficeCrmFunnelClosedStagesTest.php'
      - 'office-independent/tests/OfficeCrmLegacyMigrationSafetyTest.php'
      - 'office-independent/deployment/hostinger/migrate-office-crm-legacy-opportunities-test.php'
      - '.github/workflows/office-crm-opportunities-acceptance.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l office-independent/src/Crm/OfficeCrmOpportunitySchema.php
          php -l office-independent/src/Crm/OfficeCrmOpportunityRepository.php
          php office-independent/tests/OfficeCrmOpportunityContractTest.php
          php office-independent/tests/OfficeCrmFunnelClosedStagesTest.php
          php -l office-independent/deployment/hostinger/migrate-office-crm-legacy-opportunities-test.php
          php office-independent/tests/OfficeCrmLegacyMigrationSafetyTest.php
