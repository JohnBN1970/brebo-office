name: Office shared navigation
on:
  pull_request:
    paths:
      - 'office-independent/src/Intake/OfficeNavigation.php'
      - 'office-independent/public/office-area.php'
      - 'office-independent/tests/OfficeNavigationTest.php'
      - 'office-independent/modules/office-navigation/**'
      - 'office-independent/deployment/hostinger/office-navigation-test-install.php'
      - '.github/workflows/office-navigation.yml'
permissions:
  contents: read
jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: |
          php -l office-independent/public/office-area.php
          php -l office-independent/modules/office-navigation/routes.php
          php -l office-independent/deployment/hostinger/office-navigation-test-install.php
          php office-independent/tests/OfficeNavigationTest.php
  test-navigation-install:
    needs: navigation-contract
    if: github.event.pull_request.head.ref == 'structure/office-gotik-navigation-20261027' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        run: echo "php=$(base64 -w0 office-independent/deployment/hostinger/office-navigation-test-install.php)" >> "$GITHUB_OUTPUT"
      - name: Apply requested shared structure to isolated Office-test with private backups
        uses: appleboy/ssh-action@v1.2.0
        env:
          INSTALL_SOURCE: ${{ steps.source.outputs.php }}
        with:
          host: 77.37.34.160
          port: 65002
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_SOURCE
          script_stop: true
          script: printf '%s' "$INSTALL_SOURCE" | base64 -d | /opt/alt/php83/usr/bin/php /dev/stdin
