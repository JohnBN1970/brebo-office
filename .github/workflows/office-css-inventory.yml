name: Office CSS inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'office-independent/**'
      - 'tools/audit_office_css.py'
      - 'tools/check_office_home_css_parity.py'
      - '.github/workflows/office-css-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged Office home CSS parity
        run: python3 tools/check_office_home_css_parity.py
      - name: Generate CSS inventory
        run: |
          python3 tools/audit_office_css.py --root office-independent --json office-css-inventory.json --markdown office-css-inventory.md
          cat office-css-inventory.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: office-css-inventory
          path: |
            office-css-inventory.json
            office-css-inventory.md
