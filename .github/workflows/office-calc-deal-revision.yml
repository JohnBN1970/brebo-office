name: Office Calc Deal revision regression
on:
  pull_request:
  push:
    branches:
      - fix/calc-deal-revision-access
permissions:
  contents: read
jobs:
  deal-revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP SQLite
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - name: Syntax checks
        run: |
          php -l office-independent/src/Calculation/OfficeCalcDealRevisionGuard.php
          php -l office-independent/src/Calculation/OfficeCalcCrmTransferService.php
          php -l office-independent/public/office-calc-crm-workbench.php
      - name: Regression
        run: php office-independent/tests/office-calc-deal-revision-guard.php
