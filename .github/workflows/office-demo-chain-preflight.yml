name: Office-test complete demo chain preflight
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT-DEMO-CHAIN-TEST
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    if: ${{ inputs.confirmation == 'AUDIT-DEMO-CHAIN-TEST' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only audit and monitor contract
        run: |
          set -euo pipefail
          php -l office-independent/src/Demo/OfficeDemoProcessChain.php
          php -l office-independent/deployment/hostinger/audit-office-demo-chain.php
          php -d zend.assertions=1 -d assert.exception=1 office-independent/tests/OfficeDemoProcessChainTest.php
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Run read-only Office-test demo chain audit
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          opts="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -i $HOME/.ssh/id_deploy"
          ssh $opts -p "$PORT" "$USER@$HOST" 'mkdir -p /tmp/brebo-demo-chain/src/Demo /tmp/brebo-demo-chain/deployment/hostinger'
          scp $opts -P "$PORT" office-independent/src/Demo/OfficeDemoProcessChain.php "$USER@$HOST:/tmp/brebo-demo-chain/src/Demo/OfficeDemoProcessChain.php"
          scp $opts -P "$PORT" office-independent/deployment/hostinger/audit-office-demo-chain.php "$USER@$HOST:/tmp/brebo-demo-chain/deployment/hostinger/audit-office-demo-chain.php"
          ssh $opts -p "$PORT" "$USER@$HOST" 'OFFICE_TEST_CONFIG_PATH="$HOME/domains/brebobv.nl/office_calc_test/config/config.php" php /tmp/brebo-demo-chain/deployment/hostinger/audit-office-demo-chain.php'
