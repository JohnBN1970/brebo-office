name: BAG address format acceptance

on:
  pull_request:
    paths:
      - 'web/modules/custom/brebo_building_data/src/Controller/BuildingTruthWorkbenchController.php'
      - 'scripts/test-bag-address-format.php'
      - '.github/workflows/bag-address-format-acceptance.yml'
  push:
    branches: [develop]
    paths:
      - 'web/modules/custom/brebo_building_data/src/Controller/BuildingTruthWorkbenchController.php'
      - 'scripts/test-bag-address-format.php'

jobs:
  bag-address-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php -l web/modules/custom/brebo_building_data/src/Controller/BuildingTruthWorkbenchController.php
      - run: php scripts/test-bag-address-format.php
