name: Office 2.0 isolated test deploy preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Check isolated test source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check test router syntax
        run: |
          php -l office-independent/deployment/hostinger/office-test-index.php
          php office-independent/tests/OfficeTestUiRolloutGateTest.php
      - name: Validate SSH settings
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing SSH setting: $name"
              exit 1
            fi
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/office_test_key
          chmod 600 ~/.ssh/office_test_key
      - name: Read-only Hostinger Office-test preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/office_test_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          root="$(php -r '$c=require $argv[1]; if (!is_array($c) || !isset($c["OFFICE_PRIVATE_ROOT"]) || !is_string($c["OFFICE_PRIVATE_ROOT"])) exit(1); echo $c["OFFICE_PRIVATE_ROOT"];' "$base/config/config.php")" || { echo "::error::Unable to read configured private root"; exit 19; }
          case "$root" in "$base"/release-*/private) ;; *) echo "::error::Active root is outside an isolated Office-test release"; exit 20;; esac
          router="$HOME/domains/brebobv.nl/public_html/office-test/index.php"
          [[ -d "$base" && ! -L "$base" ]] || exit 10
          [[ -d "$root/public" && -d "$root/src" && ! -L "$root" ]] || exit 11
          [[ -f "$router" && ! -L "$router" ]] || exit 12
          [[ -f "$base/config/config.php" ]] || exit 13
          echo "Router and release layout (read-only):"
          for item in "$router" "$root" "$root/src/Intake/OfficeNavigation.php"; do
            if [[ -L "$item" ]]; then
              echo "SYMLINK: ${item##*/}"
            elif [[ -f "$item" ]]; then
              echo "FILE: ${item##*/}"
            elif [[ -d "$item" ]]; then
              echo "DIRECTORY: ${item##*/}"
            else
              echo "MISSING: ${item##*/}"
            fi
          done
          echo "Active router contract:"
          grep -Fq 'OFFICE_BASE_PATH' "$router" || { echo "::error::Missing OFFICE_BASE_PATH guard"; exit 15; }
          grep -Fq 'OFFICE_PRIVATE_ROOT' "$router" || { echo "::error::Missing OFFICE_PRIVATE_ROOT guard"; exit 18; }
          grep -Fq 'office-test' "$router" || { echo "::error::Missing office-test guard"; exit 16; }
          echo "Checking the configured active Office-test release (not release-next)"
          if [[ ! -f "$root/src/Intake/OfficeNavigation.php" ]]; then
            echo "::error::Navigation missing from configured active private release."
            exit 17
          fi
          for required in "$root/public/office-home.php" "$root/public/office-project.php"; do
            [[ -f "$required" && ! -L "$required" ]] || { echo "::error::Required Office page missing"; exit 21; }
            php -l "$required" >/dev/null || exit 22
          done
          php -l "$root/src/Intake/OfficeNavigation.php" >/dev/null || exit 22
          echo "OFFICE_TEST_PREFLIGHT_OK=1"
          echo "No server files, configuration or databases were modified"
          REMOTE
