name: Finance PDF.js Workers compatibility probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/office-native-finance
    paths:
      - "integration-api/src/pdf-embedded-positions.ts"
      - "integration-api/src/document-extraction.ts"
      - "integration-api/test/document-extraction-layout.test.ts"
      - "integration-api/test/pdf-embedded-positions.test.ts"
      - "integration-api/test/pdfjs-real-pdf-smoke.mjs"
      - ".github/workflows/finance-pdfjs-compatibility.yml"

permissions:
  contents: read

jobs:
  pdfjs-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integration-api/package-lock.json
      - run: npm ci
      - name: Install isolated PDF.js probe (no lockfile changes)
        run: |
          set -e
          curl --fail --location --silent --show-error --retry 3 \
            https://registry.npmjs.org/pdfjs-dist/-/pdfjs-dist-3.11.174.tgz \
            --output /tmp/pdfjs-dist-3.11.174.tgz
          mkdir -p node_modules/pdfjs-dist
          tar -xzf /tmp/pdfjs-dist-3.11.174.tgz -C node_modules/pdfjs-dist --strip-components=1
      - name: Verify PDF.js ESM import and API
        run: |
          node --input-type=module -e "const pdfjs = await import('pdfjs-dist/legacy/build/pdf.js'); const getDocument = pdfjs.getDocument ?? pdfjs.default?.getDocument; console.log('PDFJS_IMPORT', typeof getDocument); if (typeof getDocument !== 'function') process.exit(1); console.log('PDFJS_IMPORT_OK')"
      - name: Run positional extraction unit tests
        run: npx vitest run --config vitest.layout.config.ts
      - name: Extract actual embedded text coordinates from synthetic PDF
        run: node --experimental-strip-types test/pdfjs-real-pdf-smoke.mjs
      - name: Check Cloudflare Workers bundling with PDF.js
        run: |
          cat > src/pdfjs-compat-probe.ts <<'EOF'
          import * as pdfjs from "pdfjs-dist/legacy/build/pdf.js";
          import { pdfEmbeddedPositions } from "./pdf-embedded-positions";
          export default {
            async fetch(): Promise<Response> {
              const ok = typeof (pdfjs.getDocument ?? pdfjs.default?.getDocument) === "function" && typeof pdfEmbeddedPositions === "function";
              return new Response(ok ? "PDFJS_WORKER_BUNDLE_OK" : "PDFJS_UNAVAILABLE", { status: ok ? 200 : 500 });
            },
          };
          EOF
          cat > wrangler.pdfjs-probe.jsonc <<'EOF'
          {
            "name": "brebo-pdfjs-probe",
            "main": "src/pdfjs-compat-probe.ts",
            "compatibility_date": "2026-10-27",
            "compatibility_flags": ["nodejs_compat"]
          }
          EOF
          npx wrangler deploy --dry-run --config wrangler.pdfjs-probe.jsonc --outdir dist/pdfjs-probe
