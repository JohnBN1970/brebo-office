name: Office-test project Documents visible tab rollout
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Safely add Documents tab inside active V3 navigation
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import hashlib
          import datetime
          import sys
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          source = raw.decode("utf-8")
          if 'id="brebo-project-documents-action"' not in source:
              sys.exit("ABORT_PREVIOUS_PROJECT_ACTION_NOT_INSTALLED")
          if 'id="brebo-project-documents-tab"' in source:
              print("ALREADY_INSTALLED", flush=True)
              sys.exit(0)
          marker = "$dossierNav .= '</nav>';"
          if source.count(marker) != 1:
              print("ABORT_DOSSIER_NAV_CLOSE_MISMATCH count=" + str(source.count(marker)), flush=True)
              sys.exit(27)
          if source.count("$dossierNav =") != 1 or source.index("$dossierNav =") > source.index(marker):
              sys.exit("ABORT_DOSSIER_NAV_INITIALIZATION_MISMATCH")
          insert = r"""$dossierNav .= '<a id="brebo-project-documents-tab" href="'
              . $escape(\Brebo\Office\Intake\OfficeMount::route('documenten', ['project_id' => (int)$projectId]))
              . '">Documenten</a>';"""
          source = source.replace(marker, insert + chr(10) + marker, 1)
          suffix = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          backup = p.with_name(p.name + ".documents-action-backup-" + suffix)
          tmp = p.with_name(p.name + ".documents-action-" + suffix)
          backup.write_bytes(raw)
          backup.chmod(0o600)
          tmp.write_bytes(source.encode("utf-8"))
          tmp.chmod(p.stat().st_mode & 0o777)
          lint = subprocess.run(["php", "-l", str(tmp)], text=True, capture_output=True)
          if lint.returncode:
              tmp.unlink(missing_ok=True)
              print(lint.stdout + lint.stderr)
              sys.exit("ABORT_PHP_LINT")
          os.replace(tmp, p)
          print("PROJECT_DOCUMENTS_TAB_INSTALLED", flush=True)
          print("BACKUP_CREATED=" + backup.name, flush=True)
          PY
          php -l "$project"
          grep -Fq 'brebo-project-documents-tab' "$project"
          echo OFFICE_TEST_PROJECT_DOCUMENTS_TAB_SERVER_PASS
          REMOTE
