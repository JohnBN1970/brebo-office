name: Office-test V3 original project tab renderer inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect original project tab renderer read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          source=raw.decode("utf-8")
          lines=source.splitlines()
          if len(lines)<900 or "OfficeNativeProjectAccess($db))->canRead" not in source:
              sys.exit("ABORT_NOT_EXPECTED_PRIVATE_V3")
          # Find original five-tab HTML renderer without exposing
          # project records, credentials or complete PHP source.
          for i,line in enumerate(lines):
              if any(k in line for k in ("Werkvoorbereiding","Financieel","dashboardTabs","dashboardTab","ob_get_clean","ob_start","preg_replace","str_replace","echo $","$pageHtml","$html =","<main")):
                  if 620 <= i <= 995:
                      tokens=[t for t in ("Werkvoorbereiding","Financieel","dashboardTabs","dashboardTab","ob_get_clean","ob_start","preg_replace","str_replace","echo $","$pageHtml","$html =","<main","office-dossier-nav","<nav","<a ") if t in line]
                      print("RENDER_SOURCE_LINE="+str(i+1)+" TOKENS="+",".join(tokens)+" LEN="+str(len(line)),flush=True)
          for i in list(range(705,731))+list(range(945,976))+list(range(990,995)):
              if i>=len(lines):continue
              line=lines[i]
              if len(line)>500 or any(k in line.lower() for k in ("secret","password","token","authorization","api_key")):continue
              print("RENDER_DETAIL_LINE="+str(i+1)+" "+line,flush=True)
          print("V3_ORIGINAL_NAV_RENDER_INSPECTED",flush=True)
          PY
          echo OFFICE_TEST_V3_RENDER_INSPECTION_PASS
          REMOTE
