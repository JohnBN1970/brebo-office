name: Office-test Projectdetail V3 Documenten CSS placement check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Check visible navigation CSS placement read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          # The Documents link is now known to be part of the HTML
          # expression, but the user screenshot showed only five tabs.
          # Inspect exact CSS/class and HTML boundaries, read-only.
          source = raw.decode("utf-8")
          expected = "742529945249e360f54222f38f83976636b49bd1aaf874acc206b77008230b25"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          if source.count("brebo-project-documents-visible-tab") != 1:
              sys.exit("ABORT_DOCUMENTS_LINK_NOT_UNIQUE")
          lines = source.splitlines(keepends=True)
          if len(lines) != 994 or "brebo-project-documents-visible-tab" not in lines[991]:
              sys.exit("ABORT_VISIBLE_NAV_SOURCE_MISMATCH")
          styles = [i + 1 for i,line in enumerate(lines) if "</style>" in line]
          print("STYLE_CLOSE_LINE_NUMBERS=" + ",".join(map(str,styles)), flush=True)
          print("DOC_LINK_IN_VISIBLE_NAV=" + str("<main" in lines[991] and "</nav>" in lines[991]), flush=True)
          print("DOCUMENTS_CSS_CLASS_RULE_EXISTS=" + str(".brebo-project-documents-visible-tab" in source), flush=True)
          # Report local navigation siblings, not any customer content.
          for i in range(987,993):
              line=lines[i]
              print("NAV_HTML_" + str(i+1) + "_ANCHORS=" + str(line.count("<a ")) + " DIVS=" + str(line.count("<div")) + " QUOTES=" + str(line.count("'")), flush=True)
          print("READ_ONLY_STYLE_CONTEXT_CHECK_PASS", flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
