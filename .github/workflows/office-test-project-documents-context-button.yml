name: Office-test Projectdetail V3 visible five tabs diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Identify visible five-tab navigation source read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          source = raw.decode("utf-8")
          lines = source.splitlines()
          print("CURRENT_SHA256=" + hashlib.sha256(raw).hexdigest(), flush=True)
          for term in ("Overzicht", "Gebouwen", "Werkvoorbereiding", "Uitvoering", "Financieel", "Documenten", "brebo-project-documents-visible-tab", "$dossierNav"):
              matches = [i for i,line in enumerate(lines,1) if term in line]
              print("VISIBLE_TAB_TOKEN=" + term + " LINES=" + ",".join(map(str,matches[:50])), flush=True)
          for i in range(725, min(820,len(lines))):
              line = lines[i]
              tokens = [t for t in ("Overzicht", "Gebouwen", "Werkvoorbereiding", "Uitvoering", "Financieel", "foreach", "href=", "tab=", "echo", "nav", "render", "activeTab", "projectUrl", "project-nav", "project-tab", "dossier") if t in line]
              if tokens:
                  print("VISIBLE_NAV_STRUCTURE_LINE=" + str(i+1) + " TOKENS=" + ",".join(tokens) + " LEN=" + str(len(line)), flush=True)
          print("VISIBLE_NAV_STRUCTURE_READONLY_PASS", flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
