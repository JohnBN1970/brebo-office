name: Office-test Projectdetail V3 Documents visible navigation rollout
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Safely render existing Documents navigation in project main output
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          expected = "22f25293947cd0801b44ab2e0c80b272a4aab25d95ac1ff3ee586f2d6e9e188b"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_EXPECTED_TAB_LINK_MISSING_OR_DUPLICATED")
          if source.count("brebo-project-documents-action") != 1:
              sys.exit("ABORT_EXISTING_DOCUMENT_ACTION_MISSING_OR_DUPLICATED")
          # Run #42350282237 confirmed the output expression:
          # the unique line 992 contains the closing nav plus opening main,
          # with 2 single quotes, zero double quotes and 3 PHP variables.
          # Add existing $dossierNav into that HTML output expression.
          lines = source.splitlines(keepends=True)
          targets = [i for i,line in enumerate(lines) if "<main" in line and "</nav>" in line]
          if targets != [991]:
              sys.exit("ABORT_MAIN_NAV_ANCHOR_MISMATCH")
          old = lines[991]
          if old.count("<main") != 1 or old.count("</nav>") != 1:
              sys.exit("ABORT_MAIN_NAV_PATTERN_CHANGED")
          if (old.count("'"), old.count('"'), old.count("$")) != (2, 0, 3):
              sys.exit("ABORT_MAIN_NAV_QUOTE_STYLE_CHANGED")
          if source.count("$dossierNav") != 6:
              sys.exit("ABORT_DOSSIER_NAV_STATE_CHANGED")
          if "brebo-project-documents-tab" not in source:
              sys.exit("ABORT_DOCS_NAV_NOT_CONSTRUCTED")
          # This is a PHP string concat expression and the line is bounded
          # by the existing nav-closing literal and main-opening literal.
          # Keep the existing layout and append the prebuilt nav to the
          # output just before <main>. We do not change authorization.
          needle = "</nav><main"
          if old.count(needle) != 1:
              sys.exit("ABORT_NAV_MAIN_NOT_ADJACENT")
          new = old.replace(needle, "</nav>' . $dossierNav . '<main", 1)
          candidate = source.replace(old, new, 1)
          # Lint a temporary copy before installing, and retain backup.
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          backup = p.with_name(p.name + ".documents-visible-render-backup-" + stamp)
          tmp = p.with_name(p.name + ".documents-visible-render-tmp-" + stamp)
          backup.write_bytes(raw)
          backup.chmod(0o600)
          tmp.write_bytes(candidate.encode("utf-8"))
          tmp.chmod(p.stat().st_mode & 0o777)
          lint = subprocess.run(["php", "-l", str(tmp)], text=True, capture_output=True)
          if lint.returncode:
              tmp.unlink(missing_ok=True)
              print(lint.stdout + lint.stderr, flush=True)
              sys.exit("ABORT_PHP_LINT")
          os.replace(tmp, p)
          print("PROJECT_V3_DOCUMENTS_RENDERED", flush=True)
          print("BACKUP_CREATED=" + backup.name, flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
