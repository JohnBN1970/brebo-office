name: Office-test Projectdetail V3 Documents visible navigation render
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Safely render prebuilt Documents navigation in live project detail
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          expected = "22f25293947cd0801b44ab2e0c80b272a4aab25d95ac1ff3ee586f2d6e9e188b"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_EXPECTED_TAB_LINK_MISSING_OR_DUPLICATED")
          if source.count("brebo-project-documents-action") != 1:
              sys.exit("ABORT_EXISTING_DOCUMENT_ACTION_MISSING_OR_DUPLICATED")
          # HTML nav is constructed in $dossierNav, but the actual page
          # output is a PHP concatenation near line 992. Add the prepared
          # project-scoped nav at the unique boundary between </nav> and <main>.
          lines = source.splitlines(keepends=True)
          targets = [i for i,line in enumerate(lines) if "<main" in line and "</nav>" in line]
          if targets != [991]:
              sys.exit("ABORT_MAIN_NAV_ANCHOR_MISMATCH")
          old = lines[991]
          if old.count("<main") != 1 or old.count("</nav>") != 1:
              sys.exit("ABORT_MAIN_NAV_PATTERN_CHANGED")
          if (old.count("'"), old.count('"'), old.count("$")) != (2, 0, 3):
              sys.exit("ABORT_MAIN_NAV_QUOTE_STYLE_CHANGED")
          if source.count("$dossierNav") != 6 or source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_DOSSIER_NAV_CHANGED")
          # Preserve the original output expression and insert its existing
          # navigation variable immediately before the <main> literal.
          # The HTML source uses a PHP quote/concat boundary here.
          if "' . " not in old or old.count("' . ") != 1:
              sys.exit("ABORT_RENDER_CONCAT_MISMATCH")
          if old.count("<main") != 1:
              sys.exit("ABORT_MAIN_LITERAL_MISMATCH")
          # Replacing a PHP string interior safely: close the literal just
          # before <main, join the existing nav and reopen the literal.
          new = old.replace("<main", "' . $dossierNav . '<main", 1)
          candidate = source.replace(old, new, 1)
          if candidate.count("$dossierNav") != 7:
              sys.exit("ABORT_RENDER_NAV_REFERENCE_COUNT")
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          backup = p.with_name(p.name + ".documents-render-backup-" + stamp)
          temp = p.with_name(p.name + ".documents-render-tmp-" + stamp)
          temp.write_bytes(candidate.encode("utf-8"))
          temp.chmod(p.stat().st_mode & 0o777)
          lint = subprocess.run(["php", "-l", str(temp)], text=True, capture_output=True)
          if lint.returncode:
              temp.unlink(missing_ok=True)
              print("ABORT_RENDER_PHP_LINT", flush=True)
              print(lint.stderr + lint.stdout, flush=True)
              sys.exit(31)
          backup.write_bytes(raw)
          backup.chmod(0o600)
          os.replace(temp,p)
          print("V3_DOCUMENTS_NAV_RENDERED", flush=True)
          print("BACKUP=" + backup.name, flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
