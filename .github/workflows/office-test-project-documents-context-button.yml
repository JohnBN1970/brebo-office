name: Office-test project Documents contextual button rollout
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Safely insert project Documents action in active V3
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import hashlib
          import datetime
          import sys
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          if hashlib.sha256(raw).hexdigest() != "98c29ef3d5d3a2c7289806b28483f08e743dbe250ff7b964e750c3484122f143":
              sys.exit("ABORT_PROJECT_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if 'id="brebo-project-documents-action"' in source:
              print("ALREADY_INSTALLED", flush=True)
              sys.exit(0)
          # Inspect only structural PHP/HTML signatures. Never print project
          # contents, customer names or raw source. Server changes are blocked
          # until one unambiguous insertion point has been established.
          import re
          tokens = [
              ("dossier_nav", r"\\$dossierNav"),
              ("project_id", r"\\$projectId"),
              ("project_gegevens", r"project-gegevens"),
              ("project_id_html", r"id=[\\\"']project-"),
              ("new_document", r"Nieuw document"),
              ("project_dossier", r"Projectdossier"),
              ("detail_heading", r"<h1"),
              ("main_open", r"<main"),
              ("render_echo", r"\\becho\\b"),
          ]
          print("V3_ANCHOR_SIGNATURES " + repr({
              name: len(list(re.finditer(pattern, source)))
              for name, pattern in tokens
          }), flush=True)
          # Find safe structural anchors in the live version by reporting
          # line number and limited signature tokens (no source excerpts).
          for key in ("$dossierNav", "project-gegevens", "project-header", "project-actions", "project-detail"):
              lines = [i for i, line in enumerate(source.splitlines(), 1) if key in line]
              print("V3_ANCHOR_LINES_" + key.replace("$", "").replace("-", "_") + "=" + ",".join(map(str, lines[:25])), flush=True)
          print("ABORT_NEED_EXACT_V3_RENDER_ANCHOR", flush=True)
          sys.exit(27)
          suffix = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          backup = p.with_name(p.name + ".documents-action-backup-" + suffix)
          tmp = p.with_name(p.name + ".documents-action-" + suffix)
          backup.write_bytes(raw)
          backup.chmod(0o600)
          tmp.write_bytes(source.encode("utf-8"))
          tmp.chmod(p.stat().st_mode & 0o777)
          lint = subprocess.run(["php", "-l", str(tmp)], text=True, capture_output=True)
          if lint.returncode:
              tmp.unlink(missing_ok=True)
              print(lint.stdout + lint.stderr)
              sys.exit("ABORT_PHP_LINT")
          os.replace(tmp, p)
          print("PROJECT_DOCUMENTS_ACTION_INSTALLED", flush=True)
          print("BACKUP_CREATED=" + backup.name, flush=True)
          PY
          php -l "$project"
          grep -Fq 'brebo-project-documents-action' "$project"
          echo OFFICE_TEST_PROJECT_DOCUMENTS_ACTION_SERVER_PASS
          REMOTE
