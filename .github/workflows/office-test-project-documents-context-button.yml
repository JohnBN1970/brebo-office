name: Office-test Projectdetail V3 Documents main-line guard
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Validate project main HTML insertion preconditions
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          expected = "22f25293947cd0801b44ab2e0c80b272a4aab25d95ac1ff3ee586f2d6e9e188b"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_EXPECTED_TAB_LINK_MISSING_OR_DUPLICATED")
          if source.count("brebo-project-documents-action") != 1:
              sys.exit("ABORT_EXISTING_DOCUMENT_ACTION_MISSING_OR_DUPLICATED")
          # Exact active-V3 anchor is the unique literal navigation close
          # immediately preceding <main on line 992. Extend the output
          # there, leaving the five existing tabs and PHP variables intact.
          lines = source.splitlines(keepends=True)
          targets = [i for i, line in enumerate(lines) if "<main" in line and "</nav" in line]
          if targets != [991]:
              sys.exit("ABORT_MAIN_NAV_ANCHOR_MISMATCH")
          i = targets[0]
          main_line = lines[i]
          if main_line.count("</nav") != 1 or main_line.count("<main") != 1:
              sys.exit("ABORT_COMPLEX_MAIN_ANCHOR")
          if source.count("$dossierNav") != 6:
              sys.exit("ABORT_UNEXPECTED_DOSSIER_NAV")
          if "brebo-documents-visible-nav-v1" in source:
              print("ALREADY_INSTALLED", flush=True)
              sys.exit(0)
          # Inject a minimal project-scoped link using an already escaped
          # PHP URL produced by the existing V3 navigation builder.
          # Use a separate literal PHP statement before the HTML output,
          # avoiding changes to PHP string quoting or nav tab iteration.
          snippet = "$projectDocumentsVisibleUrl = \\Brebo\\Office\\Intake\\OfficeMount::basePath() . '/documenten?project_id=' . (int) $projectId;" + chr(10)
          if snippet in source:
              sys.exit("ABORT_DOCUMENTS_VISIBLE_URL_ALREADY_DEFINED")
          # The page uses a single PHP echo for its HTML and different
          # quoting conventions; changing that expression without full
          # context risks another HTTP 500. Fail closed rather than guess.
          print("RENDER_MAIN_QUOTE_STYLE=" + ",".join(str(main_line.count(q)) for q in ("'", '"', "$", " . ")), flush=True)
          print("RENDER_MAIN_NAV_MAIN_ORDER=" + str(main_line.find("</nav") < main_line.find("<main")), flush=True)
          print("ABORT_REQUIRES_RENDER_EXPR_REVIEW", flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
