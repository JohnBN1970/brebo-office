name: Office-test Projectdetail V3 Documents tab loop diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect active V3 navigation loop read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          expected = "22f25293947cd0801b44ab2e0c80b272a4aab25d95ac1ff3ee586f2d6e9e188b"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_EXPECTED_TAB_LINK_MISSING_OR_DUPLICATED")
          if source.count("brebo-project-documents-action") != 1:
              sys.exit("ABORT_EXISTING_DOCUMENT_ACTION_MISSING_OR_DUPLICATED")
          # The visible tab list comes from the $tabs array.
          # Insert a documents tab into that same array, then render
          # it as a direct link to the central project documents context.
          item = "'financieel' => 'Financieel'"
          if source.count(item) != 1:
              sys.exit("ABORT_FINANCIAL_TAB_ARRAY_ANCHOR_MISMATCH")
          if "'documenten' => 'Documenten'" in source:
              print("ALREADY_INSTALLED")
              sys.exit(0)
          # A strict multiline PHP tabs-array regex was incorrectly matching
          # no candidate on the active V3. Verify the actual 5-tab array by
          # its unique financial label and the existing foreach renderer.
          tab_prefix = source[:source.index(item)]
          nearby = tab_prefix[max(0, len(tab_prefix) - 600):]
          if 'Overzicht' not in nearby or 'Gebouwen' not in nearby or 'Werkvoorbereiding' not in nearby or 'Uitvoering' not in nearby:
              sys.exit('ABORT_FINANCIAL_LABEL_NOT_IN_FIVE_TAB_ARRAY')
          if '=> ' not in nearby:
              sys.exit('ABORT_TAB_MAPPING_NOT_CONFIRMED')
          print('ACTIVE_V3_FIVE_TAB_MAPPING_CONFIRMED', flush=True)
          # Preserve the existing loop and all five existing tabs. Add a sixth
          # Documenten link to the rendered nav after the loop has completed.
          # This does not depend on the loop variable names or HTML line layout.
          marker = "$dossierNav .= '</nav>';"
          if source.count(marker) != 1:
              print("ABORT_DOSSIER_NAV_CLOSE_MISMATCH", flush=True)
              sys.exit(27)
          # The first patch placed a Documenten link between the foreach and
          # </nav>. That placement did not show in the browser, so we need to
          # inspect actual live rendering rather than guessing again.
          print("ACTIVE_V3_NAV_LOOP_FORMS", flush=True)
          for term in ("foreach (", "foreach(", "$tabs", "$dossierNav", "brebo-project-documents-tab"):
              positions = [i + 1 for i, line in enumerate(source.splitlines()) if term in line]
              print("STRUCT_" + term.replace(" ", "_").replace("$", "").replace("(", "OPEN").replace("-", "_") + "_LINES=" + ",".join(map(str, positions[:24])), flush=True)
          print("ABORT_NEED_EXACT_NAV_RENDER_LOOP", flush=True)
          sys.exit(27)
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          backup = p.with_name(p.name + ".documents-visible-tabs-backup-" + stamp)
          tmp = p.with_name(p.name + ".documents-visible-tabs-tmp-" + stamp)
          backup.write_bytes(raw)
          backup.chmod(0o600)
          tmp.write_bytes(source.encode("utf-8"))
          tmp.chmod(p.stat().st_mode & 0o777)
          lint = subprocess.run(["php", "-l", str(tmp)], text=True, capture_output=True)
          if lint.returncode:
              tmp.unlink(missing_ok=True)
              print(lint.stdout + lint.stderr)
              sys.exit("ABORT_PHP_LINT")
          os.replace(tmp, p)
          print("V3_DOCUMENTS_TAB_RENDER_INSERTED")
          print("BACKUP_CREATED=" + backup.name)
          PY
          php -l "$project"
          echo OFFICE_TEST_PROJECT_DOCUMENTS_RENDER_SERVER_PASS
          REMOTE
