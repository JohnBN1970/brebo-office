name: Office-test Projectdetail V3 Documenten visible CSS deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Deploy Documenten tab visibility CSS with backup and lint
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          source = raw.decode("utf-8")
          expected = "742529945249e360f54222f38f83976636b49bd1aaf874acc206b77008230b25"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          lines = source.splitlines(keepends=True)
          if len(lines) != 994 or "brebo-project-documents-visible-tab" not in lines[991] or source.count("brebo-project-documents-visible-tab") != 1:
              sys.exit("ABORT_VISIBLE_NAV_SOURCE_MISMATCH")
          if "</style>" not in lines[986] or "<nav" not in lines[987] or "</nav>" not in lines[991]:
              sys.exit("ABORT_STYLE_NAV_BOUNDARIES_CHANGED")
          # The six-document tab's anchor is the only one lacking a CSS rule.
          # Style it through the same parent selector as the existing project
          # tabs, and retain a mobile-friendly wrap to avoid clipping.
          style = '.brebo-project-documents-visible-tab{display:inline-flex!important;align-items:center;justify-content:center;padding:9px 13px;border-radius:8px;text-decoration:none;white-space:nowrap;visibility:visible!important;opacity:1!important;position:relative;z-index:1}\n'
          if ".brebo-project-documents-visible-tab{" in source:
              sys.exit("ABORT_CSS_RULE_ALREADY_PRESENT")
          newline = lines[986].replace("</style>",style+"</style>",1)
          if newline == lines[986]:
              sys.exit("ABORT_STYLE_INSERTION_NOOP")
          lines[986] = newline
          candidate = "".join(lines).encode("utf-8")
          if candidate.count(b"brebo-project-documents-visible-tab") != 2:
              sys.exit("ABORT_DOC_LINK_COUNT_UNEXPECTED")
          from tempfile import NamedTemporaryFile
          import shutil
          with NamedTemporaryFile(dir=str(p.parent),prefix=".project-documents-css-",suffix=".php",delete=False) as tmp:
              tmp.write(candidate)
              tmpname=tmp.name
          try:
              result=subprocess.run(["php","-l",tmpname],capture_output=True,text=True)
              if result.returncode:
                  print(result.stdout+result.stderr,flush=True)
                  sys.exit("ABORT_NEW_PROJECT_PHP_LINT_FAILED")
              # Preserve backup and original file mode before atomic replace.
              stamp=datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
              backup=p.with_name(p.name+".documents-css-backup-"+stamp)
              with open(backup,"xb") as stream: stream.write(raw)
              os.chmod(backup, p.stat().st_mode & 0o777)
              os.chmod(tmpname,p.stat().st_mode & 0o777)
              os.replace(tmpname,p)
              lint=subprocess.run(["php","-l",str(p)],capture_output=True,text=True)
              if lint.returncode:
                  shutil.copy2(backup,p)
                  sys.exit("ABORT_ACTIVE_PHP_LINT_FAILED_RESTORED")
              if hashlib.sha256(p.read_bytes()).hexdigest()!=hashlib.sha256(candidate).hexdigest():
                  shutil.copy2(backup,p)
                  sys.exit("ABORT_WRITE_VERIFY_FAILED_RESTORED")
              print("V3_DOCUMENTS_CSS_DEPLOYED",flush=True)
              print("V3_DOCUMENTS_CSS_BACKUP="+backup.name,flush=True)
          finally:
              if os.path.exists(tmpname): os.unlink(tmpname)
          PY
          echo OFFICE_TEST_PROJECT_DOCUMENTS_CSS_DEPLOY_PASS
          REMOTE
