name: Office-test V3 rendered project navigation scope check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Confirm rendered main and dossier nav insertion scope read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          # Run #42353786216 proves $dossierNav is unused. Add the
          # contextual document entry to the actual project HTML fragment.
          # This is separate from the left sidebar and uses the existing
          # project context. Avoid double-rendering the whole five-tab bar.
          source = raw.decode("utf-8")
          if source.count("$dossierNav = '<nav class=\"office-dossier-nav\"") != 1:
              sys.exit("ABORT_DOSSIER_NAV_BUILDER_CHANGED")
          if source.count("$dossierNav .= '<a href=\"/office-test/documenten?project_id='") != 1:
              sys.exit("ABORT_DUPLICATE_LINK_CONTEXT_CHANGED")
          if "OfficeNativeProjectAccess($db))->canRead" not in source:
              sys.exit("ABORT_ACCESS_CHECK_CHANGED")
          if source.count("brebo-project-documents-visible-tab") != 2:
              sys.exit("ABORT_PRIOR_SIDEBAR_LINK_OR_CSS_CHANGED")
          # Inspect presentation variables near the final echo so the
          # upcoming live patch uses an exact guarded insertion point.
          lines=source.splitlines()
          print("LIVE_LINES="+str(len(lines)),flush=True)
          print("DOSSIER_NAV_LAST_REF="+str(max(i for i,line in enumerate(lines,1) if "$dossierNav" in line)),flush=True)
          for i in range(max(0,len(lines)-14),len(lines)):
              line=lines[i]
              tags=[t for t in ("$project", "$dossierNav", "<main", "</main", "<nav", "</nav", "echo", "office-project", "$dashboard") if t in line]
              print("RENDER_LINE="+str(i+1)+" TOKENS="+",".join(tags)+" LEN="+str(len(line)),flush=True)
          print("RENDER_SCOPE_READONLY_PASS",flush=True)
          PY
          echo OFFICE_TEST_RENDER_SCOPE_PASS
          REMOTE
