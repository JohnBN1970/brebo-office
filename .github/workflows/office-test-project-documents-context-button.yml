name: Office-test V3 project dossier tabs source inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect project dossier tabs, not left sidebar, read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          source = raw.decode("utf-8")
          lines = source.splitlines()
          # The previous "visible nav" was the LEFT SIDEBAR, not the
          # project dossier tabs. The actual dossier tabs are generated
          # around lines 603-623; inspect short, safe PHP fragments.
          for i in range(600,625):
              if i >= len(lines): break
              line=lines[i]
              if len(line)>650 or any(x in line.lower() for x in ("password","secret","token","api_key","authorization")):
                  sys.exit("ABORT_UNSAFE_DOSSIER_NAV_LINE")
              print("DOSSIER_TABS_PHP_LINE_"+str(i+1)+"="+line,flush=True)
          for i in range(690,715):
              if i >= len(lines): break
              line=lines[i]
              if len(line)>650 or any(x in line.lower() for x in ("password","secret","token","api_key","authorization")):
                  continue
              if any(x in line for x in ("$dossierNav","nav","tab","echo","main")):
                  print("DOSSIER_RENDER_PHP_LINE_"+str(i+1)+"="+line,flush=True)
          print("ACTUAL_DOSSIER_TABS_SOURCE_INSPECTED",flush=True)
          PY
          echo OFFICE_TEST_DOSSIER_NAV_INSPECT_PASS
          REMOTE
