name: Office-test V3 dashboard tabs render target check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Confirm dashboardTabs render target read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          # The five project tabs come from $dashboardTabs. All earlier
          # ad-hoc $dossierNav and left sidebar links were ineffective.
          # Add the sixth entry to the same canonical mapping.
          source = raw.decode("utf-8")
          expected = [
              "$dashboardTabs = [",
              "  'overzicht' => 'Overzicht', 'gebouwen' => 'Gebouwen',",
              "  'werkvoorbereiding' => 'Werkvoorbereiding',",
              "  'uitvoering' => 'Uitvoering', 'financieel' => 'Financieel',",
              "];",
          ]
          if source.count("\n".join(expected)) != 1:
              sys.exit("ABORT_DASHBOARD_TABS_MAPPING_CHANGED")
          if source.count("$dashboardTabs = [") != 1:
              sys.exit("ABORT_MULTIPLE_DASHBOARD_TABS")
          # Do not create a sixth internal tab without the corresponding
          # display pane. Instead use a contextual Documents link rendered
          # alongside the same navigation and outside the ignored dossierNav.
          # First assert the final rendering point actually interpolates
          # $dossierNav or the mapping. Otherwise abort safely.
          lines = source.splitlines(keepends=True)
          nav_refs = [i+1 for i,line in enumerate(lines) if "$dossierNav" in line]
          print("DOSS_NAV_REFS="+",".join(map(str,nav_refs)),flush=True)
          print("DOSS_NAV_RENDERED_AFTER_BUILDER="+str(any(i>625 for i in nav_refs)),flush=True)
          mapping_refs = [i+1 for i,line in enumerate(lines) if "$dashboardTabs" in line]
          print("DASHBOARD_TABS_REFS="+",".join(map(str,mapping_refs)),flush=True)
          if not any(i>625 for i in nav_refs):
              print("WARNING_DOSSIER_NAV_UNUSED__RENDER_SOURCE_NEEDS_FIX",flush=True)
          print("RENDER_TARGET_RESOLVED_READONLY",flush=True)
          PY
          echo OFFICE_TEST_DASHBOARD_TABS_TARGET_PASS
          REMOTE
