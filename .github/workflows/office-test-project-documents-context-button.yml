name: Office-test Projectdetail V3 render anchor inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Find exact project navigation HTML render anchor read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          expected = "22f25293947cd0801b44ab2e0c80b272a4aab25d95ac1ff3ee586f2d6e9e188b"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_EXPECTED_TAB_LINK_MISSING_OR_DUPLICATED")
          if source.count("brebo-project-documents-action") != 1:
              sys.exit("ABORT_EXISTING_DOCUMENT_ACTION_MISSING_OR_DUPLICATED")
          # Ensure the actual project content contains the dossier nav.
          # Previous versions constructed $dossierNav but never rendered it.
          # Use the existing variable with its escaped, authorized links.
          if source.count("$dossierNav") != 6:
              sys.exit("ABORT_DOSSIER_NAV_REFERENCE_COUNT_CHANGED")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_DOCS_TAB_MISSING")
          # The unique project dossier section is assembled into the
          # rendered HTML. Inspect the exact safe placeholder before patching.
          candidates = []
          lines = source.splitlines()
          for i, line in enumerate(lines, 1):
              if i < 620:
                  continue
              if any(t in line for t in ("$dossierHtml", "$projectHtml", "$mainContent", "$contentHtml", "echo ", "OfficeNavigation", "<main", "project-page", "project-dossier")):
                  tokens = [t for t in ("$dossierHtml", "$projectHtml", "$mainContent", "$contentHtml", "echo ", "OfficeNavigation", "<main", "project-page", "project-dossier", "$dossierNav") if t in line]
                  candidates.append((i,tokens))
          print("RENDER_CANDIDATE_COUNT=" + str(len(candidates)), flush=True)
          for i,tokens in candidates[:45]:
              print("RENDER_CANDIDATE_LINE=" + str(i) + " TOKENS=" + ",".join(tokens), flush=True)
          print("READ_ONLY_RENDER_ANCHOR_REQUIRED", flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
