name: Office-test Projectdetail V3 navigation guard diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect V3 navigation structure checks separately
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          # Projectdetail V3: change the actual visible <nav> block, not
          # the unused $dossierNav or the second injected link in <main>.
          source = raw.decode("utf-8")
          expected = "742529945249e360f54222f38f83976636b49bd1aaf874acc206b77008230b25"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          if source.count("brebo-project-documents-visible-tab") != 1:
              sys.exit("ABORT_DOCS_LINK_NOT_UNIQUE")
          if source.count("OfficeNativeProjectAccess($db))->canRead") != 1:
              sys.exit("ABORT_PROJECT_ACCESS_CHECK_CHANGED")
          lines = source.splitlines(keepends=True)
          # Inspect each location separately: the previous combined guard
          # failed despite the earlier confirmed live SHA, obscuring which
          # assertion was incorrect. This operation is read-only.
          checks = {
              "MIN_LENGTH": len(lines) >= 995,
              "NAV_OPEN_988": len(lines) >= 988 and "<nav" in lines[987],
              "OVERVIEW_989": len(lines) >= 989 and "Overzicht" in lines[988],
              "LINK_991": len(lines) >= 991 and "href=" in lines[990],
              "NAV_CLOSE_992": len(lines) >= 992 and "</nav>" in lines[991],
              "DOCS_LINK_992": len(lines) >= 992 and "brebo-project-documents-visible-tab" in lines[991],
          }
          for key, value in checks.items():
              print("STRUCT_CHECK_" + key + "=" + str(value), flush=True)
          # Existing rendered tab strip is lines 988-992. It is generated
          # as a PHP HTML concatenation. The inserted Documents link was
          # already added to the same line as </nav>, but was not visible
          # in the user's screenshot; this requires verifying CSS/layout.
          # Do not duplicate links or mutate the active page blindly.
          nav = "".join(lines[987:992])
          print("VISIBLE_NAV_DOCS_CLASS=" + str("brebo-project-documents-visible-tab" in nav), flush=True)
          print("VISIBLE_NAV_DOCS_LABEL=" + str("Documenten" in nav), flush=True)
          print("VISIBLE_NAV_DOCS_IN_CLOSE_LINE=" + str("brebo-project-documents-visible-tab" in lines[991]), flush=True)
          print("VISIBLE_NAV_LINE_LENGTH=" + str(len(lines[991])), flush=True)
          # Probe the page CSS selector names, not the contents or user data.
          for token in ("office-dossier-nav", "project-tab", "project-tabs", "project-nav", "display:none", "overflow:hidden", "overflow-x", "flex-wrap", "white-space:nowrap"):
              print("VISIBLE_NAV_CSS_" + re.sub(r"[^A-Za-z0-9]","_",token) + "=" + str(source.count(token)), flush=True)
          print("READ_ONLY_VISIBLE_NAV_CSS_CHECK_PASS", flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
