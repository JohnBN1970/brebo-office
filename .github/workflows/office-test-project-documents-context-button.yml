name: Office-test Projectdetail V3 navigation structure read-only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect live project navigation structure read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          expected = "22f25293947cd0801b44ab2e0c80b272a4aab25d95ac1ff3ee586f2d6e9e188b"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_EXPECTED_TAB_LINK_MISSING_OR_DUPLICATED")
          if source.count("brebo-project-documents-action") != 1:
              sys.exit("ABORT_EXISTING_DOCUMENT_ACTION_MISSING_OR_DUPLICATED")
          # Confirm exact active V3 layout before touching it. The existing
          # $dossierNav is not the same renderer as the visible tab bar.
          item = "'financieel' => 'Financieel'"
          if source.count(item) != 1:
              sys.exit("ABORT_FINANCIAL_LABEL_NOT_UNIQUE")
          lines = source.splitlines()
          financial_line = source[:source.index(item)].count(chr(10))
          area = lines[max(0, financial_line-8):financial_line+24]
          if not all(label in chr(10).join(area) for label in ("Overzicht", "Gebouwen", "Werkvoorbereiding", "Uitvoering", "Financieel")):
              sys.exit("ABORT_NOT_EXPECTED_TAB_MAPPING")
          print("LIVE_V3_NAVIGATION_CONTEXT", flush=True)
          # Report structural symbols only, never raw live PHP source.
          for i, line in enumerate(lines[max(0, financial_line-8):financial_line+24], max(0, financial_line-8)+1):
              tokens = ("$dossierNav", "foreach", "'financieel'", "'overzicht'", "'gebouwen'", "'werkvoorbereiding'", "'uitvoering'", "tab=", "$projectUrl", "brebo-project-documents-tab", "href=", "echo", "office-dossier-nav")
              hits = [t for t in tokens if t in line]
              if hits:
                  print(f"NAV_STRUCT_{i}=" + ",".join(hits) + ";CHARS=" + str(len(line)), flush=True)
          print("OFFICE_TEST_TAB_RENDER_SOURCE_REVIEW_PASS", flush=True)
          # Read-only inspection ends here. Never rewrite live V3 from this workflow.
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
