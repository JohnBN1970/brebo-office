name: Office-test Projectdetail V3 render inspection read-only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect live V3 visible tabs without modifying server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          # Read-only analysis of the ACTIVE V3 page, not repository copy.
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, re, hashlib
          source = pathlib.Path(os.environ["PROJECT"]).read_text()
          print("LIVE_V3_SHA256=" + hashlib.sha256(source.encode()).hexdigest())
          keys = [
              ("tabs_array", r"\$tabs\s*="),
              ("tab_labels", r"'financieel'\s*=>\s*'Financieel'"),
              ("nav_render", r"\$dossierNav\b"),
              ("nav_html", r"office-dossier-nav"),
              ("office_tabs", r"office-tabs"),
              ("project_gegevens", r"project-gegevens"),
              ("project_documents_tab", r"brebo-project-documents-tab"),
              ("project_documents_action", r"brebo-project-documents-action"),
              ("financial_label", r"Financieel"),
              ("project_detail_output", r"\becho\b"),
          ]
          for name, pattern in keys:
              hits = list(re.finditer(pattern, source))
              print("V3_RENDER_" + name.upper() + "_COUNT=" + str(len(hits)))
              print("V3_RENDER_" + name.upper() + "_LINES=" + ",".join(str(source.count(chr(10), 0, m.start()) + 1) for m in hits[:15]))
          # Report only sanitized structure from matching lines: never raw
          # page source, paths, data, names or tokens.
          for i, line in enumerate(source.splitlines(), 1):
              if any(x in line for x in ("$tabs =", "$dossierNav =", "$dossierNav .=", "office-dossier-nav", "office-tabs")):
                  print("V3_STRUCT_LINE=" + str(i) + " flags=" + ",".join(
                      x for x in ("tabs", "dossierNav", "office-dossier-nav", "office-tabs", "financieel", "echo", "print")
                      if x in line
                  ) + " length=" + str(len(line)))
          PY
          echo OFFICE_TEST_PROJECT_RENDER_DIAGNOSTIC_PASS
          REMOTE
