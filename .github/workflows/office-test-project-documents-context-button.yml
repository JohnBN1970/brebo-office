name: Office-test Projectdetail V3 Documents main-line guard
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Validate project main HTML insertion preconditions
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          expected = "22f25293947cd0801b44ab2e0c80b272a4aab25d95ac1ff3ee586f2d6e9e188b"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          source = raw.decode("utf-8")
          if source.count("brebo-project-documents-tab") != 1:
              sys.exit("ABORT_EXPECTED_TAB_LINK_MISSING_OR_DUPLICATED")
          if source.count("brebo-project-documents-action") != 1:
              sys.exit("ABORT_EXISTING_DOCUMENT_ACTION_MISSING_OR_DUPLICATED")
          # Render the existing, escaped dossier navigation inside the
          # actual HTML <main>, not in an unreferenced PHP variable.
          # Keep the five current tabs, access checks and all page content.
          lines = source.splitlines(keepends=True)
          main_indices = [i for i,line in enumerate(lines) if "<main" in line and "</nav" in line]
          if len(main_indices) != 1 or main_indices[0] != 991:
              sys.exit("ABORT_LIVE_MAIN_RENDER_ANCHOR_MISMATCH")
          if lines[main_indices[0]].count("<main") != 1:
              sys.exit("ABORT_MAIN_TAG_NOT_UNIQUE_ON_LINE")
          if source.count("$dossierNav") != 6:
              sys.exit("ABORT_DOSSIER_NAV_REFERENCE_COUNT")
          if source.count("OfficeNativeProjectAccess($db))->canRead") < 1:
              sys.exit("ABORT_ACCESS_GUARD_NOT_FOUND")
          if "brebo-documents-visible-nav-v1" in source:
              print("ALREADY_INSTALLED", flush=True)
              sys.exit(0)
          # We are still inside the PHP output string here: splice the
          # document links into the rendered markup using the same escaped
          # HTML that the server already constructed.
          main_line = lines[main_indices[0]]
          if "' . " in main_line and "<main" in main_line:
              sys.exit("ABORT_COMPLEX_MAIN_LINE_REQUIRE_EXACT_REVIEW")
          print("RENDER_MAIN_LINE_TOKENS=" + ",".join(t for t in ("echo", " . ", "$", "'", '"', "</nav", "<main", "<section") if t in main_line), flush=True)
          print("ABORT_NEED_EXACT_MAIN_LINE_SHAPE", flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
