name: Office-test Documents runtime diagnosis read-only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Diagnose runtime method compatibility after HTTP 500
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          # Read-only runtime diagnosis. No installation or page modification.
          # The failed tab called OfficeMount::route(), whereas the earlier
          # working action used OfficeMount::basePath().
          mount="$active/src/Intake/OfficeMount.php"
          test -f "$mount" && test ! -L "$mount" || { echo ABORT_MOUNT_CLASS_MISSING; exit 26; }
          php -l "$mount"
          echo "OFFICE_MOUNT_ROUTE_METHOD_COUNT=$(grep -Ec 'function[[:space:]]+route[[:space:]]*\(' "$mount" || true)"
          echo "OFFICE_MOUNT_BASEPATH_METHOD_COUNT=$(grep -Ec 'function[[:space:]]+basePath[[:space:]]*\(' "$mount" || true)"
          echo "PROJECT_V3_DOCUMENTS_TAB_COUNT=$(grep -Fc 'brebo-project-documents-tab' "$project" || true)"
          echo "PROJECT_V3_DOCUMENTS_ACTION_COUNT=$(grep -Fc 'brebo-project-documents-action' "$project" || true)"
          echo "PROJECT_V3_NAV_CLOSE_COUNT=$(grep -Fc "\$dossierNav .= '</nav>';" "$project" || true)"
          echo "PROJECT_V3_SHA256=$(sha256sum "$project" | cut -d' ' -f1)"
          echo OFFICE_TEST_DOCUMENTS_RUNTIME_DIAGNOSIS_READONLY_PASS
          REMOTE
