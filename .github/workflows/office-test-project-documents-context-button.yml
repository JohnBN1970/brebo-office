name: Office-test Projectdetail V3 Documenten actual rendering check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect rendered Documenten anchor context read-only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" || { echo ABORT_MISSING_PAGE; exit 21; }
          php -l "$project" && php -l "$docs"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENTS_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENTS_MENU_MISSING; exit 25; }
          PROJECT="$project" python3 - <<'PY'
          import os, pathlib, hashlib, datetime, subprocess, sys, re
          p = pathlib.Path(os.environ["PROJECT"])
          raw = p.read_bytes()
          # The installed URL is in the rendered HTML, but not in the
          # user's observed navigation. Probe the exact rendered PHP
          # expression and CSS selectors before making any live edit.
          source = raw.decode("utf-8")
          expected = "742529945249e360f54222f38f83976636b49bd1aaf874acc206b77008230b25"
          if hashlib.sha256(raw).hexdigest() != expected:
              sys.exit("ABORT_LIVE_V3_SHA_CHANGED")
          lines = source.splitlines(keepends=True)
          if len(lines) < 992 or source.count("brebo-project-documents-visible-tab") != 1:
              sys.exit("ABORT_RENDER_STRUCTURE_CHANGED")
          nav = "".join(lines[987:992])
          print("NAV_SOURCE_LINE_COUNT=" + str(len(lines)), flush=True)
          print("NAV_LINK_IN_OUTPUT_EXPR=" + str("brebo-project-documents-visible-tab" in nav), flush=True)
          print("NAV_LINK_CLASS_RULE_COUNT=" + str(len(re.findall(r"\.brebo-project-documents-visible-tab\b", source))), flush=True)
          print("NAV_CSS_OVERFLOW_X_COUNT=" + str(source.count("overflow-x")), flush=True)
          print("NAV_CSS_FLEX_WRAP_COUNT=" + str(source.count("flex-wrap")), flush=True)
          print("NAV_CLOSE_EXPR_QUOTE_COUNT=" + str(lines[991].count("'")), flush=True)
          # Detect whether the injected anchor falls in the same PHP
          # string expression or a nested escaped string.
          line = lines[991]
          pos = line.find("brebo-project-documents-visible-tab")
          prefix = line[:pos]
          suffix = line[pos:]
          for name, token in (("ANCHOR_PHP_DOT", " . "), ("ANCHOR_ESCAPE_CALL", "$escape("), ("ANCHOR_LINK_HREF", "href="), ("ANCHOR_NAV_END", "</nav>")):
              print("NAV_PREFIX_" + name + "=" + str(prefix.count(token)), flush=True)
              print("NAV_SUFFIX_" + name + "=" + str(suffix.count(token)), flush=True)
          print("READ_ONLY_RENDER_POSITION_CHECK_PASS", flush=True)
          PY
          echo OFFICE_TEST_PROJECT_NAV_READONLY_PASS
          REMOTE
