name: Deploy BREBO Office Production

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: brebo-office-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            [[ -n "${!name}" ]] || { echo "::error::Missing $name"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            [[ "$attempt" -lt 5 ]] || exit 1
            sleep $((attempt * 2))
          done

      - name: Deploy develop to Hostinger
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "EXPECTED_SHA='$EXPECTED_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/brebobv.nl/public_html/sboffice_app"
          public="$HOME/domains/brebobv.nl/public_html/sboffice"
          cd "$app"

          [[ -d .git ]] || { echo '::error::Production app is not a git checkout.'; exit 1; }
          git fetch origin develop --prune
          git checkout develop
          git reset --hard "$EXPECTED_SHA"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

          drush_bin=""
          [[ -x vendor/bin/drush ]] && drush_bin="vendor/bin/drush"
          [[ -n "$drush_bin" ]] || { echo '::error::vendor/bin/drush not found.'; exit 1; }

          "$drush_bin" status --fields=bootstrap,db-status --format=list
          "$drush_bin" en brebo_control brebo_procurement_control brebo_contract_control -y
          "$drush_bin" updb -y
          "$drush_bin" cr

          [[ -L "$public" || -d "$public" ]]
          echo "DEPLOYED_SHA=$(git rev-parse HEAD)"
          REMOTE

      - name: Live smoke tests
        shell: bash
        run: |
          set -euo pipefail
          check_home() {
            local url="$1"
            local status
            status=$(curl -sS -L -o /tmp/brebo-smoke-home -w '%{http_code}' --max-time 30 -H 'Cache-Control: no-cache' "$url")
            echo "$url -> HTTP $status"
            [[ "$status" -ge 200 && "$status" -lt 400 ]]
          }
          check_route_exists() {
            local url="$1"
            local status
            status=$(curl -sS -L -o /tmp/brebo-smoke-route -w '%{http_code}' --max-time 30 -H 'Cache-Control: no-cache' "$url")
            echo "$url -> HTTP $status"
            [[ "$status" -ne 404 && "$status" -lt 500 ]]
          }
          check_home 'https://sboffice.brebobv.nl/'
          check_route_exists 'https://sboffice.brebobv.nl/brebo/control-center'

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "### BREBO Office production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`sboffice.brebobv.nl\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline: develop → Hostinger → composer → modules → updb → cr → smoke tests" >> "$GITHUB_STEP_SUMMARY"
