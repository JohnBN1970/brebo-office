name: BREBO Zoho migration pilot

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/zoho-migration-pilot.yml'

permissions:
  contents: read

concurrency:
  group: brebo-zoho-migration-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Pilot newest-first Zoho batch and activate cron backfill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to obtain SSH host key."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Run controlled newest-first pilot and enable persistent cron migration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd public_html/sboffice_app
          runtime="$HOME/.brebo-mail-runtime.php"
          if [[ ! -f "$runtime" ]]; then
            echo "BREBO_RUNTIME_FILE=MISSING"
            exit 2
          fi

          php -d auto_prepend_file="$runtime" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl php:eval '
            $adapter = \Drupal::service("brebo_mail_intake.zoho_migration_source");
            if (!$adapter->isConfigured()) {
              throw new \RuntimeException("Zoho-migratiebron is niet geconfigureerd.");
            }

            $state = \Drupal::state();
            $queue = \Drupal::service("brebo_mail_intake.queue_manager");
            $storage = \Drupal::entityTypeManager()->getStorage("node");

            // Retire the old forward-only pilot cursor and initialize the new
            // newest-first backfill cursor cleanly.
            $legacyUid = (int) $state->get("brebo_mail_intake.zoho_migration_last_uid", 0);
            echo "ZOHO_LEGACY_UID=" . $legacyUid . PHP_EOL;
            $state->delete("brebo_mail_intake.zoho_migration_before_uid");
            $state->delete("brebo_mail_intake.zoho_migration_complete");
            $state->set("brebo_mail_intake.zoho_migration_enabled", FALSE);

            $beforeCount = (int) $storage->getQuery()->accessCheck(FALSE)->condition("type", "brebo_communication")->count()->execute();
            echo "COMMUNICATION_COUNT_BEFORE=" . $beforeCount . PHP_EOL;

            putenv("BREBO_ZOHO_IMAP_BATCH_LIMIT=5");
            $enqueued = $queue->enqueueSource($adapter);
            echo "ZOHO_PILOT_ENQUEUED=" . $enqueued . PHP_EOL;
            if ($enqueued < 1 || $enqueued > 5) {
              throw new \RuntimeException("Onverwacht aantal Zoho-pilotberichten in queue.");
            }
          '

          php -d auto_prepend_file="$runtime" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl queue:run brebo_mail_intake_process

          php -d auto_prepend_file="$runtime" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl php:eval '
            $state = \Drupal::state();
            $storage = \Drupal::entityTypeManager()->getStorage("node");
            $afterCount = (int) $storage->getQuery()->accessCheck(FALSE)->condition("type", "brebo_communication")->count()->execute();
            $cursor = (int) $state->get("brebo_mail_intake.zoho_migration_before_uid", 0);
            $complete = (bool) $state->get("brebo_mail_intake.zoho_migration_complete", FALSE);
            echo "COMMUNICATION_COUNT_AFTER=" . $afterCount . PHP_EOL;
            echo "ZOHO_NEWEST_FIRST_CURSOR=" . $cursor . PHP_EOL;
            echo "ZOHO_MIGRATION_COMPLETE=" . ($complete ? "YES" : "NO") . PHP_EOL;
            if ($cursor <= 0) {
              throw new \RuntimeException("Zoho newest-first cursor is niet opgeslagen.");
            }
            $state->set("brebo_mail_intake.zoho_migration_enabled", TRUE);
            echo "ZOHO_MIGRATION_STATE_ENABLED=YES" . PHP_EOL;
            echo "ZOHO_NEWEST_FIRST_PILOT=PASS" . PHP_EOL;
          '
          REMOTE
