# One-time targeted activation for BREBO Help production runtime. Trigger via PR merge.
name: BREBO Help production enable

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/brebo-help-production-enable.yml'

permissions:
  contents: read

concurrency:
  group: brebo-office-production
  cancel-in-progress: false

jobs:
  enable-help:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          timeout 20 ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Enable and verify BREBO Help in production
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          test -f web/modules/custom/brebo_help/brebo_help.info.yml
          drush=("$php" -d memory_limit=512M vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          "${drush[@]}" pm:enable brebo_help -y
          "${drush[@]}" cr

          "${drush[@]}" php:eval '
            $mh = \Drupal::moduleHandler();
            if (!$mh->moduleExists("brebo_help")) { throw new \RuntimeException("brebo_help is not enabled"); }
            $routes = \Drupal::service("router.route_provider");
            $routes->getRouteByName("brebo_help.center");
            $routes->getRouteByName("brebo_help.article");
            print "BREBO_HELP_MODULE_OK=1\n";
            print "BREBO_HELP_ROUTES_OK=1\n";
          '

          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sboffice.brebobv.nl/brebo/help)"
          [[ "$status" != "000" && "$status" != "404" && "$status" != "500" ]]
          echo "BREBO_HELP_HTTP_OK=$status"
          echo "BREBO_HELP_PRODUCTION_ENABLE=PASS"
          REMOTE
