name: Office external hours approval mode migration
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPROVAL-MODE-INSPECT or APPROVAL-MODE-PREFLIGHT
        required: true
        type: string
permissions:
  contents: read
jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPROVAL-MODE-INSPECT' || inputs.confirmation == 'APPROVAL-MODE-PREFLIGHT' }}
    runs-on: ubuntu-latest
    environment: office-test
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l office-independent/src/Inzet/OfficeExternalHoursApprovalModeMigration.php
          php -l office-independent/deployment/hostinger/install-external-hours-approval-mode.php
      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_approval_mode
          chmod 600 ~/.ssh/id_approval_mode
      - name: Office-test read-only inspection or preflight
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          CONFIRM: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER"
          remote="$USER@$HOST"
          opts="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -i $HOME/.ssh/id_approval_mode"
          ssh $opts -p "$PORT" "$remote" 'mkdir -p "$HOME/office_calc_test/.approval-mode-stage"'
          scp $opts -P "$PORT" office-independent/deployment/hostinger/install-external-hours-approval-mode.php office-independent/src/Inzet/OfficeExternalHoursApprovalModeMigration.php "$remote:office_calc_test/.approval-mode-stage/"
          if [ "$CONFIRM" = 'APPROVAL-MODE-INSPECT' ]; then mode=--inspect; else mode=--preflight; fi
          ssh $opts -p "$PORT" "$remote" "OFFICE_TEST_CONFIG_PATH=\$HOME/domains/brebobv.nl/office_calc_test/config/config.php php \$HOME/office_calc_test/.approval-mode-stage/install-external-hours-approval-mode.php '$mode'"
