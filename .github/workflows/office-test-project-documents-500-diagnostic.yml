name: Office-test project Documenten HTTP 500 runtime contract diagnostic
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/office-test-project-documents-500-diagnostic.yml'
      - 'office-independent/public/office-documents.php'
      - 'office-independent/src/Intake/OfficeMount.php'
      - 'office-independent/src/Project/OfficeNativeProjectAccess.php'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect runtime Documenten method and class contracts
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          docs="$active/public/office-documents.php"
          project="$active/public/office-project.php"
          view="$active/src/Project/OfficeProjectDetailV3View.php"
          for file in "$docs" "$project" "$view"; do
            test -f "$file" && test ! -L "$file" || { echo ABORT_FILE_MISSING; exit 21; }
            php -l "$file"
          done
          DOCS="$docs" VIEW="$view" ACTIVE="$active" python3 - <<'PY'
          import os,pathlib,re
          docs=pathlib.Path(os.environ["DOCS"]).read_text()
          view=pathlib.Path(os.environ["VIEW"]).read_text()
          active=pathlib.Path(os.environ["ACTIVE"])
          for marker in ("OfficeNewDocumentMenu::render","OfficeNativeProjectAccess","OfficeMount::route","OfficeMount::basePath","project_id","canRead","require_once"):
              print("DOCUMENTS_MARKER_"+re.sub("[^A-Z0-9]","_",marker.upper())+"="+str(docs.count(marker)),flush=True)
          print("V3_CONTEXT_LINK="+str(view.count("/documenten?project_id=")),flush=True)
          mount=active/"src/Intake/OfficeMount.php"
          if mount.is_file():
              txt=mount.read_text()
              print("DOCUMENTS_MOUNT_ROUTE_METHOD="+str(bool(re.search(r"function\s+route\s*\(",txt))),flush=True)
              print("DOCUMENTS_MOUNT_BASEPATH_METHOD="+str(bool(re.search(r"function\s+basePath\s*\(",txt))),flush=True)
          else:
              print("DOCUMENTS_MOUNT_CLASS_FILE_MISSING",flush=True)
          menu=active/"src/Document/OfficeNewDocumentMenu.php"
          print("DOCUMENTS_MENU_EXPECTED_PATH_EXISTS="+str(menu.is_file()),flush=True)
          candidates=list((active/"src").rglob("*NewDocumentMenu*.php"))
          print("DOCUMENTS_MENU_CANDIDATE_COUNT="+str(len(candidates)),flush=True)
          for candidate in candidates[:10]:
              print("DOCUMENTS_MENU_CANDIDATE_RELATIVE="+str(candidate.relative_to(active)),flush=True)
          for line in docs.splitlines():
              if "OfficeNewDocumentMenu" in line:
                  print("DOCUMENTS_MENU_REFERENCE_KIND="+("require" if "require" in line else "render" if "::render" in line else "other"),flush=True)
          print("DOCUMENTS_MENU_CLASS_DECLARATION_COUNT="+str(sum("class OfficeNewDocumentMenu" in x.read_text(errors="replace") for x in candidates)),flush=True)
          for line in docs.splitlines():
              if "OfficeNewDocumentMenu" in line and ("require" in line or "include" in line):
                  print("DOCUMENTS_MENU_INCLUDE_USES_DOCUMENTS="+str("/Documents/" in line),flush=True)
                  print("DOCUMENTS_MENU_INCLUDE_USES_DOCUMENT="+str("/Document/" in line),flush=True)
          for candidate in candidates[:10]:
              source=candidate.read_text(errors="replace")
              namespace=re.search(r"namespace\s+([A-Za-z0-9_\\]+)\s*;",source)
              print("DOCUMENTS_MENU_NAMESPACE="+(namespace.group(1) if namespace else "none"),flush=True)
              print("DOCUMENTS_MENU_HAS_STATIC_RENDER="+str(bool(re.search(r"static\s+function\s+render\s*\(",source))),flush=True)
          # Resolve the actual menu require target relative to the active public entrypoint.
          for line in docs.splitlines():
              if "OfficeNewDocumentMenu.php" in line and "require" in line:
                  print("DOCUMENTS_MENU_REQUIRE_LINE_HAS_DIRNAME="+str("__DIR__" in line),flush=True)
                  print("DOCUMENTS_MENU_REQUIRE_LINE_HAS_ACTIVE_PARENT="+str("dirname(__DIR__)" in line),flush=True)
          for candidate in candidates[:10]:
              print("DOCUMENTS_MENU_PHP_LINT_TARGET="+str(candidate.relative_to(active)),flush=True)
          # No raw source, PII or secrets are printed.
          print("DOCUMENTS_500_RUNTIME_CONTRACT_INSPECTED",flush=True)
          PY
          # Lint the menu file and verify the declared class/method contract without executing the page.
          menu_file="$active/src/Documents/OfficeNewDocumentMenu.php"
          if test -f "$menu_file" && test ! -L "$menu_file"; then
            php -l "$menu_file"
            MENU_FILE="$menu_file" php -r '
              require $GLOBALS["argv"][1];
              $class="Brebo\\Office\\Documents\\OfficeNewDocumentMenu";
              echo "DOCUMENTS_MENU_CLASS_LOADABLE=".(class_exists($class)?"true":"false").PHP_EOL;
              if (class_exists($class) && method_exists($class,"render")) {
                $method=new ReflectionMethod($class,"render");
                echo "DOCUMENTS_MENU_RENDER_STATIC=".($method->isStatic()?"true":"false").PHP_EOL;
                echo "DOCUMENTS_MENU_RENDER_REQUIRED_ARGS=".$method->getNumberOfRequiredParameters().PHP_EOL;
              }
            ' "$menu_file"
          else
            echo DOCUMENTS_MENU_RUNTIME_FILE_MISSING
          fi
          # Anonymous HTTP smoke check; no cookies, credentials, body, or redirect targets logged.
          for route in /office-test/documenten /office-test/documenten/nieuw /office-test/projecten; do
            case "$route" in
              /office-test/documenten) label=documents ;;
              /office-test/documenten/nieuw) label=documents_new ;;
              *) label=projects ;;
            esac
            status="$(curl -sS -L --max-redirs 0 --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "https://brebobv.nl$route" 2>/dev/null)" || status=transport_error
            echo "DOCUMENTS_HTTP_${label}=$status"
          done
          # Do not expose request paths, IPs, cookies or raw exception messages.
          # Only count recent PHP error categories, with no user data.
          for log in "$active/error_log" "$active/public/error_log" "$root/error_log"; do
            if test -f "$log" && test ! -L "$log"; then
              LOG="$log" python3 - <<'PY'
          import os,pathlib,re
          data=pathlib.Path(os.environ["LOG"]).read_text(errors="replace").splitlines()[-200:]
          hits=[x for x in data if any(y in x for y in ("office-documents.php","OfficeNewDocumentMenu","OfficeMount","OfficeNativeProjectAccess"))]
          print("DOCUMENTS_RELATED_ERRORS="+str(len(hits)),flush=True)
          for x in hits[-8:]:
              typ="undefined_method" if "undefined method" in x.lower() else "missing_class" if "class " in x.lower() and "not found" in x.lower() else "missing_file" if "failed opening" in x.lower() else "type_error" if "typeerror" in x.lower() else "other_php_error"
              print("DOCUMENTS_ERROR_CATEGORY="+typ,flush=True)
          PY
            fi
          done
          echo OFFICE_TEST_DOCUMENTS_500_DIAGNOSTIC_COMPLETE
          REMOTE
