name: Prepare BREBO Office test layout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sboffice-layout-preparation
  cancel-in-progress: false

jobs:
  prepare-sboffice:
    name: Build and prepare sboffice/web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out develop source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Build production Composer project
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

          test -f vendor/autoload.php
          test -f web/index.php
          test -f web/autoload.php
          php -r "require 'vendor/autoload.php';"

      - name: Assemble deployment payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp composer.json composer.lock deploy/
          cp -a vendor web deploy/
          rm -f deploy/web/sites/default/settings.php
          rm -f deploy/web/sites/default/settings.local.php
          rm -rf deploy/web/sites/default/files
          touch deploy/.brebo-office-managed

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required secret $name is missing."
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::DEPLOY_PORT must be numeric."
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify source runtime and protected targets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          target="public_html/sboffice"

          test -d "$target"
          test -f "$target/index.php"
          test -f "$target/sites/default/settings.php"
          test -d "$target/sites/default/files"

          for protected in public_html/office public_html/dev-platform; do
            if [[ "$target" == "$protected" ]]; then
              echo "::error::Refusing to use protected target $protected."
              exit 1
            fi
          done

          echo "Existing sboffice runtime: verified"
          echo "Protected production targets: excluded"
          REMOTE

      - name: Upload new Composer layout without deleting current files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          rsync -az             --exclude 'web/sites/default/settings.php'             --exclude 'web/sites/default/settings.local.php'             --exclude 'web/sites/default/files/'             -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT"             deploy/ "$DEPLOY_USER@$DEPLOY_HOST:public_html/sboffice/"

      - name: Preserve runtime files below the new web root
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          target="public_html/sboffice"

          install -d "$target/web/sites/default"
          cp -p "$target/sites/default/settings.php" "$target/web/sites/default/settings.php"

          if [[ -f "$target/sites/default/settings.local.php" ]]; then
            cp -p "$target/sites/default/settings.local.php" "$target/web/sites/default/settings.local.php"
          fi

          install -d "$target/web/sites/default/files"
          rsync -a "$target/sites/default/files/" "$target/web/sites/default/files/"

          chmod u+w "$target/web/sites/default" || true
          chmod -R u+rwX "$target/web/sites/default/files" || true
          REMOTE

      - name: Verify prepared layout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          target="public_html/sboffice"

          test -f "$target/.brebo-office-managed"
          test -f "$target/composer.json"
          test -f "$target/composer.lock"
          test -f "$target/vendor/autoload.php"
          test -f "$target/web/index.php"
          test -f "$target/web/autoload.php"
          test -f "$target/web/sites/default/settings.php"
          test -d "$target/web/sites/default/files"

          php -l "$target/web/sites/default/settings.php"
          php -r "require '$target/vendor/autoload.php';"

          echo "New Composer project root: prepared"
          echo "New Drupal web root: prepared"
          echo "Runtime settings and public files: preserved"
          echo "Current subdomain document root: unchanged"
          REMOTE
