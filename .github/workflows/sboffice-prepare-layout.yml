name: Prepare BREBO Office test layout

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-office-production
  cancel-in-progress: false

jobs:
  retired:
    name: Layout writer retired
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical deployment ownership
        shell: bash
        run: |
          set -euo pipefail
          echo "The legacy sboffice layout writer is retired."
          echo "Production code may only be changed by Deploy BREBO Office Production."
          echo "This workflow intentionally performs no remote writes."
