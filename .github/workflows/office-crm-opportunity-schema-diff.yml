name: CRM opportunities schema compatibility audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: php -l office-independent/deployment/hostinger/audit-office-crm-opportunity-schema-diff.php
      - name: Stage read-only compatibility audit
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 77.37.34.160
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 65002
          source: "office-independent/deployment/hostinger/audit-office-crm-opportunity-schema-diff.php"
          target: "/home/u213420663/domains/brebobv.nl/office_calc_test/.crm-opportunity-diff-stage"
          overwrite: true
      - name: Inspect Office-test schema without DDL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.37.34.160
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            set -eu
            ROOT=/home/u213420663/domains/brebobv.nl/office_calc_test
            SCRIPT="$ROOT/.crm-opportunity-diff-stage/office-independent/deployment/hostinger/audit-office-crm-opportunity-schema-diff.php"
            PHP=/opt/alt/php83/usr/bin/php
            test -f "$SCRIPT"
            "$PHP" -l "$SCRIPT"
            export OFFICE_BASE_PATH=/office-test
            export OFFICE_TEST_CONFIG_PATH="$ROOT/config/config.php"
            "$PHP" "$SCRIPT"
