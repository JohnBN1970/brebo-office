name: Office Calc type recipe bridge
on:
  pull_request:
    paths:
      - 'office-independent/src/Calculation/OfficeCalcTypeRecipeBridge.php'
      - 'office-independent/tests/OfficeCalcTypeRecipeBridgeTest.php'
      - '.github/workflows/office-calc-type-recipe-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BCMath
        run: sudo apt-get update -qq && sudo apt-get install -y php-bcmath
      - name: Validate type recipe bridge
        run: |
          php -l office-independent/src/Calculation/OfficeCalcTypeRecipeBridge.php
          php -l office-independent/tests/OfficeCalcTypeRecipeBridgeTest.php
          php office-independent/tests/OfficeCalcTypeRecipeBridgeTest.php
