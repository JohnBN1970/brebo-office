name: Office handover report MySQL integration
on:
  pull_request:
    paths:
      - 'office-independent/sql/20261127_project_handover_reports.sql'
      - 'office-independent/tests/OfficeHandoverReportMysqlTest.php'
      - '.github/workflows/office-handover-report-mysql-integration.yml'
  workflow_dispatch:
jobs:
  isolated-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: localtest
          MYSQL_DATABASE: brebo_handover_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocaltest"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL PDO
        run: php -m | grep -qi '^pdo_mysql
      - name: Check test syntax
        run: php -l office-independent/tests/OfficeHandoverReportMysqlTest.php
      - name: Exercise isolated schema and project-scoped draft persistence
        env:
          HANDOVER_CI_DSN: mysql:host=127.0.0.1;port=3306;dbname=brebo_handover_ci;charset=utf8mb4
          HANDOVER_CI_USER: root
          HANDOVER_CI_PASSWORD: localtest
        run: php office-independent/tests/OfficeHandoverReportMysqlTest.php
 || (sudo apt-get install -y php-mysql)
      - name: Check test syntax
        run: php -l office-independent/tests/OfficeHandoverReportMysqlTest.php
      - name: Exercise isolated schema and project-scoped draft persistence
        env:
          HANDOVER_CI_DSN: mysql:host=127.0.0.1;port=3306;dbname=brebo_handover_ci;charset=utf8mb4
          HANDOVER_CI_USER: root
          HANDOVER_CI_PASSWORD: localtest
        run: php office-independent/tests/OfficeHandoverReportMysqlTest.php
