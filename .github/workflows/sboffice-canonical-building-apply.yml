name: BREBO Office canonical building apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to confirm the canonical relation migration and config export'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sboffice-canonical-building-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply canonical building relations and export config
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.confirm }}' != 'APPLY' ]]; then
            echo '::error::Confirmation must be exactly APPLY.'
            exit 1
          fi

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required secret $name is missing."
              exit 1
            fi
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Apply canonical relations and export active config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1
          export TERM=dumb
          target="public_html/sboffice"

          if [[ ! -d "$target" ]]; then
            echo "::error::The sboffice target directory does not exist."
            exit 1
          fi
          if [[ ! -f "$target/vendor/drush/drush/drush.php" ]]; then
            echo "::error::Drush entrypoint is missing."
            exit 1
          fi
          if [[ ! -f "$target/scripts/canonicalize-building-relations.php" ]]; then
            echo "::error::Canonical migration script is missing. Deploy current develop first."
            exit 1
          fi

          cd "$target"
          export BREBO_CANONICAL_SCRIPT="$PWD/scripts/canonicalize-building-relations.php"

          echo '=== Canonical apply ==='
          BREBO_APPLY_CANONICAL_RELATIONS=1 timeout 120 php vendor/drush/drush/drush.php \
            --root=web \
            --uri=https://sboffice.brebobv.nl \
            --no-ansi \
            php:eval 'include getenv("BREBO_CANONICAL_SCRIPT");'

          echo '=== Export active Drupal configuration ==='
          timeout 180 php vendor/drush/drush/drush.php \
            --root=web \
            --uri=https://sboffice.brebobv.nl \
            --no-ansi \
            cex -y

          echo '=== Re-audit after apply ==='
          unset BREBO_APPLY_CANONICAL_RELATIONS || true
          timeout 120 php vendor/drush/drush/drush.php \
            --root=web \
            --uri=https://sboffice.brebobv.nl \
            --no-ansi \
            php:eval 'include getenv("BREBO_CANONICAL_SCRIPT");'

          if [[ ! -d config/sync ]]; then
            echo "::error::config/sync does not exist after export."
            exit 1
          fi

          tar -czf /tmp/brebo-config-sync-after-canonical-apply.tgz config/sync
          echo 'APPLY_AND_EXPORT_OK=1'
          REMOTE

      - name: Download exported config snapshot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/brebo-config-sync-after-canonical-apply.tgz" \
            ./brebo-config-sync-after-canonical-apply.tgz
          test -s ./brebo-config-sync-after-canonical-apply.tgz

      - name: Remove temporary server archive
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'rm -f /tmp/brebo-config-sync-after-canonical-apply.tgz'

      - name: Upload exported config snapshot
        uses: actions/upload-artifact@v4
        with:
          name: brebo-config-sync-after-canonical-apply
          path: brebo-config-sync-after-canonical-apply.tgz
          if-no-files-found: error
          retention-days: 7
