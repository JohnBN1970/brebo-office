name: BREBO deploy principle acceptance
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, 'feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install PyYAML==6.0.2
      - name: Enforce isolated development and explicit production release
        run: python scripts/ci/check_deployment_policy.py
