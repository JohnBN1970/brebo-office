name: BREBO Mail Intake poll

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/mail-intake-poll.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-mail-intake-poll
  cancel-in-progress: false

jobs:
  intake:
    name: Poll Hostinger IMAP into BREBO Office
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to obtain SSH host key."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Run bounded Mail Intake through Drupal
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd public_html/sboffice_app
          php vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl php:eval '
            $adapter = \Drupal::service("brebo_mail_intake.imap_source");
            if (!$adapter->isConfigured()) {
              throw new \RuntimeException("IMAP source is niet geconfigureerd.");
            }

            $state = \Drupal::state();
            $before = (int) $state->get("brebo_mail_intake.imap_last_uid", 0);
            echo "IMAP_LAST_UID_BEFORE=" . $before . PHP_EOL;

            \Drupal::service("brebo_mail_intake.pipeline")->processSource($adapter);

            $after = (int) $state->get("brebo_mail_intake.imap_last_uid", 0);
            echo "IMAP_LAST_UID_AFTER=" . $after . PHP_EOL;
            echo "MAIL_INTAKE=COMPLETED" . PHP_EOL;
          '
          REMOTE
            then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Mail Intake failed after 3 SSH attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
