name: Project detail V3 guarded mount
on:
  pull_request:
    paths:
      - 'office-independent/deployment/hostinger/mount-project-detail-v3.py'
      - '.github/workflows/project-detail-v3-mount.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V3 detail transformation
        run: |
          set -euo pipefail
          cp office-independent/public/office-project.php /tmp/project-detail-v3.php
          python3 office-independent/deployment/hostinger/mount-project-detail-v3.py /tmp/project-detail-v3.php
          php -l /tmp/project-detail-v3.php
          grep -Fq BREBO_PROJECT_DETAIL_V3_MOUNT /tmp/project-detail-v3.php
          grep -Fq OfficeNativeProjectAccess /tmp/project-detail-v3.php
          sha256sum /tmp/project-detail-v3.php > /tmp/detail-v3-before.sha
          python3 office-independent/deployment/hostinger/mount-project-detail-v3.py /tmp/project-detail-v3.php
          sha256sum -c /tmp/detail-v3-before.sha
          php -d zend.assertions=1 -d assert.exception=1 office-independent/tests/OfficeProjectDetailV3ViewTest.php
