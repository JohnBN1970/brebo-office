name: BREBO Project Operational Acceptance

on:
  workflow_run:
    workflows:
      - 'Configure BREBO Document Extraction Runtime'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-project-operational-acceptance
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify Project operational production state
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Verify Project production without changing it
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1 TERM=dumb
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          marker="$app/.brebo-deployed-sha"
          remote_php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$remote_php" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo '=== Project deployment identity ==='
          [[ -f "$marker" ]] || exit 20
          deployed_sha="$(tr -d '\r\n' < "$marker")"
          echo "PROJECT_PRODUCTION_DEPLOY_SHA=$deployed_sha"
          if [[ -n "$EXPECTED_DEPLOY_SHA" && "$deployed_sha" != "$EXPECTED_DEPLOY_SHA" ]]; then
            echo 'PROJECT_SUPERSEDED_DEPLOYMENT=1'; exit 0
          fi

          echo '=== Real authenticated Drupal route render smoke ==='
          "${drush[@]}" php:eval '
            $project_storage = \Drupal::entityTypeManager()->getStorage("node");
            $ids = $project_storage->getQuery()->accessCheck(FALSE)->condition("type", "brebo_project")->range(0, 1)->execute();
            if (!$ids) { echo "PROJECT_RENDER_NO_PROJECT=1\n"; exit(31); }
            $project = $project_storage->load(reset($ids));
            $users = \Drupal::entityTypeManager()->getStorage("user");
            $admin_ids = $users->getQuery()->accessCheck(FALSE)->condition("status", 1)->condition("uid", 0, ">")->sort("uid", "ASC")->execute();
            $account = NULL;
            foreach ($admin_ids as $uid) {
              $candidate = $users->load($uid);
              if ($candidate && $candidate->hasPermission("administer site configuration")) { $account = $candidate; break; }
            }
            if (!$account) { echo "PROJECT_RENDER_NO_PRIVILEGED_USER=1\n"; exit(33); }
            \Drupal::service("account_switcher")->switchTo($account);
            echo "PROJECT_RENDER_USER_UID=" . $account->id() . "\n";
            $routes = [
              "planning" => "brebo_office_core.project_planning",
              "documents" => "brebo_document_data.project_dossier",
              "budget" => "brebo_project_cockpit.budget",
              "procurement" => "brebo_project_cockpit.procurement",
              "contracts" => "brebo_project_cockpit.contracts",
              "invoices" => "brebo_project_cockpit.invoices",
              "inzet" => "brebo_inzet.project_dashboard",
              "quality" => "brebo_project_cockpit.quality",
              "completion" => "brebo_project_cockpit.completion",
            ];
            $kernel = \Drupal::service("http_kernel");
            try {
              foreach ($routes as $label => $route) {
                try {
                  $url = \Drupal\Core\Url::fromRoute($route, ["node" => $project->id()])->toString();
                  $request = \Symfony\Component\HttpFoundation\Request::create($url, "GET");
                  $response = $kernel->handle($request, \Symfony\Component\HttpKernel\HttpKernelInterface::SUB_REQUEST);
                  $status = $response->getStatusCode();
                  echo "PROJECT_RENDER_" . strtoupper($label) . "_HTTP=$status\n";
                  if ($status >= 400) exit(32);
                } catch (\Throwable $e) {
                  echo "PROJECT_RENDER_" . strtoupper($label) . "_EXCEPTION=" . get_class($e) . ": " . $e->getMessage() . "\n";
                  exit(32);
                }
              }
            } finally { \Drupal::service("account_switcher")->switchBack(); }
          '

          echo '=== Database update readiness ==='
          "${drush[@]}" updatedb:status
          final_sha="$(tr -d '\r\n' < "$marker")"
          [[ "$final_sha" == "$deployed_sha" ]] || exit 0
          echo 'PROJECT_REAL_RENDER_ACCEPTANCE=PASS'
          echo 'PROJECT_OPERATIONAL_ACCEPTANCE=PASS'
          REMOTE
