name: Office demo Calc link diagnostics
on:
  pull_request:
    paths:
      - 'office-independent/deployment/hostinger/audit-office-demo-calc-link.php'
      - '.github/workflows/office-demo-calc-link-diagnostics.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEMO-CALC-LINK-AUDIT to run read-only Office-test diagnostics
        required: true
        type: string
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l office-independent/deployment/hostinger/audit-office-demo-calc-link.php
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEMO-CALC-LINK-AUDIT' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_demo
          chmod 600 ~/.ssh/id_demo
      - name: Audit Office-test Calc link
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="$USER@$HOST"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_demo -P "$PORT" office-independent/deployment/hostinger/audit-office-demo-calc-link.php "$remote:domains/brebobv.nl/office_calc_test/audit-office-demo-calc-link.php"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_demo -p "$PORT" "$remote" 'OFFICE_TEST_CONFIG_PATH="$HOME/domains/brebobv.nl/office_calc_test/config/config.php" php "$HOME/domains/brebobv.nl/office_calc_test/audit-office-demo-calc-link.php"'
