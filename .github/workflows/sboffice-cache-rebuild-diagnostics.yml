name: Diagnose BREBO Drupal Cache Rebuild

on:
  workflow_run:
    workflows:
      - 'Deploy BREBO Office Production'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-office-cache-rebuild-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Diagnose Drupal cache rebuild
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set +e
          export NO_COLOR=1 TERM=dumb

          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          webroot="$app/web"
          remote_php="/opt/alt/php83/usr/bin/php"

          echo '=== BREBO Drupal cache rebuild diagnostic ==='
          echo "APP_ROOT=$app"
          "$remote_php" -v

          cd "$app" || exit 1
          drush=("$remote_php" -d display_errors=1 -d display_startup_errors=1 -d error_reporting=E_ALL -d memory_limit=512M vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo '=== Drupal status before cache rebuild ==='
          "${drush[@]}" status -vvv || true

          echo '=== Running cache rebuild with full verbosity ==='
          "${drush[@]}" cr -vvv
          cr_status=$?
          echo "DRUPAL_CACHE_REBUILD_EXIT_CODE=$cr_status"

          echo '=== Recent Drupal log entries ==='
          "${drush[@]}" watchdog:show --count=50 --extended || "${drush[@]}" ws --count=50 --extended || true

          echo '=== Recent PHP / web error logs when available ==='
          for log in \
            "$webroot/error_log" \
            "$app/error_log" \
            "$HOME/domains/brebobv.nl/logs/error.log" \
            "$HOME/domains/brebobv.nl/logs/sboffice.brebobv.nl.error.log"
          do
            if [[ -f "$log" ]]; then
              echo "--- $log ---"
              tail -n 120 "$log" || true
            fi
          done

          exit "$cr_status"
          REMOTE
