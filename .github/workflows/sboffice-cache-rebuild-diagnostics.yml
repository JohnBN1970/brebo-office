name: sboffice cache rebuild diagnostics

on:
  workflow_run:
    workflows:
      - 'Deploy BREBO Office develop to sboffice'
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: sboffice-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 77.37.34.160
      DEPLOY_PORT: '65002'
    steps:
      - name: Configure SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Inspect runtime and calculation form
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set +e
          cd public_html/sboffice
          drush=(php -d display_errors=1 -d display_startup_errors=1 -d error_reporting=E_ALL vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo '=== Runtime ==='
          php -v
          "${drush[@]}" status --fields=bootstrap,db-status,drupal-version,php-version

          echo '=== brebo_calculation state ==='
          sha256sum web/modules/custom/brebo_calculation/brebo_calculation.module
          "${drush[@]}" pm:list --type=module --filter=brebo_calculation --fields=name,status,version
          "${drush[@]}" php:eval 'print "HOOK_FUNCTION_EXISTS=".(int)function_exists("brebo_calculation_form_node_form_alter")."\n"; $f=\Drupal\field\Entity\FieldConfig::loadByName("node","brebo_calculation","field_brebo_package_ref"); print "WORK_PACKAGE_REQUIRED=".(int)($f?->isRequired() ?? true)."\n";'

          echo '=== Fresh calculation form probe ==='
          "${drush[@]}" php:eval '$node=\Drupal::entityTypeManager()->getStorage("node")->create(["type"=>"brebo_calculation"]); $form=\Drupal::service("entity.form_builder")->getForm($node,"default"); foreach (["brebo_calculation_onboarding","field_brebo_calc_code","field_brebo_package_ref","field_brebo_calc_version","field_brebo_calc_status","field_brebo_price_date"] as $k) { $exists=array_key_exists($k,$form); $access=$exists ? ($form[$k]["#access"] ?? "unset") : "missing"; print $k." EXISTS=".(int)$exists." ACCESS=".(is_bool($access)?(int)$access:$access)."\n"; } if (isset($form["field_brebo_price_date"]["widget"][0]["value"])) { $e=$form["field_brebo_price_date"]["widget"][0]["value"]; print "PRICE_DATE_DEFAULT=".($e["#default_value"] ?? "")."\n"; }'

          echo '=== Latest Drupal log ==='
          "${drush[@]}" watchdog:show --count=30 --extended || "${drush[@]}" ws --count=30 --extended || true
          REMOTE
