name: Calc Office-test preflight and CRM schema one-time setup
on:
  pull_request:
    paths:
      - '.github/workflows/calc-office-test-readonly-audit.yml'
  push:
    branches: [audit/calc-office-test-host-access-20261111]
    paths:
      - '.github/workflows/calc-office-test-readonly-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only Hostinger route and runtime checks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.37.34.160
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 65002
          script_stop: false
          script: |
            set -eu
            ROOT=/home/u213420663/domains/brebobv.nl
            WEB="$ROOT/public_html"
            OFFICE="$ROOT/office_calc_test"
            test -d "$WEB" || { echo "HOST_ROOT=NOT_FOUND"; exit 1; }
            test -d "$OFFICE" || { echo "OFFICE_PRIVATE_ROOT=NOT_FOUND"; exit 1; }
            echo "OFFICE_PRIVATE_ROOT=FOUND"
            if [ -f "$WEB/office-test/index.php" ]; then echo "OFFICE_ROUTER=FOUND"; else echo "OFFICE_ROUTER=MISSING"; fi
            if [ -f "$WEB/office-test/.htaccess" ]; then echo "OFFICE_REWRITE=FOUND"; else echo "OFFICE_REWRITE=MISSING"; fi
            if [ -f "$WEB/.htaccess" ]; then echo "ROOT_REWRITE=FOUND"; else echo "ROOT_REWRITE=MISSING"; fi
            if [ -f "$WEB/office-test/index.php" ] && grep -F '/calc-app' "$WEB/office-test/index.php" >/dev/null 2>&1; then
              echo "CALC_ROUTER_REFERENCE=FOUND"
            else
              echo "CALC_ROUTER_REFERENCE=NOT_FOUND"
            fi
            if [ -f "$WEB/office-test/.htaccess" ] && grep -E '(ProxyPass|RewriteRule.*calc-app)' "$WEB/office-test/.htaccess" >/dev/null 2>&1; then
              echo "CALC_PROXY_RULE_REFERENCE=FOUND"
            else
              echo "CALC_PROXY_RULE_REFERENCE=NOT_FOUND"
            fi
            if [ -d "$WEB/office-test/calc-app" ]; then
              echo "CALC_ROUTE_DIR=FOUND"
              if [ -f "$WEB/office-test/calc-app/startup.js" ]; then echo "CALC_STARTUP=FOUND"; else echo "CALC_STARTUP=NOT_FOUND"; fi
            else
              echo "CALC_ROUTE_DIR=NOT_FOUND"
            fi
            echo "SECTION=NODE_RUNTIME"
            if command -v node >/dev/null 2>&1; then
              echo "NODE_CLI_IN_PATH=FOUND"
              node --version
            else
              echo "NODE_CLI_IN_PATH=NOT_FOUND"
            fi
            for runtime in /opt/alt/alt-nodejs{18,20,22,24}/root/usr/bin/node /usr/local/bin/node /usr/bin/node "$HOME/.nvm/versions/node"/v*/bin/node; do
              if [ -x "$runtime" ]; then
                echo "NODE_RUNTIME_BINARY=FOUND"
                "$runtime" --version || true
              fi
            done
            echo "SECTION=PASSENGER_CONFIGURATION"
            for file in "$WEB/.htaccess" "$WEB/office-test/.htaccess"; do
              if [ -f "$file" ]; then
                for directive in PassengerAppRoot PassengerBaseURI PassengerNodejs PassengerEnabled PassengerAppType; do
                  if grep -F "$directive" "$file" >/dev/null 2>&1; then echo "PASSENGER_DIRECTIVE_${directive}=PRESENT"; else echo "PASSENGER_DIRECTIVE_${directive}=ABSENT"; fi
                done
              fi
            done
            echo "SECTION=PRIVATE_STAGE_PREFLIGHT"
            private_root=/home/u213420663/domains/brebobv.nl/office_calc_test
            private_stage="$private_root/.calc-app-staging"
            if [ -d "$private_root" ]; then echo "STAGE_ROOT_DIRECTORY=YES"; else echo "STAGE_ROOT_DIRECTORY=NO"; fi
            if [ -f "$private_root/config/config.php" ]; then echo "STAGE_CONFIG_PRESENT=YES"; else echo "STAGE_CONFIG_PRESENT=NO"; fi
            if [ -L "$private_root" ]; then echo "STAGE_ROOT_SYMLINK=YES"; else echo "STAGE_ROOT_SYMLINK=NO"; fi
            if [ -L "$private_stage" ]; then echo "STAGE_TARGET_SYMLINK=YES"; else echo "STAGE_TARGET_SYMLINK=NO"; fi
            if [ -d "$private_stage" ]; then echo "STAGE_TARGET_DIRECTORY=YES"; else echo "STAGE_TARGET_DIRECTORY=NO"; fi
            if [ -e "$private_stage/calc-code-only-c523fd75f0f46b3dd4b7cd0eaa72da67eb81b035.tgz" ]; then echo "STAGE_ARCHIVE_ALREADY_EXISTS=YES"; else echo "STAGE_ARCHIVE_ALREADY_EXISTS=NO"; fi
            if [ -f "$private_stage/calc-code-only-c523fd75f0f46b3dd4b7cd0eaa72da67eb81b035.sha256" ]; then
              echo "STAGE_CHECKSUM_FILE=YES"
              if (cd "$private_stage" && sha256sum -c calc-code-only-c523fd75f0f46b3dd4b7cd0eaa72da67eb81b035.sha256 >/dev/null 2>&1); then
                echo "STAGE_ARCHIVE_INTEGRITY=PASS"
              else
                echo "STAGE_ARCHIVE_INTEGRITY=FAIL"
              fi
            else
              echo "STAGE_CHECKSUM_FILE=NO"
              echo "STAGE_ARCHIVE_INTEGRITY=UNVERIFIED"
            fi
            echo "SECTION=CALC_APP_DESTINATIONS"
            for location in "$ROOT"/nodejs "$ROOT"/calc "$ROOT"/calc-app "$WEB"/calc-app "$WEB"/office-test/calc-app; do
              if [ -d "$location" ]; then
                echo "CALC_CANDIDATE_DIR=FOUND"
                [ ! -f "$location/startup.js" ] || echo "CALC_CANDIDATE_STARTUP=FOUND"
                [ ! -f "$location/package.json" ] || echo "CALC_CANDIDATE_PACKAGE=FOUND"
              fi
            done
            echo "SECTION=OFFICE_WEB_ACCESS"
            for url in 'https://brebobv.nl/office-test/' 'https://brebobv.nl/office-test/calc-app/'; do
              status=$(curl -k -sS --connect-timeout 8 --max-time 12 -o /dev/null -w '%{http_code}' "$url" || true)
              case "$url" in
                */calc-app/) echo "CALC_ROUTE_HTTP_STATUS=$status" ;;
                *) echo "OFFICE_HOME_HTTP_STATUS=$status" ;;
              esac
            done
            if [ -f "$OFFICE/config/config.php" ]; then echo "OFFICE_TEST_CONFIG=FOUND"; else echo "OFFICE_TEST_CONFIG=MISSING"; fi
            echo "SECTION=OFFICE_UNIFIED_CALC_TABLES"
            php -r '
            $cfg=require "/home/u213420663/domains/brebobv.nl/office_calc_test/config/config.php";
            $dsn=$cfg["OFFICE_INTAKE_PDO_DSN"]??"";
            if (!is_string($dsn) || strpos($dsn,"dbname=u213420663_office_test;")===false) {
              echo "OFFICE_CALC_DB_IDENTITY=INVALID\n"; exit(1);
            }
            try {
              $pdo=new PDO($dsn,$cfg["OFFICE_INTAKE_DB_USER"]??"",$cfg["OFFICE_INTAKE_DB_PASSWORD"]??"",[
                PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION, PDO::ATTR_EMULATE_PREPARES=>false
              ]);
              if ($pdo->query("SELECT DATABASE()")->fetchColumn()!=="u213420663_office_test") {
                echo "OFFICE_CALC_DB_IDENTITY=MISMATCH\n"; exit(1);
              }
              echo "OFFICE_CALC_DB_IDENTITY=VERIFIED\n";
              $q=$pdo->prepare("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = ?");
              foreach (["calculations","calculation_versions","calculation_lines","launch_nonces","office_calc_crm_drafts","office_calc_crm_draft_lines","office_crm_opportunities","office_crm_relations"] as $t) {
                $q->execute([$t]);
                echo "OFFICE_CALC_TABLE_".strtoupper($t)."=".((int)$q->fetchColumn()===1?"PRESENT":"ABSENT")."\n";
              }
            } catch (Throwable $e) {
              echo "OFFICE_CALC_DB_READONLY_CHECK=FAILED\n"; exit(1);
            }
            '
            echo "SECTION=CRM_CALC_COLUMN_CONTRACT"
            php -r '
            $cfg=require "/home/u213420663/domains/brebobv.nl/office_calc_test/config/config.php";
            $dsn=$cfg["OFFICE_INTAKE_PDO_DSN"]??"";
            if (!is_string($dsn) || strpos($dsn,"dbname=u213420663_office_test;")===false) exit(1);
            $db=new PDO($dsn,$cfg["OFFICE_INTAKE_DB_USER"]??"",$cfg["OFFICE_INTAKE_DB_PASSWORD"]??"",[
              PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION
            ]);
            if ($db->query("SELECT DATABASE()")->fetchColumn()!=="u213420663_office_test") exit(1);
            $checks=[
              "office_crm_opportunities"=>["id","revision","stage","status"],
              "office_operator_accounts"=>["id","active"],
              "calculations"=>["office_project_id","office_calculation_id","code","status"],
              "calculation_versions"=>["calculation_id","version_no","direct_cost","status"],
              "calculation_lines"=>["version_id","code","description","quantity"]
            ];
            $q=$db->prepare("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=? AND column_name=?");
            foreach($checks as $table=>$cols) {
              foreach($cols as $col) {
                $q->execute([$table,$col]);
                echo "COLUMN_".strtoupper($table."_".$col)."=".((int)$q->fetchColumn()===1?"PRESENT":"ABSENT")."\n";
              }
            }
            '
            php -r '
            $cfg=require "/home/u213420663/domains/brebobv.nl/office_calc_test/config/config.php";
            $db=new PDO($cfg["OFFICE_INTAKE_PDO_DSN"],$cfg["OFFICE_INTAKE_DB_USER"],$cfg["OFFICE_INTAKE_DB_PASSWORD"],[
              PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION
            ]);
            if($db->query("SELECT DATABASE()")->fetchColumn()!=="u213420663_office_test") exit(1);
            $q=$db->prepare("SELECT column_type FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=? AND column_name=?");
            foreach(["office_crm_opportunities","office_operator_accounts"] as $t) {
              $q->execute([$t,"id"]);
              $type=(string)$q->fetchColumn();
              if(!preg_match("/^(bigint|int|mediumint|smallint|tinyint)(\\([0-9]+\\))?( unsigned)?$/",$type)) $type="UNEXPECTED";
              echo "CRM_ID_COLUMN_TYPE_".strtoupper($t)."=".strtoupper(str_replace(" ","_",$type))."\n";
            }
            '
            echo "CALC_HOST_AUDIT=READ_ONLY_COMPLETE"
      - name: Explain scope
        run: |
          echo "No production changes, secrets disclosure, DB operations, data import, merge, or deployment"

  office-test-crm-identity:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Office-test DB identity and install only CRM Calc identity/grants
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.37.34.160
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 65002
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -eu
            php <<'PHP'
            <?php
            declare(strict_types=1);
            $cfg=require '/home/u213420663/domains/brebobv.nl/office_calc_test/config/config.php';
            if(!is_array($cfg)) { echo "CRM_CALC_CONFIG_INVALID\n";exit(1); }
            $dsn=$cfg['OFFICE_INTAKE_PDO_DSN']??'';
            if(!is_string($dsn) ||
                !preg_match('/^mysql:host=(?:localhost|127\\.0\\.0\\.1);dbname=u213420663_office_test;charset=utf8mb4$/D',$dsn) ||
                ($cfg['OFFICE_INTAKE_DB_USER']??'')!=='u213420663_office_test') {
                echo "CRM_CALC_DB_GUARD=FAILED\n";exit(1);
            }
            try {
              $db=new PDO($dsn,$cfg['OFFICE_INTAKE_DB_USER'],$cfg['OFFICE_INTAKE_DB_PASSWORD']??'',[
                PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,
                PDO::ATTR_EMULATE_PREPARES=>false,
                PDO::ATTR_TIMEOUT=>8
              ]);
              if($db->query('SELECT DATABASE()')->fetchColumn()!=='u213420663_office_test') {
                echo "CRM_CALC_DB_IDENTITY=FAILED\n";exit(1);
              }
              echo "CRM_CALC_DB_IDENTITY=VERIFIED\n";
              $q=$db->prepare('SELECT column_type FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name=? AND column_name=?');
              foreach([['office_crm_opportunities','id'],['office_operator_accounts','id']] as [$table,$column]) {
                $q->execute([$table,$column]);
                if(strtolower((string)$q->fetchColumn())!=='bigint unsigned') {
                  echo "CRM_CALC_REFERENCE_TYPE_UNEXPECTED_".strtoupper($table)."\n";exit(1);
                }
              }
              $check=$db->prepare('SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=?');
              foreach(['calculations','calculation_versions','calculation_lines','launch_nonces'] as $table) {
                $check->execute([$table]);
                if((int)$check->fetchColumn()!==1) {
                  echo "CRM_CALC_CANONICAL_TABLE_MISSING\n";exit(1);
                }
              }
              $sql=[
                'office_calc_crm_drafts'=>"CREATE TABLE office_calc_crm_drafts (
                  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
                  opportunity_id BIGINT UNSIGNED NOT NULL,
                  crm_revision BIGINT UNSIGNED NOT NULL,
                  created_by BIGINT UNSIGNED NOT NULL,
                  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  project_id BIGINT UNSIGNED NULL,
                  PRIMARY KEY(id),
                  UNIQUE KEY uq_calc_crm_draft_opportunity(opportunity_id),
                  KEY idx_calc_crm_draft_project(project_id),
                  CONSTRAINT fk_calc_crm_draft_opportunity FOREIGN KEY(opportunity_id)
                    REFERENCES office_crm_opportunities(id)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci",
                'office_calc_crm_launch_grants'=>"CREATE TABLE office_calc_crm_launch_grants (
                  reference CHAR(64) NOT NULL,
                  session_hash CHAR(64) NOT NULL,
                  actor_id BIGINT UNSIGNED NOT NULL,
                  draft_id BIGINT UNSIGNED NOT NULL,
                  expires_at DATETIME NOT NULL,
                  consumed_at DATETIME NULL,
                  revoked_at DATETIME NULL,
                  PRIMARY KEY(reference),
                  KEY idx_calc_crm_grant_draft(draft_id,actor_id),
                  CONSTRAINT fk_calc_crm_grant_draft FOREIGN KEY(draft_id)
                    REFERENCES office_calc_crm_drafts(id)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"
              ];
              foreach($sql as $table=>$ddl) {
                $check->execute([$table]);
                if((int)$check->fetchColumn()===0) {
                  $db->exec($ddl);
                  echo "CRM_CALC_CREATED_".strtoupper($table)."=YES\n";
                } else {
                  echo "CRM_CALC_EXISTING_".strtoupper($table)."=SKIPPED\n";
                }
              }
              $check->execute(['office_calc_crm_draft_lines']);
              if((int)$check->fetchColumn()!==0) {
                echo "CRM_CALC_PARALLEL_LINE_STORE=PRESENT_REVIEW_REQUIRED\n";exit(1);
              }
              echo "CRM_CALC_CANONICAL_LINE_STORE=CALCULATION_LINES_ONLY\n";
              echo "CRM_CALC_SCHEMA=READY\n";
              echo "OLD_CALC_DATABASE_MUTATED=NO\n";
              echo "OFFICE_TEST_ROUTER_MUTATED=NO\n";
              echo "FEATURE_FLAGS_CHANGED=NO\n";
            } catch(Throwable $e) {
              echo "CRM_CALC_SCHEMA=FAILED_WITHOUT_ERROR_DETAILS\n";
              exit(1);
            }
            PHP
