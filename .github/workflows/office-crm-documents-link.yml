name: Guarded CRM Documents link in active Office-test
on:
  push:
    branches:
      - feature/office-inspection-foundation-20261103
    paths:
      - '.github/workflows/office-crm-documents-link.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Add link to existing authenticated CRM workspace
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$base/config/config.php")"
          case "$active" in "$base"/release-*/private) ;; *) echo FAIL_TEST_SCOPE; exit 20;; esac
          target="$active/public/crm-workspace.php"
          test -f "$target" && test ! -L "$target" || exit 21
          php -l "$target" >/dev/null
          if grep -Fq 'BREBO_CRM_DOCUMENTS_LINK_20261106' "$target"; then echo CRM_DOCUMENTS_ALREADY_PRESENT; exit 0; fi
          candidate="$(mktemp "$active/public/.crm-docs-XXXXXXXX.php")"
          trap 'rm -f "$candidate"' EXIT
          export DOC_TARGET="$target" DOC_CANDIDATE="$candidate"
          python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['DOC_TARGET']).read_text()
          anchor='<nav aria-label="Hoofdnavigatie">'
          if src.count(anchor)!=1: raise SystemExit('FAIL_CRM_NAV_ANCHOR')
          if 'href="/office-test/crm/bedrijven"' not in src: raise SystemExit('FAIL_CRM_CONTEXT')
          addition='<a href="/office-test/documenten">Documenten</a> <!-- BREBO_CRM_DOCUMENTS_LINK_20261106 -->'
          out=src.replace(anchor,anchor+addition,1)
          if out.replace(addition,'',1)!=src: raise SystemExit('FAIL_PRESERVATION')
          Path(os.environ['DOC_CANDIDATE']).write_text(out)
          PY
          php -l "$candidate" >/dev/null || { echo FAIL_CRM_LINT; exit 22; }
          backup="$target.backup-documents-link-$(date +%Y%m%d%H%M%S)"
          cp -p "$target" "$backup"
          chmod --reference="$target" "$candidate"
          mv "$candidate" "$target"
          echo CRM_DOCUMENTS_LINK_DEPLOYED
          echo "BACKUP=$(basename "$backup")"
          REMOTE
