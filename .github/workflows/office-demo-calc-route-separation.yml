name: Office demo Calc route separation
on:
  pull_request:
    paths:
      - 'integration-api/test/office-demo-calc-route-separation.test.ts'
      - '.github/workflows/office-demo-calc-route-separation.yml'
      - 'integration-api/src/calc-publication-route.ts'
      - 'office-independent/src/Demo/OfficeDemoCalcV2Boundary.php'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert publication and quantity handoff stay separate
        run: node --experimental-strip-types --test integration-api/test/office-demo-calc-route-separation.test.ts
