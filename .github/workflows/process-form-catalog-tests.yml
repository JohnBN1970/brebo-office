name: Office process form catalog checks
on:
  push:
    branches:
      - 'feat/proceshandboek-formulieren-catalogus'
    paths:
      - 'office-independent/src/Process/OfficeProcessForm*.php'
      - 'office-independent/src/Process/OfficeFr201*.php'
      - 'office-independent/public/crm-new-requests.php'
      - 'office-independent/tests/test_process_form_*.php'
      - 'office-independent/public/office-process-forms.php'
      - 'office-independent/public/index.php'
      - 'office-independent/public/office-project.php'
      - 'office-independent/tests/test_fr201_*.php'
      - '.github/workflows/process-form-catalog-tests.yml'
  pull_request:
    paths:
      - 'office-independent/src/Process/OfficeProcessForm*.php'
      - 'office-independent/src/Process/OfficeFr201*.php'
      - 'office-independent/public/crm-new-requests.php'
      - 'office-independent/tests/test_process_form_*.php'
      - 'office-independent/public/office-process-forms.php'
      - 'office-independent/public/index.php'
      - 'office-independent/public/office-project.php'
      - 'office-independent/tests/test_fr201_*.php'
      - '.github/workflows/process-form-catalog-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merge-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check develop merge compatibility
        shell: bash
        run: |
          set -eu
          git fetch --no-tags origin develop
          if ! git merge-tree --write-tree HEAD FETCH_HEAD > /tmp/process-forms-merge-tree.txt 2>&1; then
            echo 'Merge conflicts detected against develop:'
            cat /tmp/process-forms-merge-tree.txt
            exit 1
          fi
          echo 'No merge conflicts with develop.'
  forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint and verify catalog contracts
        run: |
          set -eu
          for file in office-independent/src/Process/OfficeProcessForm*.php office-independent/src/Process/OfficeFr201*.php office-independent/tests/test_process_form_*.php office-independent/tests/test_fr201_*.php office-independent/public/office-process-forms.php office-independent/public/office-project.php office-independent/public/index.php office-independent/public/crm-new-requests.php; do
            php -l "$file"
          done
          for test in office-independent/tests/test_process_form_*.php office-independent/tests/test_fr201_*.php; do
            php "$test"
          done

  vps-readonly-preflight:
    name: Office-test VPS read-only preflight
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [forms, merge-compatibility]
    runs-on: ubuntu-latest
    environment: office-test-vps
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only active release diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_OFFICE_TEST_HOST }}
          VPS_PORT: ${{ secrets.VPS_OFFICE_TEST_PORT }}
          VPS_USER: ${{ secrets.VPS_OFFICE_TEST_USER }}
          VPS_KEY: ${{ secrets.VPS_OFFICE_TEST_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_OFFICE_TEST_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_PORT VPS_USER VPS_KEY VPS_HOST_KEY; do
            test -n "${!key}" || { echo "::error::Missing VPS credential: $key"; exit 1; }
          done
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          test "$VPS_USER" = brebo-deploy
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/office_test_vps ~/.ssh/known_hosts' EXIT
          printf '%s\\n' "$VPS_KEY" > ~/.ssh/office_test_vps
          printf '%s\\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/office_test_vps ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/office_test_vps > /dev/null
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts > /dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \\
            -i ~/.ssh/office_test_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \\
            'bash -s' < scripts/deployment/check_office_test_vps_readiness.sh
          echo "VPS_READONLY_PREFLIGHT=PASS"
