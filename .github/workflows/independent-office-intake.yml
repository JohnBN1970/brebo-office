name: Independent Office intake validation

on:
  pull_request:
    paths:
      - 'office-independent/**'
      - '.github/workflows/independent-office-intake.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: office_intake_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: |
          find office-independent -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build and verify symlink-free Hostinger release
        run: |
          release_dir="$(mktemp -d)"
          rmdir "$release_dir"
          bash office-independent/deployment/hostinger/build-release.sh "$release_dir"
          test -f "$release_dir/public/index.php"
          test -f "$release_dir/public/.htaccess"
          test -f "$release_dir/private/public/office-login.php"
          test -f "$release_dir/private/src/Intake/WebsiteOfficeLoginController.php"
          test -f "$release_dir/GIT-REVISION"
          test "$(cat "$release_dir/GIT-REVISION")" = "$GITHUB_SHA"
          if find "$release_dir" -type l -print -quit | grep -q .; then
            echo "Symlink found in Office release" >&2
            exit 1
          fi
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          # A release must be immutable: rebuilding to the same path must fail.
          if bash office-independent/deployment/hostinger/build-release.sh "$release_dir"; then
            echo "Release builder unexpectedly overwrote an existing release" >&2
            exit 1
          fi
          # Verify checksums actually detect a modified public entrypoint.
          printf '\\n# tampered\\n' >> "$release_dir/public/index.php"
          if (cd "$release_dir" && sha256sum -c SHA256SUMS >/dev/null 2>&1); then
            echo "Release checksum did not detect a modified public file" >&2
            exit 1
          fi
          rm -rf "$release_dir"
      - name: Verify signed Calc HTTP integration with MySQL
        env:
          OFFICE_INTAKE_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=office_intake_test;charset=utf8mb4
          OFFICE_INTAKE_TEST_USER: root
          OFFICE_INTAKE_TEST_PASSWORD: testpassword
        run: php office-independent/tests/OfficeCalcSignedHttpIntegrationTest.php
      - name: Verify authorized Calc launch against MySQL
        env:
          OFFICE_INTAKE_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=office_intake_test;charset=utf8mb4
          OFFICE_INTAKE_TEST_USER: root
          OFFICE_INTAKE_TEST_PASSWORD: testpassword
        run: php office-independent/tests/OfficeCalcLaunchPositiveHttpTest.php
      - name: Verify Calc launch HTTP denial behavior
        run: php office-independent/tests/OfficeCalcLaunchHttpTest.php
      - name: Verify Calc context HTTP denial behavior
        run: php office-independent/tests/OfficeCalcProjectContextHttpTest.php
      - name: Verify independent Calc project context read model
        run: php office-independent/tests/OfficeCalcProjectContextRepositoryTest.php
      - name: Verify Calc authenticated context gate and replay protection
        run: |
          php office-independent/tests/OfficeCalcTransportVerifierTest.php
          php office-independent/tests/OfficeCalcRequestReplayGuardTest.php
          php office-independent/tests/OfficeCalcAuthenticatedContextGateTest.php
      - name: Verify Hostinger Office deployment routing contract
        run: php office-independent/tests/HostingerOfficeDeploymentContractTest.php
      - name: Run standalone intake validator tests
        run: php office-independent/tests/WebsiteIntakeValidatorTest.php
      - name: Verify independent HTTP endpoint
        run: php office-independent/tests/WebsiteIntakeHttpEndpointTest.php
      - name: Verify signed Worker handoff
        run: php office-independent/tests/WebsiteIntakeSignatureVerifierTest.php
      - name: Verify canonical CRM scope mapping
        run: php office-independent/tests/WebsiteOpportunityMapperTest.php
      - name: Verify handler CRM contract
