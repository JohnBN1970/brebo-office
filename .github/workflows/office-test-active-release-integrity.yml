name: Office-test active release integrity
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5,11,17 * * *'
permissions:
  contents: read
concurrency:
  group: office-test-active-release-integrity
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    environment: office-test-vps
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only VPS integrity script
        run: bash -n scripts/deployment/check_office_test_vps_readiness.sh
      - name: Audit exact active Office-test VPS release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_OFFICE_TEST_HOST }}
          VPS_PORT: ${{ secrets.VPS_OFFICE_TEST_PORT }}
          VPS_USER: ${{ secrets.VPS_OFFICE_TEST_USER }}
          VPS_KEY: ${{ secrets.VPS_OFFICE_TEST_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_OFFICE_TEST_HOST_KEY }}
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_PORT VPS_USER VPS_KEY VPS_HOST_KEY; do
            test -n "${!key}" || { echo "::error::Missing Office-test VPS credential: $key"; exit 1; }
          done
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Invalid Office-test VPS SSH port"; exit 1; }
          test "$VPS_USER" = brebo-deploy || { echo "::error::Expected restricted Office-test VPS user"; exit 1; }
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/id_office_test_integrity"
          printf '%s\n' "$VPS_HOST_KEY" > "$HOME/.ssh/known_hosts_office_test"
          chmod 600 "$HOME/.ssh/id_office_test_integrity" "$HOME/.ssh/known_hosts_office_test"
          trap 'rm -f "$HOME/.ssh/id_office_test_integrity" "$HOME/.ssh/known_hosts_office_test"' EXIT
          ssh-keygen -y -P '' -f "$HOME/.ssh/id_office_test_integrity" > /dev/null
          ssh-keygen -l -f "$HOME/.ssh/known_hosts_office_test" > /dev/null
          if ! ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts_office_test" > /dev/null &&
             ! ssh-keygen -F "[$VPS_HOST]:$VPS_PORT" -f "$HOME/.ssh/known_hosts_office_test" > /dev/null; then
            echo "::error::Pinned Office-test VPS identity does not match configured host"; exit 1
          fi
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_office_test" \
            -o ConnectTimeout=15 -i "$HOME/.ssh/id_office_test_integrity" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s --' "$GITHUB_SHA" \
            < scripts/deployment/check_office_test_vps_readiness.sh
          echo "OFFICE_TEST_VPS_INTEGRITY=PASS"
