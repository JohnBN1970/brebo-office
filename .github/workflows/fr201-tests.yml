name: FR-201 intake checks

on:
  pull_request:
    paths:
      - 'office-independent/src/Process/OfficeFr201*.php'
      - 'office-independent/tests/test_fr201_*.php'
      - 'office-independent/public/crm-new-requests.php'
      - '.github/workflows/fr201-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fr201:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: PHP syntax checks
        run: |
          set -eu
          for file in office-independent/src/Process/OfficeFr201*.php office-independent/tests/test_fr201_*.php office-independent/public/crm-new-requests.php; do
            php -l "$file"
          done
      - name: FR-201 contract and view tests
        run: |
          set -eu
          for file in office-independent/tests/test_fr201_*.php; do
            php "$file"
          done
