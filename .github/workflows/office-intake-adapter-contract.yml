name: Office intake adapter contract

on:
  pull_request:
    paths:
      - 'office-independent/src/Intake/OfficeCanonicalIntakeAdapter.php'
      - 'office-independent/tests/OfficeCanonicalIntakeAdapterTest.php'
      - '.github/workflows/office-intake-adapter-contract.yml'
  push:
    branches: [develop]
    paths:
      - 'office-independent/src/Intake/OfficeCanonicalIntakeAdapter.php'
      - 'office-independent/tests/OfficeCanonicalIntakeAdapterTest.php'
      - '.github/workflows/office-intake-adapter-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint and validate adapter and intake plan
        run: |
          php -l office-independent/src/Intake/OfficeCanonicalIntakeAdapter.php
          php -l office-independent/tests/OfficeCanonicalIntakeAdapterTest.php
          php office-independent/tests/OfficeCanonicalIntakeAdapterTest.php
          php office-independent/tests/OfficeIntakeProcessPlanTest.php
