name: Project dashboard V2 - Office-test safe deploy
on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: 'SHA256 of active office-project.php, verified out of band'
        required: true
        default: 'd15b26c13248cf5d80ed9b3e6f5b48e15f3f20dccc5e6c5ebedcc78965c2a85d'
      confirm_test_only:
        description: 'Type OFFICE-TEST to authorize isolated deployment'
        required: true
permissions:
  contents: read
concurrency:
  group: office-test-project-dashboard
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirm_test_only == 'OFFICE-TEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source and SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          php -l office-independent/public/office-project.php
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.expected_sha256 }}" =~ ^[0-9a-f]{64}$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/office_test_key
          chmod 600 ~/.ssh/office_test_key
      - name: Stage versioned merger on Office-test
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_test_key -P "$DEPLOY_PORT" office-independent/deployment/hostinger/merge-project-dashboard-v2.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/brebo-dashboard-v2-merge.py"
      - name: Validate and merge Office-test presentation
        shell: bash
        env:
          EXPECTED_HASH: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_test_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "EXPECTED_HASH=$EXPECTED_HASH bash -se" <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          root="$(php -r '$c=require $argv[1]; if (!is_array($c) || !isset($c["OFFICE_PRIVATE_ROOT"])) exit(1); echo $c["OFFICE_PRIVATE_ROOT"];' "$base/config/config.php")"
          case "$root" in "$base"/release-*/private) ;; *) echo "::error::Not an isolated Office-test release"; exit 10;; esac
          file="$root/public/office-project.php"
          test -f "$file" && test ! -L "$file"
          actual="$(sha256sum "$file" | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_HASH" || { echo "::error::Server changed; refusing deployment"; exit 11; }
          for marker in create_project_contract create_project_term create_project_change OfficeProjectFinanceOverview; do
            grep -Fq "$marker" "$file" || { echo "::error::Missing server contract marker: $marker"; exit 12; }
          done
          php -l "$file"
          echo "ACTIVE_RELEASE=$root"
          echo "ACTIVE_SHA256=$actual"
          echo "CONTRACT_HANDLERS_PRESERVED=1"
          backup="$file.backup-dashboard-20261103"
          test -f "$backup" || { echo "::error::Missing verified user backup"; exit 13; }
          test "$(sha256sum "$backup" | cut -d' ' -f1)" = "$EXPECTED_HASH" || exit 14
          candidate="$(mktemp "$root/public/.office-project-v2.XXXXXXXX.php")"
          trap 'rm -f "$candidate"' EXIT
          python3 /tmp/brebo-dashboard-v2-merge.py "$file" "$candidate"
          php -l "$candidate"
          for marker in create_project_contract create_project_term create_project_change OfficeProjectFinanceOverview BREBO_DASHBOARD_V2_MERGE; do
            grep -Fq "$marker" "$candidate" || exit 15
          done
          chmod --reference="$file" "$candidate"
          mv "$candidate" "$file"
          if ! php -l "$file" >/dev/null; then
            cp "$backup" "$file"
            echo "::error::Syntax check failed; original restored"
            exit 16
          fi
          echo "OFFICE_TEST_DASHBOARD_V2_DEPLOYED=1"
          echo "Original POST handlers preserved; production and database untouched"
          REMOTE
