name: Office-test buildings targeted repair
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-buildings-targeted-repair
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source PHP syntax
        run: |
          php -l office-independent/public/office-buildings.php
          php -l office-independent/src/Buildings/OfficeBuildingPdokLocationRepository.php
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Stage source file
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -P "$PORT" office-independent/public/office-buildings.php "$USER@$HOST:/tmp/office-buildings-${GITHUB_RUN_ID}.php"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -P "$PORT" office-independent/src/Buildings/OfficeBuildingPdokLocationRepository.php "$USER@$HOST:/tmp/office-building-pdok-repo-${GITHUB_RUN_ID}.php"
      - name: Back up and deploy to active Office-test release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "GITHUB_RUN_ID=$GITHUB_RUN_ID bash -se" <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo INVALID_RELEASE_SCOPE; exit 21;; esac
          test -d "$active/public"
          src="/tmp/office-buildings-${GITHUB_RUN_ID}.php"
          repo_src="/tmp/office-building-pdok-repo-${GITHUB_RUN_ID}.php"
          dest="$active/public/office-buildings.php"
          repo_dest="$active/src/Buildings/OfficeBuildingPdokLocationRepository.php"
          test -f "$src" && test -f "$repo_src" && test -f "$dest"
          test -d "$active/src/Buildings"
          php -l "$src"
          php -l "$repo_src"
          backup="$dest.backup-${GITHUB_RUN_ID}"
          repo_backup="$repo_dest.backup-${GITHUB_RUN_ID}"
          cp -p "$dest" "$backup"
          repo_existed=0
          if test -f "$repo_dest"; then
            repo_existed=1
            cp -p "$repo_dest" "$repo_backup"
          fi
          rollback() {
            cp -p "$backup" "$dest"
            if test "$repo_existed" = 1; then cp -p "$repo_backup" "$repo_dest"; else rm -f "$repo_dest"; fi
            echo BUILDINGS_DEPLOY_ROLLED_BACK
          }
          trap 'rm -f "$src" "$repo_src"' EXIT
          if ! cp "$repo_src" "$repo_dest" || ! php -l "$repo_dest" || ! cp "$src" "$dest" || ! php -l "$dest"; then
            rollback
            exit 31
          fi
          if ! cmp -s "$src" "$dest" || ! cmp -s "$repo_src" "$repo_dest"; then
            rollback
            exit 32
          fi
          echo BUILDINGS_DEPLOY_OK
          echo "SOURCE_SHA=$(sha256sum "$src" | cut -d' ' -f1)"
          echo "ACTIVE_SHA=$(sha256sum "$dest" | cut -d' ' -f1)"
          echo "REPO_SOURCE_SHA=$(sha256sum "$repo_src" | cut -d' ' -f1)"
          echo "REPO_ACTIVE_SHA=$(sha256sum "$repo_dest" | cut -d' ' -f1)"
          echo "BACKUP_PATH=$backup"
          REMOTE
