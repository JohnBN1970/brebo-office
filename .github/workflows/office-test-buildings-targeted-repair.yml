name: Office-test buildings targeted repair
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-buildings-targeted-repair
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete source bundle
        run: |
          set -euo pipefail
          files=(public/office-buildings.php src/Buildings/OfficeBuildingPdokLocationRepository.php src/Buildings/OfficeBuildingPdokRequestGuard.php src/Buildings/OfficeBuildingPdokClient.php src/Buildings/OfficeBuildingPdokSaveAction.php src/Buildings/OfficeBuildingPdokSchemaMigration.php)
          for file in "${files[@]}"; do php -l "office-independent/$file"; done
          php office-independent/tests/OfficeBuildingPdokSchemaMigrationTest.php
          php office-independent/tests/OfficeBuildingPdokSecurityTest.php
          tar -czf /tmp/office-buildings-bundle.tgz -C office-independent "${files[@]}"
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Stage complete source bundle
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -P "$PORT" /tmp/office-buildings-bundle.tgz "$USER@$HOST:/tmp/office-buildings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
      - name: Back up and deploy complete bundle (no DB operations)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          sha="$(sha256sum /tmp/office-buildings-bundle.tgz | cut -d' ' -f1)"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "GITHUB_RUN_ID=$GITHUB_RUN_ID GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT BUNDLE_SHA=$sha bash -se" <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; if (($c["OFFICE_BASE_PATH"]??null)!=="/office-test") exit(2); echo $c["OFFICE_PRIVATE_ROOT"]??"";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo INVALID_RELEASE_SCOPE; exit 21;; esac
          test "$(realpath "$active")" = "$active"
          test -d "$active/public" && test -d "$active/src/Buildings"
          archive="/tmp/office-buildings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$BUNDLE_SHA"
          stage="$(mktemp -d "$root/.buildings-stage.XXXXXXXX")"
          cleanup() { rm -f "$archive"; rm -rf "$stage"; }
          trap cleanup EXIT
          tar -xzf "$archive" -C "$stage"
          # Dependencies first; page last. Never invoke migration apply here.
          files=(src/Buildings/OfficeBuildingPdokLocationRepository.php src/Buildings/OfficeBuildingPdokRequestGuard.php src/Buildings/OfficeBuildingPdokClient.php src/Buildings/OfficeBuildingPdokSaveAction.php src/Buildings/OfficeBuildingPdokSchemaMigration.php public/office-buildings.php)
          backup="$root/backups/buildings-code/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$backup"
          mkdir -p "$backup"
          chmod 700 "$backup"
          for file in "${files[@]}"; do
            test -f "$stage/$file"
            php -l "$stage/$file"
            test ! -L "$active/$file"
            if test -f "$active/$file"; then
              mkdir -p "$backup/$(dirname "$file")"
              cp -p "$active/$file" "$backup/$file"
              cmp -s "$active/$file" "$backup/$file"
            fi
          done
          rollback() {
            trap - ERR INT TERM
            for file in "${files[@]}"; do
              if test -f "$backup/$file"; then cp -p "$backup/$file" "$active/$file"; else rm -f "$active/$file"; fi
            done
            echo BUILDINGS_DEPLOY_ROLLED_BACK
          }
          trap 'rollback; exit 31' ERR INT TERM
          for file in "${files[@]}"; do
            install -m 644 "$stage/$file" "$active/$file.new"
            mv "$active/$file.new" "$active/$file"
            php -l "$active/$file"
            cmp -s "$stage/$file" "$active/$file"
            echo "VERIFIED_FILE=$file SHA256=$(sha256sum "$active/$file" | cut -d' ' -f1)"
          done
          trap - ERR INT TERM
          echo BUILDINGS_DEPLOY_OK
          echo "BACKUP_PATH=$backup"
          REMOTE
