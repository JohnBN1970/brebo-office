name: BREBO Mail communication 142 diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: 77.37.34.160
          DEPLOY_PORT: '65002'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose communication 142 on production runtime
        env:
          DEPLOY_HOST: 77.37.34.160
          DEPLOY_PORT: '65002'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$php" -d memory_limit=512M vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)
          "${drush[@]}" php:eval '
            $nid = 142;
            $node = \Drupal::entityTypeManager()->getStorage("node")->load($nid);
            if (!$node || $node->bundle() !== "brebo_communication") {
              throw new \RuntimeException("Communication 142 not found.");
            }
            $value = static function ($node, string $field): string {
              if (!$node->hasField($field) || $node->get($field)->isEmpty()) { return ""; }
              $item = $node->get($field)->first();
              return (string) ($item->value ?? "");
            };
            $transcript = $value($node, "field_brebo_transcript");
            $html = $value($node, "field_brebo_mail_html");
            $source = $value($node, "field_brebo_source_id");
            $subject = $value($node, "field_brebo_comm_subject");
            $from = $value($node, "field_brebo_mail_from");
            $hasBoundary = preg_match("/(?:^|\\r?\\n)--[-_A-Za-z0-9.=]+/", $transcript) === 1 || stripos($transcript, "boundary=") !== false;
            $hasMimeHeaders = stripos($transcript, "Content-Type:") !== false || stripos($transcript, "Content-Transfer-Encoding:") !== false;
            $hasBase64Run = preg_match("/(?:^|\\n)[A-Za-z0-9+\\/]{80,}={0,2}(?:\\r?$|\\n)/m", $transcript) === 1;
            $projection = \Drupal::database()->select("brebo_mailbox_message", "bm")
              ->fields("bm", ["mailbox_id", "communication_id", "mail_state"])
              ->condition("communication_id", $nid)
              ->execute()->fetchAssoc();
            print "NODE={$nid}\n";
            print "SUBJECT=" . str_replace(["\r", "\n"], " ", $subject) . "\n";
            print "FROM=" . str_replace(["\r", "\n"], " ", $from) . "\n";
            print "SOURCE_ID_PRESENT=" . ($source !== "" ? "YES" : "NO") . "\n";
            print "SOURCE_ID=" . str_replace(["\r", "\n"], " ", $source) . "\n";
            print "TRANSCRIPT_BYTES=" . strlen($transcript) . "\n";
            print "HTML_PRESENT=" . ($html !== "" ? "YES" : "NO") . "\n";
            print "HTML_BYTES=" . strlen($html) . "\n";
            print "TRANSCRIPT_HAS_BOUNDARY=" . ($hasBoundary ? "YES" : "NO") . "\n";
            print "TRANSCRIPT_HAS_MIME_HEADERS=" . ($hasMimeHeaders ? "YES" : "NO") . "\n";
            print "TRANSCRIPT_HAS_BASE64_RUN=" . ($hasBase64Run ? "YES" : "NO") . "\n";
            print "PROJECTION=" . ($projection ? "FOUND" : "MISSING") . "\n";
            if ($projection) {
              print "MAILBOX_ID=" . $projection["mailbox_id"] . "\n";
              print "MAIL_STATE=" . $projection["mail_state"] . "\n";
            }
            print "MAIL_COMMUNICATION_142_DIAGNOSIS=PASS\n";
          '
          REMOTE
