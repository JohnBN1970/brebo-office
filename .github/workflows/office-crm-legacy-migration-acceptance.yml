name: CRM legacy migration safety acceptance
on:
  pull_request:
    branches: [develop]
    paths:
      - 'office-independent/deployment/hostinger/migrate-office-crm-legacy-opportunities-test.php'
      - 'office-independent/src/Crm/OfficeCrmOpportunityRepository.php'
      - 'office-independent/tests/OfficeCrmLegacyMigrationSafetyTest.php'
      - '.github/workflows/office-crm-legacy-migration-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP syntax and safety contracts
        run: |
          php -l office-independent/deployment/hostinger/migrate-office-crm-legacy-opportunities-test.php
          php -l office-independent/src/Crm/OfficeCrmOpportunityRepository.php
          php office-independent/tests/OfficeCrmLegacyMigrationSafetyTest.php
