name: CRM lead and contact management acceptance

on:
  pull_request:
    branches: [develop]
    paths:
      - 'office-independent/public/office-crm-lead-edit.php'
      - 'office-independent/public/office-crm-lead-status.php'
      - 'office-independent/public/office-crm-relation-contact-create.php'
      - 'office-independent/public/office-crm-relation-contact-manage.php'
      - 'office-independent/public/office-crm-relation-detail.php'
      - 'office-independent/public/office-crm-relation-hierarchy.php'
      - 'office-independent/public/crm-new-requests.php'
      - 'office-independent/public/index.php'
      - 'office-independent/src/Crm/OfficeCrmRelationsSchema.php'
      - '.github/workflows/office-crm-lead-contact-acceptance.yml'

permissions:
  contents: read

jobs:
  php-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            office-independent/public/office-crm-lead-edit.php \
            office-independent/public/office-crm-lead-status.php \
            office-independent/public/office-crm-relation-contact-create.php \
            office-independent/public/office-crm-relation-contact-manage.php \
            office-independent/public/office-crm-relation-detail.php \
            office-independent/public/office-crm-relation-hierarchy.php \
            office-independent/public/crm-new-requests.php \
            office-independent/public/index.php \
            office-independent/src/Crm/OfficeCrmRelationsSchema.php; do
            php -l "$file"
          done
      - name: Routes and security contracts
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $routes=file_get_contents("office-independent/public/index.php");
            $expected=[
              "/office-test/crm/aanvragen/bewerken"=>"office-crm-lead-edit.php",
              "/office-test/crm/aanvragen/status"=>"office-crm-lead-status.php",
              "/office-test/crm/relaties/contactpersoon/nieuw"=>"office-crm-relation-contact-create.php",
              "/office-test/crm/relaties/contactpersoon/beheren"=>"office-crm-relation-contact-manage.php",
              "/office-test/crm/relaties/bedrijfsstructuur"=>"office-crm-relation-hierarchy.php",
            ];
            foreach($expected as $route=>$target){
              if(!str_contains($routes,$route) || !str_contains($routes,$target)) {
                fwrite(STDERR,"MISSING_ROUTE ".$route.PHP_EOL);exit(1);
              }
            }
            foreach([
              "office-crm-lead-edit.php"=>["FOR UPDATE","crm_lead_edit_csrf","office_crm_lead_events","converted_opportunity_id"],
              "office-crm-lead-status.php"=>["FOR UPDATE","crm_lead_status_csrf","office_crm_lead_events","converted_opportunity_id"],
              "office-crm-relation-contact-create.php"=>["beginTransaction","crm_contact_csrf","office_crm_relation_contact_events","reason"],
              "office-crm-relation-contact-manage.php"=>["FOR UPDATE","crm_contact_manage_csrf","office_crm_relation_contact_events","OFFICE_TEST_CRM_CONTACT_AUDIT_VERIFIED"],
              "office-crm-relation-hierarchy.php"=>["FOR UPDATE","crm_hierarchy_csrf","office_crm_relation_hierarchy_events","OFFICE_TEST_CRM_HIERARCHY_SCHEMA_VERIFIED"]
            ] as $file=>$markers){
              $src=file_get_contents("office-independent/public/".$file);
              foreach($markers as $marker) if(!str_contains($src,$marker)){
                fwrite(STDERR,"MISSING_CONTRACT ".$file." ".$marker.PHP_EOL);exit(1);
              }
            }
            $schema=file_get_contents("office-independent/src/Crm/OfficeCrmRelationsSchema.php");
            if(!str_contains($schema,"CREATE TABLE IF NOT EXISTS office_crm_relation_contact_events")) exit(1);
            foreach(["office_crm_relation_hierarchy","office_crm_relation_hierarchy_events"] as $table) if(!str_contains($schema,"CREATE TABLE IF NOT EXISTS ".$table)) exit(1);
            echo "CRM_LEAD_CONTACT_CONTRACT_OK\n";
          '
