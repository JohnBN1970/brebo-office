name: Deploy Office-test buildings Documents navigation
on:
  push:
    branches:
      - feature/office-inspection-foundation-20261103
    paths:
      - '.github/workflows/office-buildings-documents-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/office-inspection-foundation-20261103
          persist-credentials: false
      - name: Validate source
        run: |
          set -euo pipefail
          php -l office-independent/public/office-buildings.php
          grep -Fq '<th>Documenten</th>' office-independent/public/office-buildings.php
          grep -Fq 'OfficeNativeProjectAccess' office-independent/public/office-project.php
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Guarded Office-test deployment
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="$USER@$HOST"
          scp -o StrictHostKeyChecking=accept-new -P "$PORT" office-independent/public/office-buildings.php "$remote:domains/brebobv.nl/office_calc_test/office-buildings-documents-candidate.php"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$remote" 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          candidate="$base/office-buildings-documents-candidate.php"
          trap 'rm -f "$candidate"' EXIT
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$base/config/config.php")"
          case "$active" in "$base"/release-*/private) ;; *) echo FAIL_TEST_SCOPE; exit 20;; esac
          target="$active/public/office-buildings.php"
          test -f "$target" && test ! -L "$target" || { echo FAIL_TARGET; exit 21; }
          php -l "$candidate"
          for marker in 'office_project_memberships' 'office_buildings' 'Gebouwen gekoppeld aan projecten'; do
            grep -Fq "$marker" "$target" && grep -Fq "$marker" "$candidate" || { echo FAIL_BUILDINGS_BASELINE; exit 22; }
          done
          if cmp -s "$candidate" "$target"; then echo BUILDINGS_DOCUMENTS_ALREADY_DEPLOYED; exit 0; fi
          if grep -Fq '<th>Documenten</th>' "$target"; then echo FAIL_EXISTING_DOCUMENTS_LAYOUT; exit 23; fi
          backup="$target.backup-documents-$(date +%Y%m%d%H%M%S)"
          cp -p "$target" "$backup"
          cp -p "$candidate" "$target"
          if ! php -l "$target"; then cp -p "$backup" "$target"; echo FAIL_ROLLBACK; exit 24; fi
          echo BUILDINGS_DOCUMENTS_TEST_DEPLOYED
          REMOTE
