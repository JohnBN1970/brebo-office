name: Office Calc recipe hierarchy contract
on:
  pull_request:
    paths:
      - 'office-independent/src/Calculation/OfficeCalcRecipeHierarchy.php'
      - 'office-independent/tests/OfficeCalcRecipeHierarchyTest.php'
      - '.github/workflows/office-calc-recipe-hierarchy-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hierarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BCMath
        run: sudo apt-get update -qq && sudo apt-get install -y php-bcmath
      - name: Check PHP syntax
        run: |
          php -l office-independent/src/Calculation/OfficeCalcRecipeHierarchy.php
          php -l office-independent/tests/OfficeCalcRecipeHierarchyTest.php
      - name: Validate chapter hierarchy
        run: php office-independent/tests/OfficeCalcRecipeHierarchyTest.php
