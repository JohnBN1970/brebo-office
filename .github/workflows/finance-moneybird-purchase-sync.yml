# Legacy Moneybird purchase invoice import is intentionally disabled.
# BREBO Office owns purchase and sales invoices and payment statuses.
# Do not reinstate provider-to-Office invoice synchronization.
name: BREBO Finance Moneybird purchase import (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled legacy import
        run: |
          echo "Moneybird-to-Office invoice import is disabled by FinanceCenter architecture."
          echo "Use the separate read-only bank mutation integration for payment evidence."
