name: Office-test intake disabled HTTP acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify deployed intake route and handler without changing server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.37.34.160
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            set -eu
            base=/home/u213420663/domains/brebobv.nl/office_calc_test
            router=/home/u213420663/domains/brebobv.nl/public_html/office-test/index.php
            active="$base/release-office-test-contractform-20261030/private"
            test -f "$router" && test -f "$active/public/office-intake-receive.php"
            grep -Fq '/office-test/api/intake/v1/receive' "$router"
            grep -Fq 'OFFICE_INTAKE_RECEIVER_ENABLED' "$router"
            /opt/alt/php83/usr/bin/php -l "$router"
            /opt/alt/php83/usr/bin/php -l "$active/public/office-intake-receive.php"
            echo 'OFFICE_TEST_INTAKE_ROUTER_AND_HANDLER_PRESENT'
      - name: Confirm isolated test endpoint is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://brebobv.nl/office-test/api/intake/v1/receive'
          for method in GET POST; do
            if [ "$method" = POST ]; then
              code="$(curl --silent --show-error --max-redirs 0 --max-time 20 --output /tmp/intake-response --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"source":"website"}' "$endpoint")"
            else
              code="$(curl --silent --show-error --max-redirs 0 --max-time 20 --output /tmp/intake-response --write-out '%{http_code}' --request GET "$endpoint")"
            fi
            echo "OFFICE_TEST_INTAKE_DISABLED_${method}_HTTP=${code}"
            if [ "$code" != 404 ]; then
              echo "ABORT: disabled intake endpoint did not fail closed" >&2
              exit 2
            fi
          done
          echo 'OFFICE_TEST_INTAKE_DISABLED_HTTP_ACCEPTANCE_OK'
