name: Project scope building guard acceptance

on:
  push:
    branches:
      - develop
    paths:
      - 'web/modules/custom/brebo_scope_guard/**'
      - '.github/workflows/project-scope-building-guard.yml'
      - '.github/workflows/sboffice-deploy-develop.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Enable and verify project scope building guard
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: 77.37.34.160
          DEPLOY_PORT: '65002'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            echo "Authenticated SSH host-key probe attempt $attempt/5"
            if timeout 20 ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" 'true'; then
              test -s ~/.ssh/known_hosts
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to establish authenticated SSH connection and capture host key."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Enable and acceptance-test guard
        env:
          DEPLOY_HOST: 77.37.34.160
          DEPLOY_PORT: '65002'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd public_html/sboffice_app
          DRUSH='vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl'
          $DRUSH pm:enable brebo_scope_guard -y
          $DRUSH cr
          $DRUSH php:eval '
            $storage = \Drupal::entityTypeManager()->getStorage("node");

            $scopeIds = $storage->getQuery()->accessCheck(FALSE)->condition("type", "brebo_project_scope")->execute();
            if (!$scopeIds) {
              throw new \RuntimeException("No Projectscope exists for acceptance test.");
            }
            $scope = $storage->load(reset($scopeIds));
            if (!$scope instanceof \Drupal\node\NodeInterface) {
              throw new \RuntimeException("Projectscope could not be loaded.");
            }
            $valid = brebo_scope_guard_validate_scope($scope);
            echo "EXISTING_SCOPE_VIOLATIONS=" . count($valid) . PHP_EOL;
            if ($valid) {
              throw new \RuntimeException("Existing canonical scope is invalid.");
            }
            $probe = clone $scope;
            $probe->set("field_brebo_building_ref", ["target_id" => 999999999]);
            $invalid = brebo_scope_guard_validate_scope($probe);
            echo "SYNTHETIC_INVALID_SCOPE_VIOLATIONS=" . count($invalid) . PHP_EOL;
            if (!$invalid) {
              throw new \RuntimeException("Synthetic invalid scope was not rejected.");
            }

            $bundleCounts = [];
            foreach (["brebo_building_zone", "brebo_cluster", "brebo_dwelling", "brebo_product_position"] as $bundle) {
              $ids = $storage->getQuery()->accessCheck(FALSE)->condition("type", $bundle)->execute();
              $bundleCounts[$bundle] = count($ids);
              foreach ($storage->loadMultiple($ids) as $entity) {
                $violations = brebo_scope_guard_validate_permanent_object($entity);
                if ($violations) {
                  throw new \RuntimeException("Existing permanent object invalid: " . $bundle . " #" . $entity->id());
                }
              }
            }
            echo "PERMANENT_ZONES=" . $bundleCounts["brebo_building_zone"] . PHP_EOL;
            echo "PERMANENT_CLUSTERS=" . $bundleCounts["brebo_cluster"] . PHP_EOL;
            echo "PERMANENT_DWELLINGS=" . $bundleCounts["brebo_dwelling"] . PHP_EOL;
            echo "PERMANENT_POSITIONS=" . $bundleCounts["brebo_product_position"] . PHP_EOL;

            $clusterIds = $storage->getQuery()->accessCheck(FALSE)->condition("type", "brebo_cluster")->execute();
            if (!$clusterIds) {
              throw new \RuntimeException("No cluster exists for hierarchy probe.");
            }
            $cluster = $storage->load(reset($clusterIds));
            $badCluster = clone $cluster;
            $badCluster->set("field_brebo_building_ref", ["target_id" => 999999999]);
            $badHierarchy = brebo_scope_guard_validate_permanent_object($badCluster);
            echo "SYNTHETIC_INVALID_HIERARCHY_VIOLATIONS=" . count($badHierarchy) . PHP_EOL;
            if (!$badHierarchy) {
              throw new \RuntimeException("Synthetic invalid permanent hierarchy was not rejected.");
            }

            $contextCounts = [];
            foreach (["brebo_communication", "brebo_work_package", "brebo_verification", "brebo_deviation"] as $bundle) {
              $ids = $storage->getQuery()->accessCheck(FALSE)->condition("type", $bundle)->execute();
              $contextCounts[$bundle] = count($ids);
              foreach ($storage->loadMultiple($ids) as $entity) {
                $violations = brebo_scope_guard_validate_context_object($entity);
                if ($violations) {
                  echo "CONTEXT_INVALID_BUNDLE=" . $bundle . PHP_EOL;
                  echo "CONTEXT_INVALID_ID=" . $entity->id() . PHP_EOL;
                  echo "CONTEXT_INVALID_COUNT=" . count($violations) . PHP_EOL;
                  throw new \RuntimeException("Existing canonical context is invalid.");
                }
              }
            }
            echo "CONTEXT_COMMUNICATIONS=" . $contextCounts["brebo_communication"] . PHP_EOL;
            echo "CONTEXT_WORK_PACKAGES=" . $contextCounts["brebo_work_package"] . PHP_EOL;
            echo "CONTEXT_VERIFICATIONS=" . $contextCounts["brebo_verification"] . PHP_EOL;
            echo "CONTEXT_DEVIATIONS=" . $contextCounts["brebo_deviation"] . PHP_EOL;

            $projectIds = $storage->getQuery()->accessCheck(FALSE)->condition("type", "brebo_project")->execute();
            if (!$projectIds) {
              throw new \RuntimeException("No project exists for context probe.");
            }
            $project = $storage->load(reset($projectIds));
            $badCommunication = $storage->create(["type" => "brebo_communication", "title" => "Synthetic context probe"]);
            $badCommunication->set("field_brebo_project_ref", ["target_id" => $project->id()]);
            $badCommunication->set("field_brebo_building_ref", ["target_id" => 999999999]);
            $badContext = brebo_scope_guard_validate_context_object($badCommunication);
            echo "SYNTHETIC_INVALID_CONTEXT_VIOLATIONS=" . count($badContext) . PHP_EOL;
            if (!$badContext) {
              throw new \RuntimeException("Synthetic invalid project/building context was not rejected.");
            }

            echo "PROJECT_SCOPE_GUARD=PASS" . PHP_EOL;
            echo "PERMANENT_BUILDING_GUARD=PASS" . PHP_EOL;
            echo "CANONICAL_CONTEXT_GUARD=PASS" . PHP_EOL;
          '
          $DRUSH cex -y
          REMOTE
            then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Project scope guard acceptance failed after 3 SSH attempts."
              exit 1
            fi
            sleep $((attempt * 10))
          done
