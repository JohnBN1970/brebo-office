name: Office quotation studio contracts

on:
  pull_request:
    paths:
      - 'office-independent/src/Quotation/**'
      - 'office-independent/src/Workflow/**'
      - 'office-independent/tests/OfficeCommercialWorkflowTest.php'
      - 'office-independent/tests/OfficeCommercialTransitionGuardTest.php'
      - 'office-independent/tests/OfficeCrmWorkflowBridgeTest.php'
      - 'office-independent/tests/OfficeCommercialAcceptancePolicyTest.php'
      - 'office-independent/tests/OfficeWorkflowBlueprintValidatorTest.php'
      - 'office-independent/tests/OfficeWorkflowBlueprintCompilerTest.php'
      - 'office-independent/tests/OfficeWorkflowPublicationPolicyTest.php'
      - 'office-independent/database/office-commercial-acceptance-schema.sql'
      - 'office-independent/tests/OfficeQuotationComposerTest.php'
      - 'office-independent/public/office-quotation-studio.php'
      - 'office-independent/database/office-quotation-schema.sql'
      - 'office-independent/deployment/hostinger/office-test-index.php'
      - '.github/workflows/office-quotation-studio-contracts.yml'
  workflow_dispatch:

jobs:
  quotation-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Lint quotation PHP
        run: |
          php -l office-independent/src/Workflow/OfficeCommercialWorkflow.php
          php -l office-independent/src/Workflow/OfficeCommercialTransitionGuard.php
          php -l office-independent/src/Workflow/OfficeCrmWorkflowBridge.php
          php -l office-independent/tests/OfficeCrmWorkflowBridgeTest.php
          php -l office-independent/src/Workflow/OfficeCommercialAcceptancePolicy.php
          php -l office-independent/src/Workflow/OfficeCommercialAcceptanceRepository.php
          php -l office-independent/src/Workflow/OfficeWorkflowBlueprintValidator.php
          php -l office-independent/src/Workflow/OfficeWorkflowBlueprintCompiler.php
          php -l office-independent/tests/OfficeWorkflowBlueprintCompilerTest.php
          php -l office-independent/src/Workflow/OfficeWorkflowPublicationPolicy.php
          php -l office-independent/src/Workflow/OfficeWorkflowPublicationRepository.php
          php -l office-independent/src/Workflow/OfficeWorkflowDraftRepository.php
          php -l office-independent/src/Workflow/OfficeWorkflowDraftReader.php
          php -l office-independent/tests/OfficeWorkflowPublicationPolicyTest.php
          php -l office-independent/tests/OfficeWorkflowBlueprintValidatorTest.php
          php -l office-independent/src/Crm/OfficeCrmOpportunityRepository.php
          php -l office-independent/tests/OfficeCommercialAcceptancePolicyTest.php
          php -l office-independent/tests/OfficeCommercialTransitionGuardTest.php
          php -l office-independent/tests/OfficeCommercialWorkflowTest.php
          php -l office-independent/src/Quotation/OfficeQuotationComposer.php
          php -l office-independent/src/Quotation/OfficeQuotationDraftRepository.php
          php -l office-independent/public/office-quotation-studio.php
          php -l office-independent/deployment/hostinger/office-test-index.php
          php -l office-independent/tests/OfficeQuotationComposerTest.php
      - name: Run quotation contracts
        run: |
          php office-independent/tests/OfficeQuotationComposerTest.php
          php office-independent/tests/OfficeCommercialWorkflowTest.php
          php office-independent/tests/OfficeCommercialTransitionGuardTest.php
          php office-independent/tests/OfficeCrmWorkflowBridgeTest.php
          php office-independent/tests/OfficeCommercialAcceptancePolicyTest.php
          php office-independent/tests/OfficeWorkflowBlueprintValidatorTest.php
          php office-independent/tests/OfficeWorkflowBlueprintCompilerTest.php
          php office-independent/tests/OfficeWorkflowPublicationPolicyTest.php
      - name: Verify isolated router and safe feature gates
        run: |
          php -r '$r=file_get_contents("office-independent/deployment/hostinger/office-test-index.php"); $p=file_get_contents("office-independent/public/office-quotation-studio.php"); foreach (["/office-test/crm/offertes", "office-quotation-studio.php"] as $x) { if (!str_contains($r,$x)) exit(1); } foreach (["OFFICE_OFFERTSTUDIO_PREVIEW_ENABLED", "OFFICE_QUOTATIONS_SCHEMA_VERIFIED", "OFFICE_QUOTATIONS_WRITE_ENABLED", "quotation_csrf", "getOwnDraft", "updateOwnDraft"] as $x) { if (!str_contains($p,$x)) exit(2); } echo "Quotation router and gates verified\\n";'
      - name: Verify schema coverage
        run: |
          php -r '$s=file_get_contents("office-independent/database/office-quotation-schema.sql"); foreach (["office_quotations", "office_quotation_sections", "office_quotation_instalments", "office_quotation_assets", "office_quotation_versions"] as $table) { if (!str_contains($s,"CREATE TABLE IF NOT EXISTS ".$table)) exit(1); } echo "Quotation schema declarations verified\\n";'
