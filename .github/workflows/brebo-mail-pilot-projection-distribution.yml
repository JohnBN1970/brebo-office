name: BREBO Mail pilot projection distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: 77.37.34.160
          DEPLOY_PORT: '65002'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Audit current sandbox mail projection
        env:
          DEPLOY_HOST: 77.37.34.160
          DEPLOY_PORT: '65002'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$php" -d memory_limit=512M vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)
          "${drush[@]}" php:eval '
            $db = \Drupal::database();
            $total = (int) $db->select("brebo_mailbox_message", "bm")->countQuery()->execute()->fetchField();
            echo "PROJECTION_TOTAL=$total" . PHP_EOL;

            $q = $db->select("brebo_mailbox_message", "bm");
            $q->addField("bm", "mailbox_id");
            $q->addField("bm", "mail_state");
            $q->addExpression("COUNT(*)", "message_count");
            $q->groupBy("bm.mailbox_id");
            $q->groupBy("bm.mail_state");
            $q->orderBy("bm.mailbox_id");
            $q->orderBy("bm.mail_state");
            foreach ($q->execute() as $row) {
              echo "MAILBOX=" . $row->mailbox_id . "|STATE=" . $row->mail_state . "|COUNT=" . $row->message_count . PHP_EOL;
            }

            $q = $db->select("brebo_mailbox_message", "bm");
            $q->fields("bm", ["mailbox_id", "communication_id", "mail_state"]);
            $q->orderBy("bm.communication_id", "DESC");
            $q->range(0, 20);
            $rows = $q->execute()->fetchAll();
            $storage = \Drupal::entityTypeManager()->getStorage("node");
            foreach ($rows as $row) {
              $node = $storage->load((int) $row->communication_id);
              $subject = $node && $node->hasField("field_brebo_comm_subject") && !$node->get("field_brebo_comm_subject")->isEmpty()
                ? (string) $node->get("field_brebo_comm_subject")->value
                : ($node ? (string) $node->label() : "[missing]");
              $direction = $node && $node->hasField("field_brebo_comm_direction") && !$node->get("field_brebo_comm_direction")->isEmpty()
                ? (string) $node->get("field_brebo_comm_direction")->value
                : "";
              echo "COMMUNICATION=" . $row->communication_id
                . "|MAILBOX=" . $row->mailbox_id
                . "|STATE=" . $row->mail_state
                . "|DIRECTION=" . str_replace(["\r", "\n"], " ", $direction)
                . "|SUBJECT=" . str_replace(["\r", "\n"], " ", $subject)
                . PHP_EOL;
            }
            echo "MAIL_PILOT_PROJECTION_DISTRIBUTION=PASS" . PHP_EOL;
          '
          REMOTE
