name: Office mail context links
on:
  pull_request:
    paths:
      - 'office-independent/src/Mail/OfficeMailContextLinksRepository.php'
      - 'office-independent/tests/office_mail_context_links_smoke.php'
      - '.github/workflows/office-mail-context-links.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - name: PHP lint
        run: |
          php -l office-independent/src/Mail/OfficeMailContextLinksRepository.php
          php -l office-independent/tests/office_mail_context_links_smoke.php
      - name: ACL and idempotence smoke
        run: php office-independent/tests/office_mail_context_links_smoke.php
