name: Office process blueprint contract

on:
  pull_request:
    paths:
      - 'office-independent/src/Intake/OfficeDisciplineCatalog.php'
      - 'office-independent/src/Intake/OfficeProcessBlueprint.php'
      - 'office-independent/src/Intake/OfficeIntakeProcessPlan.php'
      - 'office-independent/src/Buildings/OfficeBuildingColumnMap.php'
      - 'office-independent/tests/OfficeDisciplineCatalogTest.php'
      - 'office-independent/tests/OfficeProcessBlueprintTest.php'
      - 'office-independent/tests/OfficeBlueprintApprovalModeRepositoryTest.php'
      - 'office-independent/tests/OfficeBlueprintAdminPageContractTest.php'
      - 'office-independent/public/office-blueprint-approval-settings.php'
      - 'office-independent/src/Approval/OfficeTestSiteAdministratorAccess.php'
      - 'office-independent/schema/office-test-site-administrators.sql'
      - 'office-independent/src/Approval/OfficeApprovalPolicy.php'
      - 'office-independent/src/Approval/OfficeBlueprintApprovalModeRepository.php'
      - 'office-independent/tests/OfficeIntakeProcessPlanTest.php'
      - 'office-independent/tests/OfficeBuildingColumnMapTest.php'
      - 'office-independent/deployment/hostinger/audit-office-intake-readonly.php'
      - '.github/workflows/office-process-blueprint-contract.yml'
  push:
    branches: [develop]
    paths:
      - 'office-independent/src/Intake/OfficeDisciplineCatalog.php'
      - 'office-independent/src/Intake/OfficeProcessBlueprint.php'
      - 'office-independent/src/Intake/OfficeIntakeProcessPlan.php'
      - 'office-independent/src/Buildings/OfficeBuildingColumnMap.php'
      - 'office-independent/tests/OfficeDisciplineCatalogTest.php'
      - 'office-independent/tests/OfficeProcessBlueprintTest.php'
      - 'office-independent/tests/OfficeBlueprintApprovalModeRepositoryTest.php'
      - 'office-independent/tests/OfficeBlueprintAdminPageContractTest.php'
      - 'office-independent/public/office-blueprint-approval-settings.php'
      - 'office-independent/src/Approval/OfficeTestSiteAdministratorAccess.php'
      - 'office-independent/schema/office-test-site-administrators.sql'
      - 'office-independent/src/Approval/OfficeApprovalPolicy.php'
      - 'office-independent/src/Approval/OfficeBlueprintApprovalModeRepository.php'
      - 'office-independent/tests/OfficeIntakeProcessPlanTest.php'
      - 'office-independent/tests/OfficeBuildingColumnMapTest.php'
      - '.github/workflows/office-process-blueprint-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax and run contracts
        run: |
          set -eu
          for file in \
            office-independent/src/Intake/OfficeDisciplineCatalog.php \
            office-independent/src/Intake/OfficeProcessBlueprint.php \
            office-independent/src/Intake/OfficeIntakeProcessPlan.php \
            office-independent/src/Buildings/OfficeBuildingColumnMap.php \
            office-independent/tests/OfficeDisciplineCatalogTest.php \
            office-independent/tests/OfficeProcessBlueprintTest.php \
            office-independent/tests/OfficeBlueprintApprovalModeRepositoryTest.php \
            office-independent/tests/OfficeBlueprintAdminPageContractTest.php \
            office-independent/public/office-blueprint-approval-settings.php \
            office-independent/src/Approval/OfficeTestSiteAdministratorAccess.php \
            office-independent/src/Approval/OfficeApprovalPolicy.php \
            office-independent/src/Approval/OfficeBlueprintApprovalModeRepository.php \
            office-independent/tests/OfficeIntakeProcessPlanTest.php \
            office-independent/tests/OfficeBuildingColumnMapTest.php \
            office-independent/deployment/hostinger/audit-office-intake-readonly.php; do
            php -l "$file"
          done
          php office-independent/tests/OfficeDisciplineCatalogTest.php
          php office-independent/tests/OfficeProcessBlueprintTest.php
          php office-independent/tests/OfficeBlueprintApprovalModeRepositoryTest.php
          php office-independent/tests/OfficeBlueprintAdminPageContractTest.php
          php office-independent/tests/OfficeIntakeProcessPlanTest.php
          php office-independent/tests/OfficeBuildingColumnMapTest.php
