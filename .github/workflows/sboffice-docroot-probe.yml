name: Probe sboffice document root

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/sboffice-docroot-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Read candidate robots hashes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/brebobv.nl/public_html"
          for item in APP:$root/sboffice_app/web/robots.txt DUP:$root/web/robots.txt; do
            label=${item%%:*}
            file=${item#*:}
            if [[ -f "$file" ]]; then
              echo "${label}_ROBOTS_SHA256=$(sha256sum "$file" | awk '{print $1}')"
              echo "${label}_ROBOTS_BYTES=$(wc -c < "$file" | tr -d ' ')"
            else
              echo "${label}_ROBOTS_MISSING=YES"
            fi
          done
          REMOTE
      - name: Read live robots hash
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://sboffice.brebobv.nl/robots.txt' -o /tmp/live-robots.txt
          echo "LIVE_ROBOTS_SHA256=$(sha256sum /tmp/live-robots.txt | awk '{print $1}')"
          echo "LIVE_ROBOTS_BYTES=$(wc -c < /tmp/live-robots.txt | tr -d ' ')"
