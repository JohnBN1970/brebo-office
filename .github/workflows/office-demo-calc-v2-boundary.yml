name: Office demo Calc v2 boundary
on:
  pull_request:
    paths:
      - 'office-independent/src/Demo/OfficeDemoCalcV2Boundary.php'
      - 'office-independent/tests/OfficeDemoCalcV2BoundaryTest.php'
      - '.github/workflows/office-demo-calc-v2-boundary.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l office-independent/src/Demo/OfficeDemoCalcV2Boundary.php
          php -l office-independent/tests/OfficeDemoCalcV2BoundaryTest.php
          php office-independent/tests/OfficeDemoCalcV2BoundaryTest.php
