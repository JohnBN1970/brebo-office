name: Office-test CRM Calc VPS readiness (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-crm-calc-db-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: office-test-vps
    timeout-minutes: 5
    steps:
      - name: Verify established VPS identity and inspect active release
        env:
          VPS_HOST: ${{ secrets.VPS_OFFICE_TEST_HOST }}
          VPS_PORT: ${{ secrets.VPS_OFFICE_TEST_PORT }}
          VPS_USER: ${{ secrets.VPS_OFFICE_TEST_USER }}
          VPS_KEY: ${{ secrets.VPS_OFFICE_TEST_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_OFFICE_TEST_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for var in VPS_HOST VPS_PORT VPS_USER VPS_KEY VPS_HOST_KEY; do
            test -n "${!var}" || { echo "::error::Missing established Office-test VPS environment secret: $var"; exit 1; }
          done
          test "$VPS_USER" = brebo-deploy || { echo "::error::Expected restricted VPS deploy user"; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Invalid SSH port"; exit 1; }
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/id_office_test"
          printf '%s\n' "$VPS_HOST_KEY" > "$HOME/.ssh/known_hosts_office_test"
          chmod 600 "$HOME/.ssh/id_office_test" "$HOME/.ssh/known_hosts_office_test"
          ssh-keygen -y -P '' -f "$HOME/.ssh/id_office_test" > /dev/null
          ssh-keygen -l -f "$HOME/.ssh/known_hosts_office_test" > /dev/null
          if ! ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts_office_test" > /dev/null &&
             ! ssh-keygen -F "[$VPS_HOST]:$VPS_PORT" -f "$HOME/.ssh/known_hosts_office_test" > /dev/null; then
            echo "::error::Pinned host identity does not cover configured VPS"; exit 1
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes -o ConnectTimeout=10 \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts_office_test" \
              -i "$HOME/.ssh/id_office_test" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = brebo-deploy
          BASE=/srv/brebo/office-test
          RELEASE="$(readlink -f "$BASE/current")"
          case "$RELEASE" in "$BASE"/releases/*) ;; *) echo "::error::OFFICE_TEST_RELEASE_INVALID"; exit 1;; esac
          test -r "$RELEASE/.office-source-sha" || { echo "::error::OFFICE_TEST_RELEASE_SHA_MISSING"; exit 1; }
          echo "OFFICE_TEST_ACTIVE_RELEASE_SHA=$(cat "$RELEASE/.office-source-sha")"
          for file in public/index.php public/office-login.php; do
            test -r "$RELEASE/$file" || { echo "::error::OFFICE_TEST_FILE_MISSING=$file"; exit 1; }
          done
          echo "OFFICE_TEST_VPS_SSH_AND_RELEASE=PASS"
          # Existing root-only, read-only audit. No sudo password prompts and no
          # broadened deploy-user permissions. If the exact audit is not allowed,
          # fail closed and require a separate administrator-run preflight.
          AUDIT="$RELEASE/deployment/vps/crm-calc-schema-preflight.php"
          test -r "$AUDIT" || { echo "::error::CRM_CALC_PREFLIGHT_SCRIPT_MISSING"; exit 1; }
          if ! sudo -n -- /usr/bin/php "$AUDIT" --check; then
            echo "::error::CRM_CALC_SCHEMA_PREFLIGHT_BLOCKED"
            exit 1
          fi
          echo "CRM_CALC_DATABASE_SCHEMA=SCHEMA_ONLY_PASS"
          echo "CRM_CALC_PROJECTLESS_E2E=NOT_VERIFIED"
          echo "CRM_CALC_INTEGRATION_RELEASE=BLOCKED"
          REMOTE
