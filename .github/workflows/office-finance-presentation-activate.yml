name: Activate Finance presentation mode on Office-test
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ACTIVATE-FINANCE-PRESENTATION-TEST, or SET-FINANCE-PRESENTATION-TEST for mode selection
        required: true
        type: string
      presentation_mode:
        description: Presentation masking; disabled shows authorized Finance data
        type: choice
        options:
          - enabled
          - disabled
        default: enabled
permissions:
  contents: read
jobs:
  activate:
    if: ${{ inputs.confirmation == 'ACTIVATE-FINANCE-PRESENTATION-TEST' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Activate isolated test config, fail closed
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/brebobv.nl/office_calc_test"
          base="$root/release-office-test-contractform-20261030/private"
          config="$root/config/config.php"
          entry="$base/public/office-finance.php"
          view="$base/src/Finance/OfficeFinancePresentationView.php"
          test -f "$config" && test ! -L "$config" || { echo TEST_CONFIG_UNSAFE; exit 20; }
          test -f "$entry" && test -f "$view" || { echo PRESENTATION_GUARD_MISSING; exit 21; }
          grep -Fq "OFFICE_FINANCE_PRESENTATION_MODE" "$entry" || exit 22
          grep -Fq "OfficeFinancePresentationView::render()" "$entry" || exit 23
          php -l "$config" >/dev/null
          php -l "$entry" >/dev/null
          php -l "$view" >/dev/null
          # Validate the isolated config without printing its contents.
          php -r '
            $c=require $argv[1];
            if (!is_array($c) || ($c["OFFICE_BASE_PATH"]??null)!=="/office-test") exit(24);
            if (!isset($c["OFFICE_INTAKE_PDO_DSN"]) || strpos($c["OFFICE_INTAKE_PDO_DSN"],"u213420663_office_test")===false) exit(25);
            if (array_key_exists("OFFICE_FINANCE_PRESENTATION_MODE",$c)) exit(($c["OFFICE_FINANCE_PRESENTATION_MODE"]==="enabled")?0:26);
          ' "$config"
          backup="$root/config/config.php.finance-presentation-backup-$RUN_ID"
          cp -p "$config" "$backup"
          temp="$root/config/.config.php.finance-presentation-$RUN_ID"
          trap 'rm -f "$temp"' EXIT
          php -r '
            $source=file_get_contents($argv[1]);
            $original=require $argv[1];
            if (array_key_exists("OFFICE_FINANCE_PRESENTATION_MODE",$original)) {
              if ($original["OFFICE_FINANCE_PRESENTATION_MODE"]!=="enabled") exit(27);
              if (file_put_contents($argv[2],$source)!==strlen($source)) exit(29);
              exit;
            }
            // The actual isolated config has a computed return expression.
            // Preserve it completely by wrapping the original PHP in a
            // static, closure-scoped expression and adding only one flag.
            // Avoid any printing of confidential config values.
            $originalTokens=token_get_all($source);
            $returnCount=0;
            foreach ($originalTokens as $token) {
              if (is_array($token) && $token[0]===T_RETURN) $returnCount++;
            }
            if ($returnCount!==1) { echo "CONFIG_RETURN_COUNT_UNREVIEWED\n"; exit(28); }
            if (!str_starts_with(ltrim($source),"<?php")) { echo "CONFIG_HEADER_UNREVIEWED\n"; exit(28); }
            // Insert a single extra assignment just before the outer return.
            // Require exactly one top-level return in the existing config.
            $depth=0; $offset=0; $returnAt=null;
            foreach ($originalTokens as $token) {
              $text=is_array($token)?$token[1]:$token;
              if ($text==="{") $depth++;
              elseif ($text==="}") $depth--;
              if (is_array($token) && $token[0]===T_RETURN && $depth===0) $returnAt=$offset;
              $offset+=strlen($text);
            }
            if ($returnAt===null) { echo "CONFIG_TOPLEVEL_RETURN_UNREVIEWED\n"; exit(28); }
            // Wrap the returned value instead of altering the expression
            // or any of the original settings.
            $before=substr($source,0,$returnAt);
            $after=substr($source,$returnAt);
            $pos=strpos($after,"return");
            if ($pos===false) exit(28);
            $expr=substr($after,$pos+6);
            $trim=trim($expr);
            if (!str_ends_with($trim,";")) { echo "CONFIG_RETURN_TERMINATOR_UNREVIEWED\n"; exit(28); }
            $trim=rtrim(substr($trim,0,-1));
            if (str_contains($trim,"?>")) { echo "CONFIG_MIXED_CONTENT_UNREVIEWED\n"; exit(28); }
            $modified=$before."return array_replace((".$trim."), [\"OFFICE_FINANCE_PRESENTATION_MODE\" => \"enabled\"]);\n";
            if (file_put_contents($argv[2],$modified)!==strlen($modified)) exit(29);
          ' "$config" "$temp"
          chmod --reference="$config" "$temp"
          php -l "$temp" >/dev/null
          php -r '
            $old=require $argv[1]; $new=require $argv[2];
            $old["OFFICE_FINANCE_PRESENTATION_MODE"]="enabled";
            if ($old!==$new) exit(30);
          ' "$config" "$temp"
          mv "$temp" "$config"
          if ! php -r '$c=require $argv[1]; exit(($c["OFFICE_FINANCE_PRESENTATION_MODE"]??"") === "enabled" ? 0 : 1);' "$config"; then
            cp -p "$backup" "$config"
            echo ACTIVATION_ROLLED_BACK
            exit 31
          fi
          echo OFFICE_TEST_PRESENTATION_FLAG_ENABLED
          echo FINANCE_PRESENTATION_GUARD_PRESENT
          echo ORIGINAL_CONFIG_BACKUP_PRESERVED
          echo PRODUCTION_CONFIG_UNCHANGED
          REMOTE

  configure:
    if: ${{ inputs.confirmation == 'SET-FINANCE-PRESENTATION-TEST' }}
    runs-on: ubuntu-latest
    concurrency:
      group: office-test-finance-presentation
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Change only the test presentation flag
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          MODE: ${{ inputs.presentation_mode }}
        run: |
          set -euo pipefail
          case "$MODE" in enabled|disabled) ;; *) exit 1;; esac
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "PRESENTATION_MODE='$MODE' CHANGE_ID='$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT' php -d display_errors=0" <<'PHP'
          <?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          umask(0077);
          $temp=null;
          try {
            $mode=getenv('PRESENTATION_MODE');
            $id=getenv('CHANGE_ID');
            if (!in_array($mode,['enabled','disabled'],true) || !preg_match('/^\d+-\d+$/D',$id)) throw new RuntimeException('Invalid mode');
            $base=rtrim((string)getenv('HOME'),'/').'/domains/brebobv.nl/office_calc_test';
            $file=$base.'/config/config.php';
            if (!is_file($file) || is_link($file) || realpath($file)!==$file) throw new RuntimeException('Unsafe config');
            $before=hash_file('sha256',$file);
            $level=ob_get_level(); ob_start();
            try { $old=require $file; } finally { while(ob_get_level()>$level) ob_end_clean(); }
            $root=$old['OFFICE_PRIVATE_ROOT']??'';
            if (!is_array($old) || ($old['OFFICE_BASE_PATH']??'')!=='/office-test' || !str_starts_with($root,$base.'/release-') || !str_ends_with($root,'/private') || realpath($root)!==$root) throw new RuntimeException('Wrong scope');
            if (($old['OFFICE_MONEYBIRD_BANK_READ_ENABLED']??'')!=='enabled' || ($old['OFFICE_MONEYBIRD_BANK_API_URL']??'')!=='https://brebo-integration-api.john-boon.workers.dev/v1/accounting/bank-data') throw new RuntimeException('Bank activation missing');
            $backup=$base.'/config/config.php.presentation-before-'.$id.'.php';
            if (file_exists($backup)) throw new RuntimeException('Backup already exists');
            $out=fopen($backup,'x');
            try { $source=file_get_contents($file); if (fwrite($out,$source)!==strlen($source)) throw new RuntimeException('Backup failed'); } finally { fclose($out); }
            chmod($backup,0600);
            if (hash_file('sha256',$backup)!==$before) throw new RuntimeException('Source changed');
            $wrapper="<?php\ndeclare(strict_types=1);\n\$config = require __DIR__ . '/".basename($backup)."';\n\$config['OFFICE_FINANCE_PRESENTATION_MODE'] = ".var_export($mode,true).";\nreturn \$config;\n";
            $temp=tempnam(dirname($file),'.finance-presentation-'); chmod($temp,0600);
            if (file_put_contents($temp,$wrapper,LOCK_EX)!==strlen($wrapper)) throw new RuntimeException('Write failed');
            $level=ob_get_level(); ob_start();
            try { $new=require $temp; } finally { while(ob_get_level()>$level) ob_end_clean(); }
            $expected=$old; $expected['OFFICE_FINANCE_PRESENTATION_MODE']=$mode;
            if ($new!==$expected || hash_file('sha256',$file)!==$before) throw new RuntimeException('Unexpected configuration change');
            if (!rename($temp,$file)) throw new RuntimeException('Atomic config update failed');
            $temp=null;
            echo 'OFFICE_TEST_PRESENTATION_MODE='.$mode."\nONLY_PRESENTATION_FLAG_CHANGED=1\nBANK_CONFIGURATION_PRESERVED=1\n";
          } catch (Throwable $ignored) { echo "OFFICE_TEST_PRESENTATION_CHANGE_FAILED=1\n"; exit(1); }
          finally { if (is_string($temp) && is_file($temp)) unlink($temp); }
          PHP
