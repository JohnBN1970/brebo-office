name: Deploy BREBO Integration API

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'integration-api/**'
      - '.github/workflows/integration-api-deploy.yml'

permissions:
  contents: read

concurrency:
  group: brebo-integration-api-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integration-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ImageMagick for extraction smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - name: Validate Integration API
        run: npm run check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify managed document extraction boundary
        shell: bash
        env:
          BREBO_INTEGRATION_API_URL: https://brebo-integration-api.john-boon.workers.dev
          DOCUMENT_EXTRACTION_TOKEN: ${{ secrets.DOCUMENT_EXTRACTION_TOKEN }}
        run: |
          set -euo pipefail
          base_url="$BREBO_INTEGRATION_API_URL"
          endpoint="$base_url/v1/internal/document-extraction"

          unauth_status="$(curl --silent --show-error --output /tmp/extraction-unauth.json --write-out '%{http_code}' \
            --request POST \
            --header 'X-BREBO-Extraction-Contract: v1' \
            --form 'document=@package.json;type=application/pdf' \
            "$endpoint")"
          [[ "$unauth_status" == '401' ]] || { cat /tmp/extraction-unauth.json; echo "MANAGED_EXTRACTION_FAIL_CLOSED=0 HTTP=$unauth_status"; exit 40; }
          echo 'MANAGED_EXTRACTION_FAIL_CLOSED=1'

          [[ -n "${DOCUMENT_EXTRACTION_TOKEN:-}" ]] || { echo 'DOCUMENT_EXTRACTION_TOKEN_CONFIGURED=0'; exit 41; }
          echo 'DOCUMENT_EXTRACTION_TOKEN_CONFIGURED=1'

          cat > /tmp/brebo-extraction-smoke.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400">
            <rect width="100%" height="100%" fill="white"/>
            <text x="60" y="180" font-family="Arial" font-size="72" fill="black">BREBO EXTRACTION SMOKE 2026</text>
            <text x="60" y="280" font-family="Arial" font-size="48" fill="black">Invoice total EUR 123.45</text>
          </svg>
          SVG
          convert /tmp/brebo-extraction-smoke.svg /tmp/brebo-extraction-smoke.png

          auth_status="$(curl --silent --show-error --output /tmp/extraction-auth.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $DOCUMENT_EXTRACTION_TOKEN" \
            --header 'X-BREBO-Extraction-Contract: v1' \
            --form 'document=@/tmp/brebo-extraction-smoke.png;type=image/png' \
            "$endpoint")"
          [[ "$auth_status" == '200' ]] || { cat /tmp/extraction-auth.json; echo "MANAGED_EXTRACTION_HTTP_OK=0 HTTP=$auth_status"; exit 42; }

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/extraction-auth.json', 'utf8'));
          if (!payload || payload.status !== 'extracted' || typeof payload.text !== 'string' || payload.text.trim() === '') {
            throw new Error(`Managed extraction returned an unexpected result: ${JSON.stringify(payload)}`);
          }
          if (payload.extractor !== 'cloudflare_workers_ai_tomarkdown_text_v1') {
            throw new Error(`Unexpected extractor: ${String(payload.extractor ?? '')}`);
          }
          console.log('MANAGED_EXTRACTION_HTTP_OK=1');
          console.log('MANAGED_EXTRACTION_TEXT_PRESENT=1');
          console.log(`MANAGED_EXTRACTION_EXTRACTOR=${payload.extractor}`);
          NODE

      - name: Verify Moneybird connection and Finance business health
        shell: bash
        env:
          BREBO_SHARED_SECRET: ${{ secrets.BREBO_SHARED_SECRET }}
          BREBO_INTEGRATION_API_URL: https://brebo-integration-api.john-boon.workers.dev
          EXPECTED_MONEYBIRD_ADMINISTRATION_ID: '470422197045823237'
        run: |
          node --input-type=module <<'NODE'
          import { createHash, createHmac, randomUUID } from 'node:crypto';

          const baseUrl = process.env.BREBO_INTEGRATION_API_URL;
          const secret = process.env.BREBO_SHARED_SECRET;
          const expectedAdministrationId = process.env.EXPECTED_MONEYBIRD_ADMINISTRATION_ID;
          if (!baseUrl || !secret || !expectedAdministrationId) {
            throw new Error('Smoke-test configuration is incomplete.');
          }

          async function signedGet(path) {
            const method = 'GET';
            const body = '';
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const requestId = randomUUID();
            const bodyHash = createHash('sha256').update(body).digest('hex');
            const canonical = [method, path, bodyHash, timestamp, requestId].join('\n');
            const signature = createHmac('sha256', secret).update(canonical).digest('hex');
            const response = await fetch(`${baseUrl}${path}`, {
              method,
              headers: {
                'X-BREBO-Request-Id': requestId,
                'X-BREBO-Timestamp': timestamp,
                'X-BREBO-Signature': `v1=${signature}`,
                'Accept': 'application/json',
              },
            });
            const payload = await response.json().catch(() => null);
            return { response, payload };
          }

          const connection = await signedGet('/v1/accounting/connection');
          if (!connection.response.ok) {
            throw new Error(`Moneybird connection check failed with HTTP ${connection.response.status}.`);
          }
          if (!connection.payload || connection.payload.status !== 'ok' || connection.payload.provider !== 'moneybird' || connection.payload.connection !== 'healthy') {
            throw new Error('Moneybird connection check returned an unexpected response.');
          }
          if (String(connection.payload.administration?.administration_id ?? '') !== expectedAdministrationId) {
            throw new Error('Moneybird connection check reached an unexpected administration.');
          }

          const health = await signedGet('/v1/accounting/business-health');
          if (!health.response.ok) {
            throw new Error(`Finance business-health check failed with HTTP ${health.response.status}.`);
          }
          if (!health.payload || health.payload.status !== 'ok' || !health.payload.business_health) {
            throw new Error('Finance business-health check returned an unexpected response.');
          }

          console.log(`Moneybird connection and Finance business health healthy for administration ${expectedAdministrationId}.`);
          NODE
