name: Office-test V3 Documenten in original project tabs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-documents-button
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical V3 view and navigation test
        shell: bash
        run: |
          set -euo pipefail
          php -l office-independent/src/Project/OfficeProjectDetailV3View.php
          php -l office-independent/src/Project/OfficeProjectPageStructure.php
          php -l office-independent/tests/OfficeProjectDetailV3ViewTest.php
          php -d zend.assertions=1 -d assert.exception=1 office-independent/tests/OfficeProjectDetailV3ViewTest.php
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Patch only actual V3 tab renderer on active Office-test
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_RELEASE_SCOPE; exit 20;; esac
          project="$active/public/office-project.php"
          docs="$active/public/office-documents.php"
          view="$active/src/Project/OfficeProjectDetailV3View.php"
          test -f "$project" && test ! -L "$project" && test -f "$docs" && test ! -L "$docs" && test -f "$view" && test ! -L "$view" || { echo ABORT_MISSING_ACTIVE_FILES; exit 21; }
          php -l "$project" && php -l "$docs" && php -l "$view"
          test "$(wc -l < "$project")" -ge 900 || { echo ABORT_NOT_ACTIVE_V3; exit 22; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$project" || { echo ABORT_PROJECT_ACCESS_CHECK_MISSING; exit 23; }
          grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$docs" || { echo ABORT_DOCUMENT_ACCESS_CHECK_MISSING; exit 24; }
          grep -Fq 'OfficeNewDocumentMenu::render' "$docs" || { echo ABORT_DOCUMENT_MENU_MISSING; exit 25; }
          grep -Fq 'OfficeProjectDetailV3View::render' "$project" || { echo ABORT_NOT_REAL_V3_RENDERER; exit 26; }
          VIEW="$view" python3 - <<'PY'
          import os, pathlib, datetime, subprocess, sys, tempfile, shutil
          p=pathlib.Path(os.environ["VIEW"])
          raw=p.read_bytes()
          s=raw.decode("utf-8")
          anchor = "        $html .= '</nav><main class=\"project-v3-content\">';"
          added = "        // Contextual Documents entry is an external destination, not a sixth\n        // content pane; keep it inside the existing project tab strip.\n        $html .= '<a href=\"' . $e(rtrim($basePath, '/') . '/documenten?project_id=' . $projectId) . '\">Documenten</a>';\n"
          if s.count("class OfficeProjectDetailV3View") != 1:
              sys.exit("ABORT_V3_CLASS_MISMATCH")
          if s.count('class="project-v3-tabs"') != 1 or s.count("foreach ($tabs as $key => $label)") != 1:
              sys.exit("ABORT_ORIGINAL_TAB_BUILDER_MISMATCH")
          if s.count(anchor) != 1:
              sys.exit("ABORT_ORIGINAL_NAV_CLOSING_ANCHOR_MISMATCH")
          if added in s:
              print("V3_ORIGINAL_TABS_DOCUMENTS_ALREADY_PRESENT",flush=True)
              sys.exit(0)
          if ">Documenten</a>" in s or "/documenten?project_id=" in s:
              sys.exit("ABORT_DOCUMENTS_LINK_ALREADY_MODIFIED")
          candidate=s.replace(anchor,added+anchor,1).encode("utf-8")
          fd,name=tempfile.mkstemp(dir=str(p.parent),prefix=".office-v3-documents-",suffix=".php")
          try:
              with os.fdopen(fd,"wb") as out:out.write(candidate)
              mode=p.stat().st_mode & 0o777
              os.chmod(name,mode)
              lint=subprocess.run(["php","-l",name],capture_output=True,text=True)
              if lint.returncode:
                  print(lint.stdout+lint.stderr,flush=True)
                  sys.exit("ABORT_PATCHED_VIEW_PHP_LINT")
              backup=p.with_name(p.name+".pre-documents-original-tabs-"+datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ"))
              with open(backup,"xb") as out:out.write(raw)
              os.chmod(backup,mode)
              os.replace(name,p)
              check=subprocess.run(["php","-l",str(p)],capture_output=True,text=True)
              if check.returncode or p.read_bytes()!=candidate:
                  shutil.copy2(backup,p)
                  sys.exit("ABORT_FINAL_CHECK_RESTORED")
              print("V3_ORIGINAL_TABS_DOCUMENTS_DEPLOYED",flush=True)
              print("V3_ORIGINAL_TABS_DOCUMENTS_BACKUP="+backup.name,flush=True)
          finally:
              if os.path.exists(name):os.unlink(name)
          PY
          echo OFFICE_TEST_V3_ORIGINAL_DOCUMENTS_TAB_PASS
          REMOTE
