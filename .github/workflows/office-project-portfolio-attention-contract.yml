name: Office project portfolio attention contract

on:
  push:
    branches: [develop]
    paths:
      - 'office-independent/public/office-projects.php'
      - 'office-independent/src/Project/OfficeProjectPortfolioView.php'
      - 'office-independent/src/Project/OfficeProjectPortfolioTotals.php'
      - 'office-independent/src/Project/OfficeProjectPortfolioPlannedHours.php'
      - 'office-independent/src/Inzet/OfficeApprovedHoursSchema.php'
      - 'office-independent/src/Inzet/OfficeApprovedHoursWeekRepository.php'
      - 'office-independent/tests/OfficeProjectPortfolioTotalsTest.php'
      - 'office-independent/tests/OfficeProjectPortfolioPlannedHoursTest.php'
      - 'office-independent/src/Project/OfficeProjectPageStructure.php'
      - 'office-independent/src/Project/OfficeProjectTrafficLight.php'
      - 'office-independent/tests/OfficeProjectPortfolioAttentionTest.php'
      - '.github/workflows/office-project-portfolio-attention-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test portfolio attention
        run: |
          set -euo pipefail
          php -l office-independent/public/office-projects.php
          php -l office-independent/src/Project/OfficeProjectPortfolioView.php
          php -l office-independent/src/Project/OfficeProjectPortfolioTotals.php
          php -l office-independent/src/Project/OfficeProjectPortfolioPlannedHours.php
          php -l office-independent/src/Inzet/OfficeApprovedHoursSchema.php
          php -l office-independent/src/Inzet/OfficeApprovedHoursWeekRepository.php
          php -l office-independent/tests/OfficeProjectPortfolioPlannedHoursTest.php
          php -l office-independent/tests/OfficeProjectPortfolioTotalsTest.php
          php -l office-independent/src/Project/OfficeProjectTrafficLight.php
          php -l office-independent/tests/OfficeProjectPortfolioAttentionTest.php
          php office-independent/tests/OfficeProjectPortfolioAttentionTest.php
          php office-independent/tests/OfficeProjectPortfolioTotalsTest.php
          php office-independent/tests/OfficeProjectPortfolioPlannedHoursTest.php
