name: Office-test central development pipeline
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, 'feature/**', 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-central-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Office-test source gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, bcmath, curl, zip, simplexml
          coverage: none
      - run: python -m pip install PyYAML==6.0.2
      - name: Enforce deployment boundaries
        run: python scripts/ci/check_deployment_policy.py
      - name: Verify Hostinger deployment shell syntax
        run: bash -n scripts/deployment/deploy_office_test.sh
      - name: Verify VPS CRM readiness diagnostics shell syntax
        run: bash -n scripts/deployment/check_office_test_vps_readiness.sh
      - name: Verify Office-test migration statement parameter contracts
        run: python3 scripts/ci/test_office_test_migration_contract.py
      - run: python scripts/ci/test_release_reconciliation.py
      - name: Verify release reconciliation CLI allowlists
        run: python3 scripts/deployment/test_calc_runtime_reconciliation.py
      - run: python scripts/ci/test_deployment_policy.py
      - name: Validate all Office PHP sources
        shell: bash
        run: |
          set -euo pipefail
          find office-independent scripts/deployment -type f -name '*.php' -print0 | xargs -0 -r -n 1 -P 4 php -l > /tmp/php-lint.log || { grep -v 'No syntax errors' /tmp/php-lint.log; exit 1; }
          echo OFFICE_SOURCE_LINT_PASS
      - name: Validate CL-204 projectopname contracts and draft handling
        run: |
          php office-independent/tests/test_cl204_projectopname.php
          php office-independent/tests/test_cl204_draft_input.php
          php office-independent/tests/test_cl204_building_route_contract.php
      - name: Verify Deal to Calc actions in Kanban, list and calendar
        run: php office-independent/tests/OfficeCrmDealCalcVisibilityTest.php
      - name: Verify canonical Calc building truth reader
        run: php office-independent/tests/OfficeCalcBuildingTruthReaderTest.php
      - name: Verify canonical native building columns
        run: php office-independent/tests/OfficeCanonicalBuildingColumnsContractTest.php
      - name: Verify existing project-to-building linking
        run: php office-independent/tests/OfficeProjectExistingBuildingLinkContractTest.php
      - name: Verify Calc housing quantity read contract
        run: php office-independent/tests/OfficeCalcHousingQuantityReaderTest.php
      - name: Exercise Calc workbench controls in Chromium
        run: python3 scripts/ci/test_calc_workbench_browser.py
      - name: Verify Deal revision approval and audit history
        run: php office-independent/tests/office-calc-deal-revision-guard.php
      - name: Validate calculation arithmetic contracts
        run: |
          set -euo pipefail
          php office-independent/tests/OfficeCalcLaborNormTest.php
          php office-independent/tests/OfficeCalcQuantityAdjustmentsTest.php
          php office-independent/tests/OfficeCalcCostBreakdownTest.php
          php office-independent/tests/OfficeCalcCrmTransferServiceContractTest.php
          php office-independent/tests/OfficeCalcBudgetLineBridgeTest.php
          php office-independent/tests/OfficeCalcDecimalQuantityMigrationContractTest.php
          php office-independent/tests/OfficeCalcDecimalBudgetMapperTest.php
          php office-independent/tests/OfficeCalcDecimalTransferContractTest.php
          php office-independent/tests/OfficeBuildingElementRepositoryTest.php
          php office-independent/tests/OfficeBuildingElementAccessTest.php
          php -l office-independent/public/office-buildings.php
          php -l office-independent/src/Project/OfficeBuildingElementRepository.php
          php office-independent/tests/OfficeCalcDecimalBaselineReadContractTest.php
          php -l office-independent/src/Calculation/OfficeCalcCrmDraftLineRepository.php
          php -l office-independent/src/Calculation/OfficeCalcCrmDraftAccess.php
          php -l office-independent/src/Calculation/OfficeCalcDraftCollaboration.php
          php -l office-independent/src/Calculation/OfficeCalcDraftMaterialSource.php
          php -l office-independent/public/office-calc-crm-workbench.php
          php -l office-independent/public/office-calc-crm-collaboration-panels.php
          php -l office-independent/public/office-calc-crm-material-panel.php
          php office-independent/tests/OfficeCalcGridLayoutContractTest.php
          php office-independent/tests/OfficeCalcUnifiedRouterContractTest.php
          php office-independent/tests/OfficeCalcDraftCollaborationTest.php
          php -l office-independent/src/Calculation/OfficeCalcDraftPriceSourceSchema.php
          php office-independent/tests/OfficeCalcDraftMaterialSourceTest.php
      - name: Validate project WBS and RBS projections
        run: php office-independent/tests/OfficeProjectBreakdownTest.php
      - name: Validate native project detail repository
        run: php office-independent/tests/OfficeNativeProjectRepositoryTest.php
      - name: Validate native work budget and costs
        run: |
          set -euo pipefail
          for test in LockedBaselineLinesTest LockedBaselineDecimalLinesTest ProjectBudgetReadModelTest ProjectBudgetPanelTest WorkingBudgetKpiProjectionTest OfficeProcurementBudgetAdapterTest OfficeWorkBudgetCommitmentComparisonTest OfficeCalcWorkBudgetHandoffTest OfficeOnSiteWeekBoundaryTest OfficeOnSiteRejectionContractTest OfficeApprovedLabourCostPolicyTest OfficeApprovedLabourValuationTest OfficeApprovedLabourRatePolicyTest OfficeApprovedLabourCostPostingContractTest OfficeActualLabourCostProjectReaderContractTest OfficeOnSiteRolloutReadinessTest; do
            php "office-independent/tests/$test.php"
          done
      - name: Validate Finance dependency, sessions and project access
        run: |
          set -euo pipefail
          find packages/brebo-finance-core -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          php office-independent/tests/OfficeFinanceIntegrationRegressionTest.php
          php office-independent/tests/OfficeFinanceSessionIntegrationTest.php
          php office-independent/tests/OfficeFinanceProjectAccessTest.php
          for test in OfficeFinanceBankViewTest OfficeFinanceCenterTest OfficeFinanceCostReadinessTest OfficeFinanceDashboardTest OfficeFinanceOverviewTest OfficeFinanceSalesOverviewTest OfficeSalesBillingTest OfficeSalesPdfTest OfficeSalesServiceTest OfficeNavigationV2Test OfficeFinanceNavigationAccessTest OfficeProjectContractServiceTest OfficeProjectFinanceControlsTest; do
            php "office-independent/tests/$test.php"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Finance editor and debtor interactions
        run: |
          set -euo pipefail
          php office-independent/tests/OfficeFinanceCenterTest.php --sales-fixture "$RUNNER_TEMP/finance-party.html"
          php office-independent/tests/OfficeSalesBillingTest.php --fixture "$RUNNER_TEMP/term-layout.html"
          php office-independent/tests/OfficeSalesPdfTest.php --layout-fixture "$RUNNER_TEMP/sales-layout.html"
          npm install --prefix "$RUNNER_TEMP/sales-dom" --no-save --ignore-scripts jsdom@26.1.0
          export SALES_JSDOM_MODULE="$RUNNER_TEMP/sales-dom/node_modules/jsdom"
          node office-independent/tests/OfficeSalesEditorDomTest.cjs "$RUNNER_TEMP/sales-layout.html" "$RUNNER_TEMP/term-layout.html"
          node office-independent/tests/OfficeFinancePartyDomTest.cjs "$RUNNER_TEMP/finance-party.html"
      - name: Validate OnSite approval and weekly deductions
        run: php office-independent/tests/OfficeLabourAtomicApprovalContractTest.php
      - name: Validate dashboard calculations, privacy and preferences
        run: |
          php office-independent/tests/OfficeDashboardSuiteTest.php
          php office-independent/tests/OfficeVpsDashboardActivationTest.php
          php office-independent/tests/OfficePersonalDashboardIntegrationTest.php
          php office-independent/tests/OfficePersonalDashboardRouteTest.php
          SALES_JSDOM_MODULE="$RUNNER_TEMP/sales-dom/node_modules/jsdom" node office-independent/tests/OfficeDashboardDomTest.cjs
      - name: Validate CRM project handoff against both persisted mapping paths
        run: php office-independent/tests/OfficeCrmProjectHandoffTest.php
      - name: Validate native CRM direct project adapter
        run: |
          php office-independent/tests/OfficeCrmNativeProjectAdapterTest.php
          php office-independent/tests/OfficeCrmDirectNativeTransferRoundTripTest.php
          php office-independent/tests/OfficeCrmDirectProjectHttpContractTest.php
          php office-independent/tests/OfficeTestProjectCreationRightsAdminContractTest.php
          php office-independent/tests/OfficeTestRolePermissionPolicyContractTest.php
          php office-independent/tests/OfficeTestRoleProfileApplyContractTest.php
          php office-independent/tests/OfficeTestProjectRoleSchemaMigrationContractTest.php
          php office-independent/tests/OfficeCrmDirectVpsPreflightContractTest.php
          php -l office-independent/src/Crm/OfficeCrmDirectProjectAcceptance.php
      - name: Validate existing core contracts
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 office-independent/tests/OfficeProjectDetailV3ViewTest.php
          python3 -m py_compile office-independent/deployment/hostinger/mount-project-detail-v3.py
          for file in office-independent/tests/test_project_kickstart_*.php office-independent/tests/test_project_execution_start_gate.php; do php "$file"; done
          python3 office-independent/tests/test_project_kickstart_mount.py
  inventory:
    name: Office-test deployment and acceptance
    environment: office-test
    needs: validate
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' && vars.VPS_OFFICE_TEST_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact source and reconciliation baseline
        run: |
          set -euo pipefail
          mkdir -p /tmp/office-development-package/baseline /tmp/office-development-package/metadata
          path=office-independent/src/Inzet/OfficeOnSiteApprovalService.php
          git log --format=%H HEAD -- "$path" | while IFS= read -r commit; do
            git rev-parse "$commit:$path" 2>/dev/null || true
          done | sort -u > /tmp/office-development-package/metadata/onsite-ancestor-blobs.txt
          calc_path=office-independent/src/Calculation/OfficeCalcCrmDraftLineRepository.php
          git log --format=%H HEAD -- "$calc_path" | while IFS= read -r commit; do
            git rev-parse "$commit:$calc_path" 2>/dev/null || true
          done | sort -u > /tmp/office-development-package/metadata/calc-ancestor-blobs.txt
          # Reviewed Office-test Calc runtime is an existing GitHub blob (older
          # repository variant without the newer cost_components API). Exact
          # hash only; the reconciler retains a private backup before replacing.
          printf '%s\n' '6b3d694c92cdb04152c7757e9e69facca60fcc38' >> /tmp/office-development-package/metadata/calc-ancestor-blobs.txt
          sort -u /tmp/office-development-package/metadata/calc-ancestor-blobs.txt -o /tmp/office-development-package/metadata/calc-ancestor-blobs.txt
          # Path-specific Git ancestors for Calc only. Never trust arbitrary
          # server PHP: unmatched blobs still fail closed, with a fingerprint.
          git rev-list --objects HEAD -- office-independent/src/Calculation | awk 'NF == 2 && index($2,"office-independent/src/Calculation/")==1 {print substr($2,length("office-independent/")+1) " " $1}' | sort -u > /tmp/office-development-package/metadata/calc-path-ancestor-blobs.txt
          # Exact runtime version verified in failed run 43748699879. Its
          # transactional/CRM guards are incorporated into the merged source.
          # Allow only this path+blob, with a private backup before replacement.
          printf '%s\n' 'src/Calculation/OfficeCalcCrmTransferService.php 915211ae14b79061e750e8648c5c2e7b2094433e' >> /tmp/office-development-package/metadata/calc-path-ancestor-blobs.txt
          sort -u /tmp/office-development-package/metadata/calc-path-ancestor-blobs.txt -o /tmp/office-development-package/metadata/calc-path-ancestor-blobs.txt
          git archive 39b992f8d022c9eba4732f5882c3c4cc3824616a office-independent | tar -x -C /tmp/office-development-package/baseline
          cp -a office-independent scripts /tmp/office-development-package/
          mkdir -p /tmp/office-development-package/packages
          cp -a packages/brebo-finance-core /tmp/office-development-package/packages/
          find /tmp/office-development-package -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -czf /tmp/office-development-package.tgz -C /tmp/office-development-package .
      - name: Prepare source inventory
        run: |
          python - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('office-independent')
          paths=[p for area in ['src','public','schema','deployment','modules'] for p in (root/area).rglob('*') if p.is_file()]
          pathlib.Path('/tmp/office-source-manifest.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}))
          PY
      - name: Deploy isolated Office-test and run HTTP acceptance
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }; done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/office_test
          chmod 600 ~/.ssh/office_test
          options=(-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_test)
          remote_dir="$(ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'mktemp -d /tmp/office-development.XXXXXXXX')"
          [[ "$remote_dir" =~ ^/tmp/office-development\.[A-Za-z0-9]+$ ]]
          trap 'ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- $remote_dir" >/dev/null 2>&1 || true; rm -f ~/.ssh/office_test' EXIT
          scp "${options[@]}" -P "$DEPLOY_PORT" office-independent/deployment/hostinger/development-inventory.php /tmp/office-source-manifest.json /tmp/office-development-package.tgz scripts/deployment/deploy_office_test.sh "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "php '$remote_dir/development-inventory.php' '$remote_dir/office-source-manifest.json'" | tee office-test-inventory.txt
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash '$remote_dir/deploy_office_test.sh' '$remote_dir/office-development-package.tgz' '$GITHUB_SHA'" | tee office-test-acceptance.txt
      - name: Fingerprint conflicting OnSite and Calc runtime sources
        if: failure() && github.ref == 'refs/heads/develop'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/office_test
          chmod 600 ~/.ssh/office_test
          trap 'rm -f ~/.ssh/office_test' EXIT
          options=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_test)
          remote="domains/brebobv.nl/office_calc_test/release-ci-$GITHUB_SHA/private/src/Inzet/OfficeOnSiteApprovalService.php"
          # The repository is public: NEVER export or print private runtime source.
          # A Git blob hash is enough to identify an already committed version.
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "if test -f ~/$remote; then git hash-object ~/$remote | sed 's/^/ONSITE_RUNTIME_GIT_BLOB=/'; else echo ONSITE_RUNTIME_BLOB_UNAVAILABLE; fi"
          # Fingerprint only: never print or export private runtime PHP sources.
          calc_remote="domains/brebobv.nl/office_calc_test/release-ci-$GITHUB_SHA/private/src/Calculation/OfficeCalcCrmDraftLineRepository.php"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "if test -f ~/$calc_remote; then git hash-object ~/$calc_remote | sed 's/^/CALC_RUNTIME_GIT_BLOB=/'; else echo CALC_RUNTIME_BLOB_UNAVAILABLE; fi"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-test-inventory-${{ github.sha }}
          path: |
            office-test-inventory.txt
            office-test-acceptance.txt
          if-no-files-found: warn
      - name: Report actual status
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "### Office-test deployment and acceptance: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Production untouched. See acceptance artifact for migrations, release activation, HTTP role tests and rollback outcome." >> "$GITHUB_STEP_SUMMARY"

  vps_deploy:
    name: Office-test VPS release
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.VPS_OFFICE_TEST_DEPLOY_ENABLED == 'true'
    environment: office-test-vps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: office-test-vps-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate VPS deployment script
        run: bash -n scripts/deployment/deploy_office_test_vps.sh
      - name: Deploy to isolated VPS
        env:
          VPS_HOST: ${{ secrets.VPS_OFFICE_TEST_HOST }}
          VPS_PORT: ${{ secrets.VPS_OFFICE_TEST_PORT }}
          VPS_USER: ${{ secrets.VPS_OFFICE_TEST_USER }}
          VPS_KEY: ${{ secrets.VPS_OFFICE_TEST_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_OFFICE_TEST_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_PORT VPS_USER VPS_KEY VPS_HOST_KEY; do
            test -n "${!key}" || { echo "::error::Missing VPS credential: $key"; exit 1; }
          done
          if ! [[ "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::VPS SSH port is not numeric"
            exit 1
          fi
          if [[ "$VPS_USER" != "brebo-deploy" ]]; then
            echo "::error::VPS_OFFICE_TEST_USER must be exactly brebo-deploy (no spaces or quotes)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/office_test_vps
          chmod 600 ~/.ssh/office_test_vps
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/office_test_vps > /dev/null 2>&1; then
            echo "::error::VPS SSH private key is invalid or cannot be parsed"
            exit 1
          fi
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "::error::VPS known_hosts entry does not match the configured host"
            exit 1
          fi
          echo "VPS credentials structurally valid; connecting over SSH"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/office_test_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'bash -s --' "$GITHUB_SHA" < scripts/deployment/deploy_office_test_vps.sh
          echo "VPS_READINESS_DIAGNOSTICS_START"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/office_test_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'bash -s --' "$GITHUB_SHA" < scripts/deployment/check_office_test_vps_readiness.sh
