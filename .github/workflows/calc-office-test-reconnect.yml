name: Calc Office-test reconnect contract

on:
  pull_request:
    paths:
      - 'office-independent/src/Calculation/**'
      - 'office-independent/public/office-calc-grant-validate.php'
      - 'office-independent/public/office-calc-launch.php'
      - 'office-independent/deployment/hostinger/office-test-index.php'
      - 'office-independent/tests/OfficeCalcLaunchTokenTest.php'
      - 'office-independent/tests/OfficeCalcSessionGrantRepositoryTest.php'
      - 'office-independent/tests/OfficeCalcLaunchAccessTest.php'
      - 'office-independent/tests/OfficeCalcSignedRequestTest.php'
      - 'office-independent/tests/OfficeCalcRequestReplayRepositoryTest.php'
      - 'office-independent/tests/OfficeCalcGrantValidationServiceTest.php'
      - 'office-independent/tests/OfficeCalcLaunchIssuerTest.php'
      - 'office-independent/tests/OfficeCalcLaunchCsrfTest.php'
      - 'office-independent/deployment/hostinger/sql/office-calc-signed-request-ids.sql'
      - 'office-independent/deployment/hostinger/sql/office-calc-session-grants.sql'
      - 'office-independent/tests/OfficeCalcReconnectGateTest.php'
      - 'office-independent/public/office-home.php'
      - 'office-independent/deployment/hostinger/office-test-index.php'
      - '.github/workflows/calc-office-test-reconnect.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: |
          php -l office-independent/src/Calculation/OfficeCalcLaunchToken.php
          php -l office-independent/src/Calculation/OfficeCalcSessionGrantRepository.php
          php -l office-independent/src/Calculation/OfficeCalcLaunchAccess.php
          php -l office-independent/src/Calculation/OfficeCalcSignedRequest.php
          php -l office-independent/src/Calculation/OfficeCalcRequestReplayRepository.php
          php -l office-independent/src/Calculation/OfficeCalcGrantValidationService.php
          php -l office-independent/src/Calculation/OfficeCalcLaunchIssuer.php
          php -l office-independent/src/Calculation/OfficeCalcLaunchCsrf.php
          php -l office-independent/public/office-calc-grant-validate.php
          php -l office-independent/public/office-calc-launch.php
          php -l office-independent/deployment/hostinger/office-test-index.php
          php -l office-independent/tests/OfficeCalcLaunchTokenTest.php
          php -l office-independent/tests/OfficeCalcSessionGrantRepositoryTest.php
          php -l office-independent/tests/OfficeCalcLaunchAccessTest.php
          php -l office-independent/tests/OfficeCalcSignedRequestTest.php
          php -l office-independent/tests/OfficeCalcRequestReplayRepositoryTest.php
          php -l office-independent/tests/OfficeCalcGrantValidationServiceTest.php
          php -l office-independent/tests/OfficeCalcLaunchIssuerTest.php
          php -l office-independent/tests/OfficeCalcLaunchCsrfTest.php
          php -l office-independent/tests/OfficeCalcReconnectGateTest.php
      - name: Calc launch token contract
        run: php office-independent/tests/OfficeCalcLaunchTokenTest.php
      - name: Calc grant input contract
        run: php office-independent/tests/OfficeCalcSessionGrantRepositoryTest.php
      - name: Calc launch ACL contract
        run: php office-independent/tests/OfficeCalcLaunchAccessTest.php
      - name: Calc signed request contract
        run: php office-independent/tests/OfficeCalcSignedRequestTest.php
      - name: Calc signed request replay contract
        run: php office-independent/tests/OfficeCalcRequestReplayRepositoryTest.php
      - name: Calc grant validation service
        run: php office-independent/tests/OfficeCalcGrantValidationServiceTest.php
      - name: Calc authorized launch issuer
        run: php office-independent/tests/OfficeCalcLaunchIssuerTest.php
      - name: Calc launch CSRF contract
        run: php office-independent/tests/OfficeCalcLaunchCsrfTest.php
      - name: Office-test safe disconnected gate
        run: php office-independent/tests/OfficeCalcReconnectGateTest.php
