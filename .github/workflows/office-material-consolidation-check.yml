name: Office material consolidation contract checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'office-independent/src/WorkingBudget/MaterialConsolidation.php'
      - 'office-independent/src/WorkingBudget/MaterialIdentityReadModel.php'
      - 'office-independent/src/WorkingBudget/LockedBaselineLines.php'
      - 'office-independent/src/WorkingBudget/MaterialProcurementProjection.php'
      - 'office-independent/tests/MaterialProcurementProjectionTest.php'
      - 'office-independent/src/WorkingBudget/PurchaseReceiptService.php'
      - 'office-independent/src/WorkingBudget/PurchaseOrderService.php'
      - 'office-independent/deployment/hostinger/sql/office-work-budget-procurement.sql'
      - 'office-independent/tests/MaterialConsolidationTest.php'
      - '.github/workflows/office-material-consolidation-check.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax checks
        run: |
          set -euo pipefail
          php -l office-independent/src/WorkingBudget/MaterialConsolidation.php
          php -l office-independent/src/WorkingBudget/MaterialIdentityReadModel.php
          php -l office-independent/src/WorkingBudget/LockedBaselineLines.php
          php -l office-independent/tests/MaterialConsolidationTest.php
          php -l office-independent/src/WorkingBudget/MaterialProcurementProjection.php
          php -l office-independent/tests/MaterialProcurementProjectionTest.php
          php -l office-independent/src/WorkingBudget/PurchaseReceiptService.php
          php -l office-independent/src/WorkingBudget/PurchaseOrderService.php
      - name: Material consolidation regression tests
        run: |
          php office-independent/tests/MaterialConsolidationTest.php
          php office-independent/tests/MaterialProcurementProjectionTest.php
      - name: Verify additive migration only
        run: |
          set -euo pipefail
          grep -Fq 'CREATE TABLE IF NOT EXISTS office_work_budget_material_identity' office-independent/deployment/hostinger/sql/office-work-budget-material-identity.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS office_work_budget_receipts' office-independent/deployment/hostinger/sql/office-work-budget-procurement.sql
          if grep -Ei '(^|[[:space:]])(DROP|TRUNCATE|DELETE|UPDATE|ALTER)[[:space:]]' office-independent/deployment/hostinger/sql/office-work-budget-material-identity.sql office-independent/deployment/hostinger/sql/office-work-budget-procurement.sql; then
            echo 'Destructive migration operation rejected' >&2
            exit 1
          fi
