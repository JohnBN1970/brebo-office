name: Office governance code-only test release staging
on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/office-governance-code-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-governance-test-code-stage
  cancel-in-progress: false
jobs:
  stage-inactive-governance-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP syntax and governance acceptance
        run: |
          set -euo pipefail
          php -l office-independent/deployment/hostinger/install-office-governance-code-test.php
          php -l office-independent/public/office-governance.php
          find office-independent/src/Governance -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
          php office-independent/tests/OfficeGovernanceIntegrationTest.php
      - name: Stage governance files outside public root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: office-independent/deployment/hostinger/install-office-governance-code-test.php,office-independent/public/office-governance.php,office-independent/src/Governance/bootstrap.php,office-independent/src/Governance/OfficeGovernanceService.php,office-independent/src/Governance/OfficeGovernanceCsrf.php,office-independent/src/Governance/OfficeGovernanceSchema.php,office-independent/src/Governance/OfficeProcurementOrderSource.php,office-independent/src/Governance/Contract/OfficeGovernanceStore.php,office-independent/src/Governance/Infrastructure/PdoOfficeGovernanceStore.php
          target: /home/u213420663/domains/brebobv.nl/office_calc_test/.governance-runtime-stage
          overwrite: true
      - name: Deploy code-only using isolated CLI installer
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            ROOT=/home/u213420663/domains/brebobv.nl/office_calc_test
            PHP=/opt/alt/php83/usr/bin/php
            FILE="$ROOT/.governance-runtime-stage/office-independent/deployment/hostinger/install-office-governance-code-test.php"
            test -f "$FILE"
            "$PHP" -l "$FILE"
            export OFFICE_BASE_PATH=/office-test
            export OFFICE_GOVERNANCE_CODE_DEPLOY=explicit
            "$PHP" "$FILE"
