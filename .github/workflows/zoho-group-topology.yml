name: BREBO Zoho group topology

on:
  workflow_dispatch:
    inputs:
      organization_id:
        description: Optional Zoho organization ID (leave empty to auto-detect)
        required: false
        default: ''
      data_center:
        description: Zoho data center
        required: true
        default: eu
        type: choice
        options: [eu, com, in, com.au, jp, ca, ae, sa]

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect BREBO group topology read-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify OAuth secrets are present
        env:
          CLIENT_ID: ${{ secrets.BREBO_ZOHO_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BREBO_ZOHO_OAUTH_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BREBO_ZOHO_OAUTH_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing required Zoho OAuth secret: ${name}"; exit 2; }
          done
          echo "ZOHO_OAUTH_SECRETS=PRESENT"

      - name: Inspect groups without exposing unrelated data
        env:
          CLIENT_ID: ${{ secrets.BREBO_ZOHO_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BREBO_ZOHO_OAUTH_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.BREBO_ZOHO_OAUTH_REFRESH_TOKEN }}
          DC: ${{ inputs.data_center }}
          INPUT_ZOID: ${{ inputs.organization_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DC" in
            eu) accounts_base="https://accounts.zoho.eu"; mail_base="https://mail.zoho.eu" ;;
            com) accounts_base="https://accounts.zoho.com"; mail_base="https://mail.zoho.com" ;;
            in) accounts_base="https://accounts.zoho.in"; mail_base="https://mail.zoho.in" ;;
            com.au) accounts_base="https://accounts.zoho.com.au"; mail_base="https://mail.zoho.com.au" ;;
            jp) accounts_base="https://accounts.zoho.jp"; mail_base="https://mail.zoho.jp" ;;
            ca) accounts_base="https://accounts.zohocloud.ca"; mail_base="https://mail.zohocloud.ca" ;;
            ae) accounts_base="https://accounts.zoho.ae"; mail_base="https://mail.zoho.ae" ;;
            sa) accounts_base="https://accounts.zoho.sa"; mail_base="https://mail.zoho.sa" ;;
            *) echo "::error::Unsupported Zoho data center"; exit 3 ;;
          esac

          token_json="$(curl --fail-with-body --silent --show-error --request POST \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "grant_type=refresh_token" \
            "$accounts_base/oauth/v2/token")"
          access_token="$(jq -r '.access_token // empty' <<<"$token_json")"
          [[ -n "$access_token" ]] || { echo "::error::Zoho OAuth refresh failed"; exit 4; }
          echo "ZOHO_OAUTH_REFRESH=PASS"

          zoid="${INPUT_ZOID//[[:space:]]/}"
          if [[ -z "$zoid" ]]; then
            accounts_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Zoho-oauthtoken $access_token" \
              -H 'Accept: application/json' \
              "$mail_base/api/accounts")"
            zoid="$(jq -r '[.data[]? | .zoid?, .organizationId?, .organizationID?, .orgId?] | map(select(. != null and . != "")) | first // empty' <<<"$accounts_json")"
          fi
          if [[ ! "$zoid" =~ ^[0-9]+$ ]]; then
            echo "ZOHO_GROUP_TOPOLOGY=ZOID_REQUIRED"
            echo "::error::Zoho organization ID could not be auto-detected. Re-run with organization_id input."
            exit 5
          fi
          echo "ZOHO_ORGANIZATION_ID=DETECTED"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Zoho-oauthtoken $access_token" \
            -H 'Accept: application/json' \
            "$mail_base/api/organization/$zoid/groups")"
          groups_json="$(cat "$response_file")"

          if [[ "$http_code" != "200" ]]; then
            api_code="$(jq -r '.status.code? // .data.errorCode? // .errorCode? // .code? // empty' <<<"$groups_json" 2>/dev/null || true)"
            api_description="$(jq -r '.status.description? // .data.message? // .message? // .error? // empty' <<<"$groups_json" 2>/dev/null || true)"
            [[ -n "$api_code" ]] || api_code="UNKNOWN"
            [[ -n "$api_description" ]] || api_description="NO_SAFE_DESCRIPTION"
            api_description="${api_description//$'\n'/ }"
            echo "ZOHO_GROUP_API_HTTP=$http_code"
            echo "ZOHO_GROUP_API_CODE=$api_code"
            echo "ZOHO_GROUP_API_DESCRIPTION=$api_description"
            echo "::error::Zoho Groups API denied the read-only request; see safe status lines above."
            exit 6
          fi
          echo "ZOHO_GROUP_API_HTTP=200"

          for target in facturen@brebobv.nl offerte@brebobv.nl admin@brebobv.nl; do
            group="$(jq -c --arg t "$target" '
              [.. | objects | select(
                ((.emailId? // .emailAddress? // .groupEmail? // .mailId? // "") | tostring | ascii_downcase) == ($t | ascii_downcase)
                or ((.emailAliases? // []) | arrays | map(tostring | ascii_downcase) | index($t | ascii_downcase) != null)
              )] | first // empty
            ' <<<"$groups_json")"
            if [[ -z "$group" ]]; then
              echo "GROUP=$target|FOUND=NO"
              continue
            fi
            group_type="$(jq -r '.groupType? // .type? // .accessType? // "UNKNOWN"' <<<"$group")"
            streams="$(jq -r '
              if (.streamsEnabled? // .isStreamsEnabled? // .streamEnabled?) == true then "YES"
              elif (.streamsEnabled? // .isStreamsEnabled? // .streamEnabled?) == false then "NO"
              else "UNKNOWN" end
            ' <<<"$group")"
            echo "GROUP=$target|FOUND=YES|TYPE=$group_type|STREAMS=$streams"
          done
          echo "ZOHO_GROUP_TOPOLOGY=PASS"
