name: Diagnose BREBO Drupal Cache Rebuild

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Drupal cache rebuild on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Run verbose Drupal cache rebuild diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -uo pipefail
          export NO_COLOR=1 TERM=dumb

          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          remote_php="/opt/alt/php83/usr/bin/php"
          cd "$app"

          echo "=== BREBO Drupal cache rebuild diagnostic ==="
          echo "APP_ROOT=$app"
          "$remote_php" -v

          drush=("$remote_php" -d display_errors=1 -d display_startup_errors=1 -d error_reporting=E_ALL -d log_errors=1 -d memory_limit=512M vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo "=== Drupal status before cache rebuild ==="
          "${drush[@]}" status -vvv 2>&1 || true

          echo "=== Running cache rebuild with full verbosity ==="
          set +e
          "${drush[@]}" cr -vvv 2>&1
          status=$?
          set -e

          echo "DRUPAL_CACHE_REBUILD_EXIT_CODE=$status"

          echo "=== Recent Drupal log entries ==="
          "${drush[@]}" watchdog:show --count=100 --extended 2>&1 || true

          echo "=== Recent PHP / web error logs when available ==="
          for log in \
            "$HOME/domains/brebobv.nl/logs/error.log" \
            "$HOME/domains/brebobv.nl/logs/php_error.log" \
            "$app/error_log" \
            "$app/web/error_log"; do
            if [[ -f "$log" ]]; then
              echo "--- $log ---"
              tail -n 100 "$log" 2>&1 || true
            fi
          done

          exit "$status"
          REMOTE
