name: Office Calc recipe snapshot contract
on:
  pull_request:
    paths:
      - 'office-independent/src/Calculation/OfficeCalcRecipeSnapshot.php'
      - 'office-independent/tests/OfficeCalcRecipeSnapshotTest.php'
      - '.github/workflows/office-calc-recipe-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipe-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BCMath
        run: sudo apt-get update -qq && sudo apt-get install -y php-bcmath
      - name: Validate PHP syntax
        run: |
          php -l office-independent/src/Calculation/OfficeCalcRecipeSnapshot.php
          php -l office-independent/tests/OfficeCalcRecipeSnapshotTest.php
      - name: Test recipe quantity expansion
        run: php office-independent/tests/OfficeCalcRecipeSnapshotTest.php
