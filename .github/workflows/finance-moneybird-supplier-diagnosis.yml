name: BREBO Finance Moneybird Supplier Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose and classify Moneybird suppliers in Finance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Run read-only supplier diagnosis and classification
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1 TERM=dumb
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          remote_php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$remote_php" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo "=== BREBO Finance Moneybird supplier diagnosis preflight ==="
          "${drush[@]}" status --fields=bootstrap,db-status,drupal-version
          "${drush[@]}" php:eval '
            $container = \Drupal::getContainer();
            foreach (["brebo_finance.moneybird_supplier_diagnosis", "brebo_finance.purchase_invoice_integration_client"] as $service) {
              print $service . "=" . ($container->has($service) ? "yes" : "no") . "\n";
              if (!$container->has($service)) { throw new \RuntimeException("Missing required service: " . $service); }
            }
            $db = \Drupal::database();
            if (!$db->schema()->tableExists("brebo_finance_purchase_invoice")) { throw new \RuntimeException("Missing purchase invoice table"); }
            print "PURCHASE_INVOICE_TABLE=yes\n";
          '

          echo "=== Existing CRM identity diagnosis ==="
          "${drush[@]}" php:eval '
            $result = \Drupal::service("brebo_finance.moneybird_supplier_diagnosis")->diagnose();
            foreach (["invoice_count", "unique_contacts", "by_moneybird_id_count", "by_exact_name_count", "new_count", "ambiguous_count", "invalid_count"] as $key) {
              print strtoupper($key) . "=" . (int) ($result[$key] ?? 0) . "\n";
            }
          '

          echo "=== Read-only supplier classification dry run ==="
          "${drush[@]}" php:eval '
            $invoices = \Drupal::service("brebo_finance.purchase_invoice_integration_client")->fetchAll();
            $classifier = new \Drupal\brebo_finance\Service\MoneybirdSupplierClassifier();
            $result = $classifier->classify($invoices);
            foreach (["invoice_count", "unique_contacts", "supplier_count", "receipt_count", "review_count"] as $key) {
              print strtoupper($key) . "=" . (int) ($result[$key] ?? 0) . "\n";
            }
            foreach (["supplier", "receipt", "review"] as $group) {
              print "--- " . strtoupper($group) . " ---\n";
              foreach (($result[$group] ?? []) as $item) {
                print json_encode($item, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n";
              }
            }
            print "MONEYBIRD_SUPPLIER_CLASSIFICATION=PASS\n";
          '
          REMOTE
