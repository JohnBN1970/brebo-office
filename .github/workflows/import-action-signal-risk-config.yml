name: Import active action signal risk config

on:
  push:
    branches:
      - config/sync-action-signal-risk
    paths:
      - .github/workflows/import-action-signal-risk-config.yml

permissions:
  actions: read
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: config/sync-action-signal-risk
          fetch-depth: 1

      - name: Download exported active config
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9114454858'
        run: |
          set -euo pipefail
          mkdir -p /tmp/brebo-config
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/brebo-config/artifact.zip
          unzip -q /tmp/brebo-config/artifact.zip -d /tmp/brebo-config/artifact
          tar -xzf /tmp/brebo-config/artifact/brebo-active-config-sync.tgz -C /tmp/brebo-config
          test -d /tmp/brebo-config/config/sync

      - name: Replace config sync with active export
        run: |
          set -euo pipefail
          rm -rf config/sync
          mkdir -p config
          cp -a /tmp/brebo-config/config/sync config/sync

      - name: Commit runtime config snapshot and remove importer
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-action-signal-risk-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config/sync .github/workflows/import-action-signal-risk-config.yml
          if git diff --cached --quiet; then
            echo "No active config changes to commit."
            exit 0
          fi
          git commit -m "Sync active config after action signal risk update"
          git push origin HEAD:config/sync-action-signal-risk
