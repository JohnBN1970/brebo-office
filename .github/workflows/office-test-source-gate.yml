name: Office-test source gate
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: Office-test source gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Office-test approval source
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            office-independent/src/Approval/OfficeTestSiteAdministratorAccess.php \
            office-independent/src/Approval/OfficeBlueprintApprovalModeRepository.php \
            office-independent/public/office-blueprint-approval-settings.php; do
            test -s "$path"
            php -l "$path"
          done
          test -s office-independent/schema/office-test-site-administrators.sql
          test -s office-independent/schema/office-test-blueprint-approval-modes.sql
          echo "Source checks passed; no deployment or activation performed."

      - name: Validate module diagnostics contract
        shell: bash
        run: |
          set -euo pipefail
          php -l office-independent/public/office-system-diagnostics.php
          php -l office-independent/tests/OfficeSystemDiagnosticsContractTest.php
          php office-independent/tests/OfficeSystemDiagnosticsContractTest.php

      - name: Validate acceptance center source
        shell: bash
        run: |
          set -euo pipefail
          php -l office-independent/public/office-test-module-acceptance.php
          php -l office-independent/src/Approval/OfficeTestModuleAcceptanceRepository.php
          php -l office-independent/src/Approval/office-test-module-acceptance-catalog.php
          php -r '$c=require "office-independent/src/Approval/office-test-module-acceptance-catalog.php"; if(count($c)!==18) exit(1); foreach($c as $tests) if(!$tests) exit(1); echo "ACCEPTANCE_CATALOG=PASS\n";'
          test -s office-independent/schema/office-test-module-acceptance.sql
          grep -Fq "'/office-test/instellingen/acceptatie' => 'office-test-module-acceptance.php'" office-independent/public/index.php
          python3 -m py_compile office-independent/deployment/hostinger/collect-mail-worker-diagnostics.py
