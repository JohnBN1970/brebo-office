name: Deploy BREBO Office develop to sboffice

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'config/sync/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sboffice-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy develop to sboffice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 77.37.34.160
      DEPLOY_PORT: '65002'

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Validate deployment settings
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Required deployment setting $name is missing."; exit 1; fi
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install locked production dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          test -f vendor/drush/drush/drush.php
          test -d web/modules/contrib/mimemail
          test -d web/modules/contrib/smtp
          test -d web/modules/contrib/mailsystem
          test -f web/modules/custom/brebo_calculation/brebo_calculation.info.yml
          test -f web/modules/custom/brebo_calculation/brebo_calculation.install
          test -f web/modules/custom/brebo_calculation/brebo_calculation.module
          test -f web/modules/custom/brebo_glass/brebo_glass.info.yml
          test -f web/modules/custom/brebo_glass/brebo_glass.install
          sha256sum web/modules/custom/brebo_calculation/brebo_calculation.module | awk '{print $1}' > /tmp/brebo-calculation-module.sha256

      - name: Configure SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 20 ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'; then
              test -s ~/.ssh/known_hosts
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then echo "::error::Unable to establish authenticated SSH connection and capture host key."; exit 1; fi
            sleep $((attempt * 2))
          done

      - name: Build deployment archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.github' --exclude='web/sites/default/files' --exclude='web/sites/default/settings.php' --exclude='web/sites/default/services.yml' --exclude='.env' --exclude='.env.*' -czf /tmp/brebo-office-develop.tgz .
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Fx './web/modules/custom/brebo_document_data/src/Controller/DocumentOpenController.php'
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Fx './web/modules/custom/brebo_calculation/brebo_calculation.info.yml'
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Fx './web/modules/custom/brebo_calculation/brebo_calculation.install'
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Fx './web/modules/custom/brebo_calculation/brebo_calculation.module'
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Fx './web/modules/custom/brebo_glass/brebo_glass.info.yml'
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Fx './web/modules/custom/brebo_glass/brebo_glass.install'

      - name: Upload deployment archive
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" /tmp/brebo-office-develop.tgz /tmp/brebo-calculation-module.sha256 "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Deploy, update and export active config
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -eEuo pipefail
          export NO_COLOR=1 TERM=dumb
          target="public_html/sboffice"
          archive="/tmp/brebo-office-develop.tgz"
          expected_hash_file="/tmp/brebo-calculation-module.sha256"
          config_archive="/tmp/brebo-active-config-sync.tgz"
          settings="$target/web/sites/default/settings.php"
          services="$target/web/sites/default/services.yml"
          [[ -d "$target" && ! -L "$target" && -f "$settings" && ! -d "$target/web/web" ]]
          settings_before="$(sha256sum "$settings" | awk '{print $1}')"
          services_before=""; [[ ! -f "$services" ]] || services_before="$(sha256sum "$services" | awk '{print $1}')"
          staging="$(mktemp -d)"; trap 'rm -rf "$staging"' EXIT
          tar -xzf "$archive" -C "$staging"
          test -f "$staging/web/modules/custom/brebo_calculation/brebo_calculation.info.yml"
          test -f "$staging/web/modules/custom/brebo_calculation/brebo_calculation.install"
          test -f "$staging/web/modules/custom/brebo_calculation/brebo_calculation.module"
          expected_hash="$(cat "$expected_hash_file")"
          staging_hash="$(sha256sum "$staging/web/modules/custom/brebo_calculation/brebo_calculation.module" | awk '{print $1}')"
          [[ "$staging_hash" == "$expected_hash" ]]
          cp -a "$staging/." "$target/"
          deployed_hash="$(sha256sum "$target/web/modules/custom/brebo_calculation/brebo_calculation.module" | awk '{print $1}')"
          [[ "$deployed_hash" == "$expected_hash" ]]
          rm -f "$archive" "$expected_hash_file"; rm -rf "$staging"; trap - EXIT
          [[ "$(sha256sum "$settings" | awk '{print $1}')" == "$settings_before" ]]
          if [[ -n "$services_before" ]]; then [[ "$(sha256sum "$services" | awk '{print $1}')" == "$services_before" ]]; fi

          cd "$target"
          drush=(php vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          diagnose() {
            rc="$1"; line="$2"; command="$3"
            set +e
            echo "::group::BREBO Drupal failure diagnostics"
            echo "FAILED_EXIT=$rc"
            echo "FAILED_LINE=$line"
            echo "FAILED_COMMAND=$command"
            "${drush[@]}" status --fields=bootstrap,db-status,drupal-version,php-version 2>&1 || true
            "${drush[@]}" watchdog:show --count=40 --extended 2>&1 || "${drush[@]}" ws --count=40 --extended 2>&1 || true
            "${drush[@]}" pm:list --type=module --filter=brebo_calculation --fields=name,status,version 2>&1 || true
            find web/modules/custom/brebo_calculation -type f \( -name '*.php' -o -name '*.install' -o -name '*.module' \) -print0 | xargs -0 -n1 php -l 2>&1 || true
            echo "::endgroup::"
            exit "$rc"
          }
          trap 'diagnose $? $LINENO "$BASH_COMMAND"' ERR

          "${drush[@]}" pm:enable editor ckeditor5 brebo_building_data brebo_document_data brebo_mail_intake brebo_resident_service brebo_glass -y
          "${drush[@]}" -vvv pm:enable brebo_calculation -y
          "${drush[@]}" php:eval '\Drupal::database()->truncate("cache_container")->execute(); \Drupal::database()->truncate("cache_discovery")->execute();'
          "${drush[@]}" updb -y --no-cache-clear
          "${drush[@]}" cr
          "${drush[@]}" php:eval '$mh=\Drupal::moduleHandler(); if (!$mh->moduleExists("brebo_calculation")) { throw new \RuntimeException("brebo_calculation is not enabled"); } $s=\Drupal::database()->schema(); foreach (["brebo_calculation_structure","brebo_calculation_version","brebo_calculation_row_domain","brebo_calculation_snapshot"] as $t) { if (!$s->tableExists($t)) { throw new \RuntimeException("Missing calculation table: ".$t); } } $r=\Drupal::service("router.route_provider"); foreach (["brebo_calculation.migration_overview","brebo_calculation.migration_audit","brebo_calculation.migration_confirm"] as $n) { $r->getRouteByName($n); } print "CALCULATION_DOMAIN_OK=1\n";'
          "${drush[@]}" php:eval '$mh=\Drupal::moduleHandler(); if (!$mh->moduleExists("brebo_glass")) { throw new \RuntimeException("brebo_glass is not enabled"); } $s=\Drupal::database()->schema(); foreach (["brebo_glass_position","brebo_glass_product"] as $t) { if (!$s->tableExists($t)) { throw new \RuntimeException("Missing glass table: ".$t); } } foreach (["brebo_glass.position_repository","brebo_glass.product_repository","brebo_glass.approval_policy"] as $service) { \Drupal::service($service); } $r=\Drupal::service("router.route_provider"); foreach (["brebo_glass.position_overview","brebo_glass.position_add","brebo_glass.position_approve","brebo_glass.product_overview","brebo_glass.product_add","brebo_glass.product_verify"] as $n) { $r->getRouteByName($n); } print "GLASS_DOMAIN_OK=1\n";'

          "${drush[@]}" php:eval '\Drupal::state()->set("system.maintenance_mode", FALSE);'
          "${drush[@]}" cr
          "${drush[@]}" php:eval 'if ((bool) \Drupal::state()->get("system.maintenance_mode", FALSE)) { throw new \RuntimeException("Maintenance mode is still enabled"); } print "MAINTENANCE_MODE_OFF=1\n";'
          login_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sboffice.brebobv.nl/user/login)"
          [[ "$login_status" == "200" ]]
          echo "PUBLIC_LOGIN_OK=1"

          timeout 180 "${drush[@]}" cex -y
          test -f scripts/canonicalize-building-relations.php
          test -d config/sync
          tar -czf "$config_archive" config/sync
          echo "DEPLOY_OK=1"
          echo "CONFIG_EXPORT_OK=1"
          echo "CALCULATION_DOMAIN_OK=1"
          echo "GLASS_DOMAIN_OK=1"
          echo "MAINTENANCE_MODE_OFF=1"
          echo "PUBLIC_LOGIN_OK=1"
          echo "CALCULATION_MODULE_HASH_OK=$deployed_hash"
          echo "TARGET=$target"
          echo "RUNTIME_SETTINGS_PRESERVED=1"
          REMOTE

      - name: Download exported config
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/brebo-active-config-sync.tgz" ./brebo-active-config-sync.tgz
          test -s ./brebo-active-config-sync.tgz

      - name: Upload active config artifact
        uses: actions/upload-artifact@v4
        with:
          name: brebo-active-config-sync
          path: brebo-active-config-sync.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup server config archive
        if: always()
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set +e
          timeout 15 ssh -o ConnectTimeout=8 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'rm -f /tmp/brebo-active-config-sync.tgz /tmp/brebo-calculation-module.sha256' || true
