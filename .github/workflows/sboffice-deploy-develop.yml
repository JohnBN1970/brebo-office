name: Deploy BREBO Office develop to sboffice

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'config/sync/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sboffice-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy develop to sboffice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: 77.37.34.160
      DEPLOY_PORT: '65002'

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Validate deployment settings
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required deployment setting $name is missing."
              exit 1
            fi
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install locked production dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          test -f vendor/drush/drush/drush.php
          test -d web/modules/contrib/mimemail
          test -d web/modules/contrib/smtp
          test -d web/modules/contrib/mailsystem

      - name: Configure SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            echo "Authenticated SSH host-key probe attempt $attempt/5"
            if timeout 20 ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=5 \
              -o ServerAliveCountMax=2 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" 'true'; then
              test -s ~/.ssh/known_hosts
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to establish authenticated SSH connection and capture host key."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Build deployment archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='web/sites/default/files' \
            --exclude='web/sites/default/settings.php' \
            --exclude='web/sites/default/services.yml' \
            --exclude='.env' \
            --exclude='.env.*' \
            -czf /tmp/brebo-office-develop.tgz .
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Fx './web/modules/custom/brebo_document_data/src/Controller/DocumentOpenController.php'

      - name: Upload deployment archive
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" /tmp/brebo-office-develop.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/brebo-office-develop.tgz"

      - name: Deploy, update and export active config
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1
          export TERM=dumb
          target="public_html/sboffice"
          archive="/tmp/brebo-office-develop.tgz"
          config_archive="/tmp/brebo-active-config-sync.tgz"
          settings="$target/web/sites/default/settings.php"
          services="$target/web/sites/default/services.yml"

          if [[ ! -d "$target" ]]; then
            echo "::error::The sboffice project root does not exist."
            exit 1
          fi
          if [[ -L "$target" ]]; then
            echo "::error::Deployment target must be a real Composer project directory, not a symlink."
            exit 1
          fi
          if [[ -d "$target/web/web" ]]; then
            echo "::error::Nested Drupal webroot detected at sboffice/web/web; refusing to deploy."
            exit 1
          fi
          if [[ ! -f "$settings" ]]; then
            echo "::error::Runtime settings.php is missing; refusing to deploy."
            exit 1
          fi

          settings_before="$(sha256sum "$settings" | awk '{print $1}')"
          services_before=""
          if [[ -f "$services" ]]; then
            services_before="$(sha256sum "$services" | awk '{print $1}')"
          fi

          staging="$(mktemp -d)"
          cleanup_staging() {
            rm -rf "$staging"
          }
          trap cleanup_staging EXIT
          tar -tzf "$archive" | grep -Fx './web/modules/custom/brebo_document_data/src/Controller/DocumentOpenController.php'
          tar -xzf "$archive" -C "$staging"
          test -f "$staging/web/modules/custom/brebo_document_data/src/Controller/DocumentOpenController.php"
          cp -a "$staging/." "$target/"
          rm -f "$archive"
          cleanup_staging
          trap - EXIT

          if [[ -d "$target/web/web" ]]; then
            echo "::error::Deployment unexpectedly created a nested Drupal webroot."
            exit 1
          fi

          settings_after="$(sha256sum "$settings" | awk '{print $1}')"
          if [[ "$settings_before" != "$settings_after" ]]; then
            echo "::error::Runtime settings.php changed unexpectedly during deploy."
            exit 1
          fi
          if [[ -n "$services_before" ]]; then
            services_after="$(sha256sum "$services" | awk '{print $1}')"
            if [[ "$services_before" != "$services_after" ]]; then
              echo "::error::Runtime services.yml changed unexpectedly during deploy."
              exit 1
            fi
          fi

          cd "$target"
          test -f vendor/drush/drush/drush.php
          php vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi pm:enable editor ckeditor5 brebo_building_data brebo_document_data brebo_mail_intake -y
          php vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi updb -y
          document_controller="web/modules/custom/brebo_document_data/src/Controller/DocumentOpenController.php"
          document_routes="web/modules/custom/brebo_document_data/brebo_document_data.routing.yml"
          test -f "$document_controller"
          test -f "$document_routes"
          php -d display_errors=1 -d error_reporting=E_ALL -l "$document_controller"
          grep -F "DocumentOpenController::view" "$document_routes"
          echo "Clearing derived container and discovery caches before rebuild."
          php vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi sql:query "TRUNCATE TABLE cache_container"
          php vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi sql:query "TRUNCATE TABLE cache_discovery"
          php -d display_errors=1 -d display_startup_errors=1 -d error_reporting=E_ALL vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi -vvv cr 2>&1
          timeout 180 php vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi cex -y

          if [[ ! -f scripts/canonicalize-building-relations.php ]]; then
            echo "::error::Expected canonical audit script is missing after deploy."
            exit 1
          fi
          if [[ ! -d config/sync ]]; then
            echo "::error::config/sync does not exist after export."
            exit 1
          fi

          tar -czf "$config_archive" config/sync
          echo "DEPLOY_OK=1"
          echo "CONFIG_EXPORT_OK=1"
          echo "TARGET=$target"
          echo "RUNTIME_SETTINGS_PRESERVED=1"
          REMOTE

      - name: Download exported config
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          scp -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/brebo-active-config-sync.tgz" ./brebo-active-config-sync.tgz
          test -s ./brebo-active-config-sync.tgz

      - name: Upload active config artifact
        uses: actions/upload-artifact@v4
        with:
          name: brebo-active-config-sync
          path: brebo-active-config-sync.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup server config archive
        if: always()
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set +e
          timeout 15 ssh -o ConnectTimeout=8 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'rm -f /tmp/brebo-active-config-sync.tgz' || true
