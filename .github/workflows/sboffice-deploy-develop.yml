name: Deploy BREBO Office Production

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'config/sync/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-office-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy develop to BREBO Office production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret $name is missing."
              exit 1
            fi
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install locked production dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          test -f vendor/drush/drush/drush.php
          test -f web/modules/custom/brebo_finance/brebo_finance.info.yml
          test -f web/modules/custom/brebo_building_data/brebo_building_data.info.yml
          test -f web/modules/custom/brebo_glass/brebo_glass.info.yml
          test -f web/modules/custom/brebo_calculation/brebo_calculation.info.yml
          test -f web/modules/custom/brebo_control/brebo_control.info.yml
          test -f web/modules/custom/brebo_procurement_control/brebo_procurement_control.info.yml
          test -f web/modules/custom/brebo_contract_control/brebo_contract_control.info.yml
          test -f web/modules/custom/brebo_inzet/brebo_inzet.info.yml
          test -f web/modules/custom/brebo_project_cockpit/brebo_project_cockpit.info.yml
          test -f web/modules/custom/brebo_sandbox_reset/brebo_sandbox_reset.info.yml
          test -f web/modules/custom/brebo_project_publication/brebo_project_publication.info.yml
          test -f web/modules/custom/brebo_data_intake/brebo_data_intake.info.yml

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 20 ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'; then
              test -s ~/.ssh/known_hosts
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to establish authenticated SSH connection."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Build deployment archive
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > .brebo-deployed-sha
          [[ "$(tr -d '\r\n' < .brebo-deployed-sha)" == "$GITHUB_SHA" ]]
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='web/sites/default/files' \
            --exclude='web/sites/default/settings.php' \
            --exclude='web/sites/default/settings.local.php' \
            --exclude='web/sites/default/services.yml' \
            --exclude='.env' \
            --exclude='.env.*' \
            -czf /tmp/brebo-office-develop.tgz .
          test -s /tmp/brebo-office-develop.tgz
          tar -tzf /tmp/brebo-office-develop.tgz | grep -Eq '^\./\.brebo-deployed-sha$'

      - name: Upload deployment archive
        shell: bash
        run: |
          set -euo pipefail
          scp -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            /tmp/brebo-office-develop.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/brebo-office-develop.tgz"

      - name: Deploy, update Drupal, rebuild cache and smoke test
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -eEuo pipefail
          export NO_COLOR=1 TERM=dumb

          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          webroot="$app/web"
          archive="/tmp/brebo-office-develop.tgz"
          config_archive="/tmp/brebo-active-config-sync.tgz"
          settings="$webroot/sites/default/settings.php"
          settings_local="$webroot/sites/default/settings.local.php"
          services="$webroot/sites/default/services.yml"

          [[ -d "$app" && ! -L "$app" ]] || { echo "::error::Production application directory missing or invalid: $app"; exit 1; }
          [[ -d "$webroot" && ! -L "$webroot" ]] || { echo "::error::Drupal webroot missing or invalid: $webroot"; exit 1; }
          [[ -f "$settings" ]] || { echo "::error::Production settings.php missing in $webroot"; exit 1; }
          [[ -f "$webroot/index.php" ]] || { echo "::error::Drupal index.php missing in $webroot"; exit 1; }
          [[ ! -d "$webroot/web" ]] || { echo "::error::Nested Drupal webroot detected: $webroot/web"; exit 1; }

          settings_before="$(sha256sum "$settings" | awk '{print $1}')"
          settings_local_before=""
          services_before=""
          [[ ! -f "$settings_local" ]] || settings_local_before="$(sha256sum "$settings_local" | awk '{print $1}')"
          [[ ! -f "$services" ]] || services_before="$(sha256sum "$services" | awk '{print $1}')"

          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          tar -xzf "$archive" -C "$staging"
          test -f "$staging/web/modules/custom/brebo_finance/brebo_finance.info.yml"
          test -f "$staging/web/modules/custom/brebo_building_data/brebo_building_data.info.yml"
          test -f "$staging/web/modules/custom/brebo_glass/brebo_glass.info.yml"
          test -f "$staging/web/modules/custom/brebo_calculation/brebo_calculation.info.yml"
          test -f "$staging/web/modules/custom/brebo_control/brebo_control.info.yml"
          test -f "$staging/web/modules/custom/brebo_procurement_control/brebo_procurement_control.info.yml"
          test -f "$staging/web/modules/custom/brebo_contract_control/brebo_contract_control.info.yml"
          test -f "$staging/web/modules/custom/brebo_inzet/brebo_inzet.info.yml"
          test -f "$staging/web/modules/custom/brebo_project_cockpit/brebo_project_cockpit.info.yml"
          test -f "$staging/web/modules/custom/brebo_sandbox_reset/brebo_sandbox_reset.info.yml"
          test -f "$staging/web/modules/custom/brebo_project_publication/brebo_project_publication.info.yml"
          test -f "$staging/web/modules/custom/brebo_data_intake/brebo_data_intake.info.yml"
          test -s "$staging/.brebo-deployed-sha"
          release_sha="$(tr -d '\r\n' < "$staging/.brebo-deployed-sha")"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid release SHA in deployment archive."; exit 1; }
          command -v rsync >/dev/null 2>&1 || { echo "::error::rsync is required for authoritative production deployment."; exit 1; }

          rm -f "$app/.brebo-deployed-sha" "$app/.brebo-deployed-sha.tmp"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.brebo-deployed-sha' \
            --exclude='web/sites/default/files/' \
            --exclude='web/sites/default/settings.php' \
            --exclude='web/sites/default/settings.local.php' \
            --exclude='web/sites/default/services.yml' \
            --exclude='.env' \
            --exclude='.env.*' \
            "$staging/" "$app/"
          rm -f "$archive"
          rm -rf "$staging"
          trap - EXIT

          [[ "$(sha256sum "$settings" | awk '{print $1}')" == "$settings_before" ]]
          if [[ -n "$settings_local_before" ]]; then
            [[ -f "$settings_local" ]]
            [[ "$(sha256sum "$settings_local" | awk '{print $1}')" == "$settings_local_before" ]]
          fi
          if [[ -n "$services_before" ]]; then
            [[ -f "$services" ]]
            [[ "$(sha256sum "$services" | awk '{print $1}')" == "$services_before" ]]
          fi

          cd "$app"
          remote_php="/opt/alt/php83/usr/bin/php"
          [[ -x "$remote_php" ]] || { echo "::error::Required remote PHP 8.3 binary not found: $remote_php"; exit 1; }
          [[ "$("$remote_php" -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" == "8.3" ]]
          drush=("$remote_php" -d memory_limit=512M vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          "${drush[@]}" pm:enable editor ckeditor5 brebo_building_data brebo_document_data brebo_mail_intake brebo_resident_service brebo_glass brebo_calculation brebo_finance brebo_control brebo_procurement_control brebo_contract_control brebo_inzet brebo_project_cockpit brebo_sandbox_reset brebo_project_publication brebo_data_intake -y
          echo "MODULE_ENABLE_OK=1"

          "${drush[@]}" updb -y --no-cache-clear
          echo "DATABASE_UPDATES_OK=1"

          page_controller="$webroot/modules/custom/brebo_finance/src/Controller/FinancialProjectPageController.php"
          ledger_controller="$webroot/modules/custom/brebo_finance/src/Controller/FinancialProjectLedgerController.php"
          euro_trace_controller="$webroot/modules/custom/brebo_finance/src/Controller/FinancialEuroTraceController.php"
          cockpit_controller="$webroot/modules/custom/brebo_project_cockpit/src/Controller/ProjectCockpitController.php"
          cockpit_route_subscriber="$webroot/modules/custom/brebo_project_cockpit/src/Routing/ProjectCockpitRouteSubscriber.php"

          for controller in "$page_controller" "$ledger_controller" "$euro_trace_controller" "$cockpit_controller" "$cockpit_route_subscriber"; do
            [[ -f "$controller" ]] || { echo "::error::Required controller/runtime file missing on production: $controller"; exit 1; }
            "$remote_php" -l "$controller"
          done

          if grep -nE 'private readonly EntityTypeManagerInterface[[:space:]]+\$entityTypeManager' "$page_controller" "$ledger_controller" "$euro_trace_controller"; then
            echo "::error::Stale readonly entityTypeManager property still exists in production finance controller."
            exit 1
          fi
          grep -n 'financeEntityTypeManager' "$page_controller" || { echo "::error::FinancialProjectPageController does not contain financeEntityTypeManager."; exit 1; }
          grep -n 'projectEntityTypeManager' "$ledger_controller" || { echo "::error::FinancialProjectLedgerController does not contain projectEntityTypeManager."; exit 1; }
          grep -n 'financeEntityTypeManager' "$euro_trace_controller" || { echo "::error::FinancialEuroTraceController does not contain financeEntityTypeManager."; exit 1; }
          echo "CONTROLLERS_DEPLOY_PROOF_OK=1"

          "${drush[@]}" cr -vvv
          echo "CACHE_REBUILD_OK=1"

          "${drush[@]}" php:eval '
            $mh = \Drupal::moduleHandler();
            foreach (["brebo_building_data", "brebo_finance", "brebo_glass", "brebo_calculation", "brebo_control", "brebo_procurement_control", "brebo_contract_control", "brebo_inzet", "brebo_project_cockpit", "brebo_sandbox_reset", "brebo_project_publication", "brebo_data_intake"] as $module) {
              if (!$mh->moduleExists($module)) { throw new \RuntimeException("Module not enabled: " . $module); }
            }
            foreach ([
              "brebo_building_data.project_building_repository",
              "brebo_building_data.object_repository",
              "brebo_finance.performance_location_manager",
              "brebo_finance.performance_receipt_manager",
              "brebo_contract_control.management_control_center",
              "brebo_contract_control.management_decision_records",
              "brebo_project_cockpit.project_status_aggregator",
              "brebo_project_cockpit.project_progress_builder",
              "brebo_project_cockpit.project_milestone_builder",
              "brebo_data_intake.source_neutral_intake_manager"
            ] as $service) { \Drupal::service($service); }
            $routes = \Drupal::service("router.route_provider");
            foreach ([
              "brebo_finance.project_finance_page",
              "brebo_finance.performance_receipt_submit",
              "brebo_finance.performance_evidence_upload",
              "brebo_building_data.object_tree",
              "brebo_contract_control.management_control_center",
              "brebo_contract_control.management_recommendation_accept",
              "brebo_contract_control.management_recommendation_reject",
              "brebo_contract_control.management_decision_outcome_review",
              "brebo_project_cockpit.overview",
              "brebo_office_core.project_dashboard",
              "brebo_sandbox_reset.form",
              "brebo_data_intake.upload"
            ] as $route) { $routes->getRouteByName($route); }
            $projectRoute = $routes->getRouteByName("brebo_office_core.project_dashboard");
            $controller = (string) $projectRoute->getDefault("_controller");
            if ($controller !== "\\Drupal\\brebo_project_cockpit\\Controller\\ProjectCockpitController::overview") {
              throw new \RuntimeException("Canonical project route is not controlled by ProjectCockpitController: " . $controller);
            }
            foreach (["brebo_project_publication", "brebo_project_publication_media", "brebo_project_publication_audit"] as $table) {
              if (!\Drupal::database()->schema()->tableExists($table)) { throw new \RuntimeException("Publication table missing: " . $table); }
            }
            print "BREBO_RUNTIME_OK=1\n";
            print "PROJECT_COCKPIT_RUNTIME_OK=1\n";
            print "SANDBOX_RESET_RUNTIME_OK=1\n";
            print "PROJECT_PUBLICATION_RUNTIME_OK=1\n";
            print "DATA_INTAKE_RUNTIME_OK=1\n";
          '

          login_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sboffice.brebobv.nl/user/login)"
          [[ "$login_status" == "200" ]]
          echo "PUBLIC_LOGIN_OK=1"

          finance_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sboffice.brebobv.nl/brebo-office/finance)"
          [[ "$finance_status" != "500" && "$finance_status" != "000" && "$finance_status" != "404" ]]
          echo "FINANCE_HTTP_SMOKE_OK=$finance_status"

          control_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sboffice.brebobv.nl/brebo/control-center)"
          [[ "$control_status" != "500" && "$control_status" != "000" && "$control_status" != "404" ]]
          echo "CONTROL_CENTER_HTTP_SMOKE_OK=$control_status"

          sandbox_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sboffice.brebobv.nl/admin/brebo/sandbox-reset)"
          [[ "$sandbox_status" != "500" && "$sandbox_status" != "000" && "$sandbox_status" != "404" ]]
          echo "SANDBOX_RESET_HTTP_SMOKE_OK=$sandbox_status"

          timeout 180 "${drush[@]}" cex -y
          test -d config/sync
          tar -czf "$config_archive" config/sync
          echo "CONFIG_EXPORT_OK=1"

          marker_tmp="$app/.brebo-deployed-sha.tmp"
          marker="$app/.brebo-deployed-sha"
          printf '%s\n' "$release_sha" > "$marker_tmp"
          chmod 644 "$marker_tmp"
          mv -f "$marker_tmp" "$marker"
          [[ "$(tr -d '\r\n' < "$marker")" == "$release_sha" ]]
          echo "DEPLOYMENT_MARKER_OK=$release_sha"

          echo "DEPLOY_OK=1"
          echo "APP_ROOT=$app"
          echo "DRUPAL_WEBROOT=$webroot"
          echo "RUNTIME_SETTINGS_PRESERVED=1"
          REMOTE

      - name: Verify source-neutral intake on deployed release
        shell: bash
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' bash -se" <<'REMOTE'
          set -eEuo pipefail
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          cd "$app"
          marker="$app/.brebo-deployed-sha"
          [[ -f "$marker" ]] || { echo "::error::Production has no deployment SHA marker."; exit 1; }
          deployed_sha="$(tr -d '\r\n' < "$marker")"
          [[ "$deployed_sha" == "$EXPECTED_DEPLOY_SHA" ]] || { echo "::error::Production marker $deployed_sha does not match $EXPECTED_DEPLOY_SHA."; exit 1; }
          echo "PRODUCTION_DEPLOY_SHA=$deployed_sha"

          remote_php="/opt/alt/php83/usr/bin/php"
          drush=("$remote_php" -d memory_limit=512M vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)
          "${drush[@]}" php:eval '
            $mh = \Drupal::moduleHandler();
            if (!$mh->moduleExists("brebo_data_intake")) { throw new \RuntimeException("brebo_data_intake is not enabled."); }
            foreach (["brebo_data_intake.source_neutral_intake_manager", "brebo_finance.purchase_invoice_intake_destination", "brebo_finance.mail_purchase_invoice_router"] as $service) { \Drupal::service($service); }
            $route = \Drupal::service("router.route_provider")->getRouteByName("brebo_data_intake.upload");
            if ($route->getRequirement("_permission") !== "submit brebo office intake") { throw new \RuntimeException("Upload route permission mismatch."); }
            $roles = \Drupal::entityTypeManager()->getStorage("user_role")->loadMultiple();
            foreach (["brebo_projectleider", "brebo_werkvoorbereider"] as $roleId) {
              if (!isset($roles[$roleId]) || !$roles[$roleId]->hasPermission("submit brebo office intake")) { throw new \RuntimeException("Required role lacks intake permission: " . $roleId); }
            }
            foreach (["anonymous", "authenticated"] as $roleId) {
              if (isset($roles[$roleId]) && $roles[$roleId]->hasPermission("submit brebo office intake")) { throw new \RuntimeException("Broad role unexpectedly has intake permission: " . $roleId); }
            }
            $database = \Drupal::database();
            $transaction = $database->startTransaction();
            try {
              $manager = \Drupal::service("brebo_data_intake.source_neutral_intake_manager");
              $sourceRecordId = "acceptance:" . bin2hex(random_bytes(16));
              $input = ["source" => "upload", "source_record_id" => $sourceRecordId, "classification" => "runtime_acceptance_unknown", "payload" => ["acceptance" => TRUE], "attachments" => [], "actor_uid" => 1];
              $first = $manager->intake($input);
              if (($first["state"] ?? NULL) !== "review_required" || empty($first["review_record_id"])) { throw new \RuntimeException("First intake did not persist review_required."); }
              $second = $manager->intake($input);
              if (($second["state"] ?? NULL) !== "duplicate") { throw new \RuntimeException("Second intake was not deduplicated."); }
              if ((int) ($second["review_record_id"] ?? 0) !== (int) $first["review_record_id"]) { throw new \RuntimeException("Duplicate did not reuse review record."); }
              print "SOURCE_NEUTRAL_RUNTIME_OK=1\n";
            }
            finally { $transaction->rollBack(); }
          '
          REMOTE

      - name: Download exported config
        shell: bash
        run: |
          set -euo pipefail
          scp -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/brebo-active-config-sync.tgz" \
            ./brebo-active-config-sync.tgz
          test -s ./brebo-active-config-sync.tgz

      - name: Upload active config artifact
        uses: actions/upload-artifact@v4
        with:
          name: brebo-active-config-sync
          path: brebo-active-config-sync.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup server archives
        if: always()
        shell: bash
        run: |
          set +e
          timeout 15 ssh -o ConnectTimeout=8 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'rm -f /tmp/brebo-active-config-sync.tgz /tmp/brebo-office-develop.tgz' || true
