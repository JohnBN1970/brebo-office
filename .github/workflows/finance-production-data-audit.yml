name: BREBO Finance Production Data Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inventory Finance production data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Read-only Finance data inventory
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1 TERM=dumb
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          remote_php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$remote_php" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo "=== BREBO Finance production data inventory ==="
          "${drush[@]}" php:eval '
            $db = \Drupal::database();
            $schema = $db->schema();
            $tables = $db->query("SHOW TABLES LIKE :pattern", [":pattern" => "brebo_finance_%"])->fetchCol();
            sort($tables, SORT_STRING);
            $total = 0;
            foreach ($tables as $table) {
              if (!$schema->tableExists($table)) { continue; }
              $count = (int) $db->select($table, "t")->countQuery()->execute()->fetchField();
              $total += $count;
              print $table . "=" . $count . "\n";
            }
            print "FINANCE_TABLE_COUNT=" . count($tables) . "\n";
            print "FINANCE_TOTAL_ROWS=" . $total . "\n";
          '

          echo "=== Sample identity fields for non-empty tables ==="
          "${drush[@]}" php:eval '
            $db = \Drupal::database();
            $schema = $db->schema();
            $tables = $db->query("SHOW TABLES LIKE :pattern", [":pattern" => "brebo_finance_%"])->fetchCol();
            sort($tables, SORT_STRING);
            $candidate = ["id", "project_nid", "status", "source_system", "source_record_id", "external_id", "moneybird_id", "invoice_number", "contract_number", "commitment_number", "created", "changed"];
            foreach ($tables as $table) {
              $count = (int) $db->select($table, "t")->countQuery()->execute()->fetchField();
              if ($count === 0) { continue; }
              $fields = array_values(array_filter($candidate, fn($f) => $schema->fieldExists($table, $f)));
              print "TABLE=" . $table . " ROWS=" . $count . " FIELDS=" . implode(",", $fields) . "\n";
              if ($fields === []) { continue; }
              $query = $db->select($table, "t")->fields("t", $fields)->range(0, 5);
              foreach ($query->execute() as $row) {
                $values = [];
                foreach ($fields as $field) {
                  $value = $row->{$field} ?? NULL;
                  if (is_string($value) && strlen($value) > 80) { $value = substr($value, 0, 77) . "..."; }
                  $values[] = $field . "=" . (string) $value;
                }
                print "  " . implode(" | ", $values) . "\n";
              }
            }
          '

          echo "FINANCE_DATA_AUDIT=PASS"
          REMOTE
