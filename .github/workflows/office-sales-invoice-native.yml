name: Office native sales invoice checks

on:
  pull_request:
    paths:
      - 'office-independent/src/Finance/OfficeSalesInvoice*.php'
      - 'office-independent/public/office-finance-sales.php'
      - 'office-independent/tests/OfficeSalesInvoice*.php'
      - 'office-independent/src/Intake/OfficeNavigation.php'
      - 'office-independent/deployment/hostinger/office-test-index.php'
      - '.github/workflows/office-sales-invoice-native.yml'
  push:
    branches:
      - 'feat/office-native-sales-invoices-20261030'
    paths:
      - 'office-independent/src/Finance/OfficeSalesInvoice*.php'
      - 'office-independent/public/office-finance-sales.php'
      - 'office-independent/tests/OfficeSalesInvoice*.php'
      - 'office-independent/src/Intake/OfficeNavigation.php'
      - 'office-independent/deployment/hostinger/office-test-index.php'
      - '.github/workflows/office-sales-invoice-native.yml'

jobs:
  sales-invoice-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          for file in office-independent/src/Finance/OfficeSalesInvoice*.php office-independent/public/office-finance-sales.php office-independent/tests/OfficeSalesInvoice*.php office-independent/src/Intake/OfficeNavigation.php office-independent/deployment/hostinger/office-test-index.php; do
            php -l "$file"
          done
      - name: Sales invoice contract tests
        run: |
          php -d zend.assertions=1 -d assert.exception=1 office-independent/tests/OfficeSalesInvoiceSourceMapTest.php
          php -d zend.assertions=1 -d assert.exception=1 office-independent/tests/OfficeSalesInvoiceDraftViewTest.php
