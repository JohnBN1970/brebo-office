name: Stage Moneybird bank components for Office-test
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGE-OFFICE-BANK
        required: true
        type: string
      check_live_bank:
        description: Check bank API with read-only GET requests; no activation
        type: boolean
        default: false
      check_worker_version:
        description: Temporarily test API version at 0 percent, current version at 100 percent, then restore
        type: boolean
        default: false
      check_cloudflare_access:
        description: Read-only token, account and Worker API diagnosis; no staging or deployment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  stage:
    if: ${{ inputs.confirmation == 'STAGE-OFFICE-BANK' && (!inputs.check_cloudflare_access || inputs.check_live_bank || inputs.check_worker_version) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      BANK_PREFLIGHT_LIVE_READ: ${{ inputs.check_live_bank && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify isolated Office code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "BANK_STAGE_SOURCE_SHA=$GITHUB_SHA"
          php -l office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php
          php -l office-independent/src/Finance/OfficeFinanceBankPanel.php
          php -l office-independent/src/Finance/OfficeFinanceAccess.php
          php -l office-independent/src/Finance/OfficeMoneybirdBankApiClient.php
          php -l office-independent/src/Finance/OfficeFinanceView.php
          php -l office-independent/public/office-finance.php
          php office-independent/tests/OfficeFinanceBankPanelTest.php
          php office-independent/tests/OfficeMoneybirdBankApiClientTest.php
          php office-independent/tests/OfficeMoneybirdBankSnapshotTest.php
          php office-independent/tests/OfficeFinanceBankAccessTest.php
          php office-independent/tests/OfficeFinanceBankViewTest.php
          php -l office-independent/deployment/hostinger/office-moneybird-bank-preflight.php
          (cd office-independent && sha256sum src/Finance/OfficeMoneybirdBankSnapshot.php src/Finance/OfficeFinanceBankPanel.php src/Finance/OfficeFinanceAccess.php src/Finance/OfficeMoneybirdBankApiClient.php src/Finance/OfficeFinanceView.php src/Intake/OfficeMount.php public/office-finance.php tests/OfficeFinanceBankPanelTest.php tests/OfficeFinanceBankAccessTest.php tests/OfficeFinanceBankViewTest.php tests/OfficeMoneybirdBankApiClientTest.php tests/OfficeMoneybirdBankSnapshotTest.php deployment/hostinger/office-moneybird-bank-preflight.php deployment/hostinger/office-moneybird-bank-plan.sh deployment/hostinger/office-moneybird-bank-office.patch) > "$RUNNER_TEMP/office-bank-stage.sha256"
      - name: Set up SSH
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/office_bank_stage_key
          chmod 600 ~/.ssh/office_bank_stage_key
      - name: Stage to private non-active directory
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage="office-bank-staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -p "$DEPLOY_PORT" "$remote" "test ! -e ~/$stage && test ! -L ~/$stage && install -d -m 700 ~/$stage && install -d -m 700 ~/$stage/src/Finance ~/$stage/src/Intake ~/$stage/public ~/$stage/tests ~/$stage/deployment/hostinger"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php \
            office-independent/src/Finance/OfficeFinanceBankPanel.php \
            office-independent/src/Finance/OfficeFinanceAccess.php \
            office-independent/src/Finance/OfficeMoneybirdBankApiClient.php \
            office-independent/src/Finance/OfficeFinanceView.php "$remote:$stage/src/Finance/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            office-independent/src/Intake/OfficeMount.php "$remote:$stage/src/Intake/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            office-independent/tests/OfficeFinanceBankPanelTest.php office-independent/tests/OfficeFinanceBankAccessTest.php \
            office-independent/tests/OfficeFinanceBankViewTest.php office-independent/tests/OfficeMoneybirdBankApiClientTest.php \
            office-independent/tests/OfficeMoneybirdBankSnapshotTest.php "$remote:$stage/tests/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            office-independent/deployment/hostinger/office-moneybird-bank-preflight.php \
            office-independent/deployment/hostinger/office-moneybird-bank-plan.sh \
            office-independent/deployment/hostinger/office-moneybird-bank-office.patch "$remote:$stage/deployment/hostinger/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/office-bank-stage.sha256" "$remote:$stage/EXPECTED_SHA256"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            office-independent/public/office-finance.php "$remote:$stage/public/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -p "$DEPLOY_PORT" "$remote" "STAGE='$stage' SOURCE_SHA='$GITHUB_SHA' BANK_PREFLIGHT_LIVE_READ='$BANK_PREFLIGHT_LIVE_READ' bash -se" <<'REMOTE'
          set -euo pipefail
          stage="$HOME/$STAGE"
          test -d "$stage" && test ! -L "$stage"
          cd "$stage"
          sha256sum -c EXPECTED_SHA256
          printf '%s\n' "$SOURCE_SHA" > SOURCE_SHA
          while read -r hash file; do case "$file" in *.php) php -l "$file";; *.sh) bash -n "$file";; esac; done < EXPECTED_SHA256
          for file in tests/OfficeFinanceBankPanelTest.php tests/OfficeFinanceBankViewTest.php tests/OfficeMoneybirdBankApiClientTest.php tests/OfficeMoneybirdBankSnapshotTest.php; do php "$file"; done
          if php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'; then
            php tests/OfficeFinanceBankAccessTest.php
          else
            echo 'BANK_ACL_SQLITE_TEST_SKIPPED_ON_TARGET_RUN_IN_CI'
          fi
          echo "BANK_STAGE_OK_NO_ACTIVE_RELEASE_CHANGED"
          php -d display_errors=0 deployment/hostinger/office-moneybird-bank-preflight.php
          bash deployment/hostinger/office-moneybird-bank-plan.sh
          REMOTE

  cloudflare-access-read:
    if: ${{ inputs.confirmation == 'STAGE-OFFICE-BANK' && inputs.check_cloudflare_access }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only diagnostic
        run: node --test integration-api/scripts/cloudflare-access-check.test.mjs
      - name: Read Cloudflare token status and Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node integration-api/scripts/cloudflare-access-check.mjs

  bank-version-read:
    needs: stage
    if: ${{ inputs.confirmation == 'STAGE-OFFICE-BANK' && inputs.check_worker_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: brebo-integration-api-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: integration-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integration-api/package-lock.json
      - name: Validate exact source and acceptance checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          npm ci
          npm run check
          node --test scripts/bank-version-acceptance.test.mjs
      - name: Record current active Worker deployment
        id: baseline
        run: npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/bank-active-before.json"
      - name: Upload version without deploying production traffic
        id: plan
        run: |
          set -euo pipefail
          if ! npx --no-install wrangler versions upload --keep-vars \
            --var MONEYBIRD_BANK_READ_ENABLED:enabled \
            --tag bank-read-1636 --message "Read-only bank acceptance $GITHUB_SHA" \
            > "$RUNNER_TEMP/bank-version-upload.log" 2>&1; then
            node scripts/bank-version-acceptance.mjs upload-error "$RUNNER_TEMP/bank-version-upload.log"
            echo '::error::Worker version upload failed; no production deploy command was invoked.'
            exit 1
          fi
          node scripts/bank-version-acceptance.mjs prepare-zero-plan "$RUNNER_TEMP/bank-active-before.json" "$RUNNER_TEMP/bank-version-upload.log" "$RUNNER_TEMP/bank-zero-plan.json"
      - name: Temporarily add test version at exactly zero percent traffic
        run: |
          set -euo pipefail
          baseline_version="$(node scripts/bank-version-acceptance.mjs baseline-version "$RUNNER_TEMP/bank-zero-plan.json")"
          candidate_version="$(node scripts/bank-version-acceptance.mjs candidate-version "$RUNNER_TEMP/bank-zero-plan.json")"
          version_available=0
          for attempt in 1 2 3 4 5; do
            if npx --no-install wrangler versions view "$candidate_version" --json > "$RUNNER_TEMP/bank-candidate-metadata.json" 2> "$RUNNER_TEMP/bank-candidate-read-error.log"; then
              version_available=1
              break
            fi
            sleep 2
          done
          if [ "$version_available" != 1 ]; then
            node scripts/bank-version-acceptance.mjs upload-error "$RUNNER_TEMP/bank-candidate-read-error.log"
            echo '::error::Uploaded version is not readable after bounded metadata checks; no traffic change attempted.'
            exit 1
          fi
          echo 'BANK_CANDIDATE_METADATA_READABLE=1'
          npx --no-install wrangler versions deploy "$baseline_version@100%" "$candidate_version@0%" --yes --message "Temporary bank GET acceptance; existing traffic stays at 100 percent"
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/bank-zero-current.json"
          node scripts/bank-version-acceptance.mjs verify-zero "$RUNNER_TEMP/bank-zero-current.json" "$RUNNER_TEMP/bank-zero-plan.json"
      - name: Verify bank-only response with signed GET
        env:
          BREBO_SHARED_SECRET: ${{ secrets.BREBO_SHARED_SECRET }}
        run: node scripts/bank-version-acceptance.mjs check-zero "$RUNNER_TEMP/bank-zero-plan.json"
      - name: Restore baseline traffic even when bank acceptance fails
        if: ${{ always() && steps.plan.outcome == 'success' }}
        run: |
          set -euo pipefail
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/bank-before-restore.json"
          state="$(node scripts/bank-version-acceptance.mjs traffic-state "$RUNNER_TEMP/bank-before-restore.json" "$RUNNER_TEMP/bank-zero-plan.json")"
          if [ "$state" = 'zero-test' ]; then
            baseline_version="$(node scripts/bank-version-acceptance.mjs baseline-version "$RUNNER_TEMP/bank-zero-plan.json")"
            npx --no-install wrangler versions deploy "$baseline_version@100%" --yes --message "Restore baseline after read-only bank acceptance"
          fi
          npx --no-install wrangler deployments list --json > "$RUNNER_TEMP/bank-active-restored.json"
          node scripts/bank-version-acceptance.mjs verify-restored "$RUNNER_TEMP/bank-active-restored.json" "$RUNNER_TEMP/bank-zero-plan.json"

