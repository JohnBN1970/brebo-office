name: Stage Moneybird bank components for Office-test
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type STAGE-OFFICE-BANK
        required: true
        type: string
permissions:
  contents: read
jobs:
  sales-preflight:
    if: ${{ inputs.confirmation == 'CHECK-OFFICE-SALES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check source and existing access without mutation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          php -l office-independent/deployment/hostinger/office-sales-preflight.php
          php office-independent/tests/OfficeSalesServiceTest.php
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/sales_preflight_key
          chmod 600 ~/.ssh/sales_preflight_key
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/sales_preflight_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'php' < office-independent/deployment/hostinger/office-sales-preflight.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect active Worker and existing Moneybird access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BREBO_SHARED_SECRET: ${{ secrets.BREBO_SHARED_SECRET }}
        run: node integration-api/scripts/sales-activation-preflight.mjs
      - name: Remove local SSH key
        if: always()
        run: rm -f ~/.ssh/sales_preflight_key
  stage:
    if: ${{ inputs.confirmation == 'STAGE-OFFICE-BANK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: develop
      - name: Verify isolated Office code
        run: |
          set -euo pipefail
          php -l office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php
          php -l office-independent/src/Finance/OfficeFinanceBankPanel.php
          php -l office-independent/src/Finance/OfficeMoneybirdBankApiClient.php
          php -l office-independent/src/Finance/OfficeFinanceView.php
          php -l office-independent/public/office-finance.php
          php office-independent/tests/OfficeFinanceBankPanelTest.php
          php office-independent/tests/OfficeMoneybirdBankApiClientTest.php
      - name: Set up SSH
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/office_bank_stage_key
          chmod 600 ~/.ssh/office_bank_stage_key
      - name: Stage to private non-active directory
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          stage="office-bank-staging-$GITHUB_RUN_ID"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -p "$DEPLOY_PORT" "$remote" "install -d -m 700 ~/$stage/Finance ~/$stage/public"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            office-independent/src/Finance/OfficeMoneybirdBankSnapshot.php \
            office-independent/src/Finance/OfficeFinanceBankPanel.php \
            office-independent/src/Finance/OfficeMoneybirdBankApiClient.php \
            office-independent/src/Finance/OfficeFinanceView.php "$remote:$stage/Finance/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -P "$DEPLOY_PORT" \
            office-independent/public/office-finance.php "$remote:$stage/public/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/office_bank_stage_key -p "$DEPLOY_PORT" "$remote" "STAGE='$stage' bash -se" <<'REMOTE'
          set -euo pipefail
          stage="$HOME/$STAGE"
          test -d "$stage" && test ! -L "$stage"
          for file in "$stage"/Finance/*.php "$stage"/public/*.php; do php -l "$file"; done
          echo "BANK_STAGE_SHA256_BEGIN"
          sha256sum "$stage"/Finance/*.php "$stage"/public/*.php
          echo "BANK_STAGE_SHA256_END"
          echo "BANK_STAGE_OK_NO_ACTIVE_RELEASE_CHANGED"
          REMOTE
