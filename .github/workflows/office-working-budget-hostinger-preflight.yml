name: Office working budget Hostinger preflight
on:
  workflow_dispatch:
    inputs:
      confirm_test_only:
        description: Type OFFICE-TEST to run read-only checks
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mount scripts and project syntax
        run: |
          set -euo pipefail
          python3 -m py_compile office-independent/deployment/hostinger/audit-working-budget-test-mount.py office-independent/deployment/hostinger/mount-working-budget-panel.py
          python3 office-independent/deployment/hostinger/test-working-budget-mount.py
          php -l office-independent/public/office-project.php
  audit:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_test_only == 'OFFICE-TEST' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect active Office-test release without writes
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o ConnectionAttempts=2 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/brebobv.nl"
          base="$root/office_calc_test/release-office-test-contractform-20261030/private"
          target="$base/public/office-project.php"
          test -f "$target" && test ! -L "$target" || { echo "WORK_BUDGET_ACTIVE_PROJECT_MISSING"; exit 20; }
          test -f "$root/public_html/office-test/index.php" || { echo "WORK_BUDGET_TEST_ROUTER_MISSING"; exit 21; }
          anchors_ok=true
          if grep -Fq 'OfficeNativeProjectAccess($db))->canRead' "$target"; then
            echo WORK_BUDGET_ACTIVE_PROJECT_ACL=OK
          else
            echo WORK_BUDGET_ACTIVE_PROJECT_ACL=MISSING
            anchors_ok=false
          fi
          if grep -Fq 'is_array($financeContracts)' "$target"; then
            echo WORK_BUDGET_ACTIVE_FINANCE_GUARD=OK
          else
            echo WORK_BUDGET_ACTIVE_FINANCE_GUARD=MISSING
            anchors_ok=false
          fi
          if grep -Fq '// Read-only Office procurement commitments: independent of invoicing and bank transactions.' "$target"; then
            echo WORK_BUDGET_ACTIVE_PROCUREMENT_ANCHOR=OK
          else
            echo WORK_BUDGET_ACTIVE_FINANCE_ANCHOR=MISSING
            anchors_ok=false
          fi
          # Safe structural diagnostics: emit marker counts only, never source lines.
          for marker in 'financialSectionHtml' 'financeHtml' 'OfficeProjectFinanceOverview' 'ProjectBudgetPanel' 'OFFICE_TEST_WORK_BUDGET_PANEL_ENABLED' 'Read-only Office procurement commitments' 'Office locked work budget KPI unavailable' 'Office procurement commitment unexpected failure' 'The overview only uses verified project and building data' 'Financial dossier: explicit Finance ACL'; do
            count="$(grep -Fc "$marker" "$target" || true)"
            printf 'WORK_BUDGET_MARKER_%s=%s\n' "$marker" "$count"
          done
          if test "$anchors_ok" != true; then
            echo WORK_BUDGET_ACTIVE_ANCHOR_MISSING
            echo WORK_BUDGET_DEPLOY_BLOCKED_DIFFERENT_RELEASE_LAYOUT
            exit 22
          fi
          printf 'WORK_BUDGET_ACTIVE_SHA256='
          sha256sum "$target" | cut -d ' ' -f 1
          if grep -Fq 'OFFICE_TEST_WORK_BUDGET_PANEL_ENABLED' "$target"; then
            echo WORK_BUDGET_PANEL_PRESENT
          else
            echo WORK_BUDGET_PANEL_NOT_MOUNTED
          fi
          for name in LockedBaselineLines WorkingBudgetKpiProjection ProjectBudgetReadModel ProjectBudgetPanel OnSiteLaborEvidence; do
            if test -f "$base/src/WorkingBudget/$name.php"; then
              echo "WORK_BUDGET_DEPENDENCY_PRESENT=$name"
            else
              echo "WORK_BUDGET_DEPENDENCY_MISSING=$name"
            fi
          done
          # Diagnose the separately merged project tab without changing server state.
          if grep -Fq "'werkbegroting' => 'Werkbegroting'" "$target"; then
            echo WORK_BUDGET_PROJECT_TAB=PRESENT
          else
            echo WORK_BUDGET_PROJECT_TAB=MISSING
          fi
          if grep -Fq "activeTab === 'werkbegroting'" "$target"; then
            echo WORK_BUDGET_TAB_RENDER=PRESENT
          else
            echo WORK_BUDGET_TAB_RENDER=MISSING
          fi
          config="$root/office_calc_test/config/config.php"
          if test -f "$config" && test ! -L "$config"; then
            OFFICE_WORK_BUDGET_CONFIG="$config" php -r '
              $c = require getenv("OFFICE_WORK_BUDGET_CONFIG");
              if (!is_array($c)) { echo "WORK_BUDGET_CONFIG=INVALID\\n"; exit(1); }
              foreach (["OFFICE_TEST_WORK_BUDGET_PANEL_ENABLED", "OFFICE_TEST_MATERIAL_PROCUREMENT_PANEL_ENABLED", "OFFICE_TEST_WORK_BUDGET_KPIS_ENABLED"] as $key) {
                echo $key . "=" . (($c[$key] ?? "") === "enabled" ? "ENABLED" : "DISABLED") . "\\n";
              }
            '
          else
            echo WORK_BUDGET_CONFIG=UNAVAILABLE
          fi
          echo WORK_BUDGET_PREFLIGHT_READ_ONLY_OK
          REMOTE
