name: Deploy Finance presentation mode to Office-test
on:
  push:
    paths:
      - '.github/workflows/office-finance-presentation-stage.yml'
      - 'office-independent/public/office-finance.php'
      - 'office-independent/src/Finance/OfficeFinancePresentationView.php'
      - 'office-independent/tests/OfficeFinancePresentationViewTest.php'
      - 'office-independent/tests/OfficeFinancePresentationRoutingTest.php'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-FINANCE-PRESENTATION-TEST
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-office-bank-integration-contract-20261103
      - name: Validate PHP and presentation safety
        run: |
          set -euo pipefail
          php -l office-independent/public/office-finance.php
          php -l office-independent/src/Finance/OfficeFinancePresentationView.php
          php office-independent/tests/OfficeFinancePresentationViewTest.php
          php office-independent/tests/OfficeFinancePresentationRoutingTest.php
  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY-FINANCE-PRESENTATION-TEST' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-office-bank-integration-contract-20261103
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Stage files without changing active release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER"
          remote="$USER@$HOST"
          stage="finance-presentation-staging-${GITHUB_RUN_ID}"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$remote" "install -d -m 700 ~/$stage"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -P "$PORT" office-independent/public/office-finance.php "$remote:$stage/office-finance.php"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -P "$PORT" office-independent/src/Finance/OfficeFinancePresentationView.php "$remote:$stage/OfficeFinancePresentationView.php"
      - name: Preflight only - do not overwrite active Finance
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "RUN_ID='$GITHUB_RUN_ID' bash -se" <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test/release-office-test-contractform-20261030/private"
          stage="$HOME/finance-presentation-staging-$RUN_ID"
          test -d "$base/public" && test -d "$base/src/Finance" || { echo ACTIVE_TEST_RELEASE_MISSING; exit 20; }
          test -f "$base/public/office-finance.php" && test ! -L "$base/public/office-finance.php" || { echo FINANCE_ENTRY_UNSAFE; exit 21; }
          test -f "$stage/office-finance.php" && test -f "$stage/OfficeFinancePresentationView.php"
          php -l "$stage/office-finance.php"
          php -l "$stage/OfficeFinancePresentationView.php"
          if ! cmp -s "$stage/office-finance.php" "$base/public/office-finance.php"; then
            echo FINANCE_ENTRY_DIFFERS_FROM_BRANCH
            echo REVIEW_AND_EXPLICIT_INSTALL_REQUIRED
          fi
          echo PRESENTATION_STAGE_PREFLIGHT_OK_NO_ACTIVE_FILES_CHANGED
          echo PRESENTATION_FLAG_NOT_ACTIVATED
          REMOTE
