name: BREBO Zoho pilot safety audit

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/zoho-pilot-safety-audit.yml'
      - '.github/workflows/zoho-migration-pilot.yml'
      - 'web/modules/custom/brebo_mail_intake/brebo_mail_intake.module'

permissions:
  contents: read

concurrency:
  group: brebo-zoho-pilot-safety-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Disable backfill and audit exact newest-10 pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to obtain SSH host key."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Stop migration state and audit Zoho UIDs against Office
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          runtime="$HOME/.brebo-mail-runtime.php"
          remote_php="/opt/alt/php83/usr/bin/php"
          [[ -d "$app" && ! -L "$app" ]] || { echo "::error::Canonical BREBO Office app missing: $app"; exit 1; }
          [[ -f "$runtime" ]] || { echo "BREBO_RUNTIME_FILE=MISSING"; exit 2; }
          [[ -x "$remote_php" ]] || { echo "::error::Required PHP 8.3 binary missing: $remote_php"; exit 1; }
          cd "$app"

          "$remote_php" -d auto_prepend_file="$runtime" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl php:eval '
            $state = \Drupal::state();
            $state->set("brebo_mail_intake.zoho_migration_enabled", FALSE);
            echo "ZOHO_MIGRATION_STATE_ENABLED=NO" . PHP_EOL;
            echo "ZOHO_NEWEST_FIRST_CURSOR=" . (int) $state->get("brebo_mail_intake.zoho_migration_before_uid", 0) . PHP_EOL;

            $host = trim((string) getenv("BREBO_ZOHO_IMAP_HOST"));
            $user = trim((string) getenv("BREBO_ZOHO_IMAP_USER"));
            $password = (string) getenv("BREBO_ZOHO_IMAP_PASSWORD");
            $port = max(1, (int) (getenv("BREBO_ZOHO_IMAP_PORT") ?: 993));
            $folder = trim((string) (getenv("BREBO_ZOHO_IMAP_FOLDER") ?: "INBOX"));
            $flags = trim((string) (getenv("BREBO_ZOHO_IMAP_FLAGS") ?: "/imap/ssl"));
            if ($host === "" || $user === "" || $password === "") {
              throw new \RuntimeException("Zoho IMAP runtimeconfiguratie ontbreekt.");
            }

            $mailbox = sprintf("{%s:%d%s}%s", $host, $port, $flags, $folder);
            $stream = @imap_open($mailbox, $user, $password, OP_READONLY);
            if ($stream === FALSE) {
              throw new \RuntimeException("Zoho INBOX kon niet read-only worden geopend.");
            }

            try {
              $uids = array_values(array_map("intval", imap_search($stream, "ALL", SE_UID) ?: []));
              $uids = array_values(array_filter($uids, static fn(int $uid): bool => $uid > 0 && $uid <= 22132));
              rsort($uids, SORT_NUMERIC);
              $uids = array_slice($uids, 0, 10);
              echo "AUDIT_UID_COUNT=" . count($uids) . PHP_EOL;
              if (count($uids) !== 10) {
                throw new \RuntimeException("Exact 10 pilot-UIDs konden niet worden gereconstrueerd.");
              }

              $storage = \Drupal::entityTypeManager()->getStorage("node");
              $found = 0;
              $missing = 0;
              foreach ($uids as $uid) {
                $overviewRows = imap_fetch_overview($stream, (string) $uid, FT_UID);
                $overview = $overviewRows[0] ?? NULL;
                $messageId = $overview && isset($overview->message_id) ? trim((string) $overview->message_id) : "";
                $sourceId = $messageId !== ""
                  ? "message-id:" . $messageId
                  : sprintf("zoho_migration:%s:%s:%d", $user, $folder, $uid);
                $subject = $overview && isset($overview->subject) ? (string) $overview->subject : "(zonder onderwerp)";
                $decoded = @iconv_mime_decode($subject, ICONV_MIME_DECODE_CONTINUE_ON_ERROR, "UTF-8");
                if (is_string($decoded) && $decoded !== "") $subject = $decoded;
                $date = $overview && isset($overview->date) ? (string) $overview->date : "";
                $timestamp = $date !== "" ? strtotime($date) : FALSE;
                $received = $timestamp !== FALSE ? gmdate("Y-m-d\\TH:i:s\\Z", $timestamp) : "UNKNOWN";

                $ids = $storage->getQuery()
                  ->accessCheck(FALSE)
                  ->condition("type", "brebo_communication")
                  ->condition("field_brebo_source_id", $sourceId)
                  ->range(0, 1)
                  ->execute();
                $nid = $ids ? (int) reset($ids) : 0;
                if ($nid > 0) $found++; else $missing++;
                $safeSubject = preg_replace("/[^\\pL\\pN .,:;_+()@&\\-]/u", "?", $subject);
                echo implode("|", [
                  "UID=" . $uid,
                  "RECEIVED=" . $received,
                  "OFFICE=" . ($nid > 0 ? "FOUND" : "MISSING"),
                  "NODE=" . ($nid > 0 ? $nid : "NONE"),
                  "SUBJECT=" . mb_substr((string) $safeSubject, 0, 120),
                ]) . PHP_EOL;
              }
              echo "AUDIT_FOUND=" . $found . PHP_EOL;
              echo "AUDIT_MISSING=" . $missing . PHP_EOL;
              echo "ZOHO_PILOT_AUDIT=" . ($missing === 0 ? "PASS" : "FAIL") . PHP_EOL;
              if ($missing > 0) {
                throw new \RuntimeException("Niet alle pilotmails zijn aantoonbaar in Office aanwezig; backfill blijft uit.");
              }
            }
            finally {
              imap_close($stream);
            }
          '
          REMOTE
