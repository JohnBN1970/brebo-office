name: Office-test project budget read-only runtime audit
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/office-project-budget-runtime-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only Office-test schema and flag audit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            BASE=/home/u213420663/domains/brebobv.nl/office_calc_test
            PHP=/opt/alt/php83/usr/bin/php
            CONFIG="$BASE/config/config.php"
            test -f "$CONFIG"
            echo BUDGET_AUDIT_START
            "$PHP" -r '$c=require $argv[1]; if (!is_array($c) || ($c["OFFICE_BASE_PATH"]??"")!=="/office-test") {echo "BUDGET_CONFIG_SCOPE=INVALID\\n";exit(3);} $root=$c["OFFICE_PRIVATE_ROOT"]??""; $base=dirname($argv[1],2); if (!is_string($root) || !str_starts_with($root,$base."/release-") || !str_ends_with($root,"/private")) {echo "BUDGET_RELEASE_SCOPE=INVALID\\n";exit(4);} $file=$root."/public/office-project.php";echo "BUDGET_CONTROLLER_PATCH=".(is_file($file)&&str_contains((string)file_get_contents($file),"OFFICE_TEST_WORK_BUDGET_KPIS_ENABLED")?"PRESENT":"MISSING")."\\n";echo "BUDGET_KPI_FLAG=".(($c["OFFICE_TEST_WORK_BUDGET_KPIS_ENABLED"]??"")==="enabled"?"ENABLED":"DISABLED")."\\n";' "$CONFIG"
            echo BUDGET_AUDIT_CONFIG_OK
            "$PHP" -r '$c=require $argv[1]; $get=static function($k)use($c){$v=getenv($k);return is_string($v)&&$v!==""?$v:($c[$k]??"");}; $dsn=$get("OFFICE_INTAKE_PDO_DSN");if(!is_string($dsn)||!str_starts_with($dsn,"mysql:")){echo "BUDGET_SCHEMA=UNKNOWN_DSN\\n";exit(5);}try{$db=new PDO($dsn,$get("OFFICE_INTAKE_DB_USER"),$get("OFFICE_INTAKE_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$expected=["office_calc_crm_acceptance_transfers","office_calc_work_budget_baselines","office_calc_work_budget_lines"];$q=$db->query("SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN (\x27office_calc_crm_acceptance_transfers\x27,\x27office_calc_work_budget_baselines\x27,\x27office_calc_work_budget_lines\x27)");$found=$q->fetchAll(PDO::FETCH_COLUMN);sort($found);sort($expected);echo "BUDGET_SCHEMA=".($found===$expected?"THREE_TABLES_PRESENT":"PARTIAL_OR_MISSING_".count($found))."\\n";if($found===$expected){$q=$db->query("SELECT COUNT(*) FROM office_calc_work_budget_baselines WHERE locked_at IS NOT NULL");echo "BUDGET_LOCKED_BASELINE_COUNT=".(int)$q->fetchColumn()."\\n";}}catch(Throwable $e){echo "BUDGET_DATABASE_AUDIT_FAILED=".get_class($e)."\\n";exit(6);}' "$CONFIG"
