name: Add Finance Documents navigation without changing Finance logic
on:
  push:
    branches:
      - feature/office-inspection-foundation-20261103
    paths:
      - '.github/workflows/office-finance-documents-safe-link.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Insert documents link only after authorized Finance render
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$base/config/config.php")"
          case "$active" in "$base"/release-*/private) ;; *) exit 20;; esac
          target="$active/public/office-finance.php"
          test -f "$target" && test ! -L "$target" || exit 21
          php -l "$target" >/dev/null
          if grep -Fq 'BREBO_FINANCE_DOCUMENTS_LINK_20261106' "$target"; then echo FINANCE_DOCUMENTS_ALREADY_PRESENT; exit 0; fi
          candidate="$(mktemp "$active/public/.finance-docs-XXXXXXXX.php")"
          trap 'rm -f "$candidate"' EXIT
          export DOC_TARGET="$target" DOC_CANDIDATE="$candidate"
          python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['DOC_TARGET']).read_text()
          anchor="echo $html;"
          if src.count(anchor)!=1 or "OfficeFinanceView::render" not in src: raise SystemExit("FAIL_FINANCE_ANCHOR")
          addition="""// BREBO_FINANCE_DOCUMENTS_LINK_20261106: display only after existing Finance authorization.
          if (is_string($html) && str_contains($html, '</main>')) {
            $documentsLink = '<p class="office-finance-documents-link"><a href="/office-test/documenten">Documenten openen</a></p>';
            $html = str_replace('</main>', $documentsLink . '</main>', $html);
          }
          """
          out=src.replace(anchor,addition+anchor,1)
          if out.replace(addition,'',1)!=src: raise SystemExit("FAIL_PRESERVATION")
          Path(os.environ['DOC_CANDIDATE']).write_text(out)
          PY
          php -l "$candidate" >/dev/null || exit 22
          backup="$target.backup-documents-link-$(date +%Y%m%d%H%M%S)"
          cp -p "$target" "$backup"
          chmod --reference="$target" "$candidate"
          mv "$candidate" "$target"
          echo FINANCE_DOCUMENTS_LINK_DEPLOYED
          echo "BACKUP=$(basename "$backup")"
          REMOTE
