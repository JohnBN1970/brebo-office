name: Deploy Office-test inspection project and reports integration
on:
  push:
    branches:
      - feature/office-inspection-foundation-20261103
      - develop
    paths:
      - 'office-independent/src/Inspection/**'
      - 'office-independent/public/office-inspection*.php'
      - 'office-independent/src/Intake/OfficeNavigation.php'
      - 'office-independent/tests/OfficeProjectDocumentMenuContractTest.php'
      - '.github/workflows/office-inspection-integration-deploy.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-INSPECTION-INTEGRATION
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: office-test-inspection-integration
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY-INSPECTION-INTEGRATION' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
      - name: Verify canonical navigation
        run: |
          set -euo pipefail
          php -l office-independent/src/Intake/OfficeNavigation.php
          php -l office-independent/public/office-project.php
          php office-independent/tests/OfficeNavigationV2Test.php
      - name: Checkout inspection feature
        uses: actions/checkout@v4
        with:
          ref: feature/office-inspection-foundation-20261103
          path: inspection-source
          persist-credentials: false
      - name: Validate inspection source
        run: |
          set -euo pipefail
          for f in inspection-source/office-independent/public/office-inspection.php inspection-source/office-independent/public/office-inspection-create.php inspection-source/office-independent/public/office-inspection-overview.php inspection-source/office-independent/src/Inspection/OfficeInspectionCreateAction.php inspection-source/office-independent/src/Inspection/OfficeInspectionRepository.php inspection-source/office-independent/src/Inspection/OfficeInspectionEvidenceRepository.php inspection-source/office-independent/src/Inspection/OfficeInspectionOverviewRepository.php inspection-source/office-independent/src/Inspection/OfficeInspectionReportPrintView.php; do php -l "$f"; done
          php inspection-source/office-independent/tests/OfficeInspectionEvidenceReportContractTest.php
          php -l inspection-source/office-independent/public/office-documents.php
          php -l inspection-source/office-independent/src/Documents/OfficeDocumentTypes.php
          php -l inspection-source/office-independent/src/Documents/OfficeNewDocumentMenu.php
          php inspection-source/office-independent/tests/OfficeNewDocumentMenuTest.php
          php inspection-source/office-independent/tests/OfficeProjectDocumentMenuContractTest.php
          php -l inspection-source/office-independent/public/office-project.php
          php -l inspection-source/office-independent/src/Intake/OfficeNavigation.php
          php -l inspection-source/office-independent/src/Inspection/OfficeInspectionEvidenceUploadAction.php
          php inspection-source/office-independent/tests/OfficeInspectionEvidenceUploadContractTest.php
          php -l inspection-source/office-independent/src/Inspection/OfficeInspectionEvidenceReadAction.php
          php -l inspection-source/office-independent/public/office-inspection-evidence-view.php
          php inspection-source/office-independent/tests/OfficeInspectionEvidenceReadContractTest.php
          php -l inspection-source/office-independent/public/office-inspection-evidence-upload.php
          grep -Fq 'INNER JOIN office_buildings b ON b.id=pb.building_id' inspection-source/office-independent/src/Inspection/OfficeInspectionCreateAction.php
          if grep -Fq 'b.active=1' inspection-source/office-independent/src/Inspection/OfficeInspectionCreateAction.php; then echo 'FAIL INVALID_BUILDING_COLUMN'; exit 2; fi
          grep -Fq 'forOperator(' inspection-source/office-independent/src/Inspection/OfficeInspectionOverviewRepository.php
          grep -Fq 'projectFilter' inspection-source/office-independent/public/office-inspection.php
          grep -Fq 'OfficeInspectionReportPrintView.php' inspection-source/office-independent/public/office-inspection-overview.php
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Stage and deploy selected files only
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p deploy-payload/public deploy-payload/src/Inspection deploy-payload/src/Intake deploy-payload/src/Documents
          cp inspection-source/office-independent/src/Intake/OfficeNavigation.php deploy-payload/src/Intake/
          cp inspection-source/office-independent/src/Documents/OfficeDocumentTypes.php deploy-payload/src/Documents/
          cp inspection-source/office-independent/src/Documents/OfficeNewDocumentMenu.php deploy-payload/src/Documents/
          cp inspection-source/office-independent/public/office-documents.php deploy-payload/public/
          cp inspection-source/office-independent/public/office-inspection.php deploy-payload/public/
          cp inspection-source/office-independent/public/office-inspection-create.php deploy-payload/public/
          cp inspection-source/office-independent/public/office-inspection-overview.php deploy-payload/public/
          cp inspection-source/office-independent/public/office-inspection-evidence-upload.php deploy-payload/public/
          cp inspection-source/office-independent/src/Inspection/OfficeInspectionEvidenceUploadAction.php deploy-payload/src/Inspection/
          cp inspection-source/office-independent/src/Inspection/OfficeInspectionEvidenceReadAction.php deploy-payload/src/Inspection/
          cp inspection-source/office-independent/public/office-inspection-evidence-view.php deploy-payload/public/
          cp inspection-source/office-independent/src/Inspection/OfficeInspectionCreateAction.php deploy-payload/src/Inspection/
          cp inspection-source/office-independent/src/Inspection/OfficeInspectionRepository.php deploy-payload/src/Inspection/
          cp inspection-source/office-independent/src/Inspection/OfficeInspectionEvidenceRepository.php deploy-payload/src/Inspection/
          cp inspection-source/office-independent/src/Inspection/OfficeInspectionOverviewRepository.php deploy-payload/src/Inspection/
          cp inspection-source/office-independent/src/Inspection/OfficeInspectionReportPrintView.php deploy-payload/src/Inspection/
          tar -C deploy-payload -czf inspection-integration.tar.gz public src
          remote="$USER@$HOST"
          scp -o StrictHostKeyChecking=accept-new -P "$PORT" inspection-integration.tar.gz "$remote:domains/brebobv.nl/office_calc_test/inspection-deploy-stage/inspection-integration.tar.gz"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$remote" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          base="$HOME/domains/brebobv.nl/office_calc_test"
          config="$base/config/config.php"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$config")"
          case "$active" in "$base"/release-*/private) ;; *) echo "FAIL TEST_SCOPE"; exit 2;; esac
          stage="$base/inspection-deploy-stage"
          tmp="$(mktemp -d "$stage/integration.XXXXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "$stage/inspection-integration.tar.gz" -C "$tmp"
          for path in src/Documents/OfficeDocumentTypes.php src/Documents/OfficeNewDocumentMenu.php src/Intake/OfficeNavigation.php public/office-documents.php src/Inspection/OfficeInspectionCreateAction.php src/Inspection/OfficeInspectionRepository.php src/Inspection/OfficeInspectionEvidenceRepository.php src/Inspection/OfficeInspectionEvidenceUploadAction.php src/Inspection/OfficeInspectionEvidenceReadAction.php src/Inspection/OfficeInspectionOverviewRepository.php src/Inspection/OfficeInspectionReportPrintView.php public/office-inspection.php public/office-inspection-create.php public/office-inspection-overview.php public/office-inspection-evidence-upload.php public/office-inspection-evidence-view.php; do
            test -f "$tmp/$path"
            php -l "$tmp/$path" >/dev/null
          done
          CONFIG_PATH="$config" php <<'PHP'
          <?php
          $c=require getenv("CONFIG_PATH");
          if (($c["OFFICE_BASE_PATH"]??"")!=="/office-test") exit(2);
          $db=new PDO($c["OFFICE_INTAKE_PDO_DSN"],$c["OFFICE_INTAKE_DB_USER"],$c["OFFICE_INTAKE_DB_PASSWORD"],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $sql="SELECT i.id,i.building_id,i.project_id,i.title,i.inspection_date,i.status,i.created_at,b.name AS building_name,COUNT(DISTINCT f.id) AS finding_count FROM office_inspections i INNER JOIN office_buildings b ON b.id=i.building_id INNER JOIN office_project_buildings pb ON pb.building_id=i.building_id AND pb.project_id=i.project_id INNER JOIN office_project_memberships m ON m.project_id=pb.project_id INNER JOIN office_operator_accounts a ON a.id=m.operator_id AND a.active=1 LEFT JOIN office_inspection_findings f ON f.inspection_id=i.id WHERE m.operator_id=? AND m.permission IN ('read','manage') GROUP BY i.id,i.building_id,i.project_id,i.title,i.inspection_date,i.status,i.created_at,b.name ORDER BY i.inspection_date DESC,i.id DESC LIMIT 100";
          $q=$db->prepare($sql);$q->execute([0]);
          echo "PASS AUTHORIZED_LIST_QUERY\n";
          $check=$db->query("SHOW TABLES LIKE 'office_inspection_report_configs'");
          if (!$check->fetchColumn()) { echo "FAIL REPORT_CONFIG_TABLE\n"; exit(4); }
          echo "PASS REPORT_CONFIG_TABLE\n";
          $evidence=$db->query("SHOW TABLES LIKE 'office_inspection_evidence'");
          if (!$evidence->fetchColumn()) {echo "FAIL EVIDENCE_TABLE\\n"; exit(5);}
          echo "PASS EVIDENCE_TABLE\\n";
          $create="SELECT 1 FROM office_project_buildings pb INNER JOIN office_project_memberships m ON m.project_id=pb.project_id INNER JOIN office_operator_accounts a ON a.id=m.operator_id AND a.active=1 INNER JOIN office_buildings b ON b.id=pb.building_id WHERE pb.building_id=? AND pb.project_id=? AND m.operator_id=? AND m.permission='manage' LIMIT 1";
          $q=$db->prepare($create);$q->execute([0,0,0]);
          echo "PASS CREATE_AUTH_QUERY\n";
          $upload="SELECT 1 FROM office_inspection_findings f
            INNER JOIN office_inspections i ON i.id=f.inspection_id
            INNER JOIN office_project_buildings pb ON pb.building_id=i.building_id AND pb.project_id=i.project_id
            INNER JOIN office_project_memberships m ON m.project_id=pb.project_id
            INNER JOIN office_operator_accounts a ON a.id=m.operator_id AND a.active=1
            WHERE i.id=? AND f.id=? AND i.status='draft' AND f.status='draft'
            AND m.operator_id=? AND m.permission='manage' LIMIT 1";
          $q=$db->prepare($upload);$q->execute([0,0,0]);
          echo "PASS PHOTO_UPLOAD_AUTH_QUERY\\n";
          $read="SELECT e.storage_key,e.mime_type FROM office_inspection_evidence e
            INNER JOIN office_inspection_findings f ON f.id=e.finding_id
            INNER JOIN office_inspections i ON i.id=f.inspection_id
            INNER JOIN office_project_buildings pb ON pb.project_id=i.project_id AND pb.building_id=i.building_id
            INNER JOIN office_project_memberships m ON m.project_id=pb.project_id
            INNER JOIN office_operator_accounts a ON a.id=m.operator_id AND a.active=1
            WHERE e.id=? AND i.id=? AND m.operator_id=? AND m.permission IN ('read','manage') LIMIT 1";
          $q=$db->prepare($read);$q->execute([0,0,0]);
          echo "PASS PHOTO_READ_AUTH_QUERY\\n";
          PHP
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$stage/integration-backup-$stamp"
          mkdir -p "$backup"
          for path in src/Intake/OfficeNavigation.php public/office-documents.php src/Inspection/OfficeInspectionCreateAction.php src/Inspection/OfficeInspectionRepository.php src/Inspection/OfficeInspectionEvidenceRepository.php src/Inspection/OfficeInspectionEvidenceUploadAction.php src/Inspection/OfficeInspectionEvidenceReadAction.php src/Inspection/OfficeInspectionOverviewRepository.php src/Inspection/OfficeInspectionReportPrintView.php public/office-inspection.php public/office-inspection-create.php public/office-inspection-overview.php public/office-inspection-evidence-upload.php public/office-inspection-evidence-view.php; do
            mkdir -p "$backup/$(dirname "$path")"
            if test -f "$active/$path"; then
              cp -p "$active/$path" "$backup/$path"
            else
              echo "NEW FILE $path (no existing backup)"
            fi
          done
          for path in src/Intake/OfficeNavigation.php public/office-documents.php src/Inspection/OfficeInspectionCreateAction.php src/Inspection/OfficeInspectionRepository.php src/Inspection/OfficeInspectionEvidenceRepository.php src/Inspection/OfficeInspectionEvidenceUploadAction.php src/Inspection/OfficeInspectionEvidenceReadAction.php src/Inspection/OfficeInspectionOverviewRepository.php src/Inspection/OfficeInspectionReportPrintView.php public/office-inspection.php public/office-inspection-create.php public/office-inspection-overview.php public/office-inspection-evidence-upload.php public/office-inspection-evidence-view.php; do
            mkdir -p "$active/$(dirname "$path")"
            install -m 644 "$tmp/$path" "$active/$path"
            php -l "$active/$path" >/dev/null
            echo "PASS FILE $path"
          done
          # Wire only the two new inspection photo routes, preserving existing router entries.
          router="$HOME/domains/brebobv.nl/public_html/office-test/index.php"
          test -f "$router"
          ROUTER_PATH="$router" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["ROUTER_PATH"])
          source=p.read_text()
          routes={
            "/office-test/documenten":"office-documents.php",
            "/office-test/inspectie/foto-uploaden":"office-inspection-evidence-upload.php",
            "/office-test/inspectie/foto":"office-inspection-evidence-view.php",
          }
          missing=[(route,file) for route,file in routes.items() if ("'"+route+"'") not in source]
          if missing:
              needle="$routes = ["
              if source.count(needle)!=1:
                  raise SystemExit("FAIL ROUTER_LAYOUT")
              addition="".join(chr(10)+"    '"+route+"' => '"+file+"'," for route,file in missing)
              new=source.replace(needle,needle+addition,1)
              Path(str(p)+".inspection-photo-backup").write_text(source)
              p.write_text(new)
          PY
          if ! php -l "$router" >/dev/null; then
            if test -f "$router.inspection-photo-backup"; then cp -p "$router.inspection-photo-backup" "$router"; fi
            echo "FAIL PHOTO_ROUTER_RESTORED"; exit 2
          fi
          grep -Fq "'/office-test/inspectie/foto-uploaden'" "$router"
          grep -Fq "'/office-test/inspectie/foto'" "$router"
          grep -Fq "'/office-test/documenten'" "$router"
          echo "PASS INSPECTION_PHOTO_ROUTES"
          # Provision storage under the isolated private release, never the public webroot.
          storage="$active/var/inspection-evidence"
          install -d -m 700 "$active/var" "$storage"
          test -d "$storage"
          test -w "$storage"
          test "$(stat -c '%a' "$storage")" = 700
          echo "PASS PHOTO_STORAGE_DIRECTORY"

          # Extend the existing inspection rewrite allowlist without changing other modules.
          rewrite="$HOME/domains/brebobv.nl/public_html/office-test/.htaccess"
          test -f "$rewrite"
          REWRITE_PATH="$rewrite" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["REWRITE_PATH"])
          source=p.read_text()
          if "foto-uploaden" not in source:
              old="bevinding-opslaan"
              if source.count(old)!=1:
                  raise SystemExit("FAIL INSPECTION_REWRITE_LAYOUT")
              p.with_name(".htaccess.inspection-photo-backup").write_text(source)
              source=source.replace(old,old+"|foto-uploaden|foto",1)
              p.write_text(source)
          PY
          if ! grep -Fq 'documenten' "$rewrite"; then
            REWRITE_PATH="$rewrite" python3 - <<'PYDOC'
          import os
          from pathlib import Path
          p=Path(os.environ['REWRITE_PATH'])
          original=p.read_text()
          if original.count('bevinding-opslaan')!=1:
              raise SystemExit('FAIL DOCUMENTS_REWRITE_LAYOUT')
          p.with_name('.htaccess.documents-backup').write_text(original)
          p.write_text(original.replace('bevinding-opslaan','bevinding-opslaan|documenten',1))
          PYDOC
          fi
          grep -Fq 'documenten' "$rewrite"
          echo "PASS PHOTO_REWRITE_UPDATED"
          # Unauthenticated HTTP smoke tests: no credentials, no database writes.
          # The upload route must reject GET; photo reads must never disclose files anonymously.
          # Distinguish rewrite-layer 404 from the PHP router's own 404.
          rewrite="$HOME/domains/brebobv.nl/public_html/office-test/.htaccess"
          if test -f "$rewrite"; then
            if grep -Eq 'RewriteRule|FallbackResource' "$rewrite"; then echo "INFO REWRITE_RULES_PRESENT"; else echo "INFO REWRITE_RULES_ABSENT"; fi
          else
            echo "INFO HTACCESS_MISSING"
          fi
          if grep -Fq "'/office-test/inspectie/foto-uploaden' => 'office-inspection-evidence-upload.php'" "$router"; then
            echo "PASS PHOTO_ROUTE_TARGET"
          else
            echo "FAIL PHOTO_ROUTE_TARGET"; exit 2
          fi
          existing_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://brebobv.nl/office-test/inspecties")"
          echo "INFO EXISTING_INSPECTIONS_HTTP_$existing_status"
          if grep -Fq 'foto-uploaden' "$rewrite"; then echo "INFO PHOTO_REWRITE_PRESENT"; else echo "INFO PHOTO_REWRITE_ABSENT"; fi
          if grep -Fq 'bevinding-opslaan' "$rewrite"; then echo "INFO FINDING_REWRITE_PRESENT"; else echo "INFO FINDING_REWRITE_ABSENT"; fi
          host="brebobv.nl"
          upload_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$host/office-test/inspectie/foto-uploaden")"
          case "$upload_status" in 405) echo "PASS PHOTO_UPLOAD_METHOD_GUARD";; *) echo "FAIL PHOTO_UPLOAD_HTTP_$upload_status"; exit 2;; esac
          read_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$host/office-test/inspectie/foto?inspection_id=1&evidence_id=1")"
          case "$read_status" in 401|403|404) echo "PASS PHOTO_READ_ANONYMOUS_GUARD";; *) echo "FAIL PHOTO_READ_HTTP_$read_status"; exit 2;; esac
          echo "PASS INSPECTION_PROJECT_REPORTS_INTEGRATION"
          echo "PROJECT_CONTROLLER_PRESERVED"
          echo "BACKUP_NAME=${backup##*/}"
          REMOTE
