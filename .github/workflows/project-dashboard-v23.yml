name: Project dashboard V2.3 acceptance and Office-test deployment
on:
  pull_request:
    paths:
      - 'office-independent/deployment/hostinger/refine-project-dashboard-v23.py'
      - '.github/workflows/project-dashboard-v23.yml'
  workflow_dispatch:
    inputs:
      confirm_test_only:
        description: Type OFFICE-TEST to deploy
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify transformer
        run: |
          python3 -m py_compile office-independent/deployment/hostinger/refine-project-dashboard-v23.py
          python3 - <<'PY'
          from pathlib import Path
          import tempfile,subprocess,sys
          with tempfile.TemporaryDirectory() as d:
              a=Path(d)/'source.php'; b=Path(d)/'out.php'
              a.write_text("""<?php
          // BREBO_DASHBOARD_V2_MERGE
          // BREBO_DASHBOARD_V21_LAYOUT
          $dashboardCss = '';
          $dashboardVisibility = '<style>';
          // create_project_contract create_project_term create_project_change OfficeProjectFinanceOverview
          echo '<!doctype html><body></body></html>';
          """)
              script='office-independent/deployment/hostinger/refine-project-dashboard-v23.py'
              subprocess.run([sys.executable,script,str(a),str(b)],check=True)
              subprocess.run(['php','-l',str(b)],check=True)
              assert 'BREBO_DASHBOARD_V23_SERVER' in b.read_text()
              assert subprocess.run([sys.executable,script,str(b),str(a)],capture_output=True).returncode!=0
          PY
  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_test_only == 'OFFICE-TEST' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Upload patch and deploy to Office-test
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -P "$PORT" office-independent/deployment/hostinger/refine-project-dashboard-v23.py "$USER@$HOST:/tmp/brebo-v23.py"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          # The active release is explicitly pinned; do not select the lexicographically last release.
          file="$base/release-office-test-contractform-20261030/private/public/office-project.php"
          test -f "$file" || { echo "ACTIVE_RELEASE_FILE_MISSING"; exit 20; }
          test ! -L "$file" || { echo "SYMLINK_NOT_ALLOWED"; exit 20; }
          grep -Fq BREBO_DASHBOARD_V21_LAYOUT "$file" || { echo "V21_MARKER_MISSING"; exit 22; }
          for marker in create_project_contract create_project_term create_project_change OfficeProjectFinanceOverview; do
            grep -Fq "$marker" "$file" || { echo "MISSING_REQUIRED_MARKER: $marker"; exit 23; }
          done
          if grep -Fq BREBO_DASHBOARD_V23_SERVER "$file"; then echo ALREADY_V23; exit 0; fi
          backup="$file.backup-v23-$(date +%Y%m%d%H%M%S)"
          cp -p "$file" "$backup"
          candidate="$(mktemp "$(dirname "$file")/.project-v23-XXXXXXXX.php")"
          trap 'rm -f "$candidate"' EXIT
          python3 /tmp/brebo-v23.py "$file" "$candidate"
          php -l "$candidate"
          for marker in create_project_contract create_project_term create_project_change OfficeProjectFinanceOverview; do grep -Fq "$marker" "$candidate"; done
          chmod --reference="$file" "$candidate"
          mv "$candidate" "$file"
          php -l "$file" || { cp -p "$backup" "$file"; exit 21; }
          echo V23_DEPLOYED
          REMOTE
