name: Office Calc accepted labor budget
on:
  pull_request:
    paths:
      - 'office-independent/src/Calculation/OfficeCalcAcceptedLaborBudget.php'
      - 'office-independent/src/Calculation/OfficeCalcProjectLaborTotal.php'
      - 'office-independent/tests/OfficeCalcAcceptedLaborBudgetTest.php'
      - '.github/workflows/office-calc-accepted-labor-budget.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP BCMath
        run: sudo apt-get update && sudo apt-get install -y php-bcmath
      - name: Syntax and immutable labor hours contract
        run: |
          php -l office-independent/src/Calculation/OfficeCalcAcceptedLaborBudget.php
          php -l office-independent/tests/OfficeCalcAcceptedLaborBudgetTest.php
          php office-independent/tests/OfficeCalcAcceptedLaborBudgetTest.php
