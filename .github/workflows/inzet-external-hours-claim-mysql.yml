name: Inzet external hours claim MySQL
on:
  pull_request:
    paths:
      - 'office-independent/src/Inzet/OfficeExternalHoursClaimSchema.php'
      - 'office-independent/src/Inzet/OfficeExternalHoursClaimRepository.php'
      - 'office-independent/tests/OfficeExternalHoursClaimMySqlTest.php'
      - '.github/workflows/inzet-external-hours-claim-mysql.yml'
jobs:
  external-claim-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-only
          MYSQL_DATABASE: office_inzet_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql
      - name: External timesheet import idempotency
        env:
          OFFICE_INZET_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=office_inzet_ci;charset=utf8mb4
          OFFICE_INZET_TEST_USER: root
          OFFICE_INZET_TEST_PASSWORD: test-root-only
        run: |
          php -l office-independent/src/Inzet/OfficeExternalHoursClaimRepository.php
          php office-independent/tests/OfficeExternalHoursClaimMySqlTest.php
