name: Office-test unified Calc schema install
on:
  push:
    branches: [audit/calc-office-test-host-access-20261111]
    paths:
      - '.github/workflows/calc-office-unified-schema-install.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-office-test-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Strict Office-test-only fresh Calc schema installation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.37.34.160
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 65002
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -eu
            test -f /home/u213420663/domains/brebobv.nl/office_calc_test/config/config.php
            php <<'PHP'
            <?php
            declare(strict_types=1);
            $cfg=require '/home/u213420663/domains/brebobv.nl/office_calc_test/config/config.php';
            if (!is_array($cfg)) { echo "CALC_SCHEMA_CONFIG=INVALID\n"; exit(1); }
            $dsn=$cfg['OFFICE_INTAKE_PDO_DSN']??'';
            if (!is_string($dsn)
              || !preg_match('/^mysql:host=(localhost|127\\.0\\.0\\.1);dbname=u213420663_office_test;charset=utf8mb4$/D',$dsn)) {
              echo "CALC_SCHEMA_DB_GUARD=REJECTED\n"; exit(1);
            }
            if (($cfg['OFFICE_INTAKE_DB_USER']??'')!=='u213420663_office_test') {
              echo "CALC_SCHEMA_DB_USER_GUARD=REJECTED\n"; exit(1);
            }
            try {
              $db=new PDO($dsn,$cfg['OFFICE_INTAKE_DB_USER'],$cfg['OFFICE_INTAKE_DB_PASSWORD']??'',[
                PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,
                PDO::ATTR_EMULATE_PREPARES=>false,
                PDO::ATTR_TIMEOUT=>8,
              ]);
              if ($db->query('SELECT DATABASE()')->fetchColumn()!=='u213420663_office_test') {
                echo "CALC_SCHEMA_DATABASE_MISMATCH=YES\n"; exit(1);
              }
              echo "CALC_SCHEMA_TARGET=OFFICE_TEST_VERIFIED\n";
              $tables=['calculations','calculation_versions','calculation_lines','launch_nonces'];
              $check=$db->prepare('SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=?');
              $present=0;
              foreach($tables as $name) {
                $check->execute([$name]);
                $present+=(int)$check->fetchColumn();
              }
              if ($present!==0) {
                echo "CALC_SCHEMA_EXISTING_TABLES=".$present."\n";
                echo "CALC_SCHEMA_INSTALL=REFUSED_TO_PREVENT_OVERWRITE\n";
                exit(1);
              }
              $ddl=[
                "CREATE TABLE calculations (
                  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
                  office_project_id BIGINT UNSIGNED NULL,
                  office_calculation_id BIGINT UNSIGNED NOT NULL,
                  code VARCHAR(64) NOT NULL,
                  title VARCHAR(255) NOT NULL,
                  status ENUM('draft','established','archived') NOT NULL DEFAULT 'draft',
                  created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  updated_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                  PRIMARY KEY (id),
                  UNIQUE KEY uq_calculation_code (code),
                  UNIQUE KEY uq_calculation_office (office_calculation_id),
                  KEY idx_calculation_office_project (office_project_id)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci",
                "CREATE TABLE calculation_versions (
                  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
                  calculation_id BIGINT UNSIGNED NOT NULL,
                  version_no INT UNSIGNED NOT NULL,
                  status ENUM('draft','established') NOT NULL DEFAULT 'draft',
                  direct_cost DECIMAL(19,4) NOT NULL DEFAULT 0,
                  markup_amount DECIMAL(19,4) NOT NULL DEFAULT 0,
                  sales_price DECIMAL(19,4) NOT NULL DEFAULT 0,
                  content_hash CHAR(64) NULL,
                  established_at DATETIME(6) NULL,
                  created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  PRIMARY KEY (id),
                  UNIQUE KEY uq_calculation_version (calculation_id,version_no),
                  CONSTRAINT fk_version_calculation FOREIGN KEY (calculation_id) REFERENCES calculations(id) ON DELETE CASCADE
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci",
                "CREATE TABLE calculation_lines (
                  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
                  version_id BIGINT UNSIGNED NOT NULL,
                  parent_id BIGINT UNSIGNED NULL,
                  sort_order INT NOT NULL DEFAULT 0,
                  line_type ENUM('chapter','paragraph','item','allowance','adjustable','option','note') NOT NULL,
                  code VARCHAR(64) NULL,
                  description VARCHAR(500) NOT NULL,
                  unit VARCHAR(32) NULL,
                  quantity DECIMAL(19,4) NULL,
                  labour_unit_cost DECIMAL(19,4) NOT NULL DEFAULT 0,
                  material_unit_cost DECIMAL(19,4) NOT NULL DEFAULT 0,
                  equipment_unit_cost DECIMAL(19,4) NOT NULL DEFAULT 0,
                  subcontracting_unit_cost DECIMAL(19,4) NOT NULL DEFAULT 0,
                  other_unit_cost DECIMAL(19,4) NOT NULL DEFAULT 0,
                  created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  updated_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                  PRIMARY KEY (id),
                  KEY idx_line_version_sort (version_id,sort_order),
                  KEY idx_line_parent (parent_id),
                  CONSTRAINT fk_line_version FOREIGN KEY (version_id) REFERENCES calculation_versions(id) ON DELETE CASCADE,
                  CONSTRAINT fk_line_parent FOREIGN KEY (parent_id) REFERENCES calculation_lines(id) ON DELETE CASCADE
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci",
                "CREATE TABLE launch_nonces (
                  nonce CHAR(32) NOT NULL,
                  expires_at DATETIME(6) NOT NULL,
                  consumed_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                  PRIMARY KEY (nonce),
                  KEY idx_launch_nonce_expiry (expires_at)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci",
              ];
              foreach ($ddl as $sql) $db->exec($sql);
              foreach ($tables as $name) {
                $check->execute([$name]);
                if ((int)$check->fetchColumn()!==1) throw new RuntimeException('Table not created');
              }
              echo "CALC_SCHEMA_INSTALL=FOUR_TABLES_CREATED\n";
              echo "CALC_EXISTING_OFFICE_RECORDS_CHANGED=NO\n";
              echo "CALC_OLD_CALC_DATABASE_TOUCHED=NO\n";
              echo "CALC_NODE_DEPLOYMENT=NOT_PERFORMED\n";
            } catch (Throwable $e) {
              echo "CALC_SCHEMA_INSTALL=ERROR_CHECK_HOSTINGER_LOGS\n";
              exit(1);
            }
            PHP
