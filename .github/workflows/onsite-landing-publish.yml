name: Publish OnSite landing page
on:
  push:
    branches: ['deploy/onsite-landing-20261024']
    paths: ['deployment/onsite-landing/**', '.github/workflows/onsite-landing-publish.yml']
permissions:
  contents: read
concurrency:
  group: brebo-onsite-landing
  cancel-in-progress: false
jobs:
  protect-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure existing host access
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY; do [[ -n "${!name}" ]]; done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/onsite_key
          chmod 600 ~/.ssh/onsite_key
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i ~/.ssh/onsite_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true
      - name: Close public access and inspect only token schema
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i ~/.ssh/onsite_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$(realpath -e "$HOME/domains/brebobv.nl/public_html")"
          target="$root/onsite"
          [[ -d "$target" && ! -L "$target" && -f "$target/.onsite-landing-managed" ]]
          printf '%s\n' 'Require all denied' > "$target/.htaccess"
          chmod 644 "$target/.htaccess"
          echo 'PUBLIC_ONSITE_ACCESS_CLOSED'
          if [[ -x /opt/alt/php83/usr/bin/php ]]; then php_bin=/opt/alt/php83/usr/bin/php; else php_bin="$(command -v php)"; fi
          "$php_bin" <<'PHP'
          <?php
          $domain = getenv('HOME') . '/domains/brebobv.nl';
          $path = $domain . '/office_calc_test/config/config.php';
          if (!is_file($path)) throw new RuntimeException('Known Office-test config missing');
          $c = require $path;
          foreach (['OFFICE_BASE_PATH','OFFICE_PUBLIC_HOST','OFFICE_ONSITE_ACTIVATION_ENABLED','OFFICE_ONSITE_SCHEMA_VERIFIED'] as $k) echo $k . '=' . ($c[$k] ?? 'missing') . PHP_EOL;
          foreach (array_keys($c) as $k) if (preg_match('/TESTFLIGHT|ONSITE.*INSTALL/i', $k)) echo 'DISTRIBUTION_SETTING=' . $k . PHP_EOL;
          $dsn = $c['OFFICE_INTAKE_PDO_DSN'] ?? '';
          if (!preg_match('/(?:^|;)dbname=u213420663_office_test(?:;|$)/', $dsn)) throw new RuntimeException('Refusing non-test database');
          $db = new PDO($dsn, $c['OFFICE_INTAKE_DB_USER'], $c['OFFICE_INTAKE_DB_PASSWORD'], [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $q = $db->query("SELECT TABLE_NAME,COLUMN_NAME,DATA_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('office_onsite_activation_invitations','office_inzet_people') ORDER BY TABLE_NAME,ORDINAL_POSITION");
          foreach ($q->fetchAll(PDO::FETCH_ASSOC) as $r) echo implode('|',$r) . PHP_EOL;
          PHP
          REMOTE
      - name: Verify unauthenticated requests are denied
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -s -o /dev/null -w '%{http_code}' https://brebobv.nl/onsite/)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' https://brebobv.nl/onsite/OnSite-Android-test.apk)" = 403
