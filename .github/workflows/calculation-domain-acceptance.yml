name: Calculation domain acceptance

on:
  pull_request:
    paths:
      - 'web/modules/custom/brebo_calculation/**'
      - '.github/workflows/calculation-domain-acceptance.yml'
  push:
    branches:
      - develop
    paths:
      - 'web/modules/custom/brebo_calculation/**'
      - '.github/workflows/calculation-domain-acceptance.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Canonical calculation behavior is covered by the executable domain checks below.
      - name: Lint calculation module PHP
        shell: bash
        run: |
          set -euo pipefail
          find web/modules/custom/brebo_calculation -type f \( -name '*.php' -o -name '*.install' -o -name '*.module' \) -print0 \
            | xargs -0 -n1 php -l

      - name: Prove calculation schema invariants
        shell: bash
        run: |
          set -euo pipefail
          install_file='web/modules/custom/brebo_calculation/brebo_calculation.install'
          grep -q "brebo_calculation_structure" "$install_file"
          grep -q "brebo_calculation_version" "$install_file"
          grep -q "brebo_calculation_row_domain" "$install_file"
          grep -q "brebo_calculation_snapshot" "$install_file"
          grep -q "row_id" "$install_file"
          grep -q "contract_quantity" "$install_file"
          grep -q "actual_quantity" "$install_file"
          grep -q "budget_hours" "$install_file"
          grep -q "labour_rate" "$install_file"
          grep -q "calculation_version_node" "$install_file"
          grep -q "calculation_version_snapshot" "$install_file"
          read_model='web/modules/custom/brebo_calculation/src/Infrastructure/DatabaseCalculationLineReadModel.php'
          services='web/modules/custom/brebo_calculation/brebo_calculation.services.yml'
          grep -q "brebo_calculation_row_domain" "$read_model"
          grep -q "DatabaseCalculationLineReadModel" "$services"
          workbench_controller='web/modules/custom/brebo_calculation/src/Controller/CalculationWorkbenchController.php'
          ! grep -q "EntityTypeManagerInterface" "$workbench_controller"
          ! grep -q "field_brebo_contract_quantity" "$workbench_controller"
          workbench_form='web/modules/custom/brebo_calculation/src/Form/CalculationWorkbenchForm.php'
          block_order='web/modules/custom/brebo_calculation/src/Service/CalculationBlockOrderManager.php'
          block_order_js='web/modules/custom/brebo_calculation/js/calculation-block-order.js'
          grep -q "data-row-id" "$workbench_form"
          ! grep -q "data-line-id" "$workbench_form"
          grep -q "row_id" "$block_order"
          grep -q "dataset.rowId" "$block_order_js"
          row_manager='web/modules/custom/brebo_calculation/src/Service/CalculationRowManager.php'
          grep -q "'calc_line_id' => NULL" "$row_manager"
          grep -q "createLegacyMirror" "$row_manager"
          grep -q "'calc_line_id'.*'not null' => FALSE" "$install_file"
          price_manager='web/modules/custom/brebo_calculation/src/Service/CalculationPriceSourceManager.php'
          price_form='web/modules/custom/brebo_calculation/src/Form/CalculationPriceSourceForm.php'
          routing='web/modules/custom/brebo_calculation/brebo_calculation.routing.yml'
          grep -q "'row_id' => \$rowId" "$price_manager"
          grep -q "condition('row_id', \$rowId)" "$price_manager"
          grep -q "getValue('row_id')" "$price_form"
          grep -q "workbench/row/{row}/price-sources" "$routing"
          line_read_model='web/modules/custom/brebo_calculation/src/Infrastructure/DatabaseCalculationLineReadModel.php'
          result_service='web/modules/custom/brebo_calculation/src/Service/CalculationResultService.php'
          readiness='web/modules/custom/brebo_calculation/src/Service/CalculationReadinessInspector.php'
          establisher='web/modules/custom/brebo_calculation/src/Service/CalculationVersionEstablisher.php'
          grep -q "condition('row_id', \$rowIds, 'IN')" "$line_read_model"
          ! grep -q "condition('calc_line_id'" "$line_read_model"
          grep -q "'id' => \$rowId" "$result_service"
          grep -q "'reference' => (int) (\$row\['row_id'\]" "$readiness"
          grep -q "'row_id' => \$rowId" "$establisher"

      - name: Prove calculation creation-to-workbench flow
        shell: bash
        run: |
          set -euo pipefail
          module='web/modules/custom/brebo_calculation/brebo_calculation.module'
          services='web/modules/custom/brebo_calculation/brebo_calculation.services.yml'
          routing='web/modules/custom/brebo_calculation/brebo_calculation.routing.yml'
          workbench='web/modules/custom/brebo_calculation/src/Form/CalculationWorkbenchForm.php'
          initializer='web/modules/custom/brebo_calculation/src/Service/CalculationDraftInitializer.php'
          libraries='web/modules/custom/brebo_calculation/brebo_calculation.libraries.yml'
          create_js='web/modules/custom/brebo_calculation/js/calculation-create.js'
          onboarding_css='web/modules/custom/brebo_calculation/css/calculation-onboarding.css'
          grep -q "brebo_calculation_form_node_form_alter" "$module"
          grep -q "brebo_calculation_node_insert" "$module"
          grep -q "Opslaan en calculatiewerkbank openen" "$module"
          grep -q "brebo_calculation.draft_initializer" "$services"
          grep -q "brebo_calculation_version" "$initializer"
          grep -q "brebo_calculation.workbench" "$routing"
          grep -q "Deelcalculaties" "$workbench"
          grep -q "calculation-onboarding.css" "$libraries"
          grep -q "calculation-create.js" "$libraries"
          grep -q "field_brebo_calc_version" "$create_js"
          grep -q "layout-region-node-secondary" "$create_js"
          grep -q "field--name-field-brebo-calc-status" "$onboarding_css"
          grep -q "filter-wrapper" "$onboarding_css"

      - name: Prove domain model invariants
        shell: bash
        run: |
          set -euo pipefail
          rule='web/modules/custom/brebo_calculation/src/Domain/RuleType.php'
          row='web/modules/custom/brebo_calculation/src/Domain/CalculationRow.php'
          tree='web/modules/custom/brebo_calculation/src/Domain/CalculationTree.php'
          params='web/modules/custom/brebo_calculation/src/Domain/CalculationParameters.php'
          version='web/modules/custom/brebo_calculation/src/Domain/CalculationVersion.php'
          grep -q "case Normal" "$rule"
          grep -q "case Allowance" "$rule"
          grep -q "case Option" "$rule"
          grep -q "case Note" "$rule"
          grep -q "case Distributed" "$rule"
          grep -q "case Adjustable" "$rule"
          grep -q "Only leaf paragraphs may contain calculation rows" "$tree"
          grep -q "effectiveQuantity" "$row"
          grep -q "commercialMethod" "$params"
          grep -q "Locked calculation versions require establishment audit data" "$version"

      - name: Prove recipe engine invariants
        shell: bash
        run: |
          set -euo pipefail
          install_file='web/modules/custom/brebo_calculation/brebo_calculation.install'
          services='web/modules/custom/brebo_calculation/brebo_calculation.services.yml'
          manager='web/modules/custom/brebo_calculation/src/Service/RecipeManager.php'
          evaluator='web/modules/custom/brebo_calculation/src/Service/RecipeFormulaEvaluator.php'
          grep -q "brebo_calculation_recipe_version" "$install_file"
          grep -q "brebo_calculation_recipe_instance_line" "$install_file"
          grep -q "snapshot_payload" "$install_file"
          grep -q "snapshot_hash" "$install_file"
          grep -q "brebo_calculation.recipe_manager" "$services"
          grep -q "brebo_calculation.recipe_formula_evaluator" "$services"
          grep -q "status', 'published'" "$manager"
          grep -q "Only unlocked draft calculation versions may be changed" "$manager"
          grep -q "is_custom', 0" "$manager"
          grep -q "is_custom' => 1" "$manager"
          grep -q "Division by zero in recipe formula" "$evaluator"
          php web/modules/custom/brebo_calculation/tests/recipe_formula_smoke.php
          php web/modules/custom/brebo_calculation/tests/kozijn_price_engine_smoke.php
          php web/modules/custom/brebo_calculation/tests/kozijn_commercial_price_smoke.php

      - name: Prove migration guardrails
        shell: bash
        run: |
          set -euo pipefail
          migrator='web/modules/custom/brebo_calculation/src/Service/GuardedLegacyMigrator.php'
          audit='web/modules/custom/brebo_calculation/src/Controller/MigrationAuditController.php'
          confirm='web/modules/custom/brebo_calculation/src/Form/MigrationConfirmForm.php'
          routing='web/modules/custom/brebo_calculation/brebo_calculation.routing.yml'
          permissions='web/modules/custom/brebo_calculation/brebo_calculation.permissions.yml'
          grep -q "isSafeToMigrate" "$migrator"
          grep -q "target migration version already exists" "$migrator"
          grep -q "startTransaction" "$migrator"
          grep -q "assertWritten" "$migrator"
          grep -q "Omzetten naar nieuwe calculatie" "$confirm"
          grep -q "migration_overview" "$routing"
          grep -q "migration_confirm" "$routing"
          grep -q "migrate brebo calculation" "$permissions"
          grep -q "max-age.*0" "$audit"

      - name: Prove calculation financial invariants
        shell: bash
        run: |
          set -euo pipefail
          totalizer='web/modules/custom/brebo_calculation/src/Service/CalculationTotalizer.php'
          commercial='web/modules/custom/brebo_calculation/src/Service/CommercialCalculator.php'
          distribution='web/modules/custom/brebo_calculation/src/Service/DistributionCalculator.php'
          grep -q "RuleType::Option" "$totalizer"
          grep -q "RuleType::Note => NULL" "$totalizer"
          grep -q "single_margin" "$commercial"
          grep -q "tail_costs" web/modules/custom/brebo_calculation/src/Domain/CalculationParameters.php
          grep -q "sourceAmount - \$allocated" "$distribution"
          grep -q "Only distributed rows can be allocated" "$distribution"
