name: BREBO Finance Moneybird Supplier Identity Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Moneybird supplier identities against CRM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Run read-only CRM identity diagnosis
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1 TERM=dumb
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          remote_php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$remote_php" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo "=== BREBO Finance Moneybird supplier identity preflight ==="
          "${drush[@]}" status --fields=bootstrap,db-status,drupal-version
          "$remote_php" -l web/modules/custom/brebo_finance/src/Service/MoneybirdSupplierIdentityDiagnosis.php

          echo "=== Read-only CRM identity dry run ==="
          "${drush[@]}" php:eval '
            $invoices = \Drupal::service("brebo_finance.purchase_invoice_integration_client")->fetchAll();
            $diagnosis = new \Drupal\brebo_finance\Service\MoneybirdSupplierIdentityDiagnosis(\Drupal::service("entity_type.manager"));
            $result = $diagnosis->diagnose($invoices);
            foreach (["supplier_count", "by_moneybird_id_count", "strong_match_count", "possible_match_count", "new_count", "conflict_count"] as $key) {
              print strtoupper($key) . "=" . (int) ($result[$key] ?? 0) . "\n";
            }
            foreach (["by_moneybird_id", "strong_match", "possible_match", "new", "conflict"] as $group) {
              print "--- " . strtoupper($group) . " ---\n";
              foreach (($result[$group] ?? []) as $item) {
                print json_encode($item, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n";
              }
            }
            print "MONEYBIRD_SUPPLIER_IDENTITY_DIAGNOSIS=PASS\n";
          '
          REMOTE
