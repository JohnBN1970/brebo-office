name: BREBO Intake Document Runtime Preflight

on:
  workflow_run:
    workflows:
      - 'Deploy BREBO Office Production'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-intake-document-runtime-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Verify document extraction runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1 TERM=dumb

          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          webroot="$app/web"
          remote_php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$remote_php" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo '=== BREBO intake document runtime preflight ==='
          marker="$app/.brebo-deployed-sha"
          [[ -f "$marker" ]] || { echo 'DEPLOYMENT_MARKER_MISSING=1'; exit 19; }
          deployed_sha="$(tr -d '\r\n' < "$marker")"
          echo "PRODUCTION_DEPLOY_SHA=$deployed_sha"
          if [[ -n "$EXPECTED_DEPLOY_SHA" && "$deployed_sha" != "$EXPECTED_DEPLOY_SHA" ]]; then
            echo 'SUPERSEDED_DEPLOYMENT=1'
            echo "EXPECTED_DEPLOY_SHA=$EXPECTED_DEPLOY_SHA"
            echo 'A newer production release superseded this workflow run; refusing to report PASS for the older release.'
            exit 0
          fi
          echo 'DEPLOYMENT_IDENTITY_OK=1'

          [[ -x "$remote_php" ]] || { echo 'PHP83_MISSING=1'; exit 20; }
          [[ -f web/modules/custom/brebo_data_intake/src/Service/ManagedDocumentTextExtractionProvider.php ]] || { echo 'MANAGED_EXTRACTION_PROVIDER_DEPLOYED=0'; exit 21; }
          [[ -f web/modules/custom/brebo_data_intake/src/Service/ManagedDocumentTextEnricher.php ]] || { echo 'MANAGED_EXTRACTION_ENRICHER_DEPLOYED=0'; exit 22; }
          [[ -f web/modules/custom/brebo_data_intake/src/Service/LocalPdfTextEnricher.php ]] || { echo 'LOCAL_PDF_ENRICHER_DEPLOYED=0'; exit 23; }
          [[ -f web/modules/custom/brebo_data_intake/src/Service/LocalOcrTextEnricher.php ]] || { echo 'LOCAL_OCR_ENRICHER_DEPLOYED=0'; exit 24; }
          echo 'MANAGED_EXTRACTION_PROVIDER_DEPLOYED=1'
          echo 'MANAGED_EXTRACTION_ENRICHER_DEPLOYED=1'
          echo 'LOCAL_PDF_ENRICHER_DEPLOYED=1'
          echo 'LOCAL_OCR_ENRICHER_DEPLOYED=1'

          echo '=== Managed extraction configuration and Drupal service wiring ==='
          "${drush[@]}" php:eval '
            $c = \Drupal::getContainer();
            $required = [
              "brebo_data_intake.managed_document_text_extraction_provider",
              "brebo_data_intake.managed_document_text_enricher",
              "brebo_data_intake.local_pdf_text_enricher",
              "brebo_data_intake.local_ocr_text_enricher",
              "brebo_data_intake.purchase_invoice_text_enricher",
            ];
            foreach ($required as $id) {
              $ok = $c->has($id);
              echo strtoupper(str_replace(["brebo_data_intake.", "."], ["", "_"], $id)) . "=" . ($ok ? "1" : "0") . "\n";
              if (!$ok) {
                exit(34);
              }
            }
            $provider = $c->get("brebo_data_intake.managed_document_text_extraction_provider");
            $pdf = $provider->supports("application/pdf");
            $png = $provider->supports("image/png");
            echo "MANAGED_EXTRACTION_PDF_CONFIGURED=" . ($pdf ? "1" : "0") . "\n";
            echo "MANAGED_EXTRACTION_PNG_CONFIGURED=" . ($png ? "1" : "0") . "\n";
            if (!$pdf || !$png) {
              fwrite(STDERR, "Managed document extraction is not runtime-configured for production intake.\n");
              exit(36);
            }
          '

          echo '=== Optional local fallback discovery in production PHP-FPM ==='
          probe=''
          probe_name=''
          probe_ready=0
          if probe_suffix="$(od -An -N12 -tx1 /dev/urandom 2>/dev/null | tr -d ' \n')" && [[ -n "$probe_suffix" ]]; then
            probe_name="brebo-runtime-probe-${probe_suffix}.php"
            probe="$webroot/$probe_name"
            trap '[[ -z "$probe" ]] || rm -f "$probe" >/dev/null 2>&1 || true' EXIT
            if cat > "$probe" <<'PHP'
          <?php
          declare(strict_types=1);
          require dirname(__DIR__) . '/vendor/autoload.php';
          use Symfony\Component\Process\ExecutableFinder;
          use Symfony\Component\Process\Process;

          header('Content-Type: application/json');
          $finder = new ExecutableFinder();
          $paths = [];
          foreach (['pdftotext', 'pdftoppm', 'tesseract'] as $binary) {
            $paths[$binary] = $finder->find($binary);
          }
          $languages = [];
          $tesseract = $paths['tesseract'] ?? NULL;
          if (is_string($tesseract) && $tesseract !== '') {
            try {
              $process = new Process([$tesseract, '--list-langs']);
              $process->setTimeout(5.0);
              $process->run();
              if ($process->isSuccessful()) {
                foreach (preg_split('/\R/u', $process->getOutput()) ?: [] as $line) {
                  $line = trim($line);
                  if ($line !== '' && !str_starts_with(strtolower($line), 'list of available')) {
                    $languages[] = $line;
                  }
                }
              }
            }
            catch (Throwable) {
              // Optional diagnostic only; never fail managed-extraction acceptance.
            }
          }
          echo json_encode(['paths' => $paths, 'languages' => array_values(array_unique($languages))], JSON_THROW_ON_ERROR);
          PHP
            then
              if chmod 644 "$probe" 2>/dev/null; then
                probe_ready=1
              else
                echo 'OPTIONAL_LOCAL_FALLBACK_PROBE_CHMOD_FAILED=1'
                rm -f "$probe" >/dev/null 2>&1 || true
              fi
            else
              echo 'OPTIONAL_LOCAL_FALLBACK_PROBE_CREATE_FAILED=1'
              rm -f "$probe" >/dev/null 2>&1 || true
            fi
          else
            echo 'OPTIONAL_LOCAL_FALLBACK_PROBE_NAME_FAILED=1'
          fi

          if [[ "$probe_ready" == '1' ]]; then
            response=''
            if response="$(curl --fail --silent --show-error --max-time 20 "https://sboffice.brebobv.nl/$probe_name" 2>/dev/null)"; then
              printf '%s\n' "$response"
              if ! printf '%s' "$response" | "$remote_php" -r '
                try {
                  $data = json_decode(stream_get_contents(STDIN), true, flags: JSON_THROW_ON_ERROR);
                  foreach (["pdftotext", "pdftoppm", "tesseract"] as $binary) {
                    $path = $data["paths"][$binary] ?? null;
                    $available = is_string($path) && $path !== "";
                    echo strtoupper($binary) . "_FPM_AVAILABLE=" . ($available ? "1" : "0") . "\n";
                    if ($available) {
                      echo strtoupper($binary) . "_FPM_PATH=" . $path . "\n";
                    }
                  }
                  $languages = array_values(array_filter($data["languages"] ?? [], "is_string"));
                  echo "TESSERACT_NLD_AVAILABLE=" . (in_array("nld", $languages, true) ? "1" : "0") . "\n";
                  echo "TESSERACT_ENG_AVAILABLE=" . (in_array("eng", $languages, true) ? "1" : "0") . "\n";
                }
                catch (Throwable) {
                  fwrite(STDERR, "OPTIONAL_LOCAL_FALLBACK_DIAGNOSTIC_PARSE_FAILED=1\n");
                  exit(1);
                }
              '; then
                echo 'OPTIONAL_LOCAL_FALLBACK_DIAGNOSTIC_PARSE_FAILED=1'
              fi
            else
              echo 'OPTIONAL_LOCAL_FALLBACK_DIAGNOSTIC_UNAVAILABLE=1'
            fi
          else
            echo 'OPTIONAL_LOCAL_FALLBACK_DIAGNOSTIC_SKIPPED=1'
          fi
          echo 'LOCAL_DOCUMENT_EXTRACTION_FALLBACK_OPTIONAL=1'
          [[ -z "$probe" ]] || rm -f "$probe" >/dev/null 2>&1 || true
          trap - EXIT

          [[ -f "$marker" ]] || { echo 'DEPLOYMENT_MARKER_LOST_DURING_PREFLIGHT=1'; exit 35; }
          final_sha="$(tr -d '\r\n' < "$marker")"
          if [[ "$final_sha" != "$deployed_sha" ]]; then
            echo "DEPLOYMENT_CHANGED_DURING_PREFLIGHT=$final_sha"
            echo 'A production deployment overlapped the preflight; refusing to report PASS.'
            exit 0
          fi
          echo 'DEPLOYMENT_IDENTITY_REVALIDATED=1'
          echo 'INTAKE_DOCUMENT_RUNTIME_PREFLIGHT=PASS'
          REMOTE
