name: BREBO Intake Document Runtime Preflight

on:
  workflow_run:
    workflows:
      - 'Deploy BREBO Office Production'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brebo-intake-document-runtime-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'true'

      - name: Verify document extraction runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_DEPLOY_SHA='$EXPECTED_DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          export NO_COLOR=1 TERM=dumb

          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          remote_php="/opt/alt/php83/usr/bin/php"
          cd "$app"
          drush=("$remote_php" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi)

          echo '=== BREBO intake document runtime preflight ==='
          marker="$app/.brebo-deployed-sha"
          [[ -f "$marker" ]] || { echo 'DEPLOYMENT_MARKER_MISSING=1'; exit 19; }
          deployed_sha="$(tr -d '\r\n' < "$marker")"
          echo "PRODUCTION_DEPLOY_SHA=$deployed_sha"
          if [[ -n "$EXPECTED_DEPLOY_SHA" && "$deployed_sha" != "$EXPECTED_DEPLOY_SHA" ]]; then
            echo 'SUPERSEDED_DEPLOYMENT=1'
            echo "EXPECTED_DEPLOY_SHA=$EXPECTED_DEPLOY_SHA"
            echo 'A newer production release superseded this workflow run; refusing to report PASS for the older release.'
            exit 0
          fi
          echo 'DEPLOYMENT_IDENTITY_OK=1'

          [[ -x "$remote_php" ]] || { echo 'PHP83_MISSING=1'; exit 20; }
          [[ -f web/modules/custom/brebo_data_intake/src/Service/LocalPdfTextEnricher.php ]] || { echo 'LOCAL_PDF_ENRICHER_DEPLOYED=0'; exit 21; }
          [[ -f web/modules/custom/brebo_data_intake/src/Service/LocalOcrTextEnricher.php ]] || { echo 'LOCAL_OCR_ENRICHER_DEPLOYED=0'; exit 22; }
          echo 'LOCAL_PDF_ENRICHER_DEPLOYED=1'
          echo 'LOCAL_OCR_ENRICHER_DEPLOYED=1'

          echo '=== Drupal/PHP executable discovery ==='
          discovery="$("${drush[@]}" php:eval '$finder=new \Symfony\Component\Process\ExecutableFinder(); foreach (["pdftotext","pdftoppm","tesseract"] as $bin) { $path=$finder->find($bin); echo strtoupper($bin) . "_PHP_PATH=" . ($path ?? "") . "\n"; }')"
          printf '%s\n' "$discovery"
          pdftotext_path="$(printf '%s\n' "$discovery" | sed -n 's/^PDFTOTEXT_PHP_PATH=//p' | tail -n 1)"
          pdftoppm_path="$(printf '%s\n' "$discovery" | sed -n 's/^PDFTOPPM_PHP_PATH=//p' | tail -n 1)"
          tesseract_path="$(printf '%s\n' "$discovery" | sed -n 's/^TESSERACT_PHP_PATH=//p' | tail -n 1)"
          [[ -n "$pdftotext_path" && -x "$pdftotext_path" ]] || { echo 'PDFTOTEXT_PHP_AVAILABLE=0'; exit 30; }
          [[ -n "$tesseract_path" && -x "$tesseract_path" ]] || { echo 'TESSERACT_PHP_AVAILABLE=0'; exit 31; }
          [[ -n "$pdftoppm_path" && -x "$pdftoppm_path" ]] || { echo 'PDFTOPPM_PHP_AVAILABLE=0'; exit 32; }
          echo 'PDFTOTEXT_PHP_AVAILABLE=1'
          echo 'PDFTOPPM_PHP_AVAILABLE=1'
          echo 'TESSERACT_PHP_AVAILABLE=1'

          echo '=== Tesseract languages ==='
          langs=$("$tesseract_path" --list-langs 2>/dev/null || true)
          printf '%s\n' "$langs"
          if printf '%s\n' "$langs" | grep -qx nld; then
            echo 'TESSERACT_NLD_AVAILABLE=1'
          else
            echo 'TESSERACT_NLD_AVAILABLE=0'
          fi
          if printf '%s\n' "$langs" | grep -qx eng; then
            echo 'TESSERACT_ENG_AVAILABLE=1'
          else
            echo 'TESSERACT_ENG_AVAILABLE=0'
          fi
          if ! printf '%s\n' "$langs" | grep -Eq '^(nld|eng)$'; then
            echo 'No supported Dutch or English Tesseract language pack is installed.'
            exit 33
          fi

          echo '=== Drupal service wiring ==='
          "${drush[@]}" php:eval '$c=\Drupal::getContainer(); foreach (["brebo_data_intake.local_pdf_text_enricher","brebo_data_intake.local_ocr_text_enricher","brebo_data_intake.purchase_invoice_text_enricher"] as $id) { echo strtoupper(str_replace(["brebo_data_intake.","."],["","_"],$id)) . "=" . ($c->has($id) ? "1" : "0") . "\n"; if (!$c->has($id)) { exit(34); } }'

          echo 'INTAKE_DOCUMENT_RUNTIME_PREFLIGHT=PASS'
          REMOTE
