name: Office-test guarded work budget KPI mount
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/office-project-budget-kpis-test-mount.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-test-project-budget-kpis
  cancel-in-progress: false
jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate patch and PHP
        run: |
          set -euo pipefail
          python3 -m py_compile office-independent/deployment/hostinger/mount-project-budget-kpis.py
          php -l office-independent/public/office-project.php
          php -l office-independent/src/Governance/OfficeWorkBudgetBaselineReader.php
          php -l office-independent/src/Governance/OfficeWorkBudgetCommitmentComparison.php
          php -l office-independent/src/Project/OfficeProjectBudgetKpiView.php
          php office-independent/tests/OfficeWorkBudgetCommitmentComparisonTest.php
          php office-independent/tests/OfficeProjectBudgetKpiViewTest.php
      - name: Stage isolated files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: office-independent/deployment/hostinger/mount-project-budget-kpis.py,office-independent/public/office-project.php,office-independent/src/Governance/OfficeWorkBudgetBaselineReader.php,office-independent/src/Governance/OfficeWorkBudgetCommitmentComparison.php,office-independent/src/Project/OfficeProjectBudgetKpiView.php
          target: /home/u213420663/domains/brebobv.nl/office_calc_test/.project-budget-stage
          overwrite: true
      - name: Guarded test install with rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            BASE=/home/u213420663/domains/brebobv.nl/office_calc_test
            PHP=/opt/alt/php83/usr/bin/php
            STAGE="$BASE/.project-budget-stage/office-independent"
            CONFIG="$BASE/config/config.php"
            RELEASE=$("$PHP" -r '$c=require $argv[1];if (($c["OFFICE_BASE_PATH"]??"")!=="/office-test" || ($c["OFFICE_NATIVE_PROJECTS_ENABLED"]??"")!=="enabled")exit(3);echo $c["OFFICE_PRIVATE_ROOT"]??"";' "$CONFIG")
            case "$RELEASE" in "$BASE"/release-*/private) ;; *) echo PROJECT_BUDGET_SCOPE_DENIED; exit 2;; esac
            TARGET="$RELEASE/public/office-project.php"
            test -f "$TARGET"
            test ! -L "$TARGET"
            grep -Fq 'OfficeProcurementOrderSource' "$TARGET"
            grep -Fq 'OfficeProjectDetailV3View' "$TARGET"
            echo PROJECT_BUDGET_ACTIVE_ANCHOR_DIAGNOSTICS
            for MARKER in 'Read-only Office procurement commitments:' 'OfficeProcurementOrderSource' 'awardedProjectCommitment' 'Verplichtingen zijn geen geboekte kosten' 'financialSectionHtml' 'moduleHtml' 'OFFICE_TEST_WORK_BUDGET_KPIS_ENABLED'; do
              COUNT=$(grep -Fc "$MARKER" "$TARGET" || true)
              echo "MARKER_COUNT=$COUNT MARKER=$MARKER"
            done
            for FILE in OfficeWorkBudgetBaselineReader.php OfficeWorkBudgetCommitmentComparison.php; do
              "$PHP" -l "$STAGE/src/Governance/$FILE"
            done
            "$PHP" -l "$STAGE/src/Project/OfficeProjectBudgetKpiView.php"
            BACKUP="$TARGET.before-budget-kpis-$(date -u +%Y%m%d%H%M%S)"
            cp -p "$TARGET" "$BACKUP"
            chmod 600 "$BACKUP"
            for FILE in OfficeWorkBudgetBaselineReader.php OfficeWorkBudgetCommitmentComparison.php; do
              cp "$STAGE/src/Governance/$FILE" "$RELEASE/src/Governance/$FILE"
            done
            cp "$STAGE/src/Project/OfficeProjectBudgetKpiView.php" "$RELEASE/src/Project/OfficeProjectBudgetKpiView.php"
            python3 "$STAGE/deployment/hostinger/mount-project-budget-kpis.py" "$TARGET" "$STAGE/public/office-project.php" || { cp -p "$BACKUP" "$TARGET"; exit 1; }
            "$PHP" -l "$TARGET" || { cp -p "$BACKUP" "$TARGET"; exit 1; }
            grep -Fq 'OFFICE_TEST_WORK_BUDGET_KPIS_ENABLED' "$TARGET"
            echo PROJECT_BUDGET_KPIS_INSTALLED_FLAG_GATED
