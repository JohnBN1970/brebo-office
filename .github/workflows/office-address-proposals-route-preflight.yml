name: Office address proposals route preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure read-only SSH access
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Inspect Office-test routing and schema without mutation
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          root="$HOME/domains/brebobv.nl/office_calc_test"
          site="$HOME/domains/brebobv.nl/public_html/office-test"
          router="$site/index.php"
          htaccess="$site/.htaccess"
          active="$(php -r '$c=require $argv[1]; echo $c["OFFICE_PRIVATE_ROOT"] ?? "";' "$root/config/config.php")"
          case "$active" in "$root"/release-*/private) ;; *) echo ABORT_INVALID_RELEASE; exit 20;; esac
          for path in "$router" "$htaccess"; do test -f "$path" && test ! -L "$path" || exit 21; done
          php -l "$router"
          grep -nF "'/office-test/documenten' =>" "$router" || true
          grep -nF "'/office-test/documenten/adresvoorstellen' =>" "$router" || true
          grep -nE 'RewriteRule \^documenten' "$htaccess" || true
          for file in office-documents.php office-document-address-proposals.php; do
            if test -f "$active/public/$file"; then echo "PRESENT:$file"; php -l "$active/public/$file"; else echo "MISSING:$file"; fi
          done
          php -r '$c=require $argv[1]; if (($c["OFFICE_BASE_PATH"]??"")!=="/office-test") exit(2); echo "OFFICE_TEST_CONFIG_OK\n";' "$root/config/config.php"
          echo READ_ONLY_ROUTER_PREFLIGHT_DONE
          REMOTE
