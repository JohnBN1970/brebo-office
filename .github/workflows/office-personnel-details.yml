name: Office personnel details

on:
  pull_request:
    paths:
      - 'office-independent/src/Inzet/OfficePersonnelDetailsSchema.php'
      - 'office-independent/src/Inzet/OfficePersonnelDetailsRepository.php'
      - 'office-independent/src/Inzet/OfficePersonnelDetailsAction.php'
      - 'office-independent/src/Inzet/OfficePersonnelStatusAction.php'
      - 'office-independent/src/Inzet/OfficePersonnelCreateAction.php'
      - 'office-independent/src/Inzet/OfficePersonnelDetailsReadForm.php'
      - 'office-independent/public/office-personnel-details-save.php'
      - 'office-independent/public/office-personnel.php'
      - 'office-independent/tests/OfficePersonnelDetailsContractTest.php'
      - 'office-independent/tests/OfficePersonnelDetailsActionTest.php'
      - 'office-independent/tests/OfficePersonnelDetailsReadFormTest.php'
      - 'office-independent/tests/OfficePersonnelPageIntegrationContractTest.php'
      - 'office-independent/tests/OfficePersonnelDetailsMySqlRoundTripTest.php'
      - '.github/workflows/office-personnel-details.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personnel-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l office-independent/src/Inzet/OfficePersonnelDetailsSchema.php
          php -l office-independent/src/Inzet/OfficePersonnelDetailsRepository.php
          php -l office-independent/src/Inzet/OfficePersonnelDetailsAction.php
          php -l office-independent/src/Inzet/OfficePersonnelStatusAction.php
          php -l office-independent/src/Inzet/OfficePersonnelCreateAction.php
          php -l office-independent/src/Inzet/OfficePersonnelDetailsReadForm.php
          php -l office-independent/public/office-personnel-details-save.php
          php -l office-independent/public/office-personnel.php
          php -l office-independent/tests/OfficePersonnelDetailsContractTest.php
          php -l office-independent/tests/OfficePersonnelDetailsActionTest.php
          php -l office-independent/tests/OfficePersonnelDetailsReadFormTest.php
          php -l office-independent/tests/OfficePersonnelPageIntegrationContractTest.php
      - name: Personnel details storage contract
        run: |
          php office-independent/tests/OfficePersonnelDetailsContractTest.php
          php office-independent/tests/OfficePersonnelDetailsActionTest.php
          php office-independent/tests/OfficePersonnelDetailsReadFormTest.php
          php office-independent/tests/OfficePersonnelPageIntegrationContractTest.php

  personnel-details-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-only
          MYSQL_DATABASE: office_inzet_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Personnel details MySQL round trip
        env:
          OFFICE_INZET_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=office_inzet_ci;charset=utf8mb4
          OFFICE_INZET_TEST_USER: root
          OFFICE_INZET_TEST_PASSWORD: test-root-only
        run: |
          php -l office-independent/tests/OfficePersonnelDetailsMySqlRoundTripTest.php
          php office-independent/tests/OfficePersonnelDetailsMySqlRoundTripTest.php
