name: Inzet labour budget policy contract
on:
  pull_request:
    paths:
      - 'office-independent/src/Inzet/OfficeLabourBudgetDebitPolicy.php'
      - 'office-independent/src/Inzet/OfficeLabourShiftAggregatePolicy.php'
      - 'office-independent/src/Inzet/OfficeLabourShiftAggregatePostingService.php'
      - 'office-independent/src/Inzet/OfficeOnSiteApprovalService.php'
      - 'office-independent/src/Inzet/OfficeOnSiteFourEyesGuard.php'
      - 'office-independent/src/Inzet/OfficeLabourShiftApprovalLinkSchema.php'
      - 'office-independent/src/Inzet/OfficeLabourPlannedShiftResolver.php'
      - 'office-independent/tests/OfficeLabourBudgetDebitPolicyTest.php'
      - 'office-independent/tests/OfficeLabourShiftAggregatePolicyTest.php'
      - 'office-independent/tests/OfficeLabourShiftAggregatePostingContractTest.php'
      - 'office-independent/tests/OfficeOnSiteAggregateGateContractTest.php'
      - 'office-independent/tests/OfficeOnSiteFourEyesGuardTest.php'
      - 'office-independent/tests/OfficeLabourShiftApprovalLinkSchemaTest.php'
      - 'office-independent/tests/OfficeLabourPlannedShiftResolverTest.php'
      - '.github/workflows/inzet-labour-budget-policy-contract.yml'
  push:
    branches: [develop]
    paths:
      - 'office-independent/src/Inzet/OfficeLabourBudgetDebitPolicy.php'
      - 'office-independent/src/Inzet/OfficeLabourShiftAggregatePolicy.php'
      - 'office-independent/src/Inzet/OfficeLabourShiftAggregatePostingService.php'
      - 'office-independent/src/Inzet/OfficeOnSiteApprovalService.php'
      - 'office-independent/src/Inzet/OfficeOnSiteFourEyesGuard.php'
      - 'office-independent/src/Inzet/OfficeLabourShiftApprovalLinkSchema.php'
      - 'office-independent/src/Inzet/OfficeLabourPlannedShiftResolver.php'
      - 'office-independent/tests/OfficeLabourBudgetDebitPolicyTest.php'
      - 'office-independent/tests/OfficeLabourShiftAggregatePolicyTest.php'
      - 'office-independent/tests/OfficeLabourShiftAggregatePostingContractTest.php'
      - 'office-independent/tests/OfficeOnSiteAggregateGateContractTest.php'
      - 'office-independent/tests/OfficeOnSiteFourEyesGuardTest.php'
      - 'office-independent/tests/OfficeLabourShiftApprovalLinkSchemaTest.php'
      - 'office-independent/tests/OfficeLabourPlannedShiftResolverTest.php'
      - '.github/workflows/inzet-labour-budget-policy-contract.yml'
permissions:
  contents: read
jobs:
  verify-labour-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP SQLite for isolated contract tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3
      - name: Verify policy and planned shift contract
        run: |
          set -euo pipefail
          php -l office-independent/src/Inzet/OfficeLabourBudgetDebitPolicy.php
          php -l office-independent/src/Inzet/OfficeLabourShiftAggregatePolicy.php
          php -l office-independent/src/Inzet/OfficeLabourShiftAggregatePostingService.php
          php -l office-independent/src/Inzet/OfficeOnSiteApprovalService.php
          php -l office-independent/src/Inzet/OfficeOnSiteFourEyesGuard.php
          php -l office-independent/src/Inzet/OfficeLabourShiftApprovalLinkSchema.php
          php -l office-independent/src/Inzet/OfficeLabourPlannedShiftResolver.php
          php office-independent/tests/OfficeLabourBudgetDebitPolicyTest.php
          php office-independent/tests/OfficeLabourShiftAggregatePolicyTest.php
          php office-independent/tests/OfficeLabourShiftAggregatePostingContractTest.php
          php office-independent/tests/OfficeOnSiteAggregateGateContractTest.php
          php office-independent/tests/OfficeOnSiteFourEyesGuardTest.php
          php office-independent/tests/OfficeLabourShiftApprovalLinkSchemaTest.php
          php office-independent/tests/OfficeLabourPlannedShiftResolverTest.php
