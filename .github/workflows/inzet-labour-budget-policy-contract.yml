permissions:
  contents: read
jobs:
  verify-labour-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP SQLite for isolated contract tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3
      - name: Verify policy and planned shift contract
        run: |
          set -euo pipefail
          php -l office-independent/deployment/hostinger/check-actual-labour-cost-readiness.php
          php -l office-independent/deployment/hostinger/install-actual-labour-cost-schema.php
          php -l office-independent/src/Inzet/OfficeActualLabourCostProjectReader.php
          php -l office-independent/src/Inzet/OfficeApprovedLabourCostSchema.php
          php -l office-independent/src/Inzet/OfficeApprovedLabourCostPostingService.php
          php -l office-independent/src/Inzet/OfficeApprovedLabourFinancialHandoffPolicy.php
          php -l office-independent/src/Inzet/OfficeApprovedLabourCostPreview.php
          php -l office-independent/src/Inzet/OfficeApprovedLabourValuation.php
          php -l office-independent/src/Inzet/OfficeApprovedLabourRatePolicy.php
          php -l office-independent/src/Inzet/OfficeApprovedLabourCostPolicy.php
          php -l office-independent/src/Inzet/OfficeLabourBudgetDebitPolicy.php
          php -l office-independent/src/Inzet/OfficeLabourShiftAggregatePolicy.php
          php -l office-independent/src/Inzet/OfficeLabourShiftAggregatePostingService.php
          php -l office-independent/src/Inzet/OfficeOnSiteApprovalService.php
          php -l office-independent/src/Inzet/OfficeOnSiteRejectionReasonSchema.php
          php -l office-independent/deployment/hostinger/install-onsite-rejection-reasons-schema.php
          php -l office-independent/public/office-onsite-presence-review.php
          php -l office-independent/src/Inzet/OfficeOnSiteFourEyesGuard.php
          php -l office-independent/src/Inzet/OfficeLabourShiftApprovalLinkSchema.php
          php -l office-independent/src/Inzet/OfficeLabourPlannedShiftResolver.php
          php office-independent/tests/OfficeOnSiteRejectionContractTest.php
          php office-independent/tests/OfficeActualLabourCostProjectReaderContractTest.php
          php office-independent/tests/OfficeApprovedLabourCostPostingContractTest.php
          php office-independent/tests/OfficeApprovedLabourFinancialHandoffPolicyTest.php
          php office-independent/tests/OfficeApprovedLabourCostPreviewTest.php
          php office-independent/tests/OfficeApprovedLabourValuationTest.php
          php office-independent/tests/OfficeApprovedLabourRatePolicyTest.php
          php office-independent/tests/OfficeApprovedLabourCostPolicyTest.php
          php office-independent/tests/OfficeLabourBudgetDebitPolicyTest.php
          php office-independent/tests/OfficeLabourShiftAggregatePolicyTest.php
          php office-independent/tests/OfficeLabourShiftAggregatePostingContractTest.php
          php office-independent/tests/OfficeOnSiteAggregateGateContractTest.php
          php office-independent/tests/OfficeOnSiteFourEyesGuardTest.php
          php office-independent/tests/OfficeLabourShiftApprovalLinkSchemaTest.php
          php office-independent/tests/OfficeLabourPlannedShiftResolverTest.php
