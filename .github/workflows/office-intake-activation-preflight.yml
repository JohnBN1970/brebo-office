name: Office-test intake activation preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only Office-test activation readiness
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 77.37.34.160
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 65002
          script_stop: true
          script: |
            set -eu
            trap 'rc=$?; echo "OFFICE_TEST_PREFLIGHT_FAILED_STEP=${stage:-init}"; exit "$rc"' EXIT
            stage=path_checks
            echo OFFICE_TEST_PREFLIGHT_STAGE=path_checks
            root="$HOME/domains/brebobv.nl/office_calc_test"
            router="$HOME/domains/brebobv.nl/public_html/office-test/index.php"
            active="$root/release-office-test-contractform-20261030/private"
            config="$root/config/config.php"
            php=/opt/alt/php83/usr/bin/php
            "$php" -l "$router" >/dev/null
            "$php" -l "$active/public/office-intake-receive.php" >/dev/null
            stage=config_checks
            echo OFFICE_TEST_PREFLIGHT_CONFIG_COMMAND_START
            echo OFFICE_TEST_PREFLIGHT_STAGE=config_checks
            # First verify PHP CLI execution independently from private config.
            "$php" -r 'fwrite(STDOUT, "OFFICE_TEST_CONFIG_PHP_STARTED\n");' || {
              echo OFFICE_TEST_CONFIG_PHP_CLI_FAILED
              exit 2
            }
            # Use a file test without executing config and never print its contents.
            test -f "$config" || {
              echo OFFICE_TEST_CONFIG_FILE_MISSING
              exit 2
            }
            test -r "$config" || {
              echo OFFICE_TEST_CONFIG_NOT_READABLE
              exit 2
            }
            echo OFFICE_TEST_CONFIG_FILE_READABLE
            # First lint private config; do not output its contents.
            "$php" -l "$config" >/dev/null || {
              echo OFFICE_TEST_CONFIG_SYNTAX_FAILED
              exit 2
            }
            echo OFFICE_TEST_CONFIG_SYNTAX_OK
            # Execute the config and emit boolean classifications only.
            "$php" -r '
              try {
                $c=require $argv[1];
                echo "OFFICE_TEST_CONFIG_REQUIRE_RETURNED\n";
                if (!is_array($c)) {echo "OFFICE_TEST_CONFIG_SHAPE=invalid\n";exit(2);}
                foreach ([
                  "BASE_PATH_MATCH"=>($c["OFFICE_BASE_PATH"]??null)==="/office-test",
                  "DB_USER_MATCH"=>($c["OFFICE_INTAKE_DB_USER"]??null)==="u213420663_office_test",
                  "PRIVATE_ROOT_MATCH"=>($c["OFFICE_PRIVATE_ROOT"]??null)===$argv[2],
                  "WEBSITE_SECRET_PRESENT"=>is_string($c["OFFICE_INTAKE_SECRET_WEBSITE"]??null) && strlen($c["OFFICE_INTAKE_SECRET_WEBSITE"])>=32,
                  "EMAIL_SECRET_PRESENT"=>is_string($c["OFFICE_INTAKE_SECRET_EMAIL"]??null) && strlen($c["OFFICE_INTAKE_SECRET_EMAIL"])>=32,
                  "RECEIVER_ENABLED"=>($c["OFFICE_INTAKE_RECEIVER_ENABLED"]??null)==="enabled"
                ] as $key=>$pass) {
                  echo "OFFICE_TEST_CONFIG_".$key."=".($pass?"yes":"no")."\n";
                }
              } catch (Throwable $e) {
                echo "OFFICE_TEST_CONFIG_READ_EXCEPTION=".get_class($e)."\n";
                exit(2);
              }
            ' "$config" "$active" || {
              echo OFFICE_TEST_CONFIG_LOAD_FAILED
              exit 2
            }
            echo OFFICE_TEST_PREFLIGHT_CONFIG_COMMAND_DONE
            stage=router_checks
            echo OFFICE_TEST_PREFLIGHT_STAGE=router_checks
            grep -Fq '/office-test/api/intake/v1/receive' "$router"
            grep -Fq 'OFFICE_INTAKE_RECEIVER_ENABLED' "$router"
            stage=runtime_checks
            echo OFFICE_TEST_PREFLIGHT_STAGE=runtime_checks
            for rel in public/office-intake-receive.php src/Intake/OfficeIntakeSecureReceiver.php src/Intake/OfficeIntakeSourceAuthenticator.php src/Intake/OfficeIntakeReplayGuard.php src/Intake/OfficeCanonicalIntakeBuildingHandoff.php src/Buildings/OfficeIntakeBuildingResolver.php; do
              test -f "$active/$rel"
              "$php" -l "$active/$rel" >/dev/null
            done
            stage=db_checks
            echo OFFICE_TEST_PREFLIGHT_STAGE=db_checks
            "$php" -r '
              try {
                $c=require $argv[1];
                if (!is_array($c)) {echo "OFFICE_TEST_DATABASE_CHECK=invalid_config\n";exit(2);}
                $needed=["OFFICE_INTAKE_PDO_DSN","OFFICE_INTAKE_DB_USER","OFFICE_INTAKE_DB_PASSWORD"];
                foreach ($needed as $k) {
                  if (!is_string($c[$k]??null) || $c[$k]==="") {
                    echo "OFFICE_TEST_DB_CONFIG_".$k."=missing\n";
                    exit(2);
                  }
                }
                $pdo=new PDO($c["OFFICE_INTAKE_PDO_DSN"],$c["OFFICE_INTAKE_DB_USER"],$c["OFFICE_INTAKE_DB_PASSWORD"],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
                if ($pdo->query("SELECT DATABASE()")->fetchColumn()!=="u213420663_office_test") {echo "OFFICE_TEST_DATABASE_SCOPE=invalid\n";exit(2);}
                echo "OFFICE_TEST_DATABASE_SCOPE=valid\n";
                foreach (["office_intake_requests","office_intake_request_disciplines","office_intake_events","office_intake_signed_nonces","office_buildings"] as $t) {
                  $s=$pdo->prepare("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=?");
                  $s->execute([$t]);
                  if ((int)$s->fetchColumn()!==1) {echo "OFFICE_TEST_TABLE_".strtoupper($t)."=missing\n";exit(2);}
                  echo "OFFICE_TEST_TABLE_".strtoupper($t)."=present\n";
                }
              } catch (Throwable $e) {
                echo "OFFICE_TEST_DATABASE_CHECK=failed_".get_class($e)."\n";
                exit(2);
              }
            ' "$config"
            stage=complete
            trap - EXIT
            echo OFFICE_TEST_INTAKE_ACTIVATION_PREFLIGHT_OK
