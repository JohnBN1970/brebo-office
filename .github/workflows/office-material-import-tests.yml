name: Office material import
on:
  pull_request:
    paths:
      - 'office-independent/src/Materials/**'
      - 'office-independent/tests/Material*'
      - 'office-independent/public/office-materials.php'
      - 'web/modules/custom/brebo_article/src/**'
      - 'office-independent/deployment/hostinger/install-office-materials-test.php'
      - 'office-independent/deployment/hostinger/probe-material-document-contract.php'
      - 'office-independent/deployment/hostinger/sql/material-import-review-ledger.sql'
      - '.github/workflows/office-material-import-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, zip, simplexml, pdo_mysql, pdo_sqlite, curl
      - name: Validate and run material import tests
        run: |
          set -euo pipefail
          for file in office-independent/deployment/hostinger/probe-material-document-contract.php office-independent/deployment/hostinger/install-office-materials-test.php web/modules/custom/brebo_article/src/Infrastructure/ArticleCurrentPriceQuery.php web/modules/custom/brebo_article/src/Controller/ArticleSearchController.php office-independent/public/office-materials.php office-independent/src/Materials/*.php office-independent/tests/MaterialImport*Test.php; do php -l "$file"; done
          for test in office-independent/tests/MaterialImport*Test.php; do if [ "$test" != office-independent/tests/MaterialImportHttpTest.php ]; then php "$test"; fi; done

  http-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: materials-test-only
          MYSQL_DATABASE: office_material_import_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmaterials-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, bcmath, mbstring, curl
      - run: php office-independent/tests/MaterialImportHttpTest.php
        env:
          MATERIAL_TEST_DATABASE: office_material_import_test
          MATERIAL_TEST_PASSWORD: materials-test-only

  install-office-test:
    needs: [verify, http-mysql]
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/office-material-import-20261113'
    runs-on: ubuntu-latest
    concurrency:
      group: office-materials-test-install
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package the bounded native module overlay
        run: |
          set -euo pipefail
          mkdir -p material-package/src/Materials material-package/src/Documents material-package/src/Inzet material-package/public material-package/sql material-package/tests
          cp office-independent/src/Materials/*.php material-package/src/Materials/
          cp office-independent/src/Inzet/OnSiteXlsxCellReader.php material-package/src/Inzet/
          cp office-independent/tests/MaterialImportSourceReaderTest.php material-package/tests/
          for name in OfficeDocumentRegistry OfficePrivateFileStorage OfficeDocumentAccessGate; do cp "office-independent/src/Documents/$name.php" material-package/src/Documents/; done
          cp office-independent/public/office-materials.php material-package/public/
          cp office-independent/deployment/hostinger/sql/material-import-review-ledger.sql material-package/sql/
          cp office-independent/deployment/hostinger/install-office-materials-test.php material-package/install.php
          cp office-independent/deployment/hostinger/probe-material-document-contract.php material-package/probe-documents.php
          tar -czf material-package.tar.gz -C material-package .
      - name: Install and verify the isolated Office-test overlay
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$HOST" && test -n "$PORT" && test -n "$USER"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_material_install
          chmod 600 ~/.ssh/id_material_install
          case "$REVISION" in *[!a-f0-9]*|'') exit 1;; esac
          remote="$USER@$HOST"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_material_install -P "$PORT" material-package.tar.gz "$remote:domains/brebobv.nl/office_calc_test/.material-stage-$REVISION.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_material_install -p "$PORT" "$remote" "bash -se -- '$REVISION'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          base="$HOME/domains/brebobv.nl/office_calc_test"
          stage="$base/.material-stage-$revision"
          mkdir -p "$stage"
          chmod 700 "$stage"
          tar -xzf "$stage.tar.gz" --no-same-owner -C "$stage"
          php -l "$stage/install.php"
          php "$stage/install.php" "$stage"
          rm -f "$stage.tar.gz"
          REMOTE
