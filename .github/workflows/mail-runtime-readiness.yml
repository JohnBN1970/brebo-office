name: BREBO Mail runtime readiness

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/mail-runtime-readiness.yml'
      - 'web/modules/custom/brebo_mail_intake/**'

permissions:
  contents: read

jobs:
  readiness:
    name: Non-secret mail runtime readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              break
            fi
            : > ~/.ssh/known_hosts
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to obtain SSH host key."
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Check Hostinger mailbox runtime through canonical Drupal without exposing secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          app="$HOME/domains/brebobv.nl/public_html/sboffice"
          webroot="$app/web"
          runtime="$HOME/.brebo-mail-runtime.php"
          remote_php="/opt/alt/php83/usr/bin/php"
          [[ -d "$app" && ! -L "$app" ]] || { echo "::error::Canonical production application missing or invalid: $app"; exit 1; }
          [[ -f "$webroot/index.php" ]] || { echo "::error::Canonical Drupal webroot missing: $webroot"; exit 1; }
          [[ -f "$runtime" ]] || { echo "::error::Canonical BREBO Mail runtime file missing: $runtime"; exit 1; }
          [[ -x "$remote_php" ]] || { echo "::error::Required PHP 8.3 binary missing: $remote_php"; exit 1; }
          cd "$app"
          echo "MAIL_RUNTIME_APP_ROOT=$app"
          echo "BREBO_RUNTIME_FILE=PRESENT"
          echo "BREBO_RUNTIME_FILE_MODE=$(stat -c '%a' "$runtime")"
          "$remote_php" -d auto_prepend_file="$runtime" vendor/drush/drush/drush.php --root=web --uri=https://sboffice.brebobv.nl --no-ansi php:eval '
            $required = [
              "BREBO_MAIL_SOURCE",
              "BREBO_MAIL_ADDRESS",
              "BREBO_IMAP_HOST",
              "BREBO_IMAP_PORT",
              "BREBO_IMAP_FLAGS",
              "BREBO_IMAP_USER",
              "BREBO_IMAP_PASSWORD",
              "BREBO_MAIL_INTAKE_UID",
            ];
            $ok = true;
            foreach ($required as $name) {
              $value = getenv($name);
              $set = $value !== false && trim((string) $value) !== "";
              echo $name . "=" . ($set ? "SET" : "MISSING") . PHP_EOL;
              $ok = $ok && $set;
            }

            $imap = function_exists("imap_open");
            echo "PHP_IMAP=" . ($imap ? "AVAILABLE" : "MISSING") . PHP_EOL;
            $ok = $ok && $imap;

            $uid = (int) getenv("BREBO_MAIL_INTAKE_UID");
            $owner = $uid > 0 ? \Drupal::entityTypeManager()->getStorage("user")->load($uid) : null;
            $ownerOk = $owner !== null && $owner->isActive();
            echo "MAIL_INTAKE_OWNER=" . ($ownerOk ? "VALID_ACTIVE_USER" : "INVALID") . PHP_EOL;
            $ok = $ok && $ownerOk;

            $adapter = \Drupal::service("brebo_mail_intake.imap_source");
            $sourceReady = $adapter->isConfigured();
            echo "IMAP_SOURCE_CONFIGURED=" . ($sourceReady ? "YES" : "NO") . PHP_EOL;
            $ok = $ok && $sourceReady;

            echo "IMAP_RUNTIME_READY=" . ($ok ? "YES" : "NO") . PHP_EOL;
            if (!$ok) {
              throw new \RuntimeException("BREBO Mail runtime readiness failed.");
            }
          '
          REMOTE
