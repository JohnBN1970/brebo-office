name: Office-test Offertestudio installation
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type INSTALL-OFFERTSTUDIO-OFFICE-TEST to install code and route; blank means preflight only
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/office-offertestudio-20261111
          persist-credentials: false
      - name: Validate quotation code and guarded installer
        run: |
          set -euo pipefail
          php -l office-independent/public/office-quotation-studio.php
          php -l office-independent/src/Quotation/OfficeQuotationComposer.php
          php -l office-independent/src/Quotation/OfficeQuotationDraftRepository.php
          php office-independent/tests/OfficeQuotationComposerTest.php
          bash -n office-independent/deployment/hostinger/install-offertestudio-office-test.sh
      - name: Inspect isolated Hostinger Office-test without changes
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER" && test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_quotation
          chmod 600 ~/.ssh/id_quotation
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_quotation -p "$PORT" "$USER@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          base="$HOME/domains/brebobv.nl/office_calc_test"
          test -f "$base/config/config.php" || { echo OFFICE_TEST_CONFIG_MISSING; exit 21; }
          router="$HOME/domains/brebobv.nl/public_html/office-test/index.php"
          test -f "$router" || { echo ROUTER_MISSING; exit 23; }
          grep -Fq "'/office-test/crm/offertes'" "$router" && echo QUOTATION_ROUTE_PRESENT || echo QUOTATION_ROUTE_NOT_INSTALLED
          echo QUOTATION_ROUTING_DIAGNOSTICS
          public="$HOME/domains/brebobv.nl/public_html"
          for f in "$public/.htaccess" "$public/office-test/.htaccess"; do
            if test -f "$f"; then
              echo "REWRITE_FILE: $f"
              grep -nE 'RewriteRule|RewriteBase|RewriteCond|ErrorDocument' "$f" | head -60 || true
            else echo "REWRITE_FILE_MISSING: $f"; fi
          done
          for url in 'https://brebobv.nl/office-test/crm/offertes' 'https://brebobv.nl/office-test/crm/verkoopkansen' 'https://brebobv.nl/office-test/'; do
            status="$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)"
            echo "HTTP_STATUS $url $status"
          done
          echo "ROUTER_TARGET: $(readlink -f "$router")"
          echo "ROUTER_ROUTE_LINES"
          grep -nF '/office-test/crm/offertes' "$router" || true
          echo PREFLIGHT_READ_ONLY_COMPLETE
          REMOTE
  deploy:
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'INSTALL-OFFERTSTUDIO-OFFICE-TEST' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/office-offertestudio-20261111
          persist-credentials: false
      - name: Package only quotation files and guarded installer
        run: |
          set -euo pipefail
          tar -czf quotation-package.tar.gz \
            office-independent/public/office-quotation-studio.php \
            office-independent/src/Quotation/OfficeQuotationComposer.php \
            office-independent/src/Quotation/OfficeQuotationDraftRepository.php \
            office-independent/deployment/hostinger/install-offertestudio-office-test.sh
      - name: Install on active isolated Office-test release with backup and rollback
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PORT" && test -n "$USER" && test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_quotation
          chmod 600 ~/.ssh/id_quotation
          remote="$USER@$HOST"
          remote_stage="domains/brebobv.nl/office_calc_test/.quotation-stage-$GITHUB_RUN_ID"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_quotation -p "$PORT" "$remote" "mkdir -p \"\$HOME/$remote_stage\""
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_quotation -P "$PORT" quotation-package.tar.gz "$remote:$remote_stage/quotation-package.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_quotation -p "$PORT" "$remote" "RUN_ID=$GITHUB_RUN_ID bash -se" <<'REMOTE'
          set -euo pipefail
          stage="$HOME/domains/brebobv.nl/office_calc_test/.quotation-stage-$RUN_ID"
          test -f "$stage/quotation-package.tar.gz"
          tar -xzf "$stage/quotation-package.tar.gz" -C "$stage"
          bash "$stage/office-independent/deployment/hostinger/install-offertestudio-office-test.sh" "$stage"
          rm -rf "$stage"
          REMOTE
