name: Office Calc CRM-first acceptance contracts
on:
  pull_request:
    paths:
      - 'office-independent/src/Calculation/OfficeCalcAcceptanceIdentity.php'
      - 'office-independent/src/Calculation/OfficeCalcWorkBudgetHandoff.php'
      - 'office-independent/src/Calculation/OfficeCalcCrmTransferService.php'
      - 'office-independent/src/Calculation/OfficeCalcCostCarrierHandoffMapper.php'
      - 'office-independent/src/Calculation/OfficeCalcPersistedCrmAcceptance.php'
      - 'office-independent/src/Calculation/OfficeCalcAcceptedOpportunityTransfer.php'
      - 'office-independent/src/Calculation/OfficeCalcAcceptanceSchemaPreflight.php'
      - 'office-independent/src/Calculation/OfficeCalcCrmHandoffDecision.php'
      - 'office-independent/src/Crm/OfficeCrmFunnel.php'
      - 'office-independent/src/Crm/OfficeCrmWonTransition.php'
      - 'office-independent/deployment/hostinger/sql/office-crm-calculation-acceptances.sql'
      - 'office-independent/src/Calculation/OfficeCalcWorkBudgetSchemaPreflight.php'
      - 'office-independent/tests/OfficeCalc*'
      - 'office-independent/deployment/hostinger/sql/office-calc-crm-work-budget.sql'
      - '.github/workflows/calc-crm-handoff-contracts.yml'
  push:
    branches: [develop]
    paths:
      - 'office-independent/src/Calculation/OfficeCalcAcceptanceIdentity.php'
      - 'office-independent/src/Calculation/OfficeCalcWorkBudgetHandoff.php'
      - 'office-independent/src/Calculation/OfficeCalcCrmTransferService.php'
      - 'office-independent/src/Calculation/OfficeCalcCostCarrierHandoffMapper.php'
      - 'office-independent/src/Calculation/OfficeCalcPersistedCrmAcceptance.php'
      - 'office-independent/src/Calculation/OfficeCalcAcceptedOpportunityTransfer.php'
      - 'office-independent/src/Calculation/OfficeCalcAcceptanceSchemaPreflight.php'
      - 'office-independent/src/Calculation/OfficeCalcCrmHandoffDecision.php'
      - 'office-independent/src/Crm/OfficeCrmFunnel.php'
      - 'office-independent/src/Crm/OfficeCrmWonTransition.php'
      - 'office-independent/deployment/hostinger/sql/office-crm-calculation-acceptances.sql'
      - 'office-independent/src/Calculation/OfficeCalcWorkBudgetSchemaPreflight.php'
      - 'office-independent/tests/OfficeCalc*'
      - 'office-independent/deployment/hostinger/sql/office-calc-crm-work-budget.sql'
      - '.github/workflows/calc-crm-handoff-contracts.yml'
permissions:
  contents: read
jobs:
  crm-calc-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP lint and CRM-first Calc contracts
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            office-independent/src/Calculation/OfficeCalcAcceptanceIdentity.php \
            office-independent/src/Calculation/OfficeCalcWorkBudgetHandoff.php \
            office-independent/src/Calculation/OfficeCalcCrmTransferService.php \
            office-independent/src/Calculation/OfficeCalcCostCarrierHandoffMapper.php \
            office-independent/src/Calculation/OfficeCalcPersistedCrmAcceptance.php \
            office-independent/src/Calculation/OfficeCalcAcceptedOpportunityTransfer.php \
            office-independent/src/Calculation/OfficeCalcAcceptanceSchemaPreflight.php \
            office-independent/src/Calculation/OfficeCalcCrmHandoffDecision.php \
            office-independent/src/Crm/OfficeCrmFunnel.php \
            office-independent/src/Crm/OfficeCrmWonTransition.php \
            office-independent/src/Calculation/OfficeCalcWorkBudgetSchemaPreflight.php; do
            php -l "$f"
          done
          for f in \
            office-independent/tests/OfficeCalcAcceptanceIdentityTest.php \
            office-independent/tests/OfficeCalcWorkBudgetHandoffTest.php \
            office-independent/tests/OfficeCalcCrmTransferServiceContractTest.php \
            office-independent/tests/OfficeCalcCrmWorkBudgetSchemaTest.php \
            office-independent/tests/OfficeCalcWorkBudgetSchemaPreflightTest.php \
            office-independent/tests/OfficeCalcWorkBudgetLockContractTest.php \
            office-independent/tests/OfficeCalcFiveCostCarriersHandoffTest.php \
            office-independent/tests/OfficeCalcCostCarrierHandoffMapperTest.php \
            office-independent/tests/OfficeCalcNativeTransferIntegrationTest.php \
            office-independent/tests/OfficeCalcPersistedAcceptanceAdapterTest.php \
            office-independent/tests/OfficeCalcAcceptanceSchemaPreflightTest.php \
            office-independent/tests/OfficeCalcCrmHandoffDecisionTest.php \
            office-independent/tests/OfficeCalcCrmDirectAssignmentStageTest.php \
            office-independent/tests/OfficeCalcCrmWonTransitionTest.php; do
            php -l "$f"
            php "$f"
          done
