workflows:
  brebo-measure-ios:
    name: BREBO Measure iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ios/MeasurePOC/BreboMeasurePOC.xcodeproj
        XCODE_SCHEME: BreboMeasurePOC
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios/MeasurePOC
          xcodegen generate
      - name: Build and test simulator proof
        script: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, devices in d.items() if "iOS" in runtime for device in devices if device.get("isAvailable") and "iPhone" in device.get("name", "")))')"
          echo "Using iOS simulator: $SIMULATOR_ID"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build test
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

  brebo-onsite-ios:
    name: BREBO OnSite iOS
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: "BREBO Codemagic"
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.brebo.onsite
      vars:
        XCODE_PROJECT: ios/CrewPOC/BreboCrewPOC.xcodeproj
        XCODE_SCHEME: BreboCrewPOC
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate OnSite Xcode project
        script: |
          cd ios/CrewPOC
          xcodegen generate
      - name: Set OnSite build number
        script: |
          cd ios/CrewPOC
          xcrun agvtool new-version -all "$BUILD_NUMBER"
      - name: Build and test OnSite simulator proof
        script: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, devices in d.items() if "iOS" in runtime for device in devices if device.get("isAvailable") and "iPhone" in device.get("name", "")))')"
          echo "Using iOS simulator: $SIMULATOR_ID"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build test
      - name: Apply OnSite signing profile
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build signed OnSite IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
