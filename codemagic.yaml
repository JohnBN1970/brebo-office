workflows:
  brebo-measure-ios:
    name: BREBO Measure iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ios/MeasurePOC/BreboMeasurePOC.xcodeproj
        XCODE_SCHEME: BreboMeasurePOC
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios/MeasurePOC
          xcodegen generate
      - name: Build and test simulator proof
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build test
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
