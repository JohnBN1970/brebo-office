brebo_document_data.context_dossier:
  path: '/admin/brebo/documents/{context_type}/{context_id}'
  defaults:
    _controller: '\Drupal\brebo_document_data\Controller\DocumentContextDossierController::view'
    _title: 'Documenten'
  requirements:
    _permission: 'access administration pages'
    context_id: '\d+'
  options:
    parameters:
      context_id:
        type: integer

brebo_document_data.node_dossier:
  path: '/node/{node}/documents'
  defaults:
    _controller: '\Drupal\brebo_document_data\Controller\NodeDocumentDossierController::nodeView'
    _title: 'Documenten'
  requirements:
    _custom_access: '\Drupal\brebo_document_data\Controller\NodeDocumentDossierController::access'
  options:
    parameters:
      node:
        type: entity:node

brebo_document_data.project_dossier:
  path: '/projecten/{node}/documenten'
  defaults:
    _controller: '\Drupal\brebo_document_data\Controller\NodeDocumentDossierController::nodeView'
    _title: 'Documenten'
  requirements:
    _custom_access: '\Drupal\brebo_document_data\Controller\NodeDocumentDossierController::access'
  options:
    parameters:
      node:
        type: entity:node

brebo_document_data.document_open:
  path: '/brebo/document/{document_id}/open'
  defaults:
    _controller: '\Drupal\brebo_document_data\Controller\DocumentOpenController::open'
  requirements:
    _permission: 'access administration pages'
    document_id: '\d+'
  options:
    parameters:
      document_id:
        type: integer

brebo_document_data.revision_dossier:
  path: '/admin/brebo/documents/{context_type}/{context_id}/{document_family}'
  defaults:
    _controller: '\Drupal\brebo_document_data\Controller\DocumentRevisionDossierController::view'
    _title: 'Documentrevisies'
  requirements:
    _permission: 'access administration pages'
    context_id: '\d+'
  options:
    parameters:
      context_id:
        type: integer

brebo_document_data.document_detail:
  path: '/brebo/document/{document_id}'
  defaults:
    _controller: '\Drupal\brebo_document_data\Controller\DocumentOpenController::view'
    _title: 'Document'
  requirements:
    _permission: 'access administration pages'
    document_id: '\d+'
  options:
    parameters:
      document_id:
        type: integer
