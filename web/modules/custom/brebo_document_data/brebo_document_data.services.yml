services:
  brebo_document_data.repository:
    class: Drupal\brebo_document_data\Service\DocumentRepository
    arguments:
      - '@database'
      - '@datetime.time'

  brebo_document_data.context_classifier:
    class: Drupal\brebo_document_data\Service\DocumentContextClassifier

  brebo_document_data.revision_series:
    class: Drupal\brebo_document_data\Service\DocumentRevisionSeries
    arguments:
      - '@database'

  brebo_document_data.storage_locator:
    class: Drupal\brebo_document_data\Service\DocumentStorageLocator
    arguments:
      - '@database'
