services:
  brebo_document_data.database_repository:
    class: Drupal\brebo_document_data\Infrastructure\DatabaseDocumentRepository
    arguments:
      - '@database'
      - '@datetime.time'

  Drupal\brebo_document_data\Contract\DocumentRepositoryInterface:
    alias: brebo_document_data.database_repository

  brebo_document_data.repository:
    class: Drupal\brebo_document_data\Service\DocumentRepository
    arguments:
      - '@brebo_document_data.database_repository'

  brebo_document_data.context_classifier:
    class: Drupal\brebo_document_data\Service\DocumentContextClassifier

  brebo_document_data.revision_read_repository:
    class: Drupal\brebo_document_data\Infrastructure\DatabaseDocumentRevisionReadRepository
    arguments:
      - '@database'

  Drupal\brebo_document_data\Contract\DocumentRevisionReadRepositoryInterface:
    alias: brebo_document_data.revision_read_repository

  brebo_document_data.revision_series:
    class: Drupal\brebo_document_data\Service\DocumentRevisionSeries
    arguments:
      - '@brebo_document_data.revision_read_repository'

  brebo_document_data.storage_read_repository:
    class: Drupal\brebo_document_data\Infrastructure\DatabaseDocumentStorageReadRepository
    arguments:
      - '@database'

  Drupal\brebo_document_data\Contract\DocumentStorageReadRepositoryInterface:
    alias: brebo_document_data.storage_read_repository

  brebo_document_data.storage_locator:
    class: Drupal\brebo_document_data\Service\DocumentStorageLocator
    arguments:
      - '@brebo_document_data.storage_read_repository'
