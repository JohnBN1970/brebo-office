brebo_project_cockpit.overview:
  path: '/projecten/{node}/cockpit'
  defaults:
    _controller: '\Drupal\brebo_project_cockpit\Controller\ProjectCockpitController::overview'
    _title_callback: '\Drupal\brebo_project_cockpit\Controller\ProjectCockpitController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.budget:
  path: '/projecten/{node}/begroting'
  defaults:
    _controller: '\Drupal\brebo_project_cockpit\Controller\ProjectBudgetController::overview'
    _title_callback: '\Drupal\brebo_project_cockpit\Controller\ProjectBudgetController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.procurement:
  path: '/projecten/{node}/inkoop'
  defaults:
    _controller: '\Drupal\brebo_project_cockpit\Controller\ProjectProcurementController::overview'
    _title_callback: '\Drupal\brebo_project_cockpit\Controller\ProjectProcurementController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.contracts:
  path: '/projecten/{node}/contracten'
  defaults:
    _controller: '\Drupal\brebo_project_cockpit\Controller\ProjectContractsController::overview'
    _title_callback: '\Drupal\brebo_project_cockpit\Controller\ProjectContractsController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.invoices:
  path: '/projecten/{node}/facturen'
  defaults:
    _controller: '\Drupal\brebo_project_cockpit\Controller\ProjectInvoicesController::overview'
    _title_callback: '\Drupal\brebo_project_cockpit\Controller\ProjectInvoicesController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.instalment_schedule:
  path: '/projecten/{node}/facturen/termijnschema'
  defaults:
    _form: '\Drupal\brebo_project_cockpit\Form\ProjectInstalmentScheduleForm'
    _title: 'Termijnschema maken'
  requirements:
    _entity_access: 'node.view'
    _permission: 'access brebo finance'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.instalment_templates:
  path: '/projecten/{node}/facturen/termijnsjablonen'
  defaults:
    _form: '\Drupal\brebo_project_cockpit\Form\InstalmentTemplateForm'
    _title: 'Termijnsjablonen'
  requirements:
    _entity_access: 'node.view'
    _permission: 'access brebo finance'
  options:
    parameters:
      node:
        type: entity:node
