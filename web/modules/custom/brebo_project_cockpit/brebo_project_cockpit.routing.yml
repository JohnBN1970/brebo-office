brebo_project_cockpit.instalment_schedule:
  path: '/projecten/{node}/facturen/termijnschema'
  defaults:
    _form: '\Drupal\brebo_project_cockpit\Form\ProjectInstalmentScheduleForm'
    _title: 'Termijnschema maken'
  requirements:
    _entity_access: 'node.view'
    _permission: 'access brebo finance'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.instalment_payment_term:
  path: '/projecten/{node}/facturen/termijnen/{instalment}/betaaltermijn'
  defaults:
    _form: '\Drupal\brebo_project_cockpit\Form\ProjectInstalmentPaymentTermForm'
    _title: 'Betaaltermijn termijn aanpassen'
  requirements:
    _entity_access: 'node.view'
    _permission: 'access brebo finance'
    instalment: '\d+'
  options:
    parameters:
      node:
        type: entity:node

brebo_project_cockpit.instalment_billable_approve:
