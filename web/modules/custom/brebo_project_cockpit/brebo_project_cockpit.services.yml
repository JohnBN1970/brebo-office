services:
  brebo_project_cockpit.project_provisional_sum_repository:
    class: Drupal\brebo_project_cockpit\Infrastructure\DatabaseProjectProvisionalSumRepository
    arguments: ['@database']

  brebo_project_cockpit.project_invoice_repository:
    class: Drupal\brebo_project_cockpit\Infrastructure\DatabaseProjectInvoiceRepository
    arguments: ['@database']

  brebo_project_cockpit.project_instalment_repository:
    class: Drupal\brebo_project_cockpit\Infrastructure\DatabaseProjectInstalmentRepository
    arguments: ['@database']

  brebo_project_cockpit.project_order_read_repository:
    class: Drupal\brebo_project_cockpit\Infrastructure\DatabaseProjectOrderReadRepository
    arguments: ['@database']

  brebo_project_cockpit.project_contract_repository:
    class: Drupal\brebo_project_cockpit\Infrastructure\DatabaseProjectContractRepository
    arguments: ['@database']

  brebo_project_cockpit.project_status_read_repository:
    class: Drupal\brebo_project_cockpit\Infrastructure\DrupalProjectStatusReadRepository
    arguments: ['@entity_type.manager', '@entity_field.manager']

  Drupal\brebo_project_cockpit\Contract\ProjectStatusReadRepositoryInterface:
    alias: brebo_project_cockpit.project_status_read_repository

  brebo_project_cockpit.project_status_aggregator:
    class: Drupal\brebo_project_cockpit\Service\ProjectStatusAggregator
    arguments: ['@brebo_project_cockpit.project_status_read_repository']

  brebo_project_cockpit.project_progress_builder:
    class: Drupal\brebo_project_cockpit\Service\ProjectProgressBuilder
    arguments: ['@entity_type.manager', '@entity_field.manager']

  brebo_project_cockpit.project_milestone_builder:
    class: Drupal\brebo_project_cockpit\Service\ProjectMilestoneBuilder
    arguments: ['@entity_type.manager']

  brebo_project_cockpit.route_subscriber:
    class: Drupal\brebo_project_cockpit\Routing\ProjectCockpitRouteSubscriber
    tags:
      - { name: event_subscriber }
