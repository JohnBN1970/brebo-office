services:
  brebo_sandbox_reset.gateway:
    class: Drupal\brebo_sandbox_reset\Infrastructure\DrupalSandboxResetGateway
    arguments: ['@database', '@entity_type.manager', '@entity_field.manager', '@state', '@queue']

  Drupal\brebo_sandbox_reset\Contract\SandboxResetGatewayInterface:
    alias: brebo_sandbox_reset.gateway

  brebo_sandbox_reset.manager:
    class: Drupal\brebo_sandbox_reset\Service\SandboxResetManager
    arguments: ['@brebo_sandbox_reset.gateway']
