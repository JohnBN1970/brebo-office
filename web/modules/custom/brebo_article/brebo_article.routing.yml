brebo_article.search:
  path: '/api/artikelen'
  defaults:
    _controller: '\Drupal\brebo_article\Controller\ArticleSearchController::search'
  requirements:
    _permission: 'access brebo articles'
  methods: [GET]

brebo_article.import:
  path: '/artikelen/importeren'
  defaults:
    _form: '\Drupal\brebo_article\Form\ArticleImportForm'
    _title: 'Artikelcatalogus importeren'
  requirements:
    _permission: 'administer brebo articles'
