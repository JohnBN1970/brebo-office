brebo_resident_service.dashboard:
  path: '/brebo/bewoners'
  defaults:
    _controller: '\Drupal\brebo_resident_service\Controller\ResidentServiceController::dashboard'
    _title: 'Bewoners & service'
  requirements:
    _permission: 'access brebo resident service'

brebo_resident_service.address_scopes:
  path: '/brebo/bewoners/adresvoorstellen'
  defaults:
    _controller: '\Drupal\brebo_resident_service\Controller\ResidentServiceController::addressScopes'
    _title: 'Adresvoorstellen uit communicatie'
  requirements:
    _permission: 'manage brebo resident service'

brebo_resident_service.address_scope_materialize:
  path: '/brebo/bewoners/adresvoorstellen/{intake_id}/toevoegen'
  defaults:
    _form: '\Drupal\brebo_resident_service\Form\MaterializeAddressScopeForm'
    _title: 'Adressen en woningen toevoegen'
  requirements:
    _permission: 'manage brebo resident service'
    intake_id: '\d+'

brebo_resident_service.building_residents:
  path: '/node/{node}/woningen-bewoners'
  defaults:
    _controller: '\Drupal\brebo_resident_service\Controller\BuildingResidentController::overview'
    _title_callback: '\Drupal\brebo_resident_service\Controller\BuildingResidentController::title'
  requirements:
    _permission: 'access brebo resident service'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
