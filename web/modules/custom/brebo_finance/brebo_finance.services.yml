services:
  brebo_finance.three_way_match:
    class: Drupal\brebo_finance\Service\ThreeWayMatchService

  brebo_finance.invoice_control:
    class: Drupal\brebo_finance\Service\InvoiceControlService
    arguments:
      - '@brebo_finance.three_way_match'

  brebo_finance.payment_control:
    class: Drupal\brebo_finance\Service\PaymentControlService

  brebo_finance.workflow:
    class: Drupal\brebo_finance\Service\FinanceWorkflowService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@brebo_finance.invoice_control'
      - '@brebo_finance.payment_control'
