    arguments: ['@database', '@brebo_finance.invoice_performance_blocker_resolver']
  brebo_finance.financial_euro_trace:
    class: Drupal\brebo_finance\Service\FinancialEuroTrace
    arguments: ['@database']
  brebo_finance.financial_euro_trace_finding_synchronizer:
    class: Drupal\brebo_finance\Service\FinancialEuroTraceFindingSynchronizer
    arguments: ['@database']
  brebo_finance.purchase_invoice_action_manager:
    class: Drupal\brebo_finance\Service\PurchaseInvoiceActionManager
    arguments: ['@database', '@brebo_finance.purchase_invoice_coding_manager', '@brebo_finance.performance_receipt_manager', '@brebo_finance.three_way_match_manager', '@brebo_finance.payment_release_manager', '@brebo_finance.financial_euro_trace_finding_synchronizer']
