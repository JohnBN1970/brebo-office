    class: Drupal\brebo_finance\Service\SalesInvoiceReceivablesReconciler
    arguments: ['@database', '@brebo_finance.sales_invoice_receivables_integration_client', '@brebo_finance.billing_control_manager', '@brebo_finance.receivables_reconciliation_monitor']
  brebo_finance.purchase_invoice_integration_client:
    class: Drupal\brebo_finance\Service\PurchaseInvoiceIntegrationClient
    arguments: ['@http_client', '@config.factory']
  brebo_finance.purchase_invoice_importer:
    class: Drupal\brebo_finance\Service\PurchaseInvoiceImporter
    arguments: ['@database', '@brebo_finance.purchase_invoice_integration_client', '@brebo_finance.vat_calculator']
  brebo_finance.project_financial_closure_guard:
    class: Drupal\brebo_finance\Service\ProjectFinancialClosureGuard
    arguments: ['@database', '@brebo_finance.project_financial_closure_manager']
  brebo_finance.finance_operating_layer:
    class: Drupal\brebo_finance\Service\FinanceOperatingLayer
    arguments: ['@database']
