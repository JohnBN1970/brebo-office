    arguments: ['@database', '@brebo_finance.purchase_invoice_importer', '@brebo_finance.vat_calculator']
  brebo_finance.bank_transaction_reconciliation_manager:
    class: Drupal\brebo_finance\Service\BankTransactionReconciliationManager
