services:
  brebo_finance.vat_calculator:
    class: Drupal\brebo_finance\Service\VatCalculator
  brebo_finance.working_budget_importer:
    class: Drupal\brebo_finance\Service\WorkingBudgetImporter
    arguments: ['@database', '@entity_type.manager']
  brebo_finance.working_budget_approval_manager:
    class: Drupal\brebo_finance\Service\WorkingBudgetApprovalManager
    arguments: ['@database']
  brebo_finance.financial_phase_gate_manager:
    class: Drupal\brebo_finance\Service\FinancialPhaseGateManager
    arguments: ['@database']
  brebo_finance.financial_phase_gate_presenter:
    class: Drupal\brebo_finance\Service\FinancialPhaseGatePresenter
    arguments: ['@brebo_finance.financial_phase_gate_manager']
  brebo_finance.financial_gate_exposure_resolver:
    class: Drupal\brebo_finance\Service\FinancialGateExposureResolver
    arguments: ['@database']
  brebo_finance.financial_approval_matrix:
    class: Drupal\brebo_finance\Service\FinancialApprovalMatrix
  brebo_finance.financial_decision_assignment_resolver:
    class: Drupal\brebo_finance\Service\FinancialDecisionAssignmentResolver
    arguments: ['@entity_type.manager']
  brebo_finance.financial_decision_inbox:
    class: Drupal\brebo_finance\Service\FinancialDecisionInbox
    arguments: ['@database', '@brebo_finance.financial_gate_exposure_resolver', '@brebo_finance.financial_approval_matrix', '@brebo_finance.financial_decision_assignment_resolver']
  brebo_finance.financial_decision_escalation_engine:
    class: Drupal\brebo_finance\Service\FinancialDecisionEscalationEngine
    arguments: ['@database', '@brebo_finance.financial_decision_inbox', '@brebo_finance.financial_notification_outbox']
  brebo_finance.financial_notification_outbox:
    class: Drupal\brebo_finance\Service\FinancialNotificationOutbox
    arguments: ['@database', '@queue']
  brebo_finance.project_phase_transition_manager:
    class: Drupal\brebo_finance\Service\ProjectPhaseTransitionManager
    arguments: ['@database', '@entity_type.manager', '@brebo_finance.financial_phase_gate_manager']
  brebo_finance.commitment_manager:
    class: Drupal\brebo_finance\Service\CommitmentManager
    arguments: ['@database', '@brebo_finance.vat_calculator', '@brebo_finance.financial_phase_gate_manager', '@brebo_finance.financial_euro_trace_finding_synchronizer']
  brebo_finance.performance_evidence_requirement_resolver:
    class: Drupal\brebo_finance\Service\PerformanceEvidenceRequirementResolver
  brebo_finance.performance_evidence_review_manager:
    class: Drupal\brebo_finance\Service\PerformanceEvidenceReviewManager
    arguments: ['@database', '@brebo_finance.performance_location_manager']
  brebo_finance.performance_location_manager:
    class: Drupal\brebo_finance\Service\PerformanceLocationManager
    arguments: ['@database', '@brebo_building_data.project_building_repository', '@brebo_building_data.object_repository']
  brebo_finance.performance_receipt_manager:
    class: Drupal\brebo_finance\Service\PerformanceReceiptManager
    arguments: ['@database', '@brebo_finance.vat_calculator', '@brebo_finance.financial_euro_trace_finding_synchronizer', '@brebo_finance.performance_evidence_review_manager', '@brebo_finance.performance_evidence_requirement_resolver', '@brebo_finance.performance_location_manager']
  brebo_finance.budget_mutation_manager:
    class: Drupal\brebo_finance\Service\BudgetMutationManager
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.three_way_match_manager:
    class: Drupal\brebo_finance\Service\ThreeWayMatchManager
    arguments: ['@database', '@brebo_finance.vat_calculator', '@brebo_finance.financial_euro_trace_finding_synchronizer']
  brebo_finance.invoice_performance_blocker_resolver:
    class: Drupal\brebo_finance\Service\InvoicePerformanceBlockerResolver
    arguments: ['@database']
  brebo_finance.invoice_blocker_action_manager:
    class: Drupal\brebo_finance\Service\InvoiceBlockerActionManager
    arguments: ['@database']
  brebo_finance.personal_work_queue:
    class: Drupal\brebo_finance\Service\PersonalWorkQueue
    arguments: ['@brebo_finance.invoice_blocker_action_manager', '@brebo_calculation.work_assignment_manager']
  brebo_finance.payment_release_manager:
    class: Drupal\brebo_finance\Service\PaymentReleaseManager
    arguments: ['@database', '@brebo_finance.vat_calculator', '@brebo_finance.financial_phase_gate_manager', '@brebo_finance.financial_euro_trace_finding_synchronizer']
  brebo_finance.project_financial_position:
    class: Drupal\brebo_finance\Service\ProjectFinancialPosition
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.control_scanner:
    class: Drupal\brebo_finance\Service\FinancialControlScanner
    arguments: ['@database', '@brebo_finance.labour_productivity_manager', '@brebo_finance.vat_calculator']
  brebo_finance.controller_briefing_builder:
    class: Drupal\brebo_finance\Service\ControllerBriefingBuilder
    arguments: ['@database']
  brebo_finance.financial_scenario_engine:
    class: Drupal\brebo_finance\Service\FinancialScenarioEngine
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.building_cost_intelligence_manager:
    class: Drupal\brebo_finance\Service\BuildingCostIntelligenceManager
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.billing_control_manager:
    class: Drupal\brebo_finance\Service\BillingControlManager
    arguments: ['@database', '@brebo_finance.vat_calculator', '@brebo_finance.financial_phase_gate_manager']
  brebo_finance.contract_obligation_manager:
    class: Drupal\brebo_finance\Service\ContractObligationManager
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.supplier_performance_scorecard:
    class: Drupal\brebo_finance\Service\SupplierPerformanceScorecard
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.failure_cost_manager:
    class: Drupal\brebo_finance\Service\FailureCostManager
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.change_order_manager:
    class: Drupal\brebo_finance\Service\ChangeOrderManager
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.cash_flow_forecast_manager:
    class: Drupal\brebo_finance\Service\CashFlowForecastManager
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.labour_productivity_manager:
    class: Drupal\brebo_finance\Service\LabourProductivityManager
    arguments: ['@database', '@brebo_finance.vat_calculator']
  brebo_finance.financial_cockpit_builder:
    class: Drupal\brebo_finance\Service\FinancialCockpitBuilder
    arguments: ['@database', '@brebo_finance.controller_briefing_builder', '@brebo_finance.labour_productivity_manager']
  brebo_finance.financial_command_center:
    class: Drupal\brebo_finance\Service\FinancialCommandCenter
    arguments: ['@entity_type.manager', '@brebo_finance.financial_cockpit_builder', '@brebo_finance.financial_decision_inbox', '@brebo_finance.financial_decision_assignment_resolver']
  brebo_finance.financial_project_ledger:
    class: Drupal\brebo_finance\Service\FinancialProjectLedger
    arguments: ['@database', '@brebo_finance.invoice_performance_blocker_resolver']
  brebo_finance.financial_euro_trace:
    class: Drupal\brebo_finance\Service\FinancialEuroTrace
    arguments: ['@database']
  brebo_finance.financial_euro_trace_control:
    class: Drupal\brebo_finance\Service\FinancialEuroTraceControl
    arguments: ['@brebo_finance.financial_euro_trace']
  brebo_finance.financial_euro_trace_finding_synchronizer:
    class: Drupal\brebo_finance\Service\FinancialEuroTraceFindingSynchronizer
    arguments: ['@database', '@brebo_finance.financial_euro_trace_control']
  brebo_finance.control_finding_manager:
    class: Drupal\brebo_finance\Service\ControlFindingManager
    arguments: ['@database']
  brebo_finance.ai_assessment_manager:
    class: Drupal\brebo_finance\Service\AiFinancialAssessmentManager
    arguments: ['@database']
  brebo_finance.digital_controller:
    class: Drupal\brebo_finance\Service\DigitalController
    arguments: ['@database', '@brebo_finance.control_scanner', '@brebo_finance.controller_briefing_builder', '@brebo_finance.ai_assessment_manager']
