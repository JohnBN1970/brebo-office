brebo_finance.command_center_page:
  path: '/brebo-office/finance'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialCommandCenterController::page', _title: 'Financieel Command Center' }
  requirements: { _permission: 'access brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }
brebo_finance.command_center_api:
  path: '/brebo-office/api/finance/command-center'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialCommandCenterController::api', _title: 'BREBO Financieel Command Center API' }
  requirements: { _permission: 'access brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }
brebo_finance.my_work_page:
  path: '/brebo-office/my-work'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\MyFinanceActionsPageController::page', _title: 'Mijn Werkbak' }
  requirements: { _user_is_logged_in: 'TRUE' }
  methods: [GET]
  options: { no_cache: TRUE }
brebo_finance.my_work_api:
  path: '/brebo-office/api/my-work'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\MyFinanceActionsController::view', _title: 'Mijn Werkbak API' }
  requirements: { _user_is_logged_in: 'TRUE' }
  methods: [GET]
  options: { no_cache: TRUE }
brebo_finance.project_finance_page:
  path: '/brebo-office/finance/projects/{project_nid}'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialProjectPageController::page', _title: 'Projectfinanciën' }
  requirements: { _permission: 'access brebo finance', project_nid: '\d+' }
  methods: [GET]
  options: { no_cache: TRUE }
brebo_finance.project_ledger:
  path: '/brebo-office/api/finance/projects/{project_nid}/ledger'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialProjectLedgerController::view', _title: 'Project financieel grootboek' }
  requirements: { _permission: 'access brebo finance', project_nid: '\d+' }
  methods: [GET]
  options: { no_cache: TRUE }
brebo_finance.performance_evidence_requirements:
  path: '/brebo-office/api/finance/performance-evidence-requirements'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\PerformanceEvidenceRequirementController::view', _title: 'Vereist prestatiebewijs' }
  requirements: { _permission: 'manage brebo procurement' }
  methods: [GET]
  options: { no_cache: TRUE }
brebo_finance.performance_evidence_upload:
  path: '/brebo-office/api/finance/performance-evidence'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\PerformanceEvidenceUploadController::upload', _title: 'Prestatiebewijs uploaden' }
  requirements: { _permission: 'manage brebo procurement' }
  methods: [POST]