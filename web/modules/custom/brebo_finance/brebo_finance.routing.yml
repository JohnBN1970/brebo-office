brebo_finance.command_center_page:
  path: '/brebo-office/finance'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialCommandCenterController::page', _title: 'Finance' }
  requirements: { _permission: 'access brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }

brebo_finance.sales_workspace:
  path: '/brebo-office/finance/sales'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\SalesWorkspaceController::page', _title: 'Verkoop' }
  requirements: { _permission: 'access brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }

brebo_finance.payables_work_queues:
  path: '/brebo-office/finance/payables'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\PayablesWorkQueueController::page', _title: 'Te doen · Inkoop & betaling' }
  requirements: { _permission: 'access brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }

brebo_finance.purchase_invoice_list:
  path: '/brebo-office/finance/purchase-invoices'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\PurchaseInvoiceController::listing', _title: 'Inkoopfacturen' }
  requirements: { _permission: 'access brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }

brebo_finance.command_center_api:
  path: '/brebo-office/api/finance/command-center'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialCommandCenterController::api', _title: 'BREBO Financieel Command Center API' }
  requirements: { _permission: 'access brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }

brebo_finance.project_finance_page:
  path: '/brebo-office/finance/projects/{project_nid}'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialProjectPageController::page', _title: 'Projectfinanciën' }
  requirements: { _permission: 'access brebo finance', project_nid: '\d+' }
  methods: [GET]
  options: { no_cache: TRUE }

brebo_finance.financial_decision_page:
  path: '/brebo-office/finance/decision-inbox'
  defaults: { _controller: '\Drupal\brebo_finance\Controller\FinancialDecisionPageController::page', _title: 'Financiële beslisinbox' }
  requirements: { _permission: 'approve brebo finance' }
  methods: [GET]
  options: { no_cache: TRUE }
