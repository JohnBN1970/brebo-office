brebo_calculation.migration_overview:
  path: '/admin/brebo/calculations/migration-audit'
  defaults:
    _controller: '\Drupal\brebo_calculation\Controller\MigrationOverviewController::overview'
    _title: 'Calculatie migratieoverzicht'
  requirements:
    _permission: 'view brebo calculation migration audit'
  options:
    _admin_route: true

brebo_calculation.migration_audit:
  path: '/admin/brebo/calculations/{node}/migration-audit'
  defaults:
    _controller: '\Drupal\brebo_calculation\Controller\MigrationAuditController::audit'
    _title: 'Calculatie migratiecontrole'
  requirements:
    _permission: 'view brebo calculation migration audit'
    node: '\d+'
  options:
    _admin_route: true

brebo_calculation.migration_confirm:
  path: '/admin/brebo/calculations/{node}/migration-audit/migrate'
  defaults:
    _form: '\Drupal\brebo_calculation\Form\MigrationConfirmForm'
    _title: 'Calculatie gecontroleerd migreren'
  requirements:
    _permission: 'migrate brebo calculation'
    node: '\d+'
  options:
    _admin_route: true

brebo_calculation.workbench:
  path: '/admin/brebo/calculations/{node}/workbench'
  defaults:
    _form: '\Drupal\brebo_calculation\Form\CalculationWorkbenchForm'
    _title: 'Calculatiewerkbank'
  requirements:
    _permission: 'edit brebo calculation workbench'
    node: '\d+'
  options:
    _admin_route: true
    parameters:
      node:
        type: entity:node

brebo_calculation.subcalculations:
  path: '/admin/brebo/calculations/{node}/workbench/subcalculations'
  defaults:
    _form: '\Drupal\brebo_calculation\Form\SubcalculationOverviewForm'
    _title: 'Deelcalculaties'
  requirements:
    _permission: 'edit brebo calculation workbench'
    node: '\d+'
  options:
    _admin_route: true
    parameters:
      node:
        type: entity:node

brebo_calculation.price_sources:
  path: '/admin/brebo/calculations/{node}/workbench/line/{line}/price-sources'
  defaults:
    _form: '\Drupal\brebo_calculation\Form\CalculationPriceSourceForm'
    _title: 'Prijsbronnen calculatieregel'
  requirements:
    _permission: 'edit brebo calculation workbench'
    node: '\d+'
    line: '\d+'
  options:
    _admin_route: true
    parameters:
      node:
        type: entity:node

brebo_calculation.structure:
  path: '/admin/brebo/calculations/{node}/structure'
  defaults:
    _form: '\Drupal\brebo_calculation\Form\CalculationStructureForm'
    _title: 'Calculatiestructuur'
  requirements:
    _permission: 'edit brebo calculation workbench'
    node: '\d+'
  options:
    _admin_route: true
    parameters:
      node:
        type: entity:node

brebo_calculation.parameters:
  path: '/admin/brebo/calculations/{node}/parameters'
  defaults:
    _controller: '\Drupal\brebo_calculation\Controller\CalculationWorkbenchController::parameters'
    _title: 'Calculatieparameters'
  requirements:
    _permission: 'view brebo calculation migration audit'
    node: '\d+'
  options:
    _admin_route: true
    parameters:
      node:
        type: entity:node
