  defaults:
    _controller: '\Drupal\brebo_calculation\Controller\ClassificationOptionsController::list'
    _title: 'BREBO classificatieopties'
  requirements:
    _permission: 'edit brebo calculation workbench'
    system: 'nlsfb|stabu|brebo'
  methods: [GET]
  options:
    no_cache: TRUE
