services:
  brebo_calculation.commercial_calculator:
    class: Drupal\brebo_calculation\Service\CommercialCalculator

  brebo_calculation.totalizer:
    class: Drupal\brebo_calculation\Service\CalculationTotalizer

  brebo_calculation.distribution_calculator:
    class: Drupal\brebo_calculation\Service\DistributionCalculator

  brebo_calculation.legacy_reconciler:
    class: Drupal\brebo_calculation\Service\LegacyReconciler

  brebo_calculation.legacy_rule_mapper:
    class: Drupal\brebo_calculation\Service\LegacyRuleMapper

  brebo_calculation.legacy_cost_mapper:
    class: Drupal\brebo_calculation\Service\LegacyCostMapper

  brebo_calculation.legacy_dry_run:
    class: Drupal\brebo_calculation\Service\LegacyDryRunService
    arguments:
      - '@entity_type.manager'
      - '@brebo_calculation.legacy_rule_mapper'
      - '@brebo_calculation.legacy_cost_mapper'
      - '@brebo_calculation.totalizer'
      - '@brebo_calculation.legacy_reconciler'

  brebo_calculation.persistence:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationPersistence
    arguments: ['@database']

  brebo_calculation.guarded_legacy_migrator:
    class: Drupal\brebo_calculation\Service\GuardedLegacyMigrator
    arguments:
      - '@brebo_calculation.legacy_dry_run'
      - '@brebo_calculation.persistence'
      - '@database'

  brebo_calculation.row_manager:
    class: Drupal\brebo_calculation\Service\CalculationRowManager
    arguments:
      - '@database'
      - '@entity_type.manager'

  brebo_calculation.block_order_manager:
    class: Drupal\brebo_calculation\Service\CalculationBlockOrderManager
    arguments:
      - '@database'
      - '@entity_type.manager'

  brebo_calculation.structure_manager:
    class: Drupal\brebo_calculation\Service\CalculationStructureManager
    arguments:
      - '@database'
      - '@entity_type.manager'

  brebo_calculation.price_source_manager:
    class: Drupal\brebo_calculation\Service\CalculationPriceSourceManager
    arguments:
      - '@database'

  brebo_calculation.subcalculation_manager:
    class: Drupal\brebo_calculation\Service\SubcalculationManager
    arguments:
      - '@database'

  brebo_calculation.object_exception_line_manager:
    class: Drupal\brebo_calculation\Service\ObjectExceptionLineManager
    arguments:
      - '@database'

  brebo_calculation.draft_initializer:
    class: Drupal\brebo_calculation\Service\CalculationDraftInitializer
    arguments:
      - '@database'

  brebo_calculation.recipe_formula_evaluator:
    class: Drupal\brebo_calculation\Service\RecipeFormulaEvaluator

  brebo_calculation.recipe_manager:
    class: Drupal\brebo_calculation\Service\RecipeManager
    arguments:
      - '@database'
      - '@brebo_calculation.recipe_formula_evaluator'

  brebo_calculation.recipe_material_selector:
    class: Drupal\brebo_calculation\Service\RecipeMaterialSelector
    arguments:
      - '@database'

  brebo_calculation.recipe_price_health_inspector:
    class: Drupal\brebo_calculation\Service\RecipePriceHealthInspector

  brebo_calculation.readiness_inspector:
    class: Drupal\brebo_calculation\Service\CalculationReadinessInspector
    arguments:
      - '@database'
      - '@brebo_calculation.recipe_price_health_inspector'

  brebo_calculation.offer_readiness_access:
    class: Drupal\brebo_calculation\Access\OfferReadinessAccessCheck
    arguments:
      - '@database'
      - '@brebo_calculation.readiness_inspector'
    tags:
      - { name: access_check, applies_to: _brebo_offer_ready }

  brebo_calculation.offer_confirmed_access:
    class: Drupal\brebo_calculation\Access\OfferConfirmedAccessCheck
    arguments:
      - '@database'
      - '@brebo_calculation.readiness_inspector'
      - '@request_stack'
    tags:
      - { name: access_check, applies_to: _brebo_offer_confirmed }

  brebo_calculation.offer_readiness_route_subscriber:
    class: Drupal\brebo_calculation\Routing\OfferReadinessRouteSubscriber
    tags:
      - { name: event_subscriber }

  brebo_calculation.workspace_route_subscriber:
    class: Drupal\brebo_calculation\Routing\CalculationWorkspaceRouteSubscriber
    tags:
      - { name: event_subscriber }
