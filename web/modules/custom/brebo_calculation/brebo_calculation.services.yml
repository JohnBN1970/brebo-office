services:
  brebo_calculation.parameters_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationParametersRepository
    arguments: ['@database']

  brebo_calculation.parameters_manager:
    class: Drupal\brebo_calculation\Service\CalculationParametersManager
    arguments:
      - '@brebo_calculation.parameters_repository'
      - '@brebo_calculation.access_gateway'

  brebo_calculation.calc_result_snapshot:
    class: Drupal\brebo_calculation\Service\CalcResultSnapshotService
    arguments: ['@database']

  brebo_calculation.calc_request_authenticator:
    class: Drupal\brebo_calculation\Service\CalcIntegrationRequestAuthenticator
    arguments: ['@cache.default']

  brebo_calculation.workspace_resource_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationWorkspaceResourceRepository
    arguments: ['@database']

  brebo_calculation.workspace_resource_guard:
    class: Drupal\brebo_calculation\Service\CalculationWorkspaceResourceGuard
    arguments: ['@brebo_calculation.workspace_resource_repository']

  brebo_calculation.workspace_read_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationWorkspaceReadRepository
    arguments: ['@database']

  brebo_calculation.workspace_state:
    class: Drupal\brebo_calculation\Service\CalculationWorkspaceStateService
    arguments:
      - '@brebo_calculation.workspace_read_repository'
      - '@brebo_calculation.context'
      - '@brebo_calculation.result'
      - '@brebo_calculation.readiness_inspector'
      - '@brebo_calculation.calc_result_snapshot'

  brebo_calculation.context_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationContextRepository
    arguments: ['@database']

  brebo_calculation.context:
    class: Drupal\brebo_calculation\Service\CalculationContextService
    arguments: ['@brebo_calculation.context_repository']

  brebo_calculation.identity_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationIdentityRepository
    arguments: ['@database']

  brebo_calculation.structure_identity_generator:
    class: Drupal\brebo_calculation\Service\CalculationStructureIdentityGenerator
    arguments: ['@brebo_calculation.identity_repository']

  brebo_calculation.legacy_line_mirror_policy:
    class: Drupal\brebo_calculation\Infrastructure\DrupalCalculationLegacyLineMirrorPolicy
    arguments: ['@config.factory']

  brebo_calculation.legacy_line_mirror_map:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationLegacyLineMirrorMap
    arguments: ['@database']

  brebo_calculation.row_identity_generator:
    class: Drupal\brebo_calculation\Service\CalculationRowIdentityGenerator
    arguments: ['@brebo_calculation.identity_repository']

  brebo_calculation.legacy_source:
    class: Drupal\brebo_calculation\Infrastructure\DrupalLegacyCalculationSource
    arguments: ['@entity_type.manager']

  brebo_calculation.legacy_calculation_gateway:
    class: Drupal\brebo_calculation\Infrastructure\DrupalCalculationLegacyGateway
    arguments: ['@entity_type.manager']

  brebo_calculation.line_read_model:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationLineReadModel
    arguments: ['@database']

  brebo_calculation.legacy_structure_gateway:
    class: Drupal\brebo_calculation\Infrastructure\DrupalCalculationStructureLegacyGateway
    arguments: ['@entity_type.manager']

  brebo_calculation.access_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationAccessRepository
    arguments: ['@database']

  brebo_calculation.access_gateway:
    class: Drupal\brebo_calculation\Infrastructure\DrupalCalculationAccessGateway
    arguments:
      - '@entity_type.manager'
      - '@brebo_calculation.access_repository'

  brebo_calculation.legacy_line_gateway:
    class: Drupal\brebo_calculation\Infrastructure\DrupalCalculationLineLegacyGateway
    arguments: ['@entity_type.manager']

  brebo_calculation.legacy_line_compatibility:
    class: Drupal\brebo_calculation\Infrastructure\NoopCalculationLegacyLineCompatibility

  brebo_calculation.legacy_line_compatibility.drupal:
    class: Drupal\brebo_calculation\Infrastructure\CalculationLegacyLineCompatibility
    arguments:
      - '@brebo_calculation.legacy_line_gateway'
      - '@brebo_calculation.legacy_line_mirror_map'
      - '@brebo_calculation.legacy_line_mirror_policy'

  brebo_calculation.kozijn_price_observation_store:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseKozijnPriceObservationStore
    arguments: ['@database']

  brebo_calculation.kozijn_price_observation_repository:
    class: Drupal\brebo_calculation\Service\KozijnPriceObservationRepository
    arguments: ['@brebo_calculation.kozijn_price_observation_store']

  brebo_calculation.kozijn_price_engine:
    class: Drupal\brebo_calculation\Service\KozijnPriceEngine

  brebo_calculation.commercial_calculator:
    class: Drupal\brebo_calculation\Service\CommercialCalculator

  brebo_calculation.kozijn_commercial_price:
    class: Drupal\brebo_calculation\Service\KozijnCommercialPriceService
    arguments:
      - '@brebo_calculation.kozijn_price_engine'
      - '@brebo_calculation.commercial_calculator'

  brebo_calculation.result_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationResultRepository
    arguments: ['@database']

  brebo_calculation.result:
    class: Drupal\brebo_calculation\Service\CalculationResultService
    arguments:
      - '@brebo_calculation.result_repository'
      - '@brebo_calculation.line_read_model'
      - '@brebo_calculation.commercial_calculator'

  brebo_calculation.establishment_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationEstablishmentRepository
    arguments: ['@database']

  brebo_calculation.version_establisher:
    class: Drupal\brebo_calculation\Service\CalculationVersionEstablisher
    arguments:
      - '@brebo_calculation.establishment_repository'
      - '@brebo_calculation.result'
      - '@brebo_calculation.readiness_inspector'
      - '@datetime.time'
      - '@brebo_calculation.line_read_model'
      - '@brebo_calculation.legacy_line_mirror_map'

  brebo_calculation.totalizer:
    class: Drupal\brebo_calculation\Service\CalculationTotalizer

  brebo_calculation.distribution_calculator:
    class: Drupal\brebo_calculation\Service\DistributionCalculator

  brebo_calculation.legacy_reconciler:
    class: Drupal\brebo_calculation\Service\LegacyReconciler

  brebo_calculation.legacy_rule_mapper:
    class: Drupal\brebo_calculation\Service\LegacyRuleMapper

  brebo_calculation.legacy_cost_mapper:
    class: Drupal\brebo_calculation\Service\LegacyCostMapper

  brebo_calculation.legacy_dry_run:
    class: Drupal\brebo_calculation\Service\LegacyDryRunService
    arguments:
      - '@brebo_calculation.legacy_source'
      - '@brebo_calculation.legacy_rule_mapper'
      - '@brebo_calculation.legacy_cost_mapper'
      - '@brebo_calculation.totalizer'
      - '@brebo_calculation.legacy_reconciler'

  brebo_calculation.persistence:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationPersistence
    arguments:
      - '@database'
      - '@brebo_calculation.row_identity_generator'

  brebo_calculation.legacy_migration_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseLegacyMigrationRepository
    arguments: ['@database']

  brebo_calculation.guarded_legacy_migrator:
    class: Drupal\brebo_calculation\Service\GuardedLegacyMigrator
    arguments:
      - '@brebo_calculation.legacy_dry_run'
      - '@brebo_calculation.persistence'
      - '@brebo_calculation.legacy_source'
      - '@brebo_calculation.legacy_migration_repository'

  brebo_calculation.row_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationRowRepository
    arguments: ['@database']

  brebo_calculation.row_manager:
    class: Drupal\brebo_calculation\Service\CalculationRowManager
    arguments:
      - '@brebo_calculation.row_repository'
      - '@brebo_calculation.legacy_line_compatibility'
      - '@brebo_calculation.access_gateway'
      - '@brebo_calculation.row_identity_generator'

  brebo_calculation.object_line_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationObjectLineRepository
    arguments: ['@database']

  brebo_calculation.object_line_writer:
    class: Drupal\brebo_calculation\Service\CalculationObjectLineWriter
    arguments:
      - '@brebo_calculation.object_line_repository'
      - '@brebo_calculation.row_manager'
      - '@brebo_calculation.legacy_line_compatibility'

  brebo_calculation.block_order_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationBlockOrderRepository
    arguments: ['@database']

  brebo_calculation.block_order_manager:
    class: Drupal\brebo_calculation\Service\CalculationBlockOrderManager
    arguments:
      - '@brebo_calculation.block_order_repository'
      - '@brebo_calculation.legacy_line_compatibility'
      - '@brebo_calculation.access_gateway'

  brebo_calculation.norm_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationNormRepository
    arguments: ['@database']

  brebo_calculation.norm_library:
    class: Drupal\brebo_calculation\Service\CalculationNormLibrary
    arguments: ['@brebo_calculation.norm_repository']

  brebo_calculation.norm_feedback_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationNormFeedbackRepository
    arguments: ['@database']

  brebo_calculation.norm_feedback:
    class: Drupal\brebo_calculation\Service\CalculationNormFeedbackService
    arguments: ['@brebo_calculation.norm_feedback_repository']

  brebo_calculation.norm_version_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationNormVersionRepository
    arguments: ['@database']

  brebo_calculation.norm_version_manager:
    class: Drupal\brebo_calculation\Service\CalculationNormVersionManager
    arguments: ['@brebo_calculation.norm_version_repository']

  brebo_calculation.structure_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationStructureRepository
    arguments: ['@database']

  brebo_calculation.structure_manager:
    class: Drupal\brebo_calculation\Service\CalculationStructureManager
    arguments:
      - '@brebo_calculation.structure_repository'
      - '@brebo_calculation.access_gateway'
      - '@brebo_calculation.structure_identity_generator'

  brebo_calculation.price_source_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationPriceSourceRepository
    arguments: ['@database']

  brebo_calculation.price_source_manager:
    class: Drupal\brebo_calculation\Service\CalculationPriceSourceManager
    arguments:
      - '@brebo_calculation.price_source_repository'

  brebo_calculation.supplier_quote_normalizer:
    class: Drupal\brebo_calculation\Service\SupplierQuoteNormalizer

  brebo_calculation.supplier_quote_pdf_text_extractor:
    class: Drupal\brebo_calculation\Service\SupplierQuotePdfTextExtractor

  brebo_calculation.subcalculation_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseSubcalculationRepository
    arguments: ['@database']

  brebo_calculation.subcalculation_manager:
    class: Drupal\brebo_calculation\Service\SubcalculationManager
    arguments:
      - '@brebo_calculation.subcalculation_repository'

  brebo_calculation.object_exception_line_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseObjectExceptionLineRepository
    arguments: ['@database']

  brebo_calculation.object_exception_line_manager:
    class: Drupal\brebo_calculation\Service\ObjectExceptionLineManager
    arguments:
      - '@brebo_calculation.object_exception_line_repository'

  brebo_calculation.draft_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationDraftRepository
    arguments: ['@database']

  brebo_calculation.draft_initializer:
    class: Drupal\brebo_calculation\Service\CalculationDraftInitializer
    arguments:
      - '@brebo_calculation.draft_repository'

  brebo_calculation.recipe_formula_evaluator:
    class: Drupal\brebo_calculation\Service\RecipeFormulaEvaluator

  brebo_calculation.recipe_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseRecipeRepository
    arguments: ['@database']

  brebo_calculation.recipe_manager:
    class: Drupal\brebo_calculation\Service\RecipeManager
    arguments:
      - '@brebo_calculation.recipe_repository'
      - '@brebo_calculation.recipe_formula_evaluator'
      - '@brebo_calculation.access_gateway'

  brebo_calculation.recipe_material_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseRecipeMaterialRepository
    arguments: ['@database']

  brebo_calculation.recipe_material_selector:
    class: Drupal\brebo_calculation\Service\RecipeMaterialSelector
    arguments:
      - '@brebo_calculation.recipe_material_repository'
      - '@brebo_calculation.access_gateway'

  brebo_calculation.recipe_price_health_inspector:
    class: Drupal\brebo_calculation\Service\RecipePriceHealthInspector

  brebo_calculation.readiness_repository:
    class: Drupal\brebo_calculation\Infrastructure\DatabaseCalculationReadinessRepository
    arguments: ['@database']

  brebo_calculation.readiness_inspector:
    class: Drupal\brebo_calculation\Service\CalculationReadinessInspector
    arguments:
      - '@brebo_calculation.readiness_repository'
      - '@brebo_calculation.recipe_price_health_inspector'
      - '@brebo_calculation.line_read_model'

  brebo_calculation.offer_readiness_access:
    class: Drupal\brebo_calculation\Access\OfferReadinessAccessCheck
    arguments:
      - '@brebo_calculation.access_repository'
      - '@brebo_calculation.readiness_inspector'
    tags:
      - { name: access_check, applies_to: _brebo_offer_ready }

  brebo_calculation.offer_confirmed_access:
    class: Drupal\brebo_calculation\Access\OfferConfirmedAccessCheck
    arguments:
      - '@brebo_calculation.access_repository'
      - '@brebo_calculation.readiness_inspector'
      - '@request_stack'
    tags:
      - { name: access_check, applies_to: _brebo_offer_confirmed }

  brebo_calculation.offer_readiness_route_subscriber:
    class: Drupal\brebo_calculation\Routing\OfferReadinessRouteSubscriber
    tags:
      - { name: event_subscriber }

  brebo_calculation.calculation_document_set:
    class: Drupal\brebo_calculation\Service\CalculationDocumentSetService
    arguments:
      - '@database'
      - '@datetime.time'

  brebo_calculation.calculation_fact:
    class: Drupal\brebo_calculation\Service\CalculationFactService
    arguments:
      - '@database'
      - '@datetime.time'

  brebo_calculation.calculation_context_snapshot:
    class: Drupal\brebo_calculation\Service\CalculationContextSnapshotService
    arguments:
      - '@database'

  brebo_calculation.recipe_catalog:
    class: Drupal\brebo_calculation\Service\RecipeCatalogService
    arguments:
      - '@brebo_calculation.recipe_repository'
