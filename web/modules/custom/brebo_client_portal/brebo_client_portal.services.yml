services:
  brebo_client_portal.publication_policy:
    class: Drupal\brebo_client_portal\Publication\PortalPublicationPolicy

  brebo_client_portal.publication_store:
    class: Drupal\brebo_client_portal\Infrastructure\DrupalPortalPublicationStore
    arguments:
      - '@database'
      - '@datetime.time'
      - '@uuid'
      - '@current_user'

  Drupal\brebo_client_portal\Contract\PortalPublicationStoreInterface:
    alias: brebo_client_portal.publication_store

  brebo_client_portal.publication_manager:
    class: Drupal\brebo_client_portal\Publication\PortalPublicationManager
    arguments:
      - '@brebo_client_portal.publication_store'
      - '@brebo_client_portal.publication_policy'

  brebo_client_portal.project_projection_builder:
    class: Drupal\brebo_client_portal\Projection\ProjectPortalProjectionBuilder
    arguments:
      - '@brebo_project_cockpit.project_progress_builder'
      - '@brebo_project_cockpit.project_milestone_builder'
