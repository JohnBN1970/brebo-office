brebo_contract_control.audit_center:
  path: '/brebo/audit'
  defaults:
    _controller: '\Drupal\brebo_contract_control\Controller\AuditCenterController::overview'
    _title: 'Audit Center'
  requirements:
    _permission: 'access brebo audit center'

brebo_contract_control.audit_generate:
  path: '/brebo/audit/generate/{scope}'
  defaults:
    _controller: '\Drupal\brebo_contract_control\Controller\AuditCenterController::generate'
  requirements:
    _permission: 'generate brebo audit packages'
  methods: [POST]

brebo_contract_control.management_control_center:
  path: '/brebo/control-center'
  defaults:
    _controller: '\Drupal\brebo_contract_control\Controller\ManagementControlCenterController::overview'
    _title: 'Management Control Center'
  requirements:
    _permission: 'view brebo management control center'

brebo_contract_control.management_actions:
  path: '/brebo/control-center/actions/{action_key}'
  defaults:
    _controller: '\Drupal\brebo_contract_control\Controller\ManagementControlCenterController::actions'
    _title: 'Managementacties'
    action_key: 'all'
  requirements:
    _permission: 'view brebo management control center'

brebo_contract_control.management_action_source:
  path: '/brebo/control-center/action/{action_id}/source'
  defaults:
    _controller: '\Drupal\brebo_contract_control\Controller\ManagementControlCenterController::source'
    _title: 'Control Source dossier'
  requirements:
    _permission: 'view brebo management control center'
    action_id: '\d+'
