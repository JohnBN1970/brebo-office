services:
  brebo_contract_control.monitoring:
    class: Drupal\brebo_contract_control\Service\ContractMonitoringService
    arguments:
      - '@database'

  brebo_contract_control.payment_gate:
    class: Drupal\brebo_contract_control\Service\ContractPaymentGate
    arguments:
      - '@database'
      - '@brebo_contract_control.monitoring'

  brebo_contract_control.payment_batch_control:
    class: Drupal\brebo_contract_control\Service\PaymentBatchControlService
    arguments:
      - '@database'
