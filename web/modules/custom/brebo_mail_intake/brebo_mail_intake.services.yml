services:
  brebo_mail_intake.communication_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalMailCommunicationRepository
    arguments:
      - '@entity_type.manager'
      - '@current_user'

  Drupal\brebo_mail_intake\Contract\MailCommunicationRepositoryInterface:
    alias: brebo_mail_intake.communication_repository

  brebo_mail_intake.ingestor:
    class: Drupal\brebo_mail_intake\Service\MailIntakeIngestor
    arguments:
      - '@brebo_mail_intake.communication_repository'
      - '@brebo_mail_intake.mailbox_storage_repository'

  brebo_mail_intake.classifier:
    class: Drupal\brebo_mail_intake\Service\MailClassifier

  brebo_mail_intake.meaning_extractor:
    class: Drupal\brebo_mail_intake\Service\MailMeaningExtractor

  brebo_mail_intake.followup_advisor:
    class: Drupal\brebo_mail_intake\Service\MailFollowupAdvisor

  brebo_mail_intake.attention_scorer:
    class: Drupal\brebo_mail_intake\Service\MailAttentionScorer

  brebo_mail_intake.attachment_evidence:
    class: Drupal\brebo_mail_intake\Service\AttachmentEvidenceExtractor

  brebo_mail_intake.attachment_document_persister:
    class: Drupal\brebo_mail_intake\Service\AttachmentDocumentPersister
    arguments:
      - '@?brebo_document_data.repository'
      - '@?brebo_document_data.revision_series'

  brebo_mail_intake.mailbox_storage_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DatabaseMailboxStorageRepository
    arguments:
      - '@database'

  brebo_mail_intake.mail_domain_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DatabaseMailDomainRepository
    arguments:
      - '@database'

  Drupal\brebo_mail_intake\Contract\MailDomainRepositoryInterface:
    alias: brebo_mail_intake.mail_domain_repository

  brebo_mail_intake.mail_domain_service:
    class: Drupal\brebo_mail_intake\Service\MailDomainService
    arguments:
      - '@brebo_mail_intake.mail_domain_repository'

  brebo_mail_intake.core_mail_domain_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\CoreMailDomainRepositoryAdapter
    arguments:
      - '@database'

  Brebo\Mail\Contract\MailDomainRepositoryInterface:
    alias: brebo_mail_intake.core_mail_domain_repository

  brebo_mail_intake.core_mailbox_provisioning_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\CoreMailboxProvisioningRepositoryAdapter
    arguments:
      - '@database'

  Brebo\Mail\Contract\MailboxProvisioningRepositoryInterface:
    alias: brebo_mail_intake.core_mailbox_provisioning_repository

  brebo_mail_intake.core_dns_resolver:
    class: Drupal\brebo_mail_intake\Infrastructure\CoreNativeDnsResolverAdapter

  Brebo\Mail\Contract\DnsResolverInterface:
    alias: brebo_mail_intake.core_dns_resolver

  brebo_mail_intake.core_mail_domain_policy:
    class: Brebo\Mail\Domain\MailDomainDnsPolicy

  brebo_mail_intake.core_mail_domain_service:
    class: Brebo\Mail\Service\MailDomainService
    arguments:
      - '@brebo_mail_intake.core_mail_domain_repository'

  brebo_mail_intake.core_mail_domain_dns_check:
    class: Brebo\Mail\Service\MailDomainDnsCheckService
    arguments:
      - '@brebo_mail_intake.core_mail_domain_repository'
      - '@brebo_mail_intake.core_dns_resolver'
      - '@brebo_mail_intake.core_mail_domain_policy'

  brebo_mail_intake.core_mailbox_provisioning:
    class: Brebo\Mail\Service\MailboxProvisioningService
    arguments:
      - '@brebo_mail_intake.core_mailbox_provisioning_repository'
      - '@brebo_mail_intake.core_mail_domain_repository'

  brebo_mail_intake.core_gateway_http_client:
    class: Drupal\brebo_mail_intake\Infrastructure\CoreGatewayHttpClientAdapter
    arguments:
      - '@http_client_factory'

  brebo_mail_intake.core_http_mail_gateway:
    class: Brebo\Mail\Infrastructure\HttpMailGateway
    arguments:
      - '@brebo_mail_intake.core_gateway_http_client'

  brebo_mail_intake.core_mail_gateway:
    class: Drupal\brebo_mail_intake\Infrastructure\DeferredCoreMailGatewayAdapter

  Brebo\Mail\Contract\MailGatewayInterface:
    alias: brebo_mail_intake.core_mail_gateway

  brebo_mail_intake.core_provisioning_job_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\CoreProvisioningJobRepositoryAdapter
    arguments:
      - '@database'

  Brebo\Mail\Contract\ProvisioningJobRepositoryInterface:
    alias: brebo_mail_intake.core_provisioning_job_repository

  brebo_mail_intake.core_provisioning:
    class: Brebo\Mail\Service\ProvisioningService
    arguments:
      - '@brebo_mail_intake.core_provisioning_job_repository'
      - '@brebo_mail_intake.core_mail_gateway'

  brebo_mail_intake.mailbox_repository:
    class: Drupal\brebo_mail_intake\Service\MailboxRepository
    arguments:
      - '@brebo_mail_intake.mailbox_storage_repository'

  brebo_mail_intake.mailbox_access_policy:
    class: Drupal\brebo_mail_intake\Service\MailboxAccessPolicy
    arguments:
      - '@brebo_mail_intake.mailbox_repository'

  brebo_mail_intake.failure_store:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalStateMailIntakeFailureStore
    arguments:
      - '@state'

  Drupal\brebo_mail_intake\Contract\MailIntakeFailureStoreInterface:
    alias: brebo_mail_intake.failure_store

  brebo_mail_intake.failure_registry:
    class: Drupal\brebo_mail_intake\Service\MailIntakeFailureRegistry
    arguments:
      - '@brebo_mail_intake.failure_store'

  brebo_mail_intake.review_controller:
    class: Drupal\brebo_mail_intake\Controller\MailIntakeReviewV2Controller
    public: true
    arguments:
      - '@entity_type.manager'
      - '@brebo_mail_intake.meaning_extractor'
      - '@brebo_mail_intake.followup_advisor'
      - '@brebo_mail_intake.attention_scorer'
      - '@brebo_mail_intake.failure_registry'

  brebo_mail_intake.context_read_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalMailContextReadRepository
    arguments:
      - '@entity_type.manager'

  Drupal\brebo_mail_intake\Contract\MailContextReadRepositoryInterface:
    alias: brebo_mail_intake.context_read_repository

  brebo_mail_intake.relation_suggester:
    class: Drupal\brebo_mail_intake\Service\MailRelationSuggester
    arguments:
      - '@brebo_mail_intake.context_read_repository'

  brebo_mail_intake.bag_pdok:
    class: Drupal\brebo_mail_intake\Service\BagPdokClient
    arguments:
      - '@http_client'

  brebo_mail_intake.canonical_context_resolver:
    class: Drupal\brebo_mail_intake\Service\CanonicalContextResolver
    arguments:
      - '@brebo_mail_intake.context_read_repository'
      - '@brebo_mail_intake.bag_pdok'
      - '@?brebo_building_data.repository'

  brebo_mail_intake.crm_read_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalMailCrmReadRepository
    arguments:
      - '@entity_type.manager'

  Drupal\brebo_mail_intake\Contract\MailCrmReadRepositoryInterface:
    alias: brebo_mail_intake.crm_read_repository

  brebo_mail_intake.canonical_crm_context_resolver:
    class: Drupal\brebo_mail_intake\Service\CanonicalCrmContextResolver
    arguments:
      - '@brebo_mail_intake.crm_read_repository'

  brebo_mail_intake.provisional_context_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalProvisionalContextRepository
    arguments:
      - '@entity_type.manager'

  Drupal\brebo_mail_intake\Contract\ProvisionalContextRepositoryInterface:
    alias: brebo_mail_intake.provisional_context_repository

  brebo_mail_intake.provisional_context_materializer:
    class: Drupal\brebo_mail_intake\Service\ProvisionalContextMaterializer
    arguments:
      - '@brebo_mail_intake.provisional_context_repository'
      - '@?brebo_building_data.repository'

  brebo_mail_intake.pipeline:
    class: Drupal\brebo_mail_intake\Service\MailIntakePipeline
    arguments:
      - '@brebo_mail_intake.classifier'
      - '@brebo_mail_intake.meaning_extractor'
      - '@brebo_mail_intake.relation_suggester'
      - '@brebo_mail_intake.ingestor'
      - '@logger.channel.brebo_mail_intake'
      - '@brebo_mail_intake.failure_registry'
      - '@brebo_mail_intake.canonical_context_resolver'
      - '@brebo_mail_intake.canonical_crm_context_resolver'
      - '@brebo_mail_intake.attachment_evidence'
      - '@brebo_mail_intake.attachment_document_persister'
      - '@?brebo_finance.mail_purchase_invoice_router'

  brebo_mail_intake.queue_manager:
    class: Drupal\brebo_mail_intake\Service\MailIntakeQueueManager
    arguments:
      - '@queue'

  logger.channel.brebo_mail_intake:
    parent: logger.channel_base
    arguments: ['brebo_mail_intake']

  brebo_mail_intake.proposal_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalMailProposalRepository
    arguments:
      - '@entity_type.manager'

  Drupal\brebo_mail_intake\Contract\MailProposalRepositoryInterface:
    alias: brebo_mail_intake.proposal_repository

  brebo_mail_intake.proposal_materializer:
    class: Drupal\brebo_mail_intake\Service\MailProposalMaterializer
    arguments:
      - '@brebo_mail_intake.proposal_repository'

  brebo_mail_intake.gmail_source:
    class: Drupal\brebo_mail_intake\Source\GmailSourceAdapter
    arguments:
      - '@http_client_factory'
      - '@state'

  brebo_mail_intake.imap_source:
    class: Drupal\brebo_mail_intake\Source\ImapSourceAdapter
    arguments:
      - '@state'
      - 'BREBO_IMAP'
      - 'imap'

  brebo_mail_intake.zoho_migration_source:
    class: Drupal\brebo_mail_intake\Source\ImapSourceAdapter
    arguments:
      - '@state'
      - 'BREBO_ZOHO_IMAP'
      - 'zoho_migration'

  brebo_mail_intake.zoho_sent_migration_source:
    class: Drupal\brebo_mail_intake\Source\ImapSourceAdapter
    arguments:
      - '@state'
      - 'BREBO_ZOHO_SENT_IMAP'
      - 'zoho_sent_migration'

  brebo_mail_intake.source_mailbox_attachment_reader:
    class: Drupal\brebo_mail_intake\Service\SourceMailboxAttachmentReader

  brebo_mail_intake.editor_provisioner:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalMailEditorProvisioner
    arguments:
      - '@module_handler'

  Drupal\brebo_mail_intake\Contract\MailEditorProvisionerInterface:
    alias: brebo_mail_intake.editor_provisioner

  brebo_mail_intake.signature_read_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalMailSignatureReadRepository
    arguments:
      - '@entity_type.manager'
      - '@config.factory'

  Drupal\brebo_mail_intake\Contract\MailSignatureReadRepositoryInterface:
    alias: brebo_mail_intake.signature_read_repository

  brebo_mail_intake.signature_builder:
    class: Drupal\brebo_mail_intake\Service\MailSignatureBuilder
    arguments:
      - '@brebo_mail_intake.signature_read_repository'

  brebo_mail_intake.outbound_attachment_read_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DatabaseOutboundAttachmentReadRepository
    arguments:
      - '@database'

  brebo_mail_intake.outbound_attachment_persistence:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalOutboundAttachmentPersistence
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@file.usage'

  Drupal\brebo_mail_intake\Contract\OutboundAttachmentPersistenceInterface:
    alias: brebo_mail_intake.outbound_attachment_persistence

  brebo_mail_intake.outbound_attachments:
    class: Drupal\brebo_mail_intake\Service\OutboundAttachmentService
    arguments:
      - '@brebo_mail_intake.outbound_attachment_read_repository'
      - '@brebo_mail_intake.outbound_attachment_persistence'
      - '@brebo_document_data.repository'
      - '@brebo_document_data.storage_locator'
      - '@brebo_mail_intake.source_mailbox_attachment_reader'

  brebo_mail_intake.outbound_mail_persistence:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalOutboundMailPersistence
    arguments:
      - '@entity_type.manager'

  Drupal\brebo_mail_intake\Contract\OutboundMailPersistenceInterface:
    alias: brebo_mail_intake.outbound_mail_persistence

  brebo_mail_intake.outbound_mail_runtime:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalOutboundMailRuntime
    arguments:
      - '@current_user'
      - '@plugin.manager.mail'
      - '@datetime.time'
      - '@config.factory'

  Drupal\brebo_mail_intake\Contract\OutboundMailRuntimeInterface:
    alias: brebo_mail_intake.outbound_mail_runtime

  brebo_mail_intake.compose_source_repository:
    class: Drupal\brebo_mail_intake\Infrastructure\DrupalMailComposeSourceRepository
    arguments:
      - '@entity_type.manager'
      - '@current_user'

  Drupal\brebo_mail_intake\Contract\MailComposeSourceRepositoryInterface:
    alias: brebo_mail_intake.compose_source_repository

  brebo_mail_intake.outbound:
    class: Drupal\brebo_mail_intake\Service\OutboundMailService
    arguments:
      - '@brebo_mail_intake.outbound_mail_persistence'
      - '@brebo_mail_intake.outbound_mail_runtime'
      - '@brebo_mail_intake.signature_builder'
      - '@brebo_mail_intake.outbound_attachments'

  brebo_mail_intake.template_catalog:
    class: Drupal\brebo_mail_intake\Service\MailTemplateCatalog

  brebo_mail_intake.ai_draft_policy:
    class: Drupal\brebo_mail_intake\Service\AiMailDraftPolicy
    arguments:
      - '@brebo_mail_intake.template_catalog'

  brebo_mail_intake.organizational_draft:
    class: Drupal\brebo_mail_intake\Service\OrganizationalMailDraftService
    arguments:
      - '@brebo_mail_intake.template_catalog'
      - '@brebo_mail_intake.outbound'

  brebo_mail_intake.html_renderer:
    class: Drupal\brebo_mail_intake\Service\MailHtmlRenderer
