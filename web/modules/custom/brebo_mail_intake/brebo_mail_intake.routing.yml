brebo_mail_intake.admin:
  path: '/admin/brebo'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'BREBO'
  requirements:
    _permission: 'review brebo mail intake'

brebo_mail_intake.review_queue:
  path: '/admin/brebo/mail-intake'
  defaults:
    _controller: 'brebo_mail_intake_review_queue'
    _title: 'Mail Intake beoordelingswerkbak'
  requirements:
    _permission: 'review brebo mail intake'

brebo_mail_intake.failure_acknowledge:
  path: '/admin/brebo/mail-intake/technisch/{source_ref}/gezien'
  defaults:
    _form: '\Drupal\brebo_mail_intake\Form\MailIntakeFailureAcknowledgeForm'
    _title: 'Technische Mail Intake-uitzondering'
  requirements:
    _permission: 'review brebo mail intake'
    source_ref: '[a-f0-9]{16}'

brebo_mail_intake.close:
  path: '/admin/brebo/mail-intake/{node}/afhandelen'
  defaults:
    _form: '\Drupal\brebo_mail_intake\Form\MailIntakeCloseForm'
    _title: 'Mail Intake afhandelen'
  requirements:
    _permission: 'review brebo mail intake'
  options:
    parameters:
      node:
        type: entity:node

brebo_mail_intake.runtime_readiness:
  path: '/admin/brebo/mail-intake/runtime'
  defaults:
    _controller: '\Drupal\brebo_mail_intake\Controller\MailRuntimeReadinessController::page'
    _title: 'Mail runtime gereedheid'
  requirements:
    _permission: 'review brebo mail intake'

brebo_mail_intake.mailbox_root:
  path: '/admin/brebo/mail'
  defaults:
    _controller: '\Drupal\brebo_mail_intake\Controller\MailboxController::page'
    _title: 'Mail'
    mailbox_id: 0
    mail_state: 'inbox'
    communication_id: 0
  requirements:
    _permission: 'review brebo mail intake'

brebo_mail_intake.mailbox:
  path: '/admin/brebo/mail/{mailbox_id}/{mail_state}'
  defaults:
    _controller: '\Drupal\brebo_mail_intake\Controller\MailboxController::page'
    _title: 'Mail'
    communication_id: 0
  requirements:
    _permission: 'review brebo mail intake'
    mailbox_id: '\d+'
    mail_state: 'inbox|sent|draft|spam|archive|trash'

brebo_mail_intake.mailbox_message:
  path: '/admin/brebo/mail/{mailbox_id}/{mail_state}/{communication_id}'
  defaults:
    _controller: '\Drupal\brebo_mail_intake\Controller\MailboxController::page'
    _title: 'Mail'
  requirements:
    _permission: 'review brebo mail intake'
    mailbox_id: '\d+'
    communication_id: '\d+'
    mail_state: 'inbox|sent|draft|spam|archive|trash'
