services:
  brebo_office_core.communication_ai_processor:
    class: Drupal\brebo_office_core\Service\CommunicationAiProcessor

  brebo_office_core.integration_api_client:
    class: Drupal\brebo_office_core\Service\IntegrationApiClient
    arguments:
      - '@http_client'
      - '@logger.channel.brebo_office_core'
      - '@brebo_office_core.integration_api_request_signer'

  brebo_office_core.integration_api_request_signer:
    class: Drupal\brebo_office_core\Service\IntegrationApiRequestSigner

  logger.channel.brebo_office_core:
    parent: logger.channel_base
    arguments:
      - 'brebo_office_core'

  brebo_office_core.project_schedule_calculator:
    class: Drupal\brebo_office_core\Service\ProjectScheduleCalculator

  brebo_office_core.personnel_budget_control:
    class: Drupal\brebo_office_core\Service\PersonnelBudgetControl

  brebo_office_core.workforce_geofence:
    class: Drupal\brebo_office_core\Service\WorkforceGeoFence

  brebo_office_core.workforce_schedule_control:
    class: Drupal\brebo_office_core\Service\WorkforceScheduleControl

  brebo_office_core.workforce_qualification_matcher:
    class: Drupal\brebo_office_core\Service\WorkforceQualificationMatcher

  brebo_office_core.workforce_planning_optimizer:
    class: Drupal\brebo_office_core\Service\WorkforcePlanningOptimizer

  brebo_office_core.workforce_resource_control:
    class: Drupal\brebo_office_core\Service\WorkforceResourceControl

  brebo_office_core.workforce_day_start_control:
    class: Drupal\brebo_office_core\Service\WorkforceDayStartControl

  brebo_office_core.workforce_time_entry_control:
    class: Drupal\brebo_office_core\Service\WorkforceTimeEntryControl

  brebo_office_core.workforce_labor_cost:
    class: Drupal\brebo_office_core\Service\WorkforceLaborCostService
    arguments:
      - '@entity_type.manager'

  brebo_office_core.project_financial_control:
    class: Drupal\brebo_office_core\Service\ProjectFinancialControl
    arguments:
      - '@entity_type.manager'
      - '@brebo_office_core.workforce_labor_cost'
      - '@database'

  brebo_office_core.project_early_warning:
    class: Drupal\brebo_office_core\Service\ProjectEarlyWarningService
    arguments:
      - '@brebo_office_core.project_financial_control'

  brebo_office_core.project_financial_route_subscriber:
    class: Drupal\brebo_office_core\Routing\ProjectFinancialRouteSubscriber
    tags:
      - { name: event_subscriber }
