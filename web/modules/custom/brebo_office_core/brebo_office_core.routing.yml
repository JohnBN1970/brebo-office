brebo_office_core.dashboard:
  path: '/office'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::dashboard'
    _title: 'BREBO Office'
  requirements:
    _access: 'TRUE'

brebo_office_core.projects:
  path: '/office/projecten'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::objectList'
    _title: 'Projecten'
    bundle: 'brebo_project'
  requirements:
    _permission: 'access content'

brebo_office_core.clusters:
  path: '/office/clusters'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::objectList'
    _title: 'Clusters'
    bundle: 'brebo_cluster'
  requirements:
    _permission: 'access content'

brebo_office_core.dwellings:
  path: '/office/woningen'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::objectList'
    _title: 'Woningen'
    bundle: 'brebo_dwelling'
  requirements:
    _permission: 'access content'

brebo_office_core.dwelling_dossier:
  path: '/office/woningen/{node}'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::dwellingDossier'
    _title_callback: '\Drupal\brebo_office_core\Controller\OfficeController::dwellingDossierTitle'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_office_core.positions:
  path: '/office/productposities'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::objectList'
    _title: 'Productposities'
    bundle: 'brebo_product_position'
  requirements:
    _permission: 'access content'

brebo_office_core.verifications:
  path: '/office/controles'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::objectList'
    _title: 'Controles en verificaties'
    bundle: 'brebo_verification'
  requirements:
    _permission: 'access content'

brebo_office_core.deviations:
  path: '/office/afwijkingen'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::objectList'
    _title: 'Afwijkingen'
    bundle: 'brebo_deviation'
  requirements:
    _permission: 'access content'

brebo_office_core.quality_dashboard:
  path: '/office/kwaliteit'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::qualityDashboard'
    _title: 'Kwaliteitsdashboard'
  requirements:
    _permission: 'access content'

brebo_office_core.quality_report:
  path: '/office/rapportages/kwaliteit'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::qualityReport'
    _title: 'BREBO kwaliteitsrapportage'
  requirements:
    _permission: 'access content'

brebo_office_core.project_dashboard:
  path: '/office/projecten/{node}'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::projectDashboard'
    _title_callback: '\Drupal\brebo_office_core\Controller\OfficeController::projectDashboardTitle'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_office_core.work_packages:
  path: '/office/werkpakketten'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::objectList'
    _title: 'Werkpakketten'
    bundle: 'brebo_work_package'
  requirements:
    _permission: 'access content'

brebo_office_core.work_package_dashboard:
  path: '/office/werkpakketten/{node}'
  defaults:
    _controller: '\Drupal\brebo_office_core\Controller\OfficeController::workPackageDashboard'
    _title_callback: '\Drupal\brebo_office_core\Controller\OfficeController::workPackageDashboardTitle'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node
