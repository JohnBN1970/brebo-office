services:
  brebo_data_intake.ingest_manager:
    class: Drupal\brebo_data_intake\Service\DataIngestManager
    arguments: ['@database', '@datetime.time']

  brebo_data_intake.classification_repository:
    class: Drupal\brebo_data_intake\Service\ClassificationRepository
    arguments: ['@database', '@datetime.time']

  brebo_data_intake.candidate_repository:
    class: Drupal\brebo_data_intake\Service\MasterdataCandidateRepository
    arguments: ['@database', '@datetime.time']

  brebo_data_intake.nlbe_sfb_provider:
    class: Drupal\brebo_data_intake\Service\NlbeSfbProvider
    arguments: ['@brebo_data_intake.ingest_manager', '@brebo_data_intake.classification_repository']

  brebo_data_intake.source_neutral_intake_manager:
    class: Drupal\brebo_data_intake\Service\SourceNeutralIntakeManager
    arguments:
      - !tagged_iterator brebo_data_intake.destination
      - '@brebo_data_intake.ingest_manager'
      - '@lock'

  brebo_data_intake.review_repository:
    class: Drupal\brebo_data_intake\Service\IntakeReviewRepository
    arguments: ['@database']

  brebo_data_intake.decision_manager:
    class: Drupal\brebo_data_intake\Service\IntakeDecisionManager
    arguments:
      - '@database'
      - '@datetime.time'
      - '@lock'
      - !tagged_iterator brebo_data_intake.destination
