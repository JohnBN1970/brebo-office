brebo_data_intake.upload:
  path: '/brebo-office/intake/upload'
  defaults:
    _form: '\Drupal\brebo_data_intake\Form\SourceNeutralUploadForm'
    _title: 'Nieuwe intake'
  requirements:
    _permission: 'submit brebo office intake'

brebo_data_intake.review:
  path: '/brebo-office/intake'
  defaults:
    _controller: '\Drupal\brebo_data_intake\Controller\IntakeReviewController::overview'
    _title: 'Intakewerkbank'
  requirements:
    _permission: 'review brebo office intake'

brebo_data_intake.review_decision:
  path: '/brebo-office/intake/{record}/review'
  defaults:
    _form: '\Drupal\brebo_data_intake\Form\IntakeReviewDecisionForm'
    _title: 'Intake beoordelen'
  requirements:
    _permission: 'review brebo office intake'
    record: '\d+'

brebo_data_intake.external_project_v1:
  path: '/brebo-internal/intake/v1/project-request'
  defaults:
    _controller: '\Drupal\brebo_data_intake\Controller\ExternalProjectIntakeController::ingest'
  requirements:
    _access: 'TRUE'
  methods: [POST]

brebo_data_intake.external_project_document_v1:
  path: '/brebo-internal/intake/v1/project-document'
  defaults:
    _controller: '\Drupal\brebo_data_intake\Controller\ExternalProjectDocumentController::upload'
  requirements:
    _access: 'TRUE'
  methods: [POST]

# Backward-compatible legacy routes. brebo-platform can migrate to v1 without
# forcing an atomic deploy of both repositories.
brebo_data_intake.website_europakozijn:
  path: '/brebo-internal/intake/europakozijn'
  defaults:
    _controller: '\Drupal\brebo_data_intake\Controller\WebsiteEuropakozijnIntakeController::ingest'
  requirements:
    _access: 'TRUE'
  methods: [POST]

brebo_data_intake.website_europakozijn_project_document:
  path: '/brebo-internal/intake/europakozijn/project-document'
  defaults:
    _controller: '\Drupal\brebo_data_intake\Controller\WebsiteEuropakozijnProjectDocumentController::upload'
  requirements:
    _access: 'TRUE'
  methods: [POST]
