brebo_building_data.object_tree:
  path: '/brebo-office/api/buildings/{building_nid}/objects'
  defaults:
    _controller: '\Drupal\brebo_building_data\Controller\BuildingObjectTreeController::tree'
    _title: 'Gebouwobjecten'
  requirements:
    _permission: 'access content'
    building_nid: '\d+'
  methods: [GET]
  options:
    no_cache: TRUE

brebo_building_data.project_buildings:
  path: '/brebo-office/api/projects/{project_nid}/buildings'
  defaults:
    _controller: '\Drupal\brebo_building_data\Controller\ProjectBuildingController::list'
    _title: 'Projectgebouwen'
  requirements:
    _permission: 'access content'
    project_nid: '\d+'
  methods: [GET]
  options:
    no_cache: TRUE

brebo_building_data.truth_workbench:
  path: '/brebo-office/buildings/{node}/truth'
  defaults:
    _controller: '\Drupal\brebo_building_data\Controller\BuildingTruthWorkbenchController::workbench'
    _title_callback: '\Drupal\brebo_building_data\Controller\BuildingTruthWorkbenchController::title'
  requirements:
    _permission: 'access content'
    node: '\d+'
  methods: [GET]
  options:
    parameters:
      node:
        type: entity:node
    no_cache: TRUE

brebo_building_data.truth_proposal_review:
  path: '/brebo-office/buildings/{node}/truth/proposals/{proposal}/review'
  defaults:
    _form: '\Drupal\brebo_building_data\Form\BuildingTruthProposalReviewForm'
    _title: 'Revisievoorstel verifieren'
  requirements:
    _entity_access: 'node.update'
    node: '\d+'
    proposal: '\d+'
  methods: [GET, POST]
  options:
    parameters:
      node:
        type: entity:node
    no_cache: TRUE
