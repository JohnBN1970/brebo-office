services:
  brebo_building_data.repository:
    class: Drupal\brebo_building_data\Service\BuildingRelationRepository
    arguments: ['@database', '@entity_type.manager', '@datetime.time']

  brebo_building_data.object_repository:
    class: Drupal\brebo_building_data\Infrastructure\DatabaseBuildingObjectRepository
    arguments: ['@database', '@entity_type.manager', '@datetime.time']

  Drupal\brebo_building_data\Contract\BuildingObjectRepositoryInterface:
    alias: brebo_building_data.object_repository

  brebo_building_data.project_building_repository:
    class: Drupal\brebo_building_data\Infrastructure\DatabaseProjectBuildingRepository
    arguments: ['@database', '@entity_type.manager', '@datetime.time']

  brebo_building_data.truth_repository:
    class: Drupal\brebo_building_data\Infrastructure\DatabaseBuildingTruthRepository
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@lock'
      - '@brebo_building_data.object_repository'

  Drupal\brebo_building_data\Contract\BuildingTruthRepositoryInterface:
    alias: brebo_building_data.truth_repository

  brebo_building_data.pdok_enricher:
    class: Drupal\brebo_building_data\Service\PdokBuildingEnricher
    arguments:
      - '@http_client'
      - '@brebo_building_data.repository'
