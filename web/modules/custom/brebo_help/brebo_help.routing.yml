brebo_help.center:
  path: '/brebo/help'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\HelpController::center'
    _title: 'Help'
  requirements:
    _permission: 'access brebo help'

brebo_help.tasks:
  path: '/brebo/help/taken'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\TaskGuideController::index'
    _title: 'Dagelijkse taken'
  requirements:
    _permission: 'access brebo help'

brebo_help.task:
  path: '/brebo/help/taken/{task}'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\TaskGuideController::guide'
    _title_callback: '\Drupal\brebo_help\Controller\TaskGuideController::title'
  requirements:
    _permission: 'access brebo help'
    task: '[a-z0-9-]+'

brebo_help.article:
  path: '/brebo/help/{article}'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\HelpController::article'
    _title_callback: '\Drupal\brebo_help\Controller\HelpController::articleTitle'
  requirements:
    _permission: 'access brebo help'
    article: '[a-z0-9-]+'
