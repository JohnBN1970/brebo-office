brebo_help.center:
  path: '/brebo/help'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\HelpController::center'
    _title: 'Help'
  requirements:
    _permission: 'access brebo help'

brebo_help.tasks:
  path: '/brebo/help/taken'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\TaskGuideController::index'
    _title: 'Dagelijkse taken'
  requirements:
    _permission: 'access brebo help'

brebo_help.task:
  path: '/brebo/help/taken/{task}'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\TaskGuideController::guide'
    _title_callback: '\Drupal\brebo_help\Controller\TaskGuideController::title'
  requirements:
    _permission: 'access brebo help'
    task: '[a-z0-9-]+'

brebo_help.glossary:
  path: '/brebo/help/begrippen'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\GlossaryController::index'
    _title: 'Begrippen & beslisregels'
  requirements:
    _permission: 'access brebo help'

brebo_help.term:
  path: '/brebo/help/begrippen/{term}'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\GlossaryController::term'
    _title_callback: '\Drupal\brebo_help\Controller\GlossaryController::title'
  requirements:
    _permission: 'access brebo help'
    term: '[a-z0-9-]+'

brebo_help.faq:
  path: '/brebo/help/vragen'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\FaqController::index'
    _title: 'Veelgestelde vragen & problemen oplossen'
  requirements:
    _permission: 'access brebo help'

brebo_help.faq_item:
  path: '/brebo/help/vragen/{faq}'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\FaqController::item'
    _title_callback: '\Drupal\brebo_help\Controller\FaqController::title'
  requirements:
    _permission: 'access brebo help'
    faq: '[a-z0-9-]+'

brebo_help.article:
  path: '/brebo/help/{article}'
  defaults:
    _controller: '\Drupal\brebo_help\Controller\HelpController::article'
    _title_callback: '\Drupal\brebo_help\Controller\HelpController::articleTitle'
  requirements:
    _permission: 'access brebo help'
    article: '[a-z0-9-]+'
