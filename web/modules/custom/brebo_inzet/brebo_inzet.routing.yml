brebo_inzet.app:
  path: '/inzet'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\InzetHomeController::start'
    _title: 'BREBO Inzet'
  requirements:
    _user_is_logged_in: 'TRUE'

brebo_inzet.project_dashboard:
  path: '/projecten/{node}/inzet'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\ProjectInzetHubController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\ProjectInzetHubController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.personnel_planning:
  path: '/inzet/planning'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\PersonnelPlanningController::overview'
    _title: 'Personeelsplanning'
  requirements:
    _permission: 'edit any brebo_personnel_assignment content'

brebo_inzet.app_clock:
  path: '/inzet/project/{node}'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\MobileClockForm'
    _title: 'BREBO Inzet'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_hours_control:
  path: '/projecten/{node}/inzet/urencontrole'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\ProjectHoursControlController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\ProjectHoursControlController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_proposal:
  path: '/projecten/{node}/inzet/projectvoorstel'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\ProjectInzetProposalForm'
    _title: 'Projectinzet voorstellen'
  requirements:
    _permission: 'edit any brebo_personnel_assignment content'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_week_planning:
  path: '/projecten/{node}/inzet/week'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\ProjectWeekPlanningController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\ProjectWeekPlanningController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_quick_planning:
  path: '/projecten/{node}/inzet/plannen'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\ProjectQuickPlanningForm'
    _title: 'Medewerkers plannen'
  requirements:
    _permission: 'edit any brebo_personnel_assignment content'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_team:
  path: '/projecten/{node}/inzet/projectteam'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\ProjectTeamForm'
    _title: 'Projectteam'
  requirements:
    _permission: 'edit any brebo_personnel_assignment content'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_clock_zones:
  path: '/projecten/{node}/inzet/kloklocaties'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\ProjectClockZoneController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\ProjectClockZoneController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_clock_zone_add:
