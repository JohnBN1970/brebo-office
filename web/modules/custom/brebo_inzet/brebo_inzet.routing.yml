brebo_inzet.app:
  path: '/inzet'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\InzetHomeController::start'
    _title: 'BREBO Inzet'
  requirements:
    _user_is_logged_in: 'TRUE'

brebo_inzet.personnel_planning:
  path: '/inzet/planning'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\PersonnelPlanningController::overview'
    _title: 'Personeelsplanning'
  requirements:
    _user_is_logged_in: 'TRUE'

brebo_inzet.app_clock:
  path: '/inzet/project/{node}'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\MobileClockForm'
    _title: 'BREBO Inzet'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_clock_zones:
  path: '/projecten/{node}/inzet/kloklocaties'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\ProjectClockZoneController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\ProjectClockZoneController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_clock_zone_add:
  path: '/projecten/{node}/inzet/kloklocaties/toevoegen'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\ProjectClockZoneForm'
    _title: 'Kloklocatie toevoegen'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_clock_zone_edit:
  path: '/projecten/{node}/inzet/kloklocaties/{zone}/bewerken'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\ProjectClockZoneForm'
    _title: 'Kloklocatie bewerken'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node
      zone:
        type: entity:node

brebo_inzet.project_clock_deviations:
  path: '/projecten/{node}/inzet/afwijkingen'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\ClockDeviationController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\ClockDeviationController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.project_clock_settings:
  path: '/projecten/{node}/inzet/instellingen'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\ProjectClockSettingsForm'
    _title: 'Inzet-klok instellingen'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.mobile_clock:
  path: '/projecten/{node}/inzet/klokken'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\MobileClockForm'
    _title: 'Klokken'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.live_workforce:
  path: '/projecten/{node}/inzet/nu-aan-het-werk'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\LiveWorkforceController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\LiveWorkforceController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node
