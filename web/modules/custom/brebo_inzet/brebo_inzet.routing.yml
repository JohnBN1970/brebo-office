  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.mobile_clock:
  path: '/projecten/{node}/inzet/klokken'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\MobileClockForm'
    _title: 'Klokken'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

brebo_inzet.live_workforce:
  path: '/projecten/{node}/inzet/nu-aan-het-werk'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\LiveWorkforceController::overview'
    _title_callback: '\Drupal\brebo_inzet\Controller\LiveWorkforceController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node


brebo_inzet.onsite_link_request:
  path: '/api/onsite/v1/link/request'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\OnSiteLinkController::requestCode'
  methods: [POST]
  requirements:
    _access: 'TRUE'

brebo_inzet.onsite_link_verify:
  path: '/api/onsite/v1/link/verify'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\OnSiteLinkController::verifyCode'
  methods: [POST]
  requirements:
    _access: 'TRUE'


brebo_inzet.onsite_bootstrap:
  path: '/api/onsite/v1/bootstrap'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\OnSiteBootstrapController::bootstrap'
  methods: [GET]
  requirements:
    _access: 'TRUE'


brebo_inzet.onsite_presence_record:
  path: '/api/onsite/v1/presence'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\OnSitePresenceController::record'
  methods: [POST]
  requirements:
    _access: 'TRUE'


brebo_inzet.onsite_install:
  path: '/onsite/install'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\OnSiteInstallController::page'
    _title: 'BREBO OnSite'
  requirements:
    _access: 'TRUE'


brebo_inzet.onsite_activate:
  path: '/api/onsite/v1/activate'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\OnSiteActivationController::activate'
  methods: [POST]
  requirements:
    _access: 'TRUE'

brebo_inzet.onsite_invite_user:
  path: '/user/{user}/onsite-uitnodigen'
  defaults:
    _controller: '\Drupal\brebo_inzet\Controller\OnSiteInviteController::page'
    _title: 'OnSite uitnodigen'
  requirements:
    _permission: 'administer users'
  options:
    parameters:
      user:
        type: entity:user

brebo_inzet.availability:
  path: '/inzet/beschikbaarheid'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\WorkforceAvailabilityForm'
    _title: 'Beschikbaarheid'
  requirements:
    _permission: 'edit any brebo_personnel_assignment content'


brebo_inzet.project_hours_approval:
  path: '/projecten/{node}/inzet/urencontrole/beoordelen'
  defaults:
    _form: '\Drupal\brebo_inzet\Form\ProjectHoursApprovalForm'
    _title: 'Uren beoordelen'
  requirements:
    _permission: 'edit any brebo_personnel_assignment content'
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node
