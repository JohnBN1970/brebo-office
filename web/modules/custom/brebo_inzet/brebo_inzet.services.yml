services:
  brebo_inzet.project_inzet_proposal_read_repository:
    class: Drupal\brebo_inzet\Infrastructure\DrupalProjectInzetProposalReadRepository
    arguments: ['@entity_type.manager']

  Drupal\brebo_inzet\Contract\ProjectInzetProposalReadRepositoryInterface:
    alias: brebo_inzet.project_inzet_proposal_read_repository

  brebo_inzet.project_inzet_proposal_builder:
    class: Drupal\brebo_inzet\Service\ProjectInzetProposalBuilder
    arguments: ['@brebo_inzet.project_inzet_proposal_read_repository']

  brebo_inzet.personnel_budget_control:
    class: Drupal\brebo_inzet\Service\PersonnelBudgetControl

  brebo_inzet.workforce_schedule_control:
    class: Drupal\brebo_inzet\Service\WorkforceScheduleControl

  brebo_inzet.workforce_geofence:
    class: Drupal\brebo_inzet\Service\WorkforceGeoFence

  brebo_inzet.project_clock_zone_control:
    class: Drupal\brebo_inzet\Service\ProjectClockZoneControl
    arguments: ['@brebo_inzet.workforce_geofence']

  brebo_inzet.project_clock_zone_repository:
    class: Drupal\brebo_inzet\Infrastructure\DrupalProjectClockZoneRepository
    arguments: ['@entity_type.manager']

  Drupal\brebo_inzet\Contract\ProjectClockZoneRepositoryInterface:
    alias: brebo_inzet.project_clock_zone_repository

  brebo_inzet.project_clock_zone_manager:
    class: Drupal\brebo_inzet\Service\ProjectClockZoneManager
    arguments: ['@brebo_inzet.project_clock_zone_repository']

  brebo_inzet.clock_time_control:
    class: Drupal\brebo_inzet\Service\ClockTimeControl

  brebo_inzet.clock_transition_control:
    class: Drupal\brebo_inzet\Service\ClockTransitionControl

  brebo_inzet.clock_action_control:
    class: Drupal\brebo_inzet\Service\ClockActionControl
    arguments: ['@brebo_inzet.clock_time_control', '@brebo_inzet.clock_transition_control']

  brebo_inzet.clock_registration_repository:
    class: Drupal\brebo_inzet\Infrastructure\DrupalClockRegistrationRepository
    arguments: ['@entity_type.manager']

  Drupal\brebo_inzet\Contract\ClockRegistrationRepositoryInterface:
    alias: brebo_inzet.clock_registration_repository

  brebo_inzet.clock_registration_writer:
    class: Drupal\brebo_inzet\Service\ClockRegistrationWriter
    arguments: ['@brebo_inzet.clock_registration_repository']

  brebo_inzet.pause_policy:
    class: Drupal\brebo_inzet\Service\PausePolicy

  brebo_inzet.clock_transition_reconciler:
    class: Drupal\brebo_inzet\Service\ClockTransitionReconciler
    arguments: ['@brebo_inzet.clock_registration_repository', '@brebo_inzet.clock_transition_control']

  brebo_inzet.clock_session_manager:
    class: Drupal\brebo_inzet\Service\ClockSessionManager
    arguments: ['@brebo_inzet.clock_registration_repository', '@brebo_inzet.project_clock_zone_manager', '@brebo_inzet.project_clock_zone_control', '@brebo_inzet.clock_action_control', '@brebo_inzet.clock_transition_reconciler']

  brebo_inzet.personnel_assignment_comparison_repository:
    class: Drupal\brebo_inzet\Infrastructure\DrupalPersonnelAssignmentComparisonRepository
    arguments: ['@entity_type.manager', '@config.factory']

  Drupal\brebo_inzet\Contract\PersonnelAssignmentComparisonRepositoryInterface:
    alias: brebo_inzet.personnel_assignment_comparison_repository

  brebo_inzet.personnel_assignment_comparison:
    class: Drupal\brebo_inzet\Service\PersonnelAssignmentComparison
    arguments: ['@brebo_inzet.personnel_assignment_comparison_repository']


  brebo_inzet.onsite_identity_repository:
    class: Drupal\brebo_inzet\Infrastructure\DrupalOnSiteIdentityRepository
    arguments: ['@entity_type.manager']

  Drupal\brebo_inzet\Contract\OnSiteIdentityRepositoryInterface:
    alias: brebo_inzet.onsite_identity_repository

  brebo_inzet.onsite_identity_resolver:
    class: Drupal\brebo_inzet\Service\OnSiteIdentityResolver
    arguments: ['@brebo_inzet.onsite_identity_repository']


  brebo_inzet.onsite_sms_sender:
    class: Drupal\brebo_inzet\Service\UnavailableOnSiteSmsSender

  brebo_inzet.onsite_otp_store:
    class: Drupal\brebo_inzet\Infrastructure\DrupalOnSiteOtpStore
    arguments: ['@keyvalue.expirable']

  Drupal\brebo_inzet\Contract\OnSiteOtpStoreInterface:
    alias: brebo_inzet.onsite_otp_store

  brebo_inzet.onsite_otp_secret_provider:
    class: Drupal\brebo_inzet\Infrastructure\DrupalOnSiteOtpSecretProvider
    arguments: ['@private_key']

  Drupal\brebo_inzet\Contract\OnSiteOtpSecretProviderInterface:
    alias: brebo_inzet.onsite_otp_secret_provider

  brebo_inzet.onsite_otp_rate_limiter:
    class: Drupal\brebo_inzet\Infrastructure\DrupalOnSiteOtpRateLimiter
    arguments: ['@flood']

  Drupal\brebo_inzet\Contract\OnSiteOtpRateLimiterInterface:
    alias: brebo_inzet.onsite_otp_rate_limiter

  brebo_inzet.onsite_otp_manager:
    class: Drupal\brebo_inzet\Service\OnSiteOtpManager
    arguments:
      - '@brebo_inzet.onsite_identity_resolver'
      - '@brebo_inzet.onsite_sms_sender'
      - '@brebo_inzet.onsite_otp_store'
      - '@brebo_inzet.onsite_otp_secret_provider'
      - '@brebo_inzet.onsite_otp_rate_limiter'


  brebo_inzet.onsite_device_store:
    class: Drupal\brebo_inzet\Infrastructure\DrupalOnSiteDeviceStore
    arguments: ['@keyvalue']

  Drupal\brebo_inzet\Contract\OnSiteDeviceStoreInterface:
    alias: brebo_inzet.onsite_device_store

  brebo_inzet.onsite_device_registry:
    class: Drupal\brebo_inzet\Service\OnSiteDeviceRegistry
    arguments: ['@brebo_inzet.onsite_device_store']


  brebo_inzet.onsite_repository:
    class: Drupal\brebo_inzet\Infrastructure\DrupalOnSiteRepository
    arguments: ['@entity_type.manager']

  Drupal\brebo_inzet\Contract\OnSiteRepositoryInterface:
    alias: brebo_inzet.onsite_repository

  brebo_inzet.onsite_assignment_provider:
    class: Drupal\brebo_inzet\Service\OnSiteAssignmentProvider
    arguments:
      - '@brebo_inzet.onsite_repository'
      - '@brebo_inzet.project_clock_zone_manager'


  brebo_inzet.onsite_presence_evidence_writer:
    class: Drupal\brebo_inzet\Service\OnSitePresenceEvidenceWriter
    arguments:
      - '@brebo_inzet.onsite_repository'


  brebo_inzet.onsite_activation_store:
    class: Drupal\brebo_inzet\Infrastructure\DrupalOnSiteActivationStore
    arguments:
      - '@keyvalue.expirable'

  Drupal\brebo_inzet\Contract\OnSiteActivationStoreInterface:
    alias: brebo_inzet.onsite_activation_store

  brebo_inzet.onsite_activation_manager:
    class: Drupal\brebo_inzet\Service\OnSiteActivationManager
    arguments:
      - '@brebo_inzet.onsite_activation_store'
      - '@brebo_inzet.onsite_device_registry'

  brebo_inzet.onsite_invitation_manager:
    class: Drupal\brebo_inzet\Service\OnSiteInvitationManager
    arguments:
      - '@brebo_inzet.onsite_identity_resolver'
      - '@brebo_inzet.onsite_activation_manager'

  brebo_inzet.personnel_assignment_repository:
    class: Drupal\brebo_inzet\Infrastructure\DrupalPersonnelAssignmentRepository
    arguments: ['@entity_type.manager']

  Drupal\brebo_inzet\Contract\PersonnelAssignmentRepositoryInterface:
    alias: brebo_inzet.personnel_assignment_repository

  brebo_inzet.personnel_finance_synchronizer:
    class: Drupal\brebo_inzet\Service\PersonnelFinanceSynchronizer
    arguments: ['@brebo_finance.labour_productivity_manager', '@brebo_inzet.personnel_assignment_repository']

  brebo_inzet.personnel_actual_hours_manager:
    class: Drupal\brebo_inzet\Service\PersonnelActualHoursManager
    arguments: ['@brebo_inzet.personnel_assignment_comparison', '@brebo_finance.labour_productivity_manager', '@brebo_inzet.personnel_labour_line_resolver', '@brebo_inzet.personnel_assignment_repository']

  brebo_inzet.personnel_labour_line_resolver:
    class: Drupal\brebo_inzet\Service\PersonnelLabourLineResolver
    arguments: ['@brebo_finance.labour_productivity_manager']
