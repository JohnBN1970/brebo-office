services:
  brebo_procurement_control.repository:
    class: Drupal\brebo_procurement_control\Infrastructure\DatabaseProcurementControlRepository
    arguments:
      - '@database'

  Drupal\brebo_procurement_control\Contract\ProcurementControlRepositoryInterface:
    alias: brebo_procurement_control.repository

  brebo_procurement_control.decision_gate:
    class: Drupal\brebo_procurement_control\Service\ProcurementDecisionGate
    arguments:
      - '@brebo_procurement_control.repository'
      - '@brebo_control.supplier_bid_evaluation'

  brebo_procurement_control.outcomes:
    class: Drupal\brebo_procurement_control\Service\ProcurementOutcomeService
    arguments:
      - '@brebo_procurement_control.repository'

  brebo_procurement_control.learning:
    class: Drupal\brebo_procurement_control\Service\ProcurementOutcomeLearningService
    arguments:
      - '@brebo_procurement_control.repository'

  brebo_procurement_control.model_governance:
    class: Drupal\brebo_procurement_control\Service\ProcurementModelGovernanceService
    arguments:
      - '@brebo_procurement_control.repository'
      - '@brebo_procurement_control.learning'

  brebo_procurement_control.decision_intelligence:
    class: Drupal\brebo_procurement_control\Service\ProcurementDecisionIntelligenceService
    arguments:
      - '@brebo_procurement_control.repository'

  brebo_procurement_control.context_intelligence:
    class: Drupal\brebo_procurement_control\Service\ProcurementContextIntelligenceService
    arguments:
      - '@brebo_procurement_control.repository'

  brebo_procurement_control.control_mode_gate:
    class: Drupal\brebo_procurement_control\Service\ProcurementControlModeGate
    arguments:
      - '@brebo_procurement_control.context_intelligence'

  brebo_procurement_control.award_gate:
    class: Drupal\brebo_procurement_control\Service\ProcurementAwardGate
    arguments:
      - '@brebo_procurement_control.repository'
      - '@brebo_procurement_control.control_mode_gate'

  brebo_procurement_control.fulfilment_decision:
    class: Drupal\brebo_procurement_control\Service\ProcurementFulfilmentDecisionService
