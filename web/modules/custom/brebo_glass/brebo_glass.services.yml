services:
  brebo_glass.wind_load_calculator:
    class: Drupal\brebo_glass\Service\GlassWindLoadCalculator

  brebo_glass.candidate_selector:
    class: Drupal\brebo_glass\Service\GlassCandidateSelector

  brebo_glass.three_point_measurement_calculator:
    class: Drupal\brebo_glass\Service\GlassThreePointMeasurementCalculator

  brebo_glass.specification_calculator:
    class: Drupal\brebo_glass\Service\GlassSpecificationCalculator

  brebo_glass.technical_rule_evaluator:
    class: Drupal\brebo_glass\Service\GlassTechnicalRuleEvaluator

  brebo_glass.approval_policy:
    class: Drupal\brebo_glass\Service\GlassApprovalPolicy

  brebo_glass.calculation_line_factory:
    class: Drupal\brebo_glass\Service\GlassCalculationLineFactory

  brebo_glass.calculation_exporter:
    class: Drupal\brebo_glass\Service\GlassCalculationExporter
    arguments:
      - '@brebo_glass.position_repository'
      - '@brebo_glass.calculation_line_factory'
      - '@brebo_calculation.object_line_writer'

  brebo_glass.position_repository:
    class: Drupal\brebo_glass\Service\GlassPositionRepository
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@brebo_glass.approval_policy']

  brebo_glass.product_repository:
    class: Drupal\brebo_glass\Service\GlassProductRepository
    arguments: ['@database', '@datetime.time']
