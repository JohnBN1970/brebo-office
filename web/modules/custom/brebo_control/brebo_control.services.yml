services:
  brebo_control.project_source:
    class: Drupal\brebo_control\Infrastructure\DrupalControlProjectSource
    arguments:
      - '@entity_type.manager'
      - '@?brebo_office_core.project_controller_actions'
      - '@?brebo_office_core.project_early_warning'
      - '@?brebo_office_core.project_financial_control'

  Drupal\brebo_control\Contract\ControlProjectSourceInterface:
    alias: brebo_control.project_source

  brebo_control.action_repository:
    class: Drupal\brebo_control\Infrastructure\DatabaseControlActionRepository
    arguments: ['@database']

  Drupal\brebo_control\Contract\ControlActionRepositoryInterface:
    alias: brebo_control.action_repository

  brebo_control.escalation_matrix:
    class: Drupal\brebo_control\Service\ControlEscalationMatrix

  brebo_control.action_manager:
    class: Drupal\brebo_control\Service\ControlActionManager
    arguments:
      - '@brebo_control.action_repository'
      - '@brebo_control.escalation_matrix'

  brebo_control.inbox:
    class: Drupal\brebo_control\Service\ControlInboxService
    arguments:
      - '@brebo_control.action_repository'

  brebo_control.notification_repository:
    class: Drupal\brebo_control\Infrastructure\DatabaseControlNotificationRepository
    arguments: ['@database']

  Drupal\brebo_control\Contract\ControlNotificationRepositoryInterface:
    alias: brebo_control.notification_repository

  brebo_control.notification_engine:
    class: Drupal\brebo_control\Service\ControlNotificationEngine
    arguments:
      - '@brebo_control.action_repository'
      - '@brebo_control.notification_repository'
      - '@brebo_control.escalation_matrix'

  brebo_control.history_repository:
    class: Drupal\brebo_control\Infrastructure\DatabaseControlHistoryRepository
    arguments: ['@database']

  Drupal\brebo_control\Contract\ControlHistoryRepositoryInterface:
    alias: brebo_control.history_repository

  brebo_control.history:
    class: Drupal\brebo_control\Service\ControlHistoryService
    arguments:
      - '@brebo_control.history_repository'
      - '@brebo_control.action_repository'

  brebo_control.trend_actions:
    class: Drupal\brebo_control\Service\ControlTrendActionService
    arguments:
      - '@brebo_control.action_repository'
      - '@brebo_control.history'

  brebo_control.portfolio:
    class: Drupal\brebo_control\Service\PortfolioControlService
    arguments:
      - '@brebo_control.project_source'
      - '@brebo_control.history'

  brebo_control.portfolio_early_warning:
    class: Drupal\brebo_control\Service\PortfolioEarlyWarningService
    arguments:
      - '@brebo_control.portfolio'
      - '@brebo_finance.supplier_invoice_analytics_repository'
      - '@brebo_control.action_repository'

  brebo_control.supplier_performance_repository:
    class: Drupal\brebo_control\Infrastructure\DatabaseSupplierPerformanceRepository
    arguments: ['@database']

  Drupal\brebo_control\Contract\SupplierPerformanceRepositoryInterface:
    alias: brebo_control.supplier_performance_repository

  brebo_control.supplier_performance:
    class: Drupal\brebo_control\Service\SupplierPerformanceService
    arguments:
      - '@brebo_control.supplier_performance_repository'

  brebo_control.supplier_scorecard:
    class: Drupal\brebo_control\Service\SupplierScorecardService
    arguments:
      - '@brebo_finance.supplier_invoice_analytics_repository'
      - '@brebo_control.supplier_performance'

  # Temporary compatibility alias: an older deployed contract-control container
  # referenced the plural id. Keep bootstrap possible long enough for deployment
  # to replace stale code and rebuild Drupal's container from the canonical id.
  brebo_control.supplier_scorecards:
    alias: brebo_control.supplier_scorecard

  brebo_control.supplier_bid_evaluation:
    class: Drupal\brebo_control\Service\SupplierBidEvaluationService
    arguments:
      - '@brebo_control.supplier_scorecard'

  brebo_control.automation_runner:
    class: Drupal\brebo_control\Service\ControlAutomationRunner
    arguments:
      - '@brebo_control.project_source'
      - '@brebo_control.action_manager'
      - '@brebo_control.notification_engine'
      - '@brebo_control.history'
      - '@brebo_control.trend_actions'
