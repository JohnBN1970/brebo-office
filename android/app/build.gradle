plugins { id 'com.android.application' }
def onsiteApiBaseUrl = providers.gradleProperty('onsiteApiBaseUrl').getOrElse('https://sboffice.brebobv.nl')
def onsiteUri = new URI(onsiteApiBaseUrl)
if (onsiteUri.scheme != 'https' || !onsiteUri.host || onsiteUri.userInfo || onsiteUri.query || onsiteUri.fragment) {
    throw new GradleException('OnSite requires an HTTPS API base URL without credentials, query or fragment')
}
android {
    namespace 'nl.brebobv.onsite'
    compileSdk 36
    defaultConfig {
        applicationId 'nl.brebobv.onsite'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', groovy.json.JsonOutput.toJson(onsiteApiBaseUrl)
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.test'; versionNameSuffix '-test' } }
}
dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
