    items:
      - bold
      - italic
      - underline
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - blockQuote
      - heading
      - '|'
      - code
      - '|'
      - undo
      - redo
  plugins:
