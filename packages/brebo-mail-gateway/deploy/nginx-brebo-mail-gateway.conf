server {
    listen 443 ssl http2;
    server_name mail-gateway.example.invalid;

    ssl_certificate /etc/letsencrypt/live/mail-gateway.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-gateway.example.invalid/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store";
    }
}
