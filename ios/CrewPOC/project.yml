name: BreboCrewPOC
options:
  bundleIdPrefix: nl.brebo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  BreboCrewPOC:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.brebo.crew.poc
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "BREBO Crew gebruikt je locatie om aanwezigheid op het toegewezen project te herkennen."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "BREBO Crew gebruikt geofencing tijdens geplande diensten om binnenkomst en vertrek bij toegewezen projecten te registreren. Er wordt geen routehistorie opgeslagen."
        INFOPLIST_KEY_UIBackgroundModes: location
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - BreboCrewPOCTests
  BreboCrewPOCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BreboCrewPOC
