name: BreboCrewPOC
options:
  bundleIdPrefix: nl.brebo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  BreboCrewPOC:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "BREBO OnSite"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        OnSiteAPIBaseURL: "https://sboffice.brebobv.nl"
        CFBundleURLTypes:
          - CFBundleURLName: nl.brebo.onsite
            CFBundleURLSchemes:
              - brebo-onsite
        NSLocationWhenInUseUsageDescription: "BREBO OnSite gebruikt je locatie om aanwezigheid op het toegewezen project te herkennen."
        NSLocationAlwaysAndWhenInUseUsageDescription: "BREBO OnSite gebruikt geofencing om binnenkomst en vertrek bij toegewezen projecten aantoonbaar te registreren. Er wordt geen routehistorie opgeslagen."
        UIBackgroundModes:
          - location
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.brebo.onsite
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BreboCrewPOCTests
  BreboCrewPOCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BreboCrewPOC
